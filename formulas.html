          id: "dipole-field-equitorial",
          title: "Field On Equitorial Line",
          type: "subtopic",
          description: "Exact and short-dipole formulas on the equitorial line.",
          children: [
            { id: "dipole-equitorial-exact", title: "Exact Equitorial Field", type: "formula", formula: "E_{\\text{equitorial}} = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{p}{(r^2 + a^2)^{3/2}}", note: "Its direction is opposite to the dipole moment and parallel to the dipole axis." },
            { id: "dipole-equitorial-short", title: "Short Dipole Equitorial Field", type: "formula", formula: "E_{\\text{equitorial}} = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{p}{r^3}", note: "Valid for r &gt;&gt; a. Its direction is opposite to the dipole moment and parallel to the dipole axis.", important: true }
          ]
        },
        {
          id: "dipole-general",
          title: "Field At General Position",
          type: "subtopic",
          description: "Useful short-dipole general-point results.",
          children: [
            { id: "dipole-general-magnitude", title: "Magnitude Of Field", type: "formula", formula: "E = \\frac{kp}{r^3}\\sqrt{1 + 3\\cos^2\\theta}", note: "Standard short-dipole result at a general position." },
            { id: "dipole-general-angle", title: "Direction Formula", type: "formula", formula: "\\tan\\alpha = \\frac{1}{2}\\tan\\theta", note: "&alpha; is the angle between the electric field and the radial direction." }
          ]
        },
        {
          id: "dipole-torque-energy",
          title: "Torque And Potential Energy",
          type: "subtopic",
          description: "Dipole placed in a uniform electric field.",
          children: [
            { id: "dipole-torque-vector", title: "Torque Vector Form", type: "formula", formula: "\\vec\\tau = \\vec p \\times \\vec E", note: "Torque tends to align the dipole with the field." },
            { id: "dipole-torque", title: "Torque Magnitude", type: "formula", formula: "\\tau = pE\\sin\\theta", note: "Maximum when &theta; = 90&deg;.", important: true },
            { id: "dipole-energy", title: "Potential Energy", type: "formula", formula: "U = -pE\\cos\\theta", note: "Minimum when the dipole is aligned with the field.", important: true }
          ]
        }
      ]
    },
    {
      id: "flux-gauss",
      title: "Electric Flux And Gauss's Law",
      type: "topic",
      description: "Flux and direct Gauss law results.",
      children: [
        {
          id: "flux",
          title: "Electric Flux",
          type: "subtopic",
          description: "Flux through plane and closed surfaces.",
          children: [
            { id: "flux-plane", title: "Flux Through Plane Surface", type: "formula", formula: "\\Phi = EA\\cos\\theta", note: "&theta; is the angle between E and the area vector.", important: true },
            { id: "flux-closed", title: "Flux Through Closed Surface", type: "formula", formula: "\\Phi = \\oint \\vec E \\cdot d\\vec A", note: "For a closed surface the area vector is always outward." }
          ]
        },
        {
          id: "gauss-law",
          title: "Gauss's Law",
          type: "subtopic",
          description: "Core law and enclosed charge form.",
          children: [
            { id: "gauss-law-formula", title: "Integral Form", type: "formula", formula: "\\oint \\vec E \\cdot d\\vec A = \\frac{q_{\\text{enc}}}{\\varepsilon_0}", note: "Gauss's law relates flux through a closed surface to charge enclosed.", important: true }
          ]
        },
        {
          id: "gauss-applications",
          title: "Applications Of Gauss's Law",
          type: "subtopic",
          description: "High-yield symmetry-based results.",
          children: [
            { id: "gauss-line", title: "Infinite Line Charge", type: "formula", formula: "E = \\frac{\\lambda}{2\\pi\\varepsilon_0 r}", note: "Obtained using a cylindrical Gaussian surface." },
            { id: "gauss-sheet", title: "Infinite Plane Sheet", type: "formula", formula: "E = \\frac{\\sigma}{2\\varepsilon_0}", note: "Obtained using a pillbox Gaussian surface." },
            { id: "gauss-conductor", title: "Conductor Surface", type: "formula", formula: "E = \\frac{\\sigma}{\\varepsilon_0}", note: "Applies just outside a conductor surface." },
            { id: "shell-outside", title: "Thin Spherical Shell Outside", type: "formula", formula: "E = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{Q}{r^2}", note: "Outside the shell it behaves like a point charge." },
            { id: "shell-inside", title: "Thin Spherical Shell Inside", type: "formula", formula: "E = 0", note: "Inside a thin charged spherical shell the field is zero." },
            { id: "solid-sphere-outside", title: "Solid Sphere Outside", type: "formula", formula: "E = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{Q}{r^2}", note: "Outside a uniformly charged non-conducting sphere, field is same as point charge Q at center." },
            { id: "solid-sphere-inside", title: "Solid Sphere Inside", type: "formula", formula: "E = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{Qr}{R^3}", note: "Inside a uniformly charged non-conducting sphere, E varies linearly with r. Equivalent form: E = \\rho r /(3\\varepsilon_0)." }
          ]
        }
      ]
    }
  ]
};

const pathIds = ["root"];

function goToChapter(){
  window.location.href = "chapter.html";
}

function resetFlow(){
  pathIds.length = 0;
  pathIds.push("root");
  renderFlow();
}

function findNodeById(node, id){
  if(node.id === id) return node;
  if(!node.children) return null;

  for(const child of node.children){
    const found = findNodeById(child, id);
    if(found) return found;
  }

  return null;
}

function getPathNodes(){
  return pathIds.map(id => findNodeById(flowData, id)).filter(Boolean);
}

function currentNode(){
  return findNodeById(flowData, pathIds[pathIds.length - 1]);
}

function getTopicNodes(){
  return flowData.children || [];
}

function getSelectedTopic(){
  return pathIds.length > 1 ? currentNode() : null;
}

function childTypeLabel(type){
  if(type === "topic") return "Topic";
  if(type === "subtopic") return "Subtopic";
  if(type === "formula") return "Formula";
  return "Node";
}

function formatFormulaText(text){
  return `\\[${text}\\]`;
}

function formatNoteText(text){
  return text;
}

function renderBreadcrumbs(){
  const breadcrumbs = document.getElementById("breadcrumbs");
  const nodes = getPathNodes();
  breadcrumbs.innerHTML = "";

  nodes.forEach((node, index) => {
    const crumb = document.createElement("button");
    crumb.className = "crumb" + (index === nodes.length - 1 ? " active" : "");
    crumb.textContent = node.title;
    crumb.onclick = () => {
      pathIds.splice(index + 1);
      renderFlow();
    };
    breadcrumbs.appendChild(crumb);
  });

  const current = nodes[nodes.length - 1];
  const levelTag = document.getElementById("levelTag");
  const backOneBtn = document.getElementById("backOneBtn");
  const label = current.type === "topic" ? "Topic Open" : "Choose A Topic";
  levelTag.textContent = current.type === "topic"
    ? `Showing · ${current.title}`
    : `Select A Topic`;
  backOneBtn.disabled = nodes.length <= 1;
}

function createNodeCard(node, extraClass = ""){
  const card = document.createElement("div");
  card.className = `node-card ${node.type} ${extraClass}`.trim();

  const kicker = document.createElement("div");
  kicker.className = "card-kicker";
  kicker.textContent = childTypeLabel(node.type);
  card.appendChild(kicker);

  if(node.important){
    const tag = document.createElement("span");
    tag.className = "importance-tag";
    tag.textContent = "Most Asked";
    kicker.appendChild(tag);
  }

  const title = document.createElement("h3");
  title.className = "card-title";
  title.textContent = node.title;
  card.appendChild(title);

  if(node.description){
    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = node.description;
    card.appendChild(desc);
  }

  if(node.formula){
    const formulaBox = document.createElement("div");
    formulaBox.className = "formula-box";

    const formulaMain = document.createElement("div");
    formulaMain.className = "formula-main";
    formulaMain.innerHTML = formatFormulaText(node.formula);
    formulaBox.appendChild(formulaMain);

    if(node.note){
      const formulaNote = document.createElement("div");
      formulaNote.className = "formula-note";
      formulaNote.innerHTML = formatNoteText(node.note);
      formulaBox.appendChild(formulaNote);
    }

    card.appendChild(formulaBox);
  }

  if(node.children && node.children.length){
    card.onclick = () => {
      pathIds.push(node.id);
      renderFlow();
    };
  }

  return card;
}

function getFormulaGroups(topic){
  return (topic.children || []).map(subtopic => ({
    title: subtopic.title,
    description: subtopic.description,
    formulas: subtopic.children || []
  }));
}

function renderFlow(){
  renderBreadcrumbs();

  const stage = document.getElementById("flowStage");
  stage.innerHTML = "";

  const browser = document.createElement("div");
  browser.className = "formula-browser";

  const topicRail = document.createElement("div");
  topicRail.className = "topic-rail";

  const selectedTopic = getSelectedTopic();
  getTopicNodes().forEach(topic => {
    const button = document.createElement("button");
    button.className = "topic-button" + (selectedTopic && selectedTopic.id === topic.id ? " active" : "");
    button.type = "button";
    button.innerHTML = `
      <span class="topic-button-title">${topic.title}</span>
      <span class="topic-button-desc">${topic.description || ""}</span>
    `;
    button.addEventListener("click", () => {
      pathIds.length = 0;
      pathIds.push("root", topic.id);
      renderFlow();
    });
    topicRail.appendChild(button);
  });

  const display = document.createElement("div");
  display.className = "formula-display";

  if(selectedTopic){
    const header = document.createElement("div");
    header.className = "display-header";
    header.innerHTML = `
      <div class="display-kicker">Current Topic</div>
      <h2 class="display-title">${selectedTopic.title}</h2>
      <p class="display-desc">${selectedTopic.description || ""}</p>
    `;
    display.appendChild(header);

    const stack = document.createElement("div");
    stack.className = "subtopic-stack";

    getFormulaGroups(selectedTopic).forEach(group => {
      const panel = document.createElement("section");
      panel.className = "subtopic-panel";

      const panelHeader = document.createElement("div");
      panelHeader.className = "subtopic-header";
      panelHeader.innerHTML = `
        <h3 class="subtopic-title">${group.title}</h3>
        <p class="subtopic-desc">${group.description || ""}</p>
      `;
      panel.appendChild(panelHeader);

      const formulaList = document.createElement("div");
      formulaList.className = "formula-list";
      group.formulas.forEach(formulaNode => {
        formulaList.appendChild(createNodeCard(formulaNode, "formula"));
      });
      panel.appendChild(formulaList);
      stack.appendChild(panel);
    });

    display.appendChild(stack);
  } else {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "Select any topic from the left to show its formulas here. Opening another topic will replace the current one.";
    display.appendChild(empty);
  }

  browser.appendChild(topicRail);
  browser.appendChild(display);
  stage.appendChild(browser);

  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise([stage]);
  }
}

renderFlow();

document.getElementById("backOneBtn").addEventListener("click", () => {
  if(pathIds.length > 1){
    pathIds.pop();
    renderFlow();
  }
});
</script>
