<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coulomb's Law | Vidyaalok Classes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060913;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Top Navigation Header */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #e2e8f0;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.6);
      color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    /* Futuristic Glassmorphism Control Panel */
    .ui-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 340px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 22px;
      z-index: 10;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .brand-header {
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .sim-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 18px;
    }

    .control-group {
      margin-bottom: 16px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Live Data Card */
    .data-card {
      background: rgba(30, 41, 59, 0.6);
      border-radius: 12px;
      padding: 14px;
      margin-top: 20px;
      border-left: 4px solid #38bdf8;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      margin-bottom: 6px;
    }
    .data-row:last-child {
      margin-bottom: 0;
    }
    .data-value {
      font-weight: 800;
      font-family: monospace;
      font-size: 1.05rem;
      color: #f43f5e;
      text-shadow: 0 0 8px rgba(244, 63, 94, 0.4);
    }

    .instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.8rem;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>

  <!-- Three.js + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Top Navigation -->
  <div class="top-bar">
    <a href="chapter.html" class="nav-btn">&larr; Electric Charges & Fields</a>
    <a href="index.html" class="nav-btn">Home</a>
  </div>

  <!-- Interactive Control Panel -->
  <div class="ui-panel">
    <div class="brand-header">VIDYAALOK CLASSES</div>
    <div class="sim-title">3D Electrostatic Force Simulator</div>

    <div class="control-group">
      <label>Charge $q_1$: <span id="q1-val" style="color:#38bdf8">+5 μC</span></label>
      <input type="range" id="q1" min="-10" max="10" value="5" step="1">
    </div>

    <div class="control-group">
      <label>Charge $q_2$: <span id="q2-val" style="color:#f43f5e">-5 μC</span></label>
      <input type="range" id="q2" min="-10" max="10" value="-5" step="1">
    </div>

    <div class="control-group">
      <label>Separation Distance $r$: <span id="r-val" style="color:#a855f7">4.0 m</span></label>
      <input type="range" id="r" min="1" max="8" value="4" step="0.1">
    </div>

    <div class="data-card">
      <div class="data-row">
        <span>Force Magnitude ($F$):</span>
        <span class="data-value" id="force-val">14.06 N</span>
      </div>
      <div class="data-row">
        <span>Interaction Type:</span>
        <span id="type-val" style="color:#38bdf8; font-weight:bold;">ATTRACTIVE</span>
      </div>
    </div>
  </div>

  <div class="instructions">
    🖱️ <b>Left Click + Drag:</b> Rotate 3D Camera | <b>Scroll:</b> Zoom | <b>Right Click:</b> Pan
  </div>

  <script>
    // --- 1. SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060913, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- 2. LIGHTING & CYBER GRID ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const light1 = new THREE.PointLight(0x38bdf8, 2, 30);
    light1.position.set(-5, 5, 5);
    scene.add(light1);

    const light2 = new THREE.PointLight(0xf43f5e, 2, 30);
    light2.position.set(5, 5, 5);
    scene.add(light2);

    const gridHelper = new THREE.GridHelper(24, 24, 0x38bdf8, 0x1e293b);
    gridHelper.position.y = -2;
    gridHelper.material.opacity = 0.25;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- 3. SHINY NEON SPHERE CREATION ---
    function createGlowSphere(colorHex) {
      const group = new THREE.Group();
      
      // Shiny Metallic Core Sphere
      const geo = new THREE.SphereGeometry(0.55, 32, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: colorHex,
        emissive: colorHex,
        emissiveIntensity: 0.9,
        roughness: 0.1,
        metalness: 0.9
      });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);

      // Outer Glowing Aura Mesh
      const haloGeo = new THREE.SphereGeometry(0.8, 16, 16);
      const haloMat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.3,
        wireframe: true
      });
      const haloMesh = new THREE.Mesh(haloGeo, haloMat);
      group.add(haloMesh);

      return group;
    }

    const sphere1 = createGlowSphere(0x38bdf8); // Blue (+)
    const sphere2 = createGlowSphere(0xf43f5e); // Red (-)
    scene.add(sphere1);
    scene.add(sphere2);

    // --- 4. FORCE VECTOR ARROW ---
    const arrowDir = new THREE.Vector3(1, 0, 0);
    const arrowHelper = new THREE.ArrowHelper(arrowDir, new THREE.Vector3(0,0,0), 1, 0x38bdf8, 0.35, 0.25);
    scene.add(arrowHelper);

    // --- 5. FLOATING PARTICLES FIELD ---
    const particleCount = 80;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);

    for(let i = 0; i < particleCount * 3; i++) {
      pPos[i] = (Math.random() - 0.5) * 12;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.06, transparent: true, opacity: 0.6 });
    const particleSystem = new THREE.Points(pGeo, pMat);
    scene.add(particleSystem);

    // --- 6. SIMULATION CALCULATIONS ---
    const k = 8.99; // Coulomb scaling factor

    function updateSimulation() {
      const q1 = parseFloat(document.getElementById('q1').value);
      const q2 = parseFloat(document.getElementById('q2').value);
      const r = parseFloat(document.getElementById('r').value);

      // UI Labels
      document.getElementById('q1-val').innerText = (q1 >= 0 ? '+' : '') + q1 + ' μC';
      document.getElementById('q2-val').innerText = (q2 >= 0 ? '+' : '') + q2 + ' μC';
      document.getElementById('r-val').innerText = r.toFixed(1) + ' m';

      // Positions
      sphere1.position.x = -r / 2;
      sphere2.position.x = r / 2;

      // Color Logic based on Charge Sign
      const col1 = q1 >= 0 ? 0x38bdf8 : 0xf43f5e;
      const col2 = q2 >= 0 ? 0x38bdf8 : 0xf43f5e;

      sphere1.children[0].material.color.setHex(col1);
      sphere1.children[0].material.emissive.setHex(col1);
      sphere1.children[1].material.color.setHex(col1);

      sphere2.children[0].material.color.setHex(col2);
      sphere2.children[0].material.emissive.setHex(col2);
      sphere2.children[1].material.color.setHex(col2);

      // Coulomb Formula: F = k * |q1 * q2| / r^2
      const force = (k * Math.abs(q1 * q2)) / (r * r);
      const isRepulsive = (q1 * q2) > 0;

      document.getElementById('force-val').innerText = force.toFixed(2) + ' N';
      const typeLabel = document.getElementById('type-val');
      
      if (q1 === 0 || q2 === 0) {
        typeLabel.innerText = 'NEUTRAL';
        typeLabel.style.color = '#94a3b8';
      } else if (isRepulsive) {
        typeLabel.innerText = 'REPULSIVE';
        typeLabel.style.color = '#f43f5e';
      } else {
        typeLabel.innerText = 'ATTRACTIVE';
        typeLabel.style.color = '#38bdf8';
      }

      // Force Vector Styling
      const arrowLength = Math.min(Math.max(force * 0.15, 0.5), 3.5);
      arrowHelper.position.copy(sphere2.position);
      
      if (isRepulsive) {
        arrowHelper.setDirection(new THREE.Vector3(1, 0, 0));
        arrowHelper.setColor(0xf43f5e);
      } else {
        arrowHelper.setDirection(new THREE.Vector3(-1, 0, 0));
        arrowHelper.setColor(0x38bdf8);
      }
      arrowHelper.setLength(arrowLength, arrowLength * 0.3, arrowLength * 0.2);
    }

    // Event Listeners
    ['q1', 'q2', 'r'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateSimulation);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 7. CONTINUOUS ANIMATION LOOP ---
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.02;

      // Continuous rotation & glowing halo pulsation
      sphere1.rotation.y += 0.01;
      sphere2.rotation.y += 0.01;
      
      sphere1.children[1].rotation.z -= 0.015;
      sphere2.children[1].rotation.z -= 0.015;

      const pulseScale = 1 + Math.sin(time * 3) * 0.08;
      sphere1.children[1].scale.set(pulseScale, pulseScale, pulseScale);
      sphere2.children[1].scale.set(pulseScale, pulseScale, pulseScale);

      // Animate ambient field particles
      const positions = particleSystem.geometry.attributes.position.array;
      const r = parseFloat(document.getElementById('r').value);
      for(let i = 0; i < particleCount; i++) {
        positions[i * 3 + 1] += Math.sin(time + i) * 0.003;
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    updateSimulation();
    animate();
  </script>
</body>
</html>
