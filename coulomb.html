<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coulomb's Law | Vidyaalok Classes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060913;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Top Navigation */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #e2e8f0;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.6);
      color: #38bdf8;
    }

    /* Control Panel */
    .ui-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 350px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 20px;
      z-index: 10;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    .brand-header {
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
    }
    .sim-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .control-group {
      margin-bottom: 14px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="range"], select {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    select {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    /* Live Data Card */
    .data-card {
      background: rgba(30, 41, 59, 0.6);
      border-radius: 12px;
      padding: 12px;
      margin-top: 16px;
      border-left: 4px solid #38bdf8;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    .data-value {
      font-weight: 800;
      font-family: monospace;
      font-size: 0.95rem;
      color: #f43f5e;
    }

    /* Graph Panel */
    .graph-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 320px;
      height: 200px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 12px;
      z-index: 10;
    }
    .graph-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #graph-canvas {
      width: 100%;
      height: 150px;
      background: rgba(8, 12, 20, 0.6);
      border-radius: 8px;
    }
  </style>

  <!-- Three.js + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Top Navigation -->
  <div class="top-bar">
    <a href="chapter.html" class="nav-btn">&larr; Electric Charges & Fields</a>
    <a href="index.html" class="nav-btn">Home</a>
  </div>

  <!-- Control Panel -->
  <div class="ui-panel">
    <div class="brand-header">VIDYAALOK CLASSES</div>
    <div class="sim-title">3D Electrostatic Force Simulator</div>

    <div class="control-group">
      <label>Charge q₁: <span id="q1-val" style="color:#38bdf8">+5.00 × 10⁻⁶ C</span></label>
      <input type="range" id="q1" min="-10" max="10" value="5" step="1">
    </div>

    <div class="control-group">
      <label>Charge q₂: <span id="q2-val" style="color:#f43f5e">-5.00 × 10⁻⁶ C</span></label>
      <input type="range" id="q2" min="-10" max="10" value="-5" step="1">
    </div>

    <div class="control-group">
      <label>Separation Distance r: <span id="r-val" style="color:#a855f7">4.00 m</span></label>
      <input type="range" id="r" min="1" max="8" value="4" step="0.1">
    </div>

    <div class="control-group">
      <label>Dielectric Medium (εᵣ):</label>
      <select id="medium">
        <option value="1">Vacuum / Air (εᵣ = 1.0)</option>
        <option value="5">Glass (εᵣ = 5.0)</option>
        <option value="6">Mica (εᵣ = 6.0)</option>
        <option value="80">Water (εᵣ = 80.0)</option>
      </select>
    </div>

    <div class="data-card">
      <div class="data-row">
        <span>Force Magnitude (F):</span>
        <span class="data-value" id="force-val">1.41 × 10⁻1 N</span>
      </div>
      <div class="data-row">
        <span>Interaction Type:</span>
        <span id="type-val" style="color:#38bdf8; font-weight:bold;">ATTRACTIVE</span>
      </div>
    </div>
  </div>

  <!-- Live Graph Overlay -->
  <div class="graph-panel">
    <div class="graph-title">📈 Force vs Distance (F ∝ 1/r²)</div>
    <canvas id="graph-canvas"></canvas>
  </div>

  <script>
    // --- 1. THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060913, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light1 = new THREE.PointLight(0x38bdf8, 2, 30);
    light1.position.set(-5, 5, 5);
    scene.add(light1);

    const gridHelper = new THREE.GridHelper(24, 24, 0x38bdf8, 0x1e293b);
    gridHelper.position.y = -2;
    gridHelper.material.opacity = 0.2;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- 2. DIELECTRIC MEDIUM VISUAL BOX ---
    const mediumGeo = new THREE.BoxGeometry(16, 4, 6);
    const mediumMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.0, wireframe: true });
    const mediumMesh = new THREE.Mesh(mediumGeo, mediumMat);
    scene.add(mediumMesh);

    // --- 3. CHARGE SPHERES ---
    function createGlowSphere(colorHex) {
      const group = new THREE.Group();
      const geo = new THREE.SphereGeometry(0.5, 32, 32);
      const mat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.8, roughness: 0.2 });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);

      const haloGeo = new THREE.SphereGeometry(0.75, 16, 16);
      const haloMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.25, wireframe: true });
      group.add(new THREE.Mesh(haloGeo, haloMat));
      return group;
    }

    const sphere1 = createGlowSphere(0x38bdf8);
    const sphere2 = createGlowSphere(0xf43f5e);
    scene.add(sphere1);
    scene.add(sphere2);

    // Force Vectors
    const arrowHelper1 = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 1, 0x38bdf8, 0.3, 0.2);
    const arrowHelper2 = new THREE.ArrowHelper(new THREE.Vector3(-1,0,0), new THREE.Vector3(0,0,0), 1, 0x38bdf8, 0.3, 0.2);
    scene.add(arrowHelper1);
    scene.add(arrowHelper2);

    // --- 4. SCIENTIFIC NOTATION HELPER ---
    function toScientific(num) {
      if (num === 0) return "0.00";
      const exp = Math.floor(Math.log10(Math.abs(num)));
      const mantissa = (num / Math.pow(10, exp)).toFixed(2);
      const superScripts = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
      const expStr = String(exp).split('').map(c => superScripts[c] || c).join('');
      return `${mantissa} × 10${expStr}`;
    }

    // --- 5. GRAPH DRAWING FUNCTION ---
    const gCanvas = document.getElementById('graph-canvas');
    const gCtx = gCanvas.getContext('2d');

    function drawGraph(currentR, currentF) {
      gCanvas.width = gCanvas.clientWidth;
      gCanvas.height = gCanvas.clientHeight;
      const w = gCanvas.width;
      const h = gCanvas.height;

      gCtx.clearRect(0, 0, w, h);
      gCtx.strokeStyle = '#334155';
      gCtx.lineWidth = 1;

      // Axes
      gCtx.beginPath();
      gCtx.moveTo(30, 10); gCtx.lineTo(30, h - 20); gCtx.lineTo(w - 10, h - 20);
      gCtx.stroke();

      // Labels
      gCtx.fillStyle = '#94a3b8';
      gCtx.font = '10px sans-serif';
      gCtx.fillText("F", 10, 15);
      gCtx.fillText("r", w - 15, h - 5);

      // Curve
      gCtx.strokeStyle = '#38bdf8';
      gCtx.lineWidth = 2;
      gCtx.beginPath();

      const q1Val = Math.abs(parseFloat(document.getElementById('q1').value));
      const q2Val = Math.abs(parseFloat(document.getElementById('q2').value));
      const erVal = parseFloat(document.getElementById('medium').value);

      for (let rPx = 1; rPx <= 8; rPx += 0.1) {
        const x = 30 + (rPx / 8) * (w - 40);
        const fCalc = (8.99 * q1Val * q2Val) / (erVal * rPx * rPx);
        const y = (h - 20) - Math.min((fCalc / 250) * (h - 30), h - 30);
        if (rPx === 1) gCtx.moveTo(x, y);
        else gCtx.lineTo(x, y);
      }
      gCtx.stroke();

      // Current Operating Point
      const curX = 30 + (currentR / 8) * (w - 40);
      const curY = (h - 20) - Math.min((currentF / 250) * (h - 30), h - 30);
      gCtx.fillStyle = '#f43f5e';
      gCtx.beginPath();
      gCtx.arc(curX, curY, 4, 0, Math.PI * 2);
      gCtx.fill();
    }

    // --- 6. SIMULATION LOGIC ---
    function updateSimulation() {
      const q1Raw = parseFloat(document.getElementById('q1').value);
      const q2Raw = parseFloat(document.getElementById('q2').value);
      const r = parseFloat(document.getElementById('r').value);
      const er = parseFloat(document.getElementById('medium').value);

      const q1 = q1Raw * 1e-6;
      const q2 = q2Raw * 1e-6;

      // Update Text Inputs
      document.getElementById('q1-val').innerText = (q1Raw >= 0 ? '+' : '') + toScientific(q1) + ' C';
      document.getElementById('q2-val').innerText = (q2Raw >= 0 ? '+' : '') + toScientific(q2) + ' C';
      document.getElementById('r-val').innerText = r.toFixed(2) + ' m';

      // Sphere Positions
      sphere1.position.x = -r / 2;
      sphere2.position.x = r / 2;

      // Dielectric Box Opacity
      mediumMat.opacity = er > 1 ? 0.25 : 0.0;
      mediumMat.color.setHex(er === 80 ? 0x0284c7 : 0x38bdf8);

      // Coulomb Formula: F = (1 / 4πε₀εᵣ) * |q1 * q2| / r²
      const k = 8.98755e9;
      const force = (k * Math.abs(q1 * q2)) / (er * r * r);
      const isRepulsive = (q1Raw * q2Raw) > 0;

      document.getElementById('force-val').innerText = toScientific(force) + ' N';
      const typeLabel = document.getElementById('type-val');
      
      if (q1Raw === 0 || q2Raw === 0) {
        typeLabel.innerText = 'NEUTRAL';
        typeLabel.style.color = '#94a3b8';
      } else if (isRepulsive) {
        typeLabel.innerText = 'REPULSIVE';
        typeLabel.style.color = '#f43f5e';
      } else {
        typeLabel.innerText = 'ATTRACTIVE';
        typeLabel.style.color = '#38bdf8';
      }

      // Vector Scaling (Guaranteed Minimum Visibility)
      const visibleScale = Math.max(force * 15, 0.8);
      arrowHelper1.position.copy(sphere1.position);
      arrowHelper2.position.copy(sphere2.position);

      if (isRepulsive) {
        arrowHelper1.setDirection(new THREE.Vector3(-1, 0, 0));
        arrowHelper2.setDirection(new THREE.Vector3(1, 0, 0));
        arrowHelper1.setColor(0xf43f5e);
        arrowHelper2.setColor(0xf43f5e);
      } else {
        arrowHelper1.setDirection(new THREE.Vector3(1, 0, 0));
        arrowHelper2.setDirection(new THREE.Vector3(-1, 0, 0));
        arrowHelper1.setColor(0x38bdf8);
        arrowHelper2.setColor(0x38bdf8);
      }
      arrowHelper1.setLength(visibleScale, visibleScale * 0.25, 0.2);
      arrowHelper2.setLength(visibleScale, visibleScale * 0.25, 0.2);

      // Redraw Curve Graph
      drawGraph(r, (8.99 * Math.abs(q1Raw * q2Raw)) / (er * r * r));
    }

    // Event Listeners
    ['q1', 'q2', 'r', 'medium'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateSimulation);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateSimulation();
    });

    function animate() {
      requestAnimationFrame(animate);
      sphere1.rotation.y += 0.01;
      sphere2.rotation.y += 0.01;
      controls.update();
      renderer.render(scene, camera);
    }

    updateSimulation();
    animate();
  </script>
</body>
</html>
