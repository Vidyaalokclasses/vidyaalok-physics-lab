<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Electric Field Lines | Vidyaalok Classes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body {
      background: #020617;
      background-image: 
        radial-gradient(at 50% 0%, rgba(14, 165, 233, 0.15) 0px, transparent 60%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Top Navigation */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(14, 165, 233, 0.4);
      color: #f8fafc;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .nav-btn:hover {
      background: rgba(14, 165, 233, 0.25);
      color: #38bdf8;
      border-color: #38bdf8;
    }

    /* Glassmorphism Control Drawer */
    .ui-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 340px;
      max-width: calc(100vw - 30px);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(14, 165, 233, 0.35);
      border-radius: 20px;
      padding: 20px;
      z-index: 10;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }

    .brand-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .sim-title {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .control-group {
      margin-bottom: 14px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Live Data Card */
    .data-card {
      background: rgba(30, 41, 59, 0.7);
      border-radius: 12px;
      padding: 12px;
      margin-top: 16px;
      border-left: 4px solid #38bdf8;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      margin-bottom: 6px;
    }
    .data-row:last-child { margin-bottom: 0; }
    .data-value {
      font-weight: 800;
      font-family: monospace;
      font-size: 0.92rem;
      color: #38bdf8;
    }

    /* Floating Canvas Instructions */
    .drag-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.8rem;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    @media (max-width: 600px) {
      .top-bar { top: 10px; left: 10px; }
      .ui-panel { 
        top: auto; 
        bottom: 10px; 
        right: 10px; 
        left: 10px; 
        width: auto;
      }
      .drag-hint { display: none; }
    }
  </style>

  <!-- Three.js + DragControls / OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Top Navigation -->
  <div class="top-bar">
    <a href="chapter.html" class="nav-btn">&larr; Electric Charges & Fields</a>
    <a href="index.html" class="nav-btn">Home</a>
  </div>

  <!-- Control Drawer -->
  <div class="ui-panel">
    <div class="brand-header">VIDYAALOK CLASSES</div>
    <div class="sim-title">3D Electric Field Lines Laboratory</div>

    <div class="control-group">
      <label>Charge q₁: <span id="q1-val" style="color:#38bdf8">+5.00 × 10⁻⁶ C</span></label>
      <input type="range" id="q1" min="-10" max="10" value="5" step="1">
    </div>

    <div class="control-group">
      <label>Charge q₂: <span id="q2-val" style="color:#f43f5e">-5.00 × 10⁻⁶ C</span></label>
      <input type="range" id="q2" min="-10" max="10" value="-5" step="1">
    </div>

    <div class="data-card">
      <div class="data-row">
        <span>Charge Separation (r):</span>
        <span class="data-value" id="dist-val">4.00 m</span>
      </div>
      <div class="data-row">
        <span>Field Direction:</span>
        <span style="color:#38bdf8; font-weight:bold;">Away (+q) ➔ Towards (-q)</span>
      </div>
    </div>
  </div>

  <div class="drag-hint">
    🎯 <b>Click & Drag Spheres</b> to move charges | <b>Right Drag:</b> Rotate 3D Camera
  </div>

  <script>
    // --- 1. THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020617, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.mouseButtons = { LEFT: THREE.MOUSE.NONE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE }; // Left reserved for charge drag

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    // Unique Laboratory Blueprint Grid Background
    const gridHelper = new THREE.GridHelper(24, 24, 0x0ea5e9, 0x1e1b4b);
    gridHelper.position.y = -3;
    gridHelper.material.opacity = 0.35;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- 2. CHARGE MESH CREATION ---
    function createChargeMesh(colorHex, labelText) {
      const group = new THREE.Group();
      
      const geo = new THREE.SphereGeometry(0.5, 32, 32);
      const mat = new THREE.MeshStandardMaterial({ 
        color: colorHex, 
        emissive: colorHex, 
        emissiveIntensity: 0.9,
        roughness: 0.1,
        metalness: 0.8
      });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);

      // Glowing Halo Ring
      const haloGeo = new THREE.SphereGeometry(0.75, 16, 16);
      const haloMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.3, wireframe: true });
      group.add(new THREE.Mesh(haloGeo, haloMat));

      return group;
    }

    const sphere1 = createChargeMesh(0x38bdf8); // q1 (Cyan)
    const sphere2 = createChargeMesh(0xf43f5e); // q2 (Red)
    
    sphere1.position.set(-2, 0, 0);
    sphere2.position.set(2, 0, 0);

    scene.add(sphere1);
    scene.add(sphere2);

    // Field Lines Storage Group
    const fieldLinesGroup = new THREE.Group();
    scene.add(fieldLinesGroup);

    // --- 3. SCIENTIFIC NOTATION HELPER ---
    function toScientific(num) {
      if (num === 0) return "0.00";
      const exp = Math.floor(Math.log10(Math.abs(num)));
      const mantissa = (num / Math.pow(10, exp)).toFixed(2);
      const superScripts = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
      const expStr = String(exp).split('').map(c => superScripts[c] || c).join('');
      return `${mantissa} × 10${expStr}`;
    }

    // --- 4. RAYCASTING / CLICK-AND-DRAG CHARGE LOGIC ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let selectedObject = null;
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const planeIntersect = new THREE.Vector3();

    function onPointerDown(e) {
      const x = (e.clientX || e.touches[0].clientX);
      const y = (e.clientY || e.touches[0].clientY);

      mouse.x = (x / window.innerWidth) * 2 - 1;
      mouse.y = -(y / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([sphere1.children[0], sphere2.children[0]]);

      if (intersects.length > 0) {
        selectedObject = intersects[0].object.parent;
        controls.enabled = false;
      }
    }

    function onPointerMove(e) {
      if (!selectedObject) return;

      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const y = e.clientY || (e.touches && e.touches[0].clientY);

      mouse.x = (x / window.innerWidth) * 2 - 1;
      mouse.y = -(y / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
        selectedObject.position.copy(planeIntersect);
        updateSimulation();
      }
    }

    function onPointerUp() {
      selectedObject = null;
      controls.enabled = true;
    }

    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // --- 5. FIELD LINES GENERATION (EVALUATING E-FIELD DIRECTION) ---
    function drawFieldLines() {
      // Clear Old Lines
      while (fieldLinesGroup.children.length > 0) {
        const obj = fieldLinesGroup.children[0];
        fieldLinesGroup.remove(obj);
      }

      const q1Val = parseFloat(document.getElementById('q1').value);
      const q2Val = parseFloat(document.getElementById('q2').value);

      const charges = [];
      if (q1Val !== 0) charges.push({ pos: sphere1.position.clone(), q: q1Val });
      if (q2Val !== 0) charges.push({ pos: sphere2.position.clone(), q: q2Val });

      if (charges.length === 0) return;

      // Generate seed points around positive charges (lines radiate away)
      charges.forEach(ch => {
        if (ch.q > 0) {
          const lineCount = Math.abs(ch.q) * 8;
          for (let i = 0; i < lineCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / lineCount);
            const theta = Math.sqrt(lineCount * Math.PI) * phi;

            const dir = new THREE.Vector3(
              Math.cos(theta) * Math.sin(phi),
              Math.sin(theta) * Math.sin(phi),
              Math.cos(phi)
            );

            traceFieldLine(ch.pos.clone().addScaledVector(dir, 0.55), dir, charges);
          }
        }
      });
    }

    function traceFieldLine(startPos, initialDir, charges) {
      const points = [startPos.clone()];
      let currentPos = startPos.clone();
      const stepSize = 0.15;

      for (let step = 0; step < 80; step++) {
        let netField = new THREE.Vector3(0, 0, 0);

        charges.forEach(ch => {
          let rVec = new THREE.Vector3().subVectors(currentPos, ch.pos);
          let rMag = rVec.length();
          if (rMag > 0.1) {
            let fieldMag = ch.q / (rMag * rMag);
            netField.addScaledVector(rVec.normalize(), fieldMag);
          }
        });

        if (netField.length() === 0) break;

        currentPos.addScaledVector(netField.normalize(), stepSize);
        points.push(currentPos.clone());

        // Check if line hits a negative charge (terminates towards -q)
        let hitNegative = false;
        charges.forEach(ch => {
          if (ch.q < 0 && currentPos.distanceTo(ch.pos) < 0.55) {
            hitNegative = true;
          }
        });

        if (hitNegative || currentPos.length() > 12) break;
      }

      if (points.length > 2) {
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({ 
          color: 0x38bdf8, 
          transparent: true, 
          opacity: 0.7,
          linewidth: 2 
        });
        const line = new THREE.Line(geometry, material);
        fieldLinesGroup.add(line);
      }
    }

    // --- 6. SIMULATION CALCULATIONS ---
    function updateSimulation() {
      const q1Raw = parseFloat(document.getElementById('q1').value);
      const q2Raw = parseFloat(document.getElementById('q2').value);

      const q1 = q1Raw * 1e-6;
      const q2 = q2Raw * 1e-6;

      document.getElementById('q1-val').innerText = (q1Raw >= 0 ? '+' : '') + toScientific(q1) + ' C';
      document.getElementById('q2-val').innerText = (q2Raw >= 0 ? '+' : '') + toScientific(q2) + ' C';

      // Update Sphere Colors
      const col1 = q1Raw >= 0 ? 0x38bdf8 : 0xf43f5e;
      const col2 = q2Raw >= 0 ? 0x38bdf8 : 0xf43f5e;

      sphere1.children[0].material.color.setHex(col1);
      sphere1.children[0].material.emissive.setHex(col1);
      sphere1.children[1].material.color.setHex(col1);

      sphere2.children[0].material.color.setHex(col2);
      sphere2.children[0].material.emissive.setHex(col2);
      sphere2.children[1].material.color.setHex(col2);

      // Distance
      const dist = sphere1.position.distanceTo(sphere2.position);
      document.getElementById('dist-val').innerText = dist.toFixed(2) + ' m';

      drawFieldLines();
    }

    // Input Listeners
    ['q1', 'q2'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateSimulation);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      sphere1.rotation.y += 0.01;
      sphere2.rotation.y += 0.01;
      controls.update();
      renderer.render(scene, camera);
    }

    updateSimulation();
    animate();
  </script>
</body>
</html>
