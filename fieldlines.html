<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Electric Field Lines | Vidyaalok Classes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060913;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Top Navigation */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #e2e8f0;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.6);
    }

    /* Control Panel */
    .ui-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 330px;
      max-width: calc(100vw - 30px);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 20px;
      z-index: 10;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .brand-header {
      font-size: 1rem;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .sim-title {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .control-group {
      margin-bottom: 14px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Data Card */
    .data-card {
      background: rgba(30, 41, 59, 0.6);
      border-radius: 12px;
      padding: 12px;
      margin-top: 16px;
      border-left: 4px solid #38bdf8;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      margin-bottom: 4px;
    }
    .data-row:last-child { margin-bottom: 0; }
    .data-value {
      font-weight: 800;
      font-family: monospace;
      font-size: 0.9rem;
      color: #38bdf8;
    }

    .instructions {
      position: absolute;
      bottom: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.75rem;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .top-bar { top: 10px; left: 10px; }
      .ui-panel { 
        top: auto; 
        bottom: 10px; 
        right: 10px; 
        left: 10px; 
        width: auto;
      }
      .instructions { display: none; }
    }
  </style>

  <!-- Three.js + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Top Navigation -->
  <div class="top-bar">
    <a href="chapter.html" class="nav-btn">&larr; Electric Charges & Fields</a>
    <a href="index.html" class="nav-btn">Home</a>
  </div>

  <!-- UI Panel -->
  <div class="ui-panel">
    <div class="brand-header">VIDYAALOK CLASSES</div>
    <div class="sim-title">3D Electric Field Lines Simulator</div>

    <div class="control-group">
      <label>Charge q₁: <span id="q1-val" style="color:#38bdf8">+5.00 × 10⁻⁶ C</span></label>
      <input type="range" id="q1" min="-10" max="10" value="5" step="1">
    </div>

    <div class="control-group">
      <label>Charge q₂: <span id="q2-val" style="color:#f43f5e">-5.00 × 10⁻⁶ C</span></label>
      <input type="range" id="q2" min="-10" max="10" value="-5" step="1">
    </div>

    <div class="control-group">
      <label>Separation r: <span id="r-val" style="color:#a855f7">4.00 m</span></label>
      <input type="range" id="r" min="1" max="7" value="4" step="0.1">
    </div>

    <div class="data-card">
      <div class="data-row">
        <span>Field Vector Flow:</span>
        <span class="data-value">Away (+q) ➔ Towards (-q)</span>
      </div>
    </div>
  </div>

  <div class="instructions">
    📱 <b>Touch / Mouse:</b> Drag to rotate 3D view | Scroll/Pinch to zoom
  </div>

  <script>
    // --- 1. THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060913, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const gridHelper = new THREE.GridHelper(24, 24, 0x38bdf8, 0x1e293b);
    gridHelper.position.y = -2;
    gridHelper.material.opacity = 0.2;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- 2. SHINY SPHERES ---
    function createGlowSphere(colorHex) {
      const group = new THREE.Group();
      const geo = new THREE.SphereGeometry(0.5, 32, 32);
      const mat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.8, roughness: 0.2 });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);

      const haloGeo = new THREE.SphereGeometry(0.75, 16, 16);
      const haloMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.25, wireframe: true });
      group.add(new THREE.Mesh(haloGeo, haloMat));
      return group;
    }

    const sphere1 = createGlowSphere(0x38bdf8);
    const sphere2 = createGlowSphere(0xf43f5e);
    scene.add(sphere1);
    scene.add(sphere2);

    // --- 3. DYNAMIC FIELD PARTICLES ---
    const particleCount = 180;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);

    for(let i = 0; i < particleCount * 3; i++) {
      pPos[i] = (Math.random() - 0.5) * 8;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.07, transparent: true, opacity: 0.8 });
    const particleSystem = new THREE.Points(pGeo, pMat);
    scene.add(particleSystem);

    // Helper: Scientific Notation
    function toScientific(num) {
      if (num === 0) return "0.00";
      const exp = Math.floor(Math.log10(Math.abs(num)));
      const mantissa = (num / Math.pow(10, exp)).toFixed(2);
      const superScripts = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
      const expStr = String(exp).split('').map(c => superScripts[c] || c).join('');
      return `${mantissa} × 10${expStr}`;
    }

    // --- 4. SIMULATION CALCULATIONS ---
    function updateSimulation() {
      const q1Raw = parseFloat(document.getElementById('q1').value);
      const q2Raw = parseFloat(document.getElementById('q2').value);
      const r = parseFloat(document.getElementById('r').value);

      document.getElementById('q1-val').innerText = (q1Raw >= 0 ? '+' : '') + toScientific(q1Raw * 1e-6) + ' C';
      document.getElementById('q2-val').innerText = (q2Raw >= 0 ? '+' : '') + toScientific(q2Raw * 1e-6) + ' C';
      document.getElementById('r-val').innerText = r.toFixed(2) + ' m';

      sphere1.position.x = -r / 2;
      sphere2.position.x = r / 2;

      // Update Colors based on Charge Sign
      const col1 = q1Raw >= 0 ? 0x38bdf8 : 0xf43f5e;
      const col2 = q2Raw >= 0 ? 0x38bdf8 : 0xf43f5e;

      sphere1.children[0].material.color.setHex(col1);
      sphere1.children[0].material.emissive.setHex(col1);
      sphere1.children[1].material.color.setHex(col1);

      sphere2.children[0].material.color.setHex(col2);
      sphere2.children[0].material.emissive.setHex(col2);
      sphere2.children[1].material.color.setHex(col2);
    }

    // --- 5. ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      const q1Raw = parseFloat(document.getElementById('q1').value);
      const q2Raw = parseFloat(document.getElementById('q2').value);
      const positions = particleSystem.geometry.attributes.position.array;

      // Vector field motion loop
      for (let i = 0; i < particleCount; i++) {
        let p = new THREE.Vector3(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
        let E = new THREE.Vector3(0, 0, 0);

        // Field from q1
        if (q1Raw !== 0) {
          let r1 = new THREE.Vector3().subVectors(p, sphere1.position);
          let d1 = Math.max(r1.length(), 0.3);
          r1.normalize().multiplyScalar(q1Raw / (d1 * d1));
          E.add(r1);
        }

        // Field from q2
        if (q2Raw !== 0) {
          let r2 = new THREE.Vector3().subVectors(p, sphere2.position);
          let d2 = Math.max(r2.length(), 0.3);
          r2.normalize().multiplyScalar(q2Raw / (d2 * d2));
          E.add(r2);
        }

        // Move along Net E-field
        p.addScaledVector(E, 0.05);

        // Reset particles if out of bounds or colliding
        if (p.length() > 8 || p.distanceTo(sphere1.position) < 0.4 || p.distanceTo(sphere2.position) < 0.4) {
          p.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
        }

        positions[i * 3] = p.x;
        positions[i * 3 + 1] = p.y;
        positions[i * 3 + 2] = p.z;
      }

      particleSystem.geometry.attributes.position.needsUpdate = true;
      sphere1.rotation.y += 0.01;
      sphere2.rotation.y += 0.01;

      controls.update();
      renderer.render(scene, camera);
    }

    ['q1', 'q2', 'r'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateSimulation);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateSimulation();
    animate();
  </script>
</body>
</html>
