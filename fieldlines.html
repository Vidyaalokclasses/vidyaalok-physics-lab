<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Electric Field Lines | Vidyaalok Classes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    body {
      background-color: #060913;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Top Navigation Bar */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.6);
    }

    /* Responsive Control Panel (Mobile Friendly) */
    .ui-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 320px;
      max-width: calc(100vw - 30px);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 18px;
      z-index: 10;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      max-height: calc(100vh - 30px);
      overflow-y: auto;
    }

    .brand-header {
      font-size: 1rem;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .sim-title {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    .control-group {
      margin-bottom: 12px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="range"], select {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    select {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      outline: none;
    }

    /* Live Data Box */
    .data-card {
      background: rgba(30, 41, 59, 0.6);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      border-left: 4px solid #38bdf8;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      margin-bottom: 4px;
    }
    .data-row:last-child { margin-bottom: 0; }
    .data-value {
      font-weight: 800;
      font-family: monospace;
      font-size: 0.9rem;
      color: #f43f5e;
    }

    /* Mobile Instruction Banner */
    .instructions {
      position: absolute;
      bottom: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.75rem;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .top-bar { top: 10px; left: 10px; }
      .ui-panel { 
        top: auto; 
        bottom: 10px; 
        right: 10px; 
        left: 10px; 
        width: auto;
        max-height: 45vh;
      }
      .instructions { display: none; }
    }
  </style>

  <!-- Three.js + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Top Navigation -->
  <div class="top-bar">
    <a href="chapter.html" class="nav-btn">&larr; Electric Charges & Fields</a>
    <a href="index.html" class="nav-btn">Home</a>
  </div>

  <!-- UI Controls Panel -->
  <div class="ui-panel">
    <div class="brand-header">VIDYAALOK CLASSES</div>
    <div class="sim-title">3D Electric Field Lines Simulator</div>

    <div class="control-group">
      <label>Charge Configuration:</label>
      <select id="config-select">
        <option value="dipole">Electric Dipole (+q & -q)</option>
        <option value="like">Like Charges (+q & +q)</option>
        <option value="pos">Single Positive Charge (+q)</option>
        <option value="neg">Single Negative Charge (-q)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Charge Magnitude |q|: <span id="q-val" style="color:#38bdf8">5.00 × 10⁻⁶ C</span></label>
      <input type="range" id="q-magnitude" min="1" max="10" value="5" step="1">
    </div>

    <div class="control-group" id="sep-group">
      <label>Separation Distance 2a: <span id="d-val" style="color:#a855f7">3.00 m</span></label>
      <input type="range" id="separation" min="1" max="6" value="3" step="0.2">
    </div>

    <div class="data-card">
      <div class="data-row">
        <span>Field Strength |E| (at test point):</span>
        <span class="data-value" id="field-val">1.25 × 10⁴ N/C</span>
      </div>
      <div class="data-row">
        <span>Line Density:</span>
        <span style="color:#38bdf8; font-weight:bold;">High Resolution</span>
      </div>
    </div>
  </div>

  <div class="instructions">
    📱 <b>Touch / Mouse:</b> Drag to rotate 3D view | Pinch/Scroll to zoom
  </div>

  <script>
    // --- 1. THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060913, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Mobile GPU performance cap
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // --- 2. CHARGE SPHERES ---
    function createChargeMesh(colorHex) {
      const group = new THREE.Group();
      const geo = new THREE.SphereGeometry(0.4, 24, 24);
      const mat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.9 });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);

      const haloGeo = new THREE.SphereGeometry(0.65, 16, 16);
      const haloMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.25, wireframe: true });
      group.add(new THREE.Mesh(haloGeo, haloMat));

      return group;
    }

    const posCharge = createChargeMesh(0x38bdf8); // Cyan (+)
    const negCharge = createChargeMesh(0xf43f5e); // Red (-)
    scene.add(posCharge);
    scene.add(negCharge);

    // --- 3. FIELD LINE PARTICLE STREAM ---
    const particleCount = 200;
    const particlesGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleVelocities = [];

    for (let i = 0; i < particleCount; i++) {
      particlePositions[i * 3] = (Math.random() - 0.5) * 8;
      particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 8;
      particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 8;
      particleVelocities.push(new THREE.Vector3());
    }

    particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particlesMat = new THREE.PointsMaterial({
      color: 0x38bdf8,
      size: 0.08,
      transparent: true,
      opacity: 0.8
    });
    const particleSystem = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particleSystem);

    // --- 4. HELPER FUNCTION: SCIENTIFIC NOTATION ---
    function toScientific(num) {
      if (num === 0) return "0.00";
      const exp = Math.floor(Math.log10(Math.abs(num)));
      const mantissa = (num / Math.pow(10, exp)).toFixed(2);
      const superScripts = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
      const expStr = String(exp).split('').map(c => superScripts[c] || c).join('');
      return `${mantissa} × 10${expStr}`;
    }

    // --- 5. FIELD CALCULATION & SIMULATION UPDATE ---
    function updateSimulation() {
      const config = document.getElementById('config-select').value;
      const qMag = parseFloat(document.getElementById('q-magnitude').value) * 1e-6;
      const sep = parseFloat(document.getElementById('separation').value);

      document.getElementById('q-val').innerText = toScientific(qMag) + " C";
      document.getElementById('d-val').innerText = sep.toFixed(2) + " m";

      const sepGroup = document.getElementById('sep-group');

      if (config === 'dipole') {
        sepGroup.style.display = 'block';
        posCharge.visible = true;
        negCharge.visible = true;
        posCharge.position.set(-sep / 2, 0, 0);
        negCharge.position.set(sep / 2, 0, 0);
      } else if (config === 'like') {
        sepGroup.style.display = 'block';
        posCharge.visible = true;
        negCharge.visible = true;
        // Turn second sphere blue for like charges (+q, +q)
        negCharge.children[0].material.color.setHex(0x38bdf8);
        negCharge.children[0].material.emissive.setHex(0x38bdf8);
        posCharge.position.set(-sep / 2, 0, 0);
        negCharge.position.set(sep / 2, 0, 0);
      } else if (config === 'pos') {
        sepGroup.style.display = 'none';
        posCharge.visible = true;
        negCharge.visible = false;
        posCharge.position.set(0, 0, 0);
      } else if (config === 'neg') {
        sepGroup.style.display = 'none';
        posCharge.visible = false;
        negCharge.visible = true;
        negCharge.children[0].material.color.setHex(0xf43f5e);
        negCharge.children[0].material.emissive.setHex(0xf43f5e);
        negCharge.position.set(0, 0, 0);
      }

      // Calculate Field |E| at a sample test point (1, 1, 0)
      const k = 8.98755e9;
      const testR = 2.0;
      const E = (k * qMag) / (testR * testR);
      document.getElementById('field-val').innerText = toScientific(E) + " N/C";
    }

    // --- 6. ANIMATION & FIELD LINE FLOW ---
    function animate() {
      requestAnimationFrame(animate);

      const config = document.getElementById('config-select').value;
      const positions = particleSystem.geometry.attributes.position.array;

      for (let i = 0; i < particleCount; i++) {
        let p = new THREE.Vector3(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
        let fieldVec = new THREE.Vector3(0, 0, 0);

        if (posCharge.visible) {
          let rVec = new THREE.Vector3().subVectors(p, posCharge.position);
          let dist = Math.max(rVec.length(), 0.3);
          rVec.normalize().divideScalar(dist * dist);
          fieldVec.add(rVec);
        }

        if (negCharge.visible) {
          let rVec = new THREE.Vector3().subVectors(p, negCharge.position);
          let dist = Math.max(rVec.length(), 0.3);
          if (config === 'dipole') {
            rVec.normalize().divideScalar(dist * dist).negate(); // Attracted to -q
          } else if (config === 'like') {
            rVec.normalize().divideScalar(dist * dist); // Repelled by second +q
          } else if (config === 'neg') {
            rVec.normalize().divideScalar(dist * dist).negate();
          }
          fieldVec.add(rVec);
        }

        p.addScaledVector(fieldVec, 0.08);

        // Reset particle if it strays too far or touches charge
        if (p.length() > 7 || p.distanceTo(posCharge.position) < 0.4) {
          p.set(
            (Math.random() - 0.5) * 6,
            (Math.random() - 0.5) * 6,
            (Math.random() - 0.5) * 6
          );
        }

        positions[i * 3] = p.x;
        positions[i * 3 + 1] = p.y;
        positions[i * 3 + 2] = p.z;
      }

      particleSystem.geometry.attributes.position.needsUpdate = true;
      controls.update();
      renderer.render(scene, camera);
    }

    // Touch & Resize Listeners
    ['config-select', 'q-magnitude', 'separation'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateSimulation);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateSimulation();
    animate();
  </script>
</body>
</html>
