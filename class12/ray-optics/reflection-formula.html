<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reflection Formulas | Vidyaalok Lab</title>
  
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L8DFSQTR66"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-L8DFSQTR66');
  </script>

  <!-- MathJax for rendering LaTeX formulas -->
  <script>
    window.MathJax = { 
      tex: { inlineMath: [['\\(', '\\)']] }, 
      svg: { fontCache: 'global' } 
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    :root {
      --primary: #00e5ff;
      --secondary: #ff007f;
      --bg-dark: #070b19;
      --panel-bg: rgba(255, 255, 255, 0.03);
      --text-main: #ffffff;
      --text-muted: #a0aabf;
      --gold: #ffd166;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden; 
    }

    /* Top Navigation */
    .navbar {
      padding: 1rem 2rem;
      background: rgba(7, 11, 25, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      position: sticky;
      top: 0;
    }

    .navbar h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
    }

    .back-btn {
      color: var(--text-main);
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 1px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--text-main);
    }

    /* Main Workspace Layout */
    .main {
      width: min(1200px, 94vw);
      margin: 2rem auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Hero Section */
    .hero-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .hero-card h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 40px);
      color: var(--primary);
      line-height: 1.1;
    }

    .hero-card p {
      margin: 0;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 900px;
    }

    /* Formula Browser Layout */
    .formula-browser {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    /* Left Sidebar (Topics) */
    .topic-rail {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topic-button {
      width: 100%;
      text-align: left;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .topic-button:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .topic-button.active {
      border-color: rgba(0, 229, 255, 0.3);
      background: rgba(0, 229, 255, 0.05);
      border-left: 4px solid var(--primary);
    }

    .topic-button-title {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .topic-button.active .topic-button-title {
      color: var(--primary);
    }

    .topic-button-desc {
      display: block;
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    /* Right Display Area */
    .formula-display {
      position: relative;
      min-width: 0;
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      min-height: 500px;
      overflow: hidden;
    }

    /* Transparent Watermark Logo */
    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%; 
      height: 80%;
      background-image: url('../../logo.png'); 
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.06; 
      pointer-events: none; 
      z-index: 0;
    }

    .display-header {
      margin-bottom: 24px;
      position: relative;
      z-index: 2;
    }

    .display-title {
      margin: 0 0 8px;
      font-size: 1.8rem;
      color: var(--text-main);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }

    .subtopic-stack {
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      z-index: 2;
    }

    .subtopic-panel {
      padding: 0;
    }

    .subtopic-title {
      margin: 0 0 12px;
      font-size: 1.2rem;
      color: var(--gold);
    }

    .formula-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    /* Individual Formula/Table Cards */
    .node-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.2rem;
      text-align: left;
    }

    .card-kicker {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--secondary);
      font-weight: 800;
    }

    .importance-tag {
      margin-left: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 209, 102, 0.1);
      border: 1px solid rgba(255, 209, 102, 0.3);
      color: var(--gold);
      font-size: 0.65rem;
    }

    .card-title {
      margin: 0 0 12px;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .formula-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 8px;
      padding: 16px 12px;
      overflow-x: auto;
      overflow-y: hidden;
      text-align: center;
      margin-bottom: 10px;
      -webkit-overflow-scrolling: touch; /* Smooth iOS scrolling */
    }

    /* Custom Scrollbar for Formula Box */
    .formula-box::-webkit-scrollbar {
      height: 6px;
    }
    .formula-box::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    .formula-box::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.3);
      border-radius: 3px;
    }

    .formula-main {
      color: var(--primary);
      font-size: 1.1rem;
      display: inline-block; /* Helps with overflow calculation */
      min-width: 100%;
    }

    /* Crucial fix to prevent SVG clipping on mobile */
    .formula-main mjx-container {
      max-width: none !important;
      min-width: min-content;
    }

    .formula-note {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.4;
      border-top: 1px dashed rgba(255,255,255,0.1);
      padding-top: 10px;
    }

    /* Table Styles for Image Formation */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-top: 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 229, 255, 0.2);
      background: rgba(0, 0, 0, 0.6);
      -webkit-overflow-scrolling: touch;
    }

    .table-wrapper::-webkit-scrollbar {
      height: 6px;
    }
    .table-wrapper::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.3);
      border-radius: 3px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    .data-table th {
      background: rgba(0, 229, 255, 0.1);
      color: var(--primary);
      padding: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.75rem;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      white-space: nowrap;
    }

    .data-table td {
      padding: 12px;
      color: var(--text-main);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      line-height: 1.4;
      white-space: nowrap;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Mobile & Tablet Responsive Layout */
    @media(max-width: 900px) {
      .formula-browser {
        grid-template-columns: 1fr;
      }
      .navbar {
        padding: 1rem;
      }
      .navbar h1 {
        display: none;
      }
      .main {
        padding: 0;
        margin: 1rem auto;
      }
      .hero-card {
        padding: 1.5rem;
      }
      .formula-display {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <h1>Chapter 09</h1>
    <a href="index.html" class="back-btn">← Back to Dashboard</a>
  </nav>

  <main class="main">
    <section class="hero-card">
      <h1>Reflection Formula Browser</h1>
      <p>
        Master the laws of reflection, plane mirror combinations, and spherical mirror derivations. Select a topic to isolate and review its key formulas and image formation tables.
      </p>
    </section>

    <div class="formula-browser">
      <div class="topic-rail" id="topicRail">
        <!-- Topic Buttons Generated Here -->
      </div>
      
      <div class="formula-display" id="flowStage">
        <!-- Formulas Generated Here -->
      </div>
    </div>
  </main>

<script>
// Isolated Data strictly for Reflection
const flowData = {
  id: "root",
  title: "Reflection",
  type: "root",
  children: [
    {
      id: "plane-mirror-deviation",
      title: "Plane Mirror Basics & Deviation",
      type: "topic",
      description: "Laws of reflection and deviation by plane mirrors.",
      children: [
        {
          id: "basic-laws",
          title: "Laws & Deviation",
          type: "subtopic",
          children: [
            { id: "reflection-law", title: "Law of Reflection", type: "formula", formula: "\\angle i = \\angle r", note: "Angle of incidence equals angle of reflection.", important: true },
            { id: "single-deviation", title: "Deviation in Single Mirror", type: "formula", formula: "\\delta = 180^\\circ - 2i", note: "Deviation of the reflected ray from its original path." },
            { id: "two-mirror-deviation", title: "Deviation for Two Mirrors", type: "formula", formula: "\\delta = 360^\\circ - 2\\theta", note: "Total deviation when two mirrors are inclined at angle θ.", important: true }
          ]
        }
      ]
    },
    {
      id: "multiple-plane-mirrors",
      title: "Multiple Plane Mirrors",
      type: "topic",
      description: "Images formed by inclined plane mirrors.",
      children: [
        {
          id: "image-counting",
          title: "Circular Method",
          type: "subtopic",
          children: [
            { id: "even-n", title: "If (360/θ) is Even", type: "formula", formula: "\\text{Number of images} = \\left(\\frac{360}{\\theta}\\right) - 1", note: "Applies regardless of object placement.", important: true },
            { id: "odd-symmetric", title: "If (360/θ) is Odd (Symmetric)", type: "formula", formula: "\\text{Number of images} = \\left(\\frac{360}{\\theta}\\right) - 1", note: "Object placed symmetrically (on angle bisector) between the mirrors." },
            { id: "odd-unsymmetric", title: "If (360/θ) is Odd (Asymmetric)", type: "formula", formula: "\\text{Number of images} = \\left(\\frac{360}{\\theta}\\right)", note: "Object placed asymmetrically (not on angle bisector) between the mirrors.", important: true },
            { id: "parallel-mirrors", title: "Parallel Mirrors (θ = 0)", type: "formula", formula: "\\text{Number of images} = \\infty", note: "Infinite images are formed." }
          ]
        }
      ]
    },
    {
      id: "mirror-velocity",
      title: "Velocity in Mirrors",
      type: "topic",
      description: "Relative motion of objects and images.",
      children: [
        {
          id: "plane-velocity",
          title: "Plane Mirror Velocity",
          type: "subtopic",
          children: [
            { id: "image-velocity-plane", title: "Velocity of Image", type: "formula", formula: "\\vec{V}_I = (2V_m - V_{ox})\\hat{i} + V_{oy}\\hat{j}", note: "Given object velocity V_o and mirror velocity V_m.", important: true }
          ]
        },
        {
          id: "spherical-velocity",
          title: "Spherical Mirror Velocity",
          type: "subtopic",
          children: [
            { id: "image-velocity-spherical", title: "Relative Velocity of Image", type: "formula", formula: "V_{I/m} = -m^2 (V_{o/m})", note: "Velocity of image with respect to mirror depends on magnification squared.", important: true }
          ]
        }
      ]
    },
    {
      id: "spherical-mirrors",
      title: "Spherical Mirrors",
      type: "topic",
      description: "Focal length, mirror formula, and image formation tables.",
      children: [
        {
          id: "spherical-basics",
          title: "Focal Length & Mirror Equation",
          type: "subtopic",
          children: [
            { 
              id: "focal-radius", 
              title: "Focal Length (Marginal & Paraxial)", 
              type: "formula", 
              /* Using aligned block to split long equation onto two lines for mobile display */
              formula: "\\begin{aligned} f &= R - \\frac{R}{2\\cos i} \\\\[1ex] \\Rightarrow f &\\approx \\frac{R}{2} \\text{ (Paraxial)} \\end{aligned}", 
              note: "Exact focal length depends on incidence angle i. For paraxial rays, the angle is small.", 
              important: true 
            },
            { id: "mirror-equation", title: "Mirror Formula", type: "formula", formula: "\\frac{1}{v} + \\frac{1}{u} = \\frac{1}{f}", note: "Apply proper Cartesian sign convention.", important: true }
          ]
        },
        {
          id: "magnification",
          title: "Magnification",
          type: "subtopic",
          children: [
            { id: "transverse-mag", title: "Transverse Magnification", type: "formula", formula: "m_T = -\\frac{v}{u} = \\frac{f}{f-u} = \\frac{f-v}{f}", note: "Negative m indicates an inverted, real image.", important: true },
            { id: "longitudinal-mag", title: "Longitudinal Magnification", type: "formula", formula: "m_L = \\frac{dv}{du} = -m_T^2", note: "For short objects placed along the principal axis." }
          ]
        },
        {
          id: "image-tables",
          title: "Image Formation Tables",
          type: "subtopic",
          children: [
            {
              id: "concave-table",
              title: "Concave Mirror Image Formation",
              type: "table",
              headers: ["Position of Object", "Position of Image", "Nature of Image"],
              rows: [
                ["At infinity", "At focus (F)", "Real, inverted, and diminished"],
                ["Beyond C", "Between F and C", "Real, inverted, and diminished"],
                ["At C", "At C", "Real, inverted, and same size"],
                ["Between F and C", "Beyond C", "Real, inverted, and enlarged"],
                ["At F", "At infinity", "Real, inverted, and highly enlarged"],
                ["Between F and P", "Behind the mirror", "Virtual, enlarged, and erect"]
              ],
              note: "For interactive ray diagrams of these specific cases, visit the Spherical Mirrors Simulator.",
              important: true
            },
            {
              id: "convex-table",
              title: "Convex Mirror Image Formation",
              type: "table",
              headers: ["Position of Object", "Position of Image", "Nature of Image"],
              rows: [
                ["At infinity", "At F, behind mirror", "Virtual, erect, highly diminished"],
                ["Any finite position", "Between P and F, behind mirror", "Virtual, erect, diminished"]
              ],
              note: "Convex mirrors always form virtual, erect, and diminished images regardless of object position.",
              important: true
            }
          ]
        }
      ]
    }
  ]
};

let activeTopicId = null;

function formatFormulaText(text){ return `\\[${text}\\]`; }

function createFormulaCard(node){
  const card = document.createElement("div");
  card.className = "node-card";

  // Force tables to take full width of the grid
  if (node.type === "table") {
    card.style.gridColumn = "1 / -1";
  }

  const kicker = document.createElement("div");
  kicker.className = "card-kicker";
  kicker.textContent = node.type === "table" ? "Reference Table" : "Formula";
  if(node.important){
    const tag = document.createElement("span");
    tag.className = "importance-tag";
    tag.textContent = "Most Asked";
    kicker.appendChild(tag);
  }
  card.appendChild(kicker);

  const title = document.createElement("h3");
  title.className = "card-title";
  title.textContent = node.title;
  card.appendChild(title);

  // Render Table Type
  if (node.type === "table") {
    const tableWrapper = document.createElement("div");
    tableWrapper.className = "table-wrapper";
    
    let tableHTML = '<table class="data-table"><thead><tr>';
    node.headers.forEach(h => {
      tableHTML += `<th>${h}</th>`;
    });
    tableHTML += '</tr></thead><tbody>';
    
    node.rows.forEach(row => {
      tableHTML += '<tr>';
      row.forEach(cell => {
        tableHTML += `<td>${cell}</td>`;
      });
      tableHTML += '</tr>';
    });
    tableHTML += '</tbody></table>';
    
    tableWrapper.innerHTML = tableHTML;
    card.appendChild(tableWrapper);
  } 
  // Render Formula Type
  else {
    const formulaBox = document.createElement("div");
    formulaBox.className = "formula-box";
    
    const formulaMain = document.createElement("div");
    formulaMain.className = "formula-main";
    formulaMain.innerHTML = formatFormulaText(node.formula);
    formulaBox.appendChild(formulaMain);
    card.appendChild(formulaBox);
  }

  // Add Note if present
  if(node.note){
    const formulaNote = document.createElement("div");
    formulaNote.className = "formula-note";
    formulaNote.textContent = node.note;
    card.appendChild(formulaNote);
  }

  return card;
}

function renderSidebar() {
  const rail = document.getElementById("topicRail");
  rail.innerHTML = "";
  
  flowData.children.forEach(topic => {
    const btn = document.createElement("button");
    btn.className = "topic-button" + (activeTopicId === topic.id ? " active" : "");
    btn.innerHTML = `<span class="topic-button-title">${topic.title}</span><span class="topic-button-desc">${topic.description}</span>`;
    
    btn.onclick = () => {
      activeTopicId = topic.id;
      renderSidebar();
      renderDisplay();
    };
    rail.appendChild(btn);
  });
}

function renderDisplay() {
  const stage = document.getElementById("flowStage");
  stage.innerHTML = '<div class="watermark"></div>';
  
  if (!activeTopicId) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.innerHTML = "<h2 style='color: var(--text-main); margin-bottom: 10px;'>Select a Topic</h2><p>Select any topic from the left to show its formulas here. Opening another topic will replace the current one.</p>";
    stage.appendChild(empty);
    return;
  }

  const topic = flowData.children.find(t => t.id === activeTopicId);
  
  const header = document.createElement("div");
  header.className = "display-header";
  header.innerHTML = `<h2 class="display-title">${topic.title}</h2>`;
  stage.appendChild(header);

  const stack = document.createElement("div");
  stack.className = "subtopic-stack";

  topic.children.forEach(sub => {
    const panel = document.createElement("div");
    panel.className = "subtopic-panel";
    panel.innerHTML = `<h3 class="subtopic-title">${sub.title}</h3>`;
    
    const list = document.createElement("div");
    list.className = "formula-list";
    sub.children.forEach(form => list.appendChild(createFormulaCard(form)));
    
    panel.appendChild(list);
    stack.appendChild(panel);
  });

  stage.appendChild(stack);

  if(window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([stage]);
  }
}

renderSidebar();
renderDisplay();

</script>
</body>
</html>
