<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prism Ray Diagram | Vidyaalok Lab</title>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L8DFSQTR66"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L8DFSQTR66');
    </script>

    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --border: rgba(0, 229, 255, 0.2);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 12px 20px; background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; position: relative;
        }

        .back-btn {
            color: var(--primary); text-decoration: none; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
        }

        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        /* Workspace & Canvas */
        .workspace {
            position: relative; flex-grow: 1; width: 100%; display: flex; overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; touch-action: none; cursor: crosshair;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%;
            background-image: url('../../logo.png'); background-size: contain;
            background-repeat: no-repeat; background-position: center;
            opacity: 0.06; pointer-events: none; z-index: 0;
        }

        /* HUD Panel */
        .hud-panel {
            position: absolute; z-index: 50; background: var(--panel-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .hud-header {
            padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }

        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .hud-content {
            padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px;
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }

        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        /* Device Specific HUD Layout */
        @media (min-width: 901px) {
            .hud-panel { top: 20px; left: 20px; width: 380px; max-height: calc(100% - 40px); border-radius: 16px; }
        }

        @media (max-width: 900px) {
            .hud-panel { bottom: 0; left: 0; width: 100%; height: 45vh; border-radius: 20px 20px 0 0; border-bottom: none; border-left: none; border-right: none; }
        }

        /* Controls */
        .section-title { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }

        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        /* Stats & Formulas */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; }
        .stat strong { color: var(--secondary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat span { font-size: 1.1rem; font-weight: bold; color: var(--text-main); font-family: monospace; }
        .stat.alert span { color: #ff3366; }

        .formula-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            text-align: center; color: var(--primary); font-weight: bold; font-size: 1rem; overflow-x: auto;
            display: flex; flex-direction: column; gap: 8px; font-family: 'Segoe UI', serif; font-style: italic;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="back-btn">← Back to Dashboard</a>
        <h1>Prism Ray Diagram</h1>
    </nav>

    <div class="workspace">
        <div class="watermark"></div>
        <canvas id="simCanvas"></canvas>

        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>Controls</h2>
            </div>
            
            <div class="hud-content">
                <div id="controlsContainer">
                    <div class="section-title">Prism Properties</div>
                    <div class="control-group">
                        <label>Angle of Prism (A) <span id="aVal">60°</span></label>
                        <input id="aSlider" type="range" min="30" max="80" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Refractive Index (n) <span id="nVal">1.50</span></label>
                        <input id="nSlider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Angle of Incidence (i) <span id="iVal">45°</span></label>
                        <input id="iSlider" type="range" min="0" max="85" step="1" value="45">
                    </div>
                </div>

                <div class="section-title" style="margin-top: 5px;">Analysis & Results</div>
                <div id="resultsContainer">
                    <div class="stat-grid">
                        <div class="stat"><strong>Refract 1 (r₁)</strong><span id="r1Out">0°</span></div>
                        <div class="stat"><strong>Refract 2 (r₂)</strong><span id="r2Out">0°</span></div>
                        <div class="stat" id="eBox"><strong>Emergence (e)</strong><span id="eOut">0°</span></div>
                        <div class="stat" id="dBox"><strong>Deviation (δ)</strong><span id="dOut">0°</span></div>
                    </div>
                    <!-- Clean HTML/CSS Formula to prevent MathJax clipping on mobile -->
                    <div class="formula-panel">
                        <div>r₁ + r₂ = A</div>
                        <div>δ = i + e - A</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");
        const hudPanel = document.getElementById("hudPanel");
        
        const aSlider = document.getElementById("aSlider");
        const nSlider = document.getElementById("nSlider");
        const iSlider = document.getElementById("iSlider");
        
        let W = 0, H = 0, originX = 0, originY = 0;
        let drawScale = 1; 
        let initialized = false;

        // --- MOBILE SCALING LOGIC ---
        function updateLayout() {
            if (W > 900) {
                // Desktop
                originX = 380 + (W - 380) * 0.4; 
                originY = H * 0.6;
                drawScale = Math.min(1, H / 500);
            } else {
                // Mobile: Calculate exact pixel height available ABOVE the HUD
                const hudHeight = hudPanel.offsetHeight || (H * 0.45);
                const visH = H - hudHeight; 
                originX = W * 0.5; // Perfectly centered
                originY = visH * 0.6; // Anchored to bottom-middle of visible area
                // Scale mathematically to fit visible window
                drawScale = Math.min(1, visH / 400, W / 600);
            }
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W;
                canvas.height = H;
                updateLayout();
                if (!initialized && W > 10 && H > 10) { initialized = true; draw(); } 
                else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));

        function updateUI() {
            document.getElementById("aVal").textContent = `${aSlider.value}°`;
            document.getElementById("nVal").textContent = parseFloat(nSlider.value).toFixed(2);
            document.getElementById("iVal").textContent = `${iSlider.value}°`;
            draw();
        }

        [aSlider, nSlider, iSlider].forEach(el => el.addEventListener("input", updateUI));

        // --- VECTOR MATH UTILS ---
        function mapX(x) { return originX + x * drawScale; }
        function mapY(y) { return originY - y * drawScale; } // Standard Cartesian: +Y is UP

        function drawArrowLine(x1, y1, x2, y2, color, dashed=false) {
            ctx.save();
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
            if(dashed) { ctx.setLineDash([5,5]); ctx.globalAlpha = 0.5; }
            else { ctx.shadowBlur = 10; ctx.shadowColor = color; }
            
            const sx1 = mapX(x1), sy1 = mapY(y1);
            const sx2 = mapX(x2), sy2 = mapY(y2);
            
            ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
            ctx.setLineDash([]); ctx.shadowBlur = 0;

            const dx = sx2 - sx1, dy = sy2 - sy1;
            const len = Math.hypot(dx, dy);
            if(len > 30 && !dashed) {
                const angle = Math.atan2(dy, dx);
                // Guaranteed visible arrowhead distance
                const mx = sx1 + (dx/len) * Math.min(len * 0.6, 120);
                const my = sy1 + (dy/len) * Math.min(len * 0.6, 120);
                ctx.beginPath();
                ctx.moveTo(mx, my);
                ctx.lineTo(mx - 12 * Math.cos(angle - 0.4), my - 12 * Math.sin(angle - 0.4));
                ctx.lineTo(mx - 12 * Math.cos(angle + 0.4), my - 12 * Math.sin(angle + 0.4));
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawDashedNormal(x, y, nx, ny) {
            ctx.save();
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
            const sx = mapX(x), sy = mapY(y);
            const snx = nx, sny = -ny; // Invert Y for screen space normal
            
            // Draw through boundary
            const p1x = sx + snx * 120, p1y = sy + sny * 120; // Outward
            const p2x = sx - snx * 120, p2y = sy - sny * 120; // Inward
            ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y); ctx.stroke();
            
            // Double Arrowheads on normal
            const a1 = Math.atan2(sny, snx);
            const a2 = Math.atan2(-sny, -snx);
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p1x - 8*Math.cos(a1-0.4), p1y - 8*Math.sin(a1-0.4)); ctx.lineTo(p1x - 8*Math.cos(a1+0.4), p1y - 8*Math.sin(a1+0.4)); ctx.fill();
            ctx.beginPath(); ctx.moveTo(p2x, p2y); ctx.lineTo(p2x - 8*Math.cos(a2-0.4), p2y - 8*Math.sin(a2-0.4)); ctx.lineTo(p2x - 8*Math.cos(a2+0.4), p2y - 8*Math.sin(a2+0.4)); ctx.fill();
            ctx.restore();
        }

        function drawArcLabel(x, y, v1, v2, radius, label, color) {
            ctx.save();
            const sx = mapX(x), sy = mapY(y);
            
            // Convert physical vectors to screen vectors (invert Y)
            let a1 = Math.atan2(-v1.y, v1.x);
            let a2 = Math.atan2(-v2.y, v2.x);
            
            if(a1 < 0) a1 += 2*Math.PI; if(a2 < 0) a2 += 2*Math.PI;
            
            let start = Math.min(a1, a2);
            let end = Math.max(a1, a2);
            if(end - start > Math.PI) {
                start = Math.max(a1, a2);
                end = Math.min(a1, a2) + 2*Math.PI;
            }

            ctx.beginPath(); ctx.arc(sx, sy, radius, start, end);
            ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([3,3]); ctx.stroke();
            
            const mid = (start + end)/2;
            ctx.fillStyle = color; ctx.font = "italic 14px 'Segoe UI'";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(label, sx + (radius + 20)*Math.cos(mid), sy + (radius + 20)*Math.sin(mid));
            ctx.restore();
        }

        function lineIntersect(x1,y1, dx1,dy1, x3,y3, x4,y4) {
            const x2 = x1+dx1, y2 = y1+dy1;
            const den = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
            if(Math.abs(den) < 1e-6) return null;
            const t = ((x1-x3)*(y3-y4) - (y1-y3)*(x3-x4)) / den;
            const u = -((x1-x2)*(y1-y3) - (y1-y2)*(x1-x3)) / den;
            if(t > 1e-4 && u >= 0 && u <= 1) return { t: t, x: x1+t*dx1, y: y1+t*dy1 };
            return null;
        }

        // --- MAIN RENDER LOOP ---
        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            const A = parseFloat(aSlider.value);
            const n = parseFloat(nSlider.value);
            const i_deg = parseFloat(iSlider.value);
            
            const A_rad = A * Math.PI / 180;
            const i_rad = i_deg * Math.PI / 180;
            const side = 300;
            
            // Prism Geometry
            const h = side * Math.cos(A_rad/2);
            const w = side * Math.sin(A_rad/2);
            const apex = { x: 0, y: h * 0.5 };
            const bl = { x: -w, y: -h * 0.5 };
            const br = { x: w, y: -h * 0.5 };

            ctx.save();
            ctx.beginPath(); ctx.moveTo(mapX(apex.x), mapY(apex.y)); ctx.lineTo(mapX(bl.x), mapY(bl.y)); ctx.lineTo(mapX(br.x), mapY(br.y)); ctx.closePath();
            ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; ctx.fill();
            ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "center";
            ctx.fillText("A", mapX(apex.x), mapY(apex.y) - 15);
            ctx.fillText("B", mapX(bl.x) - 15, mapY(bl.y) + 15);
            ctx.fillText("C", mapX(br.x) + 15, mapY(br.y) + 15);
            ctx.restore();

            // Apex Angle Arc
            drawArcLabel(apex.x, apex.y, {x: bl.x-apex.x, y: bl.y-apex.y}, {x: br.x-apex.x, y: br.y-apex.y}, 35*drawScale, `A=${A}°`, "#fff");

            // --- OPTICS CALCULATIONS ---
            
            // Left Face Outward Normal
            const l_len = Math.hypot(apex.x - bl.x, apex.y - bl.y);
            const n1_out = { x: -(apex.y - bl.y)/l_len, y: (apex.x - bl.x)/l_len }; 
            const n1_in = { x: -n1_out.x, y: -n1_out.y };
            
            // INCIDENT RAY: Math to guarantee it comes from bottom-left
            const normalAngle = Math.atan2(n1_out.y, n1_out.x); // points Up-Left
            const rayAngle = normalAngle - Math.PI + i_rad; // points Up-Right towards prism
            const d_inc = { x: Math.cos(rayAngle), y: Math.sin(rayAngle) };
            
            // Hit point on left face (35% up from base)
            const hit1 = { x: bl.x + (apex.x - bl.x)*0.35, y: bl.y + (apex.y - bl.y)*0.35 };
            const startX = hit1.x - d_inc.x * 400, startY = hit1.y - d_inc.y * 400;

            // Draw Incident Ray & Normal
            drawArrowLine(startX, startY, hit1.x, hit1.y, "#ffffff");
            drawDashedNormal(hit1.x, hit1.y, n1_out.x, n1_out.y);
            drawArcLabel(hit1.x, hit1.y, {x: -d_inc.x, y: -d_inc.y}, n1_out, 45*drawScale, `i=${i_deg.toFixed(1)}°`, "#ffffff");

            // Extension of incident ray
            drawArrowLine(hit1.x, hit1.y, hit1.x + d_inc.x*400, hit1.y + d_inc.y*400, "rgba(255,255,255,0.2)", true);

            // Refraction 1 (Snell's Law: 1 * sin(i) = n * sin(r1))
            const sin_r1 = Math.sin(i_rad) / n;
            const r1_rad = Math.asin(sin_r1);
            const r1_deg = r1_rad * 180 / Math.PI;
            
            // Refracted ray angle relative to inward normal
            const in_normal_angle = Math.atan2(n1_in.y, n1_in.x);
            const ref1_ang = in_normal_angle + r1_rad; // Bends towards normal
            const d_ref1 = { x: Math.cos(ref1_ang), y: Math.sin(ref1_ang) };
            
            let hit2 = lineIntersect(hit1.x, hit1.y, d_ref1.x, d_ref1.y, apex.x, apex.y, br.x, br.y);
            if(!hit2) hit2 = lineIntersect(hit1.x, hit1.y, d_ref1.x, d_ref1.y, bl.x, bl.y, br.x, br.y); // Fallback to base

            if(hit2) {
                // Ray inside prism
                drawArrowLine(hit1.x, hit1.y, hit2.x, hit2.y, "#ffffff");
                drawArcLabel(hit1.x, hit1.y, d_ref1, n1_in, 45*drawScale, `r₁=${r1_deg.toFixed(1)}°`, "#ffffff");

                // Right Face Outward Normal
                const r_len = Math.hypot(br.x - apex.x, br.y - apex.y);
                const n2_out = { x: -(br.y - apex.y)/r_len, y: (br.x - apex.x)/r_len };
                const n2_in = { x: -n2_out.x, y: -n2_out.y };
                drawDashedNormal(hit2.x, hit2.y, n2_out.x, n2_out.y);

                const r2_rad = A_rad - r1_rad;
                const r2_deg = r2_rad * 180 / Math.PI;
                drawArcLabel(hit2.x, hit2.y, {x: -d_ref1.x, y: -d_ref1.y}, n2_in, 45*drawScale, `r₂=${r2_deg.toFixed(1)}°`, "#ffffff");

                document.getElementById('r1Out').textContent = `${r1_deg.toFixed(1)}°`;
                document.getElementById('r2Out').textContent = `${r2_deg.toFixed(1)}°`;

                // Refraction 2 (Snell's Law: n * sin(r2) = 1 * sin(e))
                let isTIR = false;
                let e_rad = 0, e_deg = 0, delta_deg = 0;
                
                if (n * Math.sin(r2_rad) > 1.0) {
                    isTIR = true;
                    document.getElementById('eOut').textContent = "TIR";
                    document.getElementById('dOut').textContent = "N/A";
                    document.getElementById('eBox').classList.add('alert');
                    document.getElementById('dBox').classList.add('alert');
                    
                    const tir_ang = Math.atan2(n2_in.y, n2_in.x) + r2_rad;
                    drawArrowLine(hit2.x, hit2.y, hit2.x + Math.cos(tir_ang)*400, hit2.y + Math.sin(tir_ang)*400, "#ffffff");
                } else {
                    e_rad = Math.asin(n * Math.sin(r2_rad));
                    e_deg = e_rad * 180 / Math.PI;
                    delta_deg = i_deg + e_deg - A;
                    
                    document.getElementById('eOut').textContent = `${e_deg.toFixed(1)}°`;
                    document.getElementById('dOut').textContent = `${delta_deg.toFixed(1)}°`;
                    document.getElementById('eBox').classList.remove('alert');
                    document.getElementById('dBox').classList.remove('alert');

                    // Emergent Ray Angle
                    const out_normal_angle = Math.atan2(n2_out.y, n2_out.x);
                    const em_ang = out_normal_angle - e_rad; // Bends away from normal towards base
                    const d_em = { x: Math.cos(em_ang), y: Math.sin(em_ang) };
                    
                    drawArrowLine(hit2.x, hit2.y, hit2.x + d_em.x*600, hit2.y + d_em.y*600, "#ffffff");
                    drawArcLabel(hit2.x, hit2.y, d_em, n2_out, 45*drawScale, `e=${e_deg.toFixed(1)}°`, "#ffffff");

                    // Deviation Angle & Intersection
                    const cross = d_inc.x * d_em.y - d_inc.y * d_em.x;
                    if(Math.abs(cross) > 1e-5) {
                        const t = ((hit2.x - hit1.x)*d_em.y - (hit2.y - hit1.y)*d_em.x) / cross;
                        const devX = hit1.x + t*d_inc.x, devY = hit1.y + t*d_inc.y;
                        drawArrowLine(hit2.x, hit2.y, devX, devY, "#ffffff", true); // Ext backward
                        drawArcLabel(devX, devY, d_inc, d_em, 35*drawScale, `δ=${delta_deg.toFixed(1)}°`, "#ffd166");
                    }
                }
            }
        }
    </script>
</body>
</html>
