<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L8DFSQTR66"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    <style>
        :root { --primary: #00e5ff; --secondary: #ff007f; --bg-dark: #070b19; --panel-bg: rgba(7, 11, 25, 0.85); --text-main: #ffffff; --text-muted: #a0aabf; --gold: #ffd166; --border: rgba(0, 229, 255, 0.2); }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; }
        .navbar { padding: 12px 20px; background: rgba(7, 11, 25, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 100; position: relative; }
        .back-btn { color: var(--primary); text-decoration: none; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }
        .workspace { position: relative; flex-grow: 1; width: 100%; display: flex; overflow: hidden; background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; cursor: crosshair; }
        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60%; height: 60%; background-image: url('../../logo.png'); background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.06; pointer-events: none; z-index: 0; }
        .hud-panel { position: absolute; z-index: 50; background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.7); transition: all 0.3s ease; }
        .hud-header { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        .hud-content { padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; scrollbar-width: thin; scrollbar-color: var(--primary) transparent; }
        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
        @media (min-width: 901px) { .hud-panel { top: 20px; left: 20px; width: 380px; max-height: calc(100% - 40px); border-radius: 16px; } }
        @media (max-width: 900px) { .hud-panel { bottom: 0; left: 0; width: 100%; height: 45vh; border-radius: 20px 20px 0 0; border-bottom: none; border-left: none; border-right: none; } }
        .section-title { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn { flex: 1 1 calc(50% - 8px); min-width: 130px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: var(--text-main); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease; text-align: center; text-decoration: none; display: inline-block; }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); color: var(--primary); pointer-events: none; }
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="back-btn">← Back to Dashboard</a>
        <h1>Two Prisms</h1>
    </nav>
    <div class="workspace">
        <div class="watermark"></div>
        <canvas id="simCanvas"></canvas>
        <div class="hud-panel" id="hudPanel">
            <div class="hud-header"><h2>Controls</h2></div>
            <div class="hud-content">
                <div class="toolbar">
                    <a href="index.html" class="btn">Ray Diagram</a>
                    <a href="dispersion.html" class="btn">Dispersion</a>
                    <a href="deviation-graph.html" class="btn">Deviation Graph</a>
                    <a href="two-prisms.html" class="btn active">Two Prisms</a>
                </div>
                <div id="controlsContainer">
                    <div class="section-title">Prism 1 Properties</div>
                    <div class="control-group">
                        <label>Angle of Prism 1 (A₁) <span id="aVal">60°</span></label>
                        <input id="aSlider" type="range" min="30" max="80" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Refractive Index 1 (n₁) <span id="nVal">1.50</span></label>
                        <input id="nSlider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Angle of Incidence (i) <span id="iVal">45°</span></label>
                        <input id="iSlider" type="range" min="0" max="85" step="1" value="45">
                    </div>
                </div>
                <div id="twoPrismsContainer">
                    <div class="section-title">Prism 2 Properties</div>
                    <div class="control-group">
                        <label>Angle of Prism 2 (A₂) <span id="a2Val">60°</span></label>
                        <input id="a2Slider" type="range" min="30" max="80" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Refractive Index 2 (n₂) <span id="n22Val">1.50</span></label>
                        <input id="n22Slider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Orientation</label>
                        <div class="toolbar" style="margin-bottom:0;">
                            <button class="btn" id="btnUpright" onclick="setP2Inverted(false)">Upright</button>
                            <button class="btn active" id="btnInverted" onclick="setP2Inverted(true)">Inverted</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");
        const hudPanel = document.getElementById("hudPanel");
        const aSlider = document.getElementById("aSlider"), nSlider = document.getElementById("nSlider"), iSlider = document.getElementById("iSlider");
        const a2Slider = document.getElementById("a2Slider"), n22Slider = document.getElementById("n22Slider");
        
        let p2Inverted = true;
        let W = 0, H = 0, originX = 0, originY = 0, drawScale = 1, initialized = false;

        const rayColors = ['#00e5ff', '#ff007f', '#00ffaa', '#ffd166', '#c7a6ff'];

        function updateLayout() {
            if (W > 900) {
                originX = 380 + (W - 380) * 0.25; originY = H * 0.55; drawScale = Math.min(1, H / 600);
            } else {
                const visH = H - (hudPanel.offsetHeight || (H * 0.45));
                originX = W * 0.2; originY = visH * 0.65; drawScale = Math.min(1, visH / 400, W / 800);
            }
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width); H = Math.floor(entry.contentRect.height);
                canvas.width = W; canvas.height = H; updateLayout();
                if (!initialized && W > 10 && H > 10) { initialized = true; draw(); } else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));
        setTimeout(() => { if (!initialized) { W = canvas.parentElement.clientWidth; H = canvas.parentElement.clientHeight || 500; canvas.width = W; canvas.height = H; initialized = true; updateLayout(); draw(); } }, 300);

        function setP2Inverted(val) { p2Inverted = val; document.getElementById("btnInverted").classList.toggle("active", val); document.getElementById("btnUpright").classList.toggle("active", !val); draw(); }

        function updateUI() {
            document.getElementById("aVal").textContent = `${aSlider.value}°`; document.getElementById("nVal").textContent = parseFloat(nSlider.value).toFixed(2); document.getElementById("iVal").textContent = `${iSlider.value}°`;
            document.getElementById("a2Val").textContent = `${a2Slider.value}°`; document.getElementById("n22Val").textContent = parseFloat(n22Slider.value).toFixed(2);
            draw();
        }
        [aSlider, nSlider, iSlider, a2Slider, n22Slider].forEach(el => el.addEventListener("input", updateUI));

        function mapX(x) { return originX + x * drawScale; } function mapY(y) { return originY - y * drawScale; }
        function norm(v) { let l = Math.hypot(v.x, v.y) || 1; return { x: v.x/l, y: v.y/l }; }
        function dot(a, b) { return a.x*b.x + a.y*b.y; }
        function getOutwardNormal(p1, p2, center) {
            let dx = p2.x - p1.x, dy = p2.y - p1.y, l = Math.hypot(dx, dy), n = { x: dy/l, y: -dx/l }; 
            let mid = { x: (p1.x + p2.x)/2, y: (p1.y + p2.y)/2 }, toCenter = { x: center.x - mid.x, y: center.y - mid.y };
            if (dot(n, toCenter) > 0) { n.x = -n.x; n.y = -n.y; } return n;
        }
        function refract(D, N, n1, n2) {
            let r = n1 / n2, c = -dot(D, N);
            if (c < 0) { N = {x: -N.x, y: -N.y}; c = -c; }
            let sin2_t = r * r * (1 - c * c);
            if (sin2_t > 1.0) return { tir: true };
            return { tir: false, dir: { x: r * D.x + (r * c - Math.sqrt(1 - sin2_t)) * N.x, y: r * D.y + (r * c - Math.sqrt(1 - sin2_t)) * N.y } };
        }
        function lineIntersect(p1, d1, a, b) {
            let v1 = p1, v2 = {x: p1.x + d1.x, y: p1.y + d1.y}, v3 = a, v4 = b;
            let denom = (v1.x - v2.x)*(v3.y - v4.y) - (v1.y - v2.y)*(v3.x - v4.x);
            if (Math.abs(denom) < 1e-6) return null;
            let t = ((v1.x - v3.x)*(v3.y - v4.y) - (v1.y - v3.y)*(v3.x - v4.x)) / denom;
            let u = -((v1.x - v2.x)*(v1.y - v3.y) - (v1.y - v2.y)*(v1.x - v3.x)) / denom;
            if (t > 1e-5 && u >= 0 && u <= 1) return { t: t, p: { x: p1.x + t*d1.x, y: p1.y + t*d1.y } }; return null;
        }
        function getPrismPoints(offsetX, A_rad, inverted, n) {
            const side = 260, h = side * Math.cos(A_rad/2), w = side * Math.sin(A_rad/2);
            let pts = !inverted ? [ {x: offsetX, y: h*0.5}, {x: offsetX - w, y: -h*0.5}, {x: offsetX + w, y: -h*0.5} ] : [ {x: offsetX, y: -h*0.5}, {x: offsetX - w, y: h*0.5}, {x: offsetX + w, y: h*0.5} ];
            const center = { x: offsetX, y: (pts[0].y + pts[1].y + pts[2].y) / 3 };
            let edges = !inverted ? [ {a: pts[1], b: pts[0], n: getOutwardNormal(pts[1], pts[0], center)}, {a: pts[0], b: pts[2], n: getOutwardNormal(pts[0], pts[2], center)}, {a: pts[2], b: pts[1], n: getOutwardNormal(pts[2], pts[1], center)} ] : [ {a: pts[1], b: pts[2], n: getOutwardNormal(pts[1], pts[2], center)}, {a: pts[2], b: pts[0], n: getOutwardNormal(pts[2], pts[0], center)}, {a: pts[0], b: pts[1], n: getOutwardNormal(pts[0], pts[1], center)} ];
            return { pts, edges, n, A_rad, inverted };
        }
        function getPrismIntersection(p, d, prism) {
            let bestHit = null; const eps = 1e-4; const px = p.x + d.x * eps, py = p.y + d.y * eps;
            for (let edge of prism.edges) {
                let hit = lineIntersect({x: px, y: py}, d, edge.a, edge.b);
                if (hit && hit.t > 0 && (!bestHit || hit.t < bestHit.t)) bestHit = { t: hit.t + eps, p: { x: p.x + (hit.t + eps)*d.x, y: p.y + (hit.t + eps)*d.y }, n: edge.n }; 
            } return bestHit;
        }
        function drawArrowLine(p1, p2, color, dashed=false, showArrow=true) {
            const sx1 = mapX(p1.x), sy1 = mapY(p1.y), sx2 = mapX(p2.x), sy2 = mapY(p2.y);
            ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
            if(dashed) { ctx.setLineDash([5,5]); ctx.globalAlpha = 0.5; } else { ctx.shadowBlur = 10; ctx.shadowColor = color; }
            ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0;
            const dx = sx2 - sx1, dy = sy2 - sy1, len = Math.hypot(dx, dy);
            if(showArrow && len > 30 && !dashed) {
                const angle = Math.atan2(dy, dx), mx = sx1 + (dx/len) * Math.min(len * 0.6, 120), my = sy1 + (dy/len) * Math.min(len * 0.6, 120);
                ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx - 12*Math.cos(angle-0.4), my - 12*Math.sin(angle-0.4)); ctx.lineTo(mx - 12*Math.cos(angle+0.4), my - 12*Math.sin(angle+0.4)); ctx.closePath(); ctx.fill();
            } ctx.restore();
        }

        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            const A_rad = parseFloat(aSlider.value) * Math.PI / 180, n = parseFloat(nSlider.value), i_rad = parseFloat(iSlider.value) * Math.PI / 180;
            const p1 = getPrismPoints(0, A_rad, false, n);
            const A2_rad = parseFloat(a2Slider.value) * Math.PI / 180, n2 = parseFloat(n22Slider.value);
            const p2 = getPrismPoints(260 * Math.sin(A_rad/2) + 260 * Math.sin(A2_rad/2) + 40, A2_rad, p2Inverted, n2);
            const prisms = [p1, p2];

            prisms.forEach(prism => {
                ctx.save(); ctx.beginPath(); ctx.moveTo(mapX(prism.pts[0].x), mapY(prism.pts[0].y)); ctx.lineTo(mapX(prism.pts[1].x), mapY(prism.pts[1].y)); ctx.lineTo(mapX(prism.pts[2].x), mapY(prism.pts[2].y)); ctx.closePath();
                ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; ctx.fill(); ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
            });

            const outNormalLeft = p1.edges[0].n; 
            const inwardNormalAngle = Math.atan2(-outNormalLeft.y, -outNormalLeft.x);
            const rayAngle = inwardNormalAngle + i_rad; 
            const d_inc = { x: Math.cos(rayAngle), y: Math.sin(rayAngle) };
            const perp_d = { x: -d_inc.y, y: d_inc.x }; 
            const hitTarget = { x: p1.pts[1].x + (p1.pts[0].x - p1.pts[1].x)*0.35, y: p1.pts[1].y + (p1.pts[0].y - p1.pts[1].y)*0.35 };

            let activeRays = [];
            const offsets = [-40, -20, 0, 20, 40];
            offsets.forEach((off, idx) => activeRays.push({ color: rayColors[idx % rayColors.length], offset: off }));

            activeRays.forEach(r => {
                let currentP = { x: hitTarget.x - d_inc.x * 400 + r.offset * perp_d.x, y: hitTarget.y - d_inc.y * 400 + r.offset * perp_d.y };
                let currentD = { x: d_inc.x, y: d_inc.y };
                
                for(let bounce=0; bounce<4; bounce++) {
                    let bestHit = null; let hitPrismIdx = -1;
                    for (let pIdx=0; pIdx<prisms.length; pIdx++) {
                        let hit = getPrismIntersection(currentP, currentD, prisms[pIdx]);
                        if (hit && (!bestHit || hit.t < bestHit.t)) { bestHit = hit; hitPrismIdx = pIdx; }
                    }
                    if (!bestHit) { drawArrowLine(currentP, { x: currentP.x + currentD.x * 1200, y: currentP.y + currentD.y * 1200 }, r.color, false, true); break; }
                    
                    drawArrowLine(currentP, bestHit.p, r.color, false, true);
                    let dotOut = dot(currentD, bestHit.n);
                    let n1 = (dotOut > 0) ? prisms[hitPrismIdx].n : 1.0;
                    let n2_opt = (dotOut > 0) ? 1.0 : prisms[hitPrismIdx].n;
                    
                    let nextD = refract(currentD, bestHit.n, n1, n2_opt);
                    if (nextD.tir) break;
                    currentD = nextD.dir; currentP = bestHit.p;
                }
            });
        }
        draw();
    </script>
</body>
</html>
