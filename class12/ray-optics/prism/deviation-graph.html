    <style>
        :root { --primary: #00e5ff; --secondary: #ff007f; --bg-dark: #070b19; --panel-bg: rgba(7, 11, 25, 0.85); --text-main: #ffffff; --text-muted: #a0aabf; --gold: #ffd166; --border: rgba(0, 229, 255, 0.2); }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; }
        .navbar { padding: 12px 20px; background: rgba(7, 11, 25, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 100; position: relative; }
        .back-btn { color: var(--primary); text-decoration: none; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }
        
        /* Flexbox Layout ensuring exact visible bounds */
        .workspace {
            display: flex; flex-direction: row; flex-grow: 1; width: 100%; height: calc(100vh - 70px);
            overflow: hidden; background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }
        
        .canvas-wrapper { position: relative; flex-grow: 1; height: 100%; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; cursor: crosshair; }
        
        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60%; height: 60%; background-image: url('../../../logo.png'); background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.06; pointer-events: none; z-index: 0; }
        
        .hud-panel { width: 380px; flex-shrink: 0; background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-left: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,0.5); z-index: 50; }
        .hud-header { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        .hud-content { padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; scrollbar-width: thin; scrollbar-color: var(--primary) transparent; }
        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
        
        @media (max-width: 900px) { 
            .workspace { flex-direction: column; }
            .hud-panel { width: 100%; height: 45vh; border-left: none; border-top: 1px solid var(--border); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); } 
        }
        
        .section-title { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .btn { flex: 1 1 calc(50% - 8px); min-width: 130px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: var(--text-main); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease; text-align: center; text-decoration: none; display: inline-block; }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); color: var(--primary); pointer-events: none; }
        
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; }
        .stat strong { color: var(--secondary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat span { font-size: 1.1rem; font-weight: bold; color: var(--text-main); font-family: monospace; }
        .stat.alert span { color: #ff3366; }
        
        .formula-panel { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); text-align: center; color: var(--primary); font-weight: bold; font-size: 0.95rem; display: flex; flex-direction: column; gap: 8px; font-family: 'Segoe UI', serif; font-style: italic; }
        .math-eqn { font-size: 1.05rem; color: var(--primary); font-style: italic; font-family: 'Times New Roman', Times, serif; letter-spacing: 1px; }
        .math-eqn sub { font-size: 0.7rem; font-style: normal; }
    </style>

<body>
    <nav class="navbar">
        <a href="../index.html" class="back-btn">← Dashboard</a>
        <h1>Deviation Graph</h1>
    </nav>

    <div class="workspace">
        <div class="canvas-wrapper" id="simWrapper">
            <div class="watermark"></div>
            <canvas id="simCanvas"></canvas>
        </div>

        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>Controls</h2>
            </div>
            
            <div class="hud-content">
                <div class="toolbar">
                    <a href="index.html" class="btn">Ray Diagram</a>
                    <a href="dispersion.html" class="btn">Dispersion</a>
                    <a href="deviation-graph.html" class="btn active">Deviation Graph</a>
                    <a href="two-prisms.html" class="btn">Two Prisms</a>
                </div>

                <div id="controlsContainer">
                    <div class="section-title">Prism Properties</div>
                    <div class="control-group">
                        <label>Angle of Prism (A) <span id="aVal">60°</span></label>
                        <input id="aSlider" type="range" min="30" max="80" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Refractive Index (n) <span id="nVal">1.50</span></label>
                        <input id="nSlider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Angle of Incidence (i) <span id="iVal">45°</span></label>
                        <input id="iSlider" type="range" min="0" max="85" step="1" value="45">
                    </div>
                </div>

                <div class="section-title" style="margin-top: 5px;">Analysis & Results</div>
                <div id="resultsContainer">
                    <div class="stat-grid">
                        <div class="stat"><strong>Current Deviation (&delta;)</strong><span id="dOut">0°</span></div>
                        <div class="stat"><strong>Minimum Deviation (&delta;<sub>m</sub>)</strong><span id="dmOut" style="color:var(--gold);">0°</span></div>
                    </div>
                    <div class="formula-panel">
                        <div class="math-eqn">n = sin((A + &delta;<sub>m</sub>)/2) / sin(A/2)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");
        
        const aSlider = document.getElementById("aSlider");
        const nSlider = document.getElementById("nSlider");
        const iSlider = document.getElementById("iSlider");
        
        let W = 0, H = 0, originX = 0, originY = 0;
        let drawScale = 1; 
        let initialized = false;

        function updateLayout() {
            // W and H are natively the exact dimensions of the visible canvas wrapper
            const isDesktop = window.innerWidth > 900;
            if (isDesktop) {
                originX = W * 0.35; // Shift left for graph
                originY = H * 0.65;
                drawScale = Math.min(1, H / 500);
            } else {
                originX = W * 0.5; // Perfectly centered horizontally
                originY = H * 0.45; // Shift UP to make room for graph below
                drawScale = Math.min(1, H / 450, W / 600);
            }
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W;
                canvas.height = H;
                updateLayout();
                if (!initialized && W > 10 && H > 10) { initialized = true; draw(); } 
                else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.getElementById('simWrapper'));

        setTimeout(() => {
            if (!initialized && canvas.parentElement.clientWidth > 10) {
                W = canvas.parentElement.clientWidth;
                H = canvas.parentElement.clientHeight || 500; 
                canvas.width = W;
                canvas.height = H;
                initialized = true; 
                updateLayout();
                draw();
            }
        }, 300);

        function updateUI() {
            document.getElementById("aVal").textContent = `${aSlider.value}°`;
            document.getElementById("nVal").textContent = parseFloat(nSlider.value).toFixed(2);
            document.getElementById("iVal").textContent = `${iSlider.value}°`;
            draw();
        }

        [aSlider, nSlider, iSlider].forEach(el => el.addEventListener("input", updateUI));

        function mapX(x) { return originX + x * drawScale; }
        function mapY(y) { return originY - y * drawScale; } // Standard Cartesian: +Y is UP

        function drawArrowLine(x1, y1, x2, y2, color, dashed=false) {
            ctx.save();
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
            if(dashed) { ctx.setLineDash([5,5]); ctx.globalAlpha = 0.5; }
            else { ctx.shadowBlur = 10; ctx.shadowColor = color; }
            
            const sx1 = mapX(x1), sy1 = mapY(y1);
            const sx2 = mapX(x2), sy2 = mapY(y2);
            
            ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
            ctx.setLineDash([]); ctx.shadowBlur = 0;

            const dx = sx2 - sx1, dy = sy2 - sy1;
            const len = Math.hypot(dx, dy);
            if(len > 30 && !dashed) {
                const angle = Math.atan2(dy, dx);
                const mx = sx1 + (dx/len) * Math.min(len * 0.6, 120);
                const my = sy1 + (dy/len) * Math.min(len * 0.6, 120);
                ctx.beginPath();
                ctx.moveTo(mx, my);
                ctx.lineTo(mx - 12 * Math.cos(angle - 0.4), my - 12 * Math.sin(angle - 0.4));
                ctx.lineTo(mx - 12 * Math.cos(angle + 0.4), my - 12 * Math.sin(angle + 0.4));
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawNormalLine(x, y, nx, ny) {
            ctx.save();
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
            const sx = mapX(x), sy = mapY(y);
            const snx = nx, sny = -ny; // Invert Y for screen space normal
            
            const p1x = sx + snx * 100, p1y = sy + sny * 100; // Outward
            const p2x = sx - snx * 100, p2y = sy - sny * 100; // Inward
            ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y); ctx.stroke();
            
            // Arrows on normal
            const a1 = Math.atan2(sny, snx);
            const a2 = Math.atan2(-sny, -snx);
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p1x - 8*Math.cos(a1-0.4), p1y - 8*Math.sin(a1-0.4)); ctx.lineTo(p1x - 8*Math.cos(a1+0.4), p1y - 8*Math.sin(a1+0.4)); ctx.fill();
            ctx.beginPath(); ctx.moveTo(p2x, p2y); ctx.lineTo(p2x - 8*Math.cos(a2-0.4), p2y - 8*Math.sin(a2-0.4)); ctx.lineTo(p2x - 8*Math.cos(a2+0.4), p2y - 8*Math.sin(a2+0.4)); ctx.fill();
            ctx.restore();
        }

        function drawArcLabel(x, y, a1, a2, radius, label, color) {
            ctx.save();
            const sx = mapX(x), sy = mapY(y);
            // Convert physical angles to screen angles (invert direction)
            let sa1 = -a1; let sa2 = -a2;
            if(sa1 < 0) sa1 += 2*Math.PI; if(sa2 < 0) sa2 += 2*Math.PI;
            
            let start = Math.min(sa1, sa2);
            let end = Math.max(sa1, sa2);
            if(end - start > Math.PI) {
                start = Math.max(sa1, sa2);
                end = Math.min(sa1, sa2) + 2*Math.PI;
            }

            ctx.beginPath(); ctx.arc(sx, sy, radius, start, end);
            ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([3,3]); ctx.stroke();
            
            const mid = (start + end)/2;
            ctx.fillStyle = color; ctx.font = "italic 14px 'Segoe UI'";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(label, sx + (radius + 15)*Math.cos(mid), sy + (radius + 15)*Math.sin(mid));
            ctx.restore();
        }

        function lineIntersect(x1,y1, dx1,dy1, x3,y3, x4,y4) {
            const x2 = x1+dx1, y2 = y1+dy1;
            const den = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
            if(Math.abs(den) < 1e-6) return null;
            const t = ((x1-x3)*(y3-y4) - (y1-y3)*(x3-x4)) / den;
            const u = -((x1-x2)*(y1-y3) - (y1-y2)*(x1-x3)) / den;
            if(t > 1e-4 && u >= 0 && u <= 1) return { t: t, x: x1+t*dx1, y: y1+t*dy1 };
            return null;
        }

        function refract(D, N, n1, n2) {
            let r = n1 / n2;
            let c = -(D.x*N.x + D.y*N.y);
            if (c < 0) { N = {x: -N.x, y: -N.y}; c = -c; }
            let sin2_t = r * r * (1 - c * c);
            if (sin2_t > 1.0) return { tir: true };
            let cos_t = Math.sqrt(1 - sin2_t);
            return { tir: false, dir: { x: r * D.x + (r * c - cos_t) * N.x, y: r * D.y + (r * c - cos_t) * N.y } };
        }

        function reflect(D, N) {
            let cosI = -(D.x*N.x + D.y*N.y);
            let outN = {x: N.x, y: N.y};
            if (cosI < 0) { outN = {x: -N.x, y: -N.y}; cosI = -cosI; }
            return { x: D.x + 2 * cosI * outN.x, y: D.y + 2 * cosI * outN.y };
        }

        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            const A = parseFloat(aSlider.value);
            const n = parseFloat(nSlider.value);
            const i_deg = parseFloat(iSlider.value);
            
            const A_rad = A * Math.PI / 180;
            const i_rad = i_deg * Math.PI / 180;
            const side = 300;
            
            // Prism Geometry
            const apex = { x: 0, y: side * Math.cos(A_rad/2) };
            const bl = { x: -side * Math.sin(A_rad/2), y: 0 };
            const br = { x: side * Math.sin(A_rad/2), y: 0 };

            ctx.save();
            ctx.beginPath(); ctx.moveTo(mapX(apex.x), mapY(apex.y)); ctx.lineTo(mapX(bl.x), mapY(bl.y)); ctx.lineTo(mapX(br.x), mapY(br.y)); ctx.closePath();
            ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; ctx.fill();
            ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "center";
            ctx.fillText("A", mapX(apex.x), mapY(apex.y) - 15);
            ctx.fillText("B", mapX(bl.x) - 15, mapY(bl.y) + 15);
            ctx.fillText("C", mapX(br.x) + 15, mapY(br.y) + 15);
            ctx.restore();

            drawArcLabel(apex.x, apex.y, Math.atan2(bl.y-apex.y, bl.x-apex.x), Math.atan2(br.y-apex.y, br.x-apex.x), 30*drawScale, `A=${A}°`, "#fff");

            // Left Face Outward Normal
            const dx1 = apex.x - bl.x, dy1 = apex.y - bl.y;
            const len1 = Math.hypot(dx1, dy1);
            const n1x = -dy1/len1, n1y = dx1/len1; 
            
            // Right Face Outward Normal
            const dx2 = br.x - apex.x, dy2 = br.y - apex.y;
            const len2 = Math.hypot(dx2, dy2);
            const n2x = -dy2/len2, n2y = dx2/len2; 

            // Incident Ray (From Bottom Left)
            const n1_ang = Math.atan2(n1y, n1x);
            const in_n1_ang = n1_ang - Math.PI; // Points down-right
            const ray_ang = in_n1_ang + i_rad; // Shift UPWARD
            const d_inc = { x: Math.cos(ray_ang), y: Math.sin(ray_ang) };
            
            const hit1 = { x: bl.x + dx1*0.4, y: bl.y + dy1*0.4 };
            const startP = { x: hit1.x - d_inc.x*400, y: hit1.y - d_inc.y*400 };

            drawArrowLine(startP.x, startP.y, hit1.x, hit1.y, "#ffffff");
            drawNormalLine(hit1.x, hit1.y, n1x, n1y);
            drawArcLabel(hit1.x, hit1.y, Math.atan2(-d_inc.y, -d_inc.x), n1_ang, 40*drawScale, `i=${i_deg.toFixed(1)}°`, "#ffffff");

            drawArrowLine(hit1.x, hit1.y, hit1.x + d_inc.x*400, hit1.y + d_inc.y*400, "rgba(255,255,255,0.2)", true);

            let ref1 = refract(d_inc, {x: n1x, y: n1y}, 1.0, n);

            if (!ref1.tir) {
                let hit2 = lineIntersect(hit1.x, hit1.y, ref1.dir.x, ref1.dir.y, apex.x, apex.y, br.x, br.y);
                let hit2Normal = {x: n2x, y: n2y};

                if(!hit2) {
                    hit2 = lineIntersect(hit1.x, hit1.y, ref1.dir.x, ref1.dir.y, bl.x, bl.y, br.x, br.y); 
                    hit2Normal = {x: 0, y: -1}; // base normal
                }

                if(hit2) {
                    drawArrowLine(hit1.x, hit1.y, hit2.x, hit2.y, "#ffffff");
                    
                    const r1_rad = Math.asin(Math.sin(i_rad) / n);
                    drawArcLabel(hit1.x, hit1.y, Math.atan2(ref1.dir.y, ref1.dir.x), in_n1_ang, 40*drawScale, `r₁=${(r1_rad*180/Math.PI).toFixed(1)}°`, "#ffffff");

                    drawNormalLine(hit2.x, hit2.y, hit2Normal.x, hit2Normal.y);

                    const r2_rad = A_rad - r1_rad;
                    const in_n2_ang = Math.atan2(-hit2Normal.y, -hit2Normal.x); 
                    drawArcLabel(hit2.x, hit2.y, Math.atan2(-ref1.dir.y, -ref1.dir.x), in_n2_ang, 40*drawScale, `r₂=${(r2_rad*180/Math.PI).toFixed(1)}°`, "#ffffff");

                    let ref2 = refract(ref1.dir, hit2Normal, n, 1.0);

                    if (ref2.tir) {
                        document.getElementById('dOut').textContent = "N/A";
                        document.getElementById('dBox').classList.add('alert');
                        let tirDir = reflect(ref1.dir, hit2Normal);
                        drawArrowLine(hit2.x, hit2.y, hit2.x + tirDir.x*400, hit2.y + tirDir.y*400, "#ffffff");
                    } else {
                        const e_rad = Math.asin(n * Math.sin(r2_rad));
                        const delta_deg = i_deg + (e_rad * 180 / Math.PI) - A;
                        
                        document.getElementById('dOut').textContent = `${delta_deg.toFixed(1)}°`;
                        document.getElementById('dBox').classList.remove('alert');

                        drawArrowLine(hit2.x, hit2.y, hit2.x + ref2.dir.x*600, hit2.y + ref2.dir.y*600, "#ffffff");
                        drawArcLabel(hit2.x, hit2.y, Math.atan2(ref2.dir.y, ref2.dir.x), Math.atan2(hit2Normal.y, hit2Normal.x), 40*drawScale, `e=${(e_rad*180/Math.PI).toFixed(1)}°`, "#ffffff");

                        const cross = d_inc.x * ref2.dir.y - d_inc.y * ref2.dir.x;
                        if(Math.abs(cross) > 1e-5) {
                            const t = ((hit2.x - hit1.x)*ref2.dir.y - (hit2.y - hit1.y)*ref2.dir.x) / cross;
                            const devX = hit1.x + t*d_inc.x, devY = hit1.y + t*d_inc.y;
                            drawArrowLine(hit2.x, hit2.y, devX, devY, "#ffffff", true);
                            drawArcLabel(devX, devY, Math.atan2(-d_inc.y, -d_inc.x), Math.atan2(ref2.dir.y, ref2.dir.x), 30*drawScale, `δ=${delta_deg.toFixed(1)}°`, "#ffd166");
                        }
                    }
                }
            }

            // --- DEVIATION GRAPH OVERLAY ---
            const gW = Math.min(300, W * 0.8) * drawScale; 
            const gH = 200 * drawScale;
            let gX, gY;

            if (window.innerWidth > 900) {
                gX = originX + 220 * drawScale; 
                gY = originY - gH / 2;
            } else {
                gX = W / 2 - gW / 2; 
                gY = H - gH - 10 * drawScale; // Guaranteed to be strictly inside the canvas area above HUD
            }
            
            ctx.save();
            ctx.fillStyle = "rgba(7, 11, 25, 0.98)"; 
            ctx.fillRect(gX, gY, gW, gH); 
            
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(gX, gY); ctx.lineTo(gX, gY + gH); // Y Axis
            ctx.lineTo(gX + gW, gY + gH); // X Axis
            ctx.stroke();

            ctx.fillStyle = "#fff"; ctx.font = "12px 'Segoe UI'";
            ctx.textAlign = "left"; ctx.textBaseline = "bottom";
            ctx.fillText("δ (Deviation)", gX + 10, gY + 15);
            ctx.textAlign = "right";
            ctx.fillText("i (Incidence)", gX + gW - 10, gY + gH - 10);
            ctx.textAlign = "right"; ctx.textBaseline = "top";
            ctx.fillText("0", gX - 5, gY + gH + 5);

            // CLIPPING MASK FOR GRAPH CURVE ONLY (so lines don't spill out)
            ctx.save();
            ctx.beginPath();
            ctx.rect(gX, gY, gW, gH);
            ctx.clip();

            ctx.beginPath();
            let firstPoint = true;
            for(let i = 0; i <= 90; i++) {
                let i_r = i * Math.PI / 180;
                let sin_r1 = Math.sin(i_r) / n;
                if(sin_r1 > 1) continue;
                let r1_r = Math.asin(sin_r1);
                let r2_r = A_rad - r1_r;
                let sin_e = n * Math.sin(r2_r);
                if(sin_e > 1) continue;
                let e_r = Math.asin(sin_e);
                let delta = (i_r + e_r - A_rad) * 180 / Math.PI;
                
                let px = gX + (i / 90) * gW;
                // Scale to 180 to prevent blowout
                let py = gY + gH - (delta / 180) * gH; 
                if(firstPoint) { ctx.moveTo(px, py); firstPoint = false; } 
                else { ctx.lineTo(px, py); }
            }
            ctx.strokeStyle = "var(--primary)"; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore(); // Removes clip

            // Plot Minimum Deviation Point inside the graph bounds
            const i_min_rad = Math.asin(n * Math.sin(A_rad / 2));
            if (!isNaN(i_min_rad)) {
                const d_min_deg = (2 * i_min_rad - A_rad) * 180 / Math.PI;
                const i_min_deg = i_min_rad * 180 / Math.PI;
                
                let px_min = gX + (i_min_deg / 90) * gW;
                let py_min = gY + gH - (d_min_deg / 180) * gH;

                ctx.setLineDash([4,4]); ctx.strokeStyle = "rgba(255,255,255,0.6)";
                ctx.beginPath(); 
                ctx.moveTo(px_min, gY + gH); ctx.lineTo(px_min, py_min); 
                ctx.lineTo(gX, py_min); ctx.stroke();
                ctx.setLineDash([]);
                
                // Plot Current Point
                const r1_rad = Math.asin(Math.sin(i_rad) / n);
                const r2_rad = A_rad - r1_rad;
                if (n * Math.sin(r2_rad) <= 1) {
                    const e_rad = Math.asin(n * Math.sin(r2_rad));
                    const delta_deg = (i_rad + e_rad - A_rad) * 180 / Math.PI;
                    let cX = gX + (i_deg / 90) * gW;
                    let cY = gY + gH - (delta_deg / 180) * gH;
                    
                    ctx.shadowBlur = 10; ctx.shadowColor = "var(--gold)"; ctx.fillStyle = "var(--gold)";
                    ctx.beginPath(); ctx.arc(cX, cY, 5, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Draw labels (outside clipping mask)
                ctx.fillStyle = "var(--gold)"; ctx.font = "italic 13px 'Segoe UI'";
                ctx.textAlign = "center"; ctx.textBaseline = "top";
                ctx.fillText("iₘ", px_min, gY + gH + 5);
                ctx.textAlign = "right"; ctx.textBaseline = "middle";
                ctx.fillText("δₘ", gX - 5, py_min);
                document.getElementById('dmOut').textContent = `${d_min_deg.toFixed(1)}°`;
            } else {
                document.getElementById('dmOut').textContent = "N/A";
            }
            ctx.restore(); 
        }

        setMode('graph');
    </script>
</body>
</html>
