    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --border: rgba(0, 229, 255, 0.2);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 12px 20px; background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; position: relative;
        }

        .back-btn {
            color: var(--primary); text-decoration: none; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
        }

        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        /* Workspace & Canvas */
        .workspace {
            position: relative; flex-grow: 1; width: 100%; display: flex; overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; touch-action: none; cursor: crosshair;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%;
            background-image: url('../../logo.png'); background-size: contain;
            background-repeat: no-repeat; background-position: center;
            opacity: 0.06; pointer-events: none; z-index: 0;
        }

        /* HUD Panel */
        .hud-panel {
            position: absolute; z-index: 50; background: var(--panel-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .hud-header {
            padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }

        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .hud-content {
            padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px;
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }

        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        /* Device Specific HUD Layout */
        @media (min-width: 901px) {
            .hud-panel { top: 20px; left: 20px; width: 380px; max-height: calc(100% - 40px); border-radius: 16px; }
        }

        @media (max-width: 900px) {
            .hud-panel { bottom: 0; left: 0; width: 100%; height: 45vh; border-radius: 20px 20px 0 0; border-bottom: none; border-left: none; border-right: none; }
        }

        /* Controls */
        .section-title { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

        .btn {
            flex: 1 1 calc(50% - 8px); min-width: 130px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s ease; text-align: center; text-decoration: none;
            display: inline-block;
        }

        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); color: var(--primary); pointer-events: none; }

        /* Sliders */
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        /* Stats & Formulas */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; }
        .stat strong { color: var(--secondary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat span { font-size: 1.1rem; font-weight: bold; color: var(--text-main); font-family: monospace; }
        .stat.alert span { color: #ff3366; }

        .formula-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            text-align: center; color: var(--primary); font-weight: bold; font-size: 0.95rem; overflow-x: auto;
            display: flex; flex-direction: column; gap: 8px; font-family: 'Segoe UI', serif; font-style: italic; letter-spacing: 1px;
        }
        .math-eqn {
            font-size: 1rem; color: var(--primary); font-style: italic; font-family: 'Times New Roman', Times, serif;
        }
        .math-eqn sub { font-size: 0.7rem; font-style: normal; }
        .math-eqn sup { font-size: 0.7rem; font-style: normal; }
    </style>

<body>
    <nav class="navbar">
        <a href="../index.html" class="back-btn">← Back to Dashboard</a>
        <h1>Dispersion</h1>
    </nav>

    <div class="workspace">
        <div class="watermark"></div>
        <canvas id="simCanvas"></canvas>

        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>Controls</h2>
            </div>
            
            <div class="hud-content">
                <div class="toolbar">
                    <a href="index.html" class="btn">Ray Diagram</a>
                    <a href="dispersion.html" class="btn active">Dispersion</a>
                    <a href="deviation-graph.html" class="btn">Deviation Graph</a>
                    <a href="two-prisms.html" class="btn">Two Prisms</a>
                </div>

                <div id="controlsContainer">
                    <div class="section-title">Prism Properties</div>
                    <div class="control-group">
                        <label>Angle of Prism A <span id="aVal">60°</span></label>
                        <input id="aSlider" type="range" min="30" max="80" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Base Refractive Index n <span id="nVal">1.50</span></label>
                        <input id="nSlider" type="range" min="1.3" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Angle of Incidence i <span id="iVal">45°</span></label>
                        <input id="iSlider" type="range" min="20" max="80" step="1" value="45">
                    </div>
                </div>

                <div class="section-title" style="margin-top: 5px;">Analysis & Results</div>
                <div id="resultsContainer">
                    <div class="stat-grid">
                        <div class="stat"><strong>Δ Violet</strong><span id="dVOut">0°</span></div>
                        <div class="stat"><strong>Δ Red</strong><span id="dROut">0°</span></div>
                        <div class="stat" style="grid-column: span 2;"><strong>Angular Dispersion</strong><span id="dispOut">0°</span></div>
                    </div>
                    <!-- Pure HTML/CSS Scientific Formula -->
                    <div class="formula-panel">
                        <div class="math-eqn">n(&lambda;) = A + B / &lambda;<sup>2</sup> &nbsp;(Cauchy's Eq)</div>
                        <div class="math-eqn">&delta;<sub>V</sub> - &delta;<sub>R</sub> = (&mu;<sub>V</sub> - &mu;<sub>R</sub>)A</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");
        const hudPanel = document.getElementById("hudPanel");
        
        const aSlider = document.getElementById("aSlider");
        const nSlider = document.getElementById("nSlider");
        const iSlider = document.getElementById("iSlider");
        
        let W = 0, H = 0, originX = 0, originY = 0;
        let drawScale = 1; 
        let initialized = false;

        // --- MOBILE SCALING LOGIC ---
        function updateLayout() {
            if (W > 900) {
                originX = 380 + (W - 380) * 0.45; 
                originY = H * 0.6;
                drawScale = Math.min(1, H / 500);
            } else {
                const hudHeight = hudPanel.offsetHeight || (H * 0.45);
                const visH = H - hudHeight; 
                originX = W * 0.5; 
                originY = visH * 0.65; 
                drawScale = Math.min(1, visH / 400, W / 600);
            }
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W;
                canvas.height = H;
                updateLayout();
                if (!initialized && W > 10 && H > 10) { initialized = true; draw(); } 
                else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));

        function updateUI() {
            document.getElementById("aVal").textContent = `${aSlider.value}°`;
            document.getElementById("nVal").textContent = parseFloat(nSlider.value).toFixed(2);
            document.getElementById("iVal").textContent = `${iSlider.value}°`;
            draw();
        }

        [aSlider, nSlider, iSlider].forEach(el => el.addEventListener("input", updateUI));

        // --- VECTOR MATH UTILS ---
        function mapX(x) { return originX + x * drawScale; }
        function mapY(y) { return originY - y * drawScale; } // Standard Cartesian: +Y is UP
        function dot(a, b) { return a.x*b.x + a.y*b.y; }

        function drawArrowLine(x1, y1, x2, y2, color, dashed=false, showArrow=true) {
            ctx.save();
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
            if(dashed) { ctx.setLineDash([5,5]); ctx.globalAlpha = 0.5; }
            else { ctx.shadowBlur = 10; ctx.shadowColor = color; }
            
            const sx1 = mapX(x1), sy1 = mapY(y1);
            const sx2 = mapX(x2), sy2 = mapY(y2);
            
            ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
            ctx.setLineDash([]); ctx.shadowBlur = 0;

            const dx = sx2 - sx1, dy = sy2 - sy1;
            const len = Math.hypot(dx, dy);
            if(showArrow && len > 30 && !dashed) {
                const angle = Math.atan2(dy, dx);
                const mx = sx1 + (dx/len) * Math.min(len * 0.6, 120);
                const my = sy1 + (dy/len) * Math.min(len * 0.6, 120);
                ctx.beginPath();
                ctx.moveTo(mx, my);
                ctx.lineTo(mx - 12 * Math.cos(angle - 0.4), my - 12 * Math.sin(angle - 0.4));
                ctx.lineTo(mx - 12 * Math.cos(angle + 0.4), my - 12 * Math.sin(angle + 0.4));
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawNormalArrow(x, y, dir_screen) {
            const angle = Math.atan2(dir_screen.y, dir_screen.x);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 8 * Math.cos(angle - 0.4), y - 8 * Math.sin(angle - 0.4));
            ctx.lineTo(x - 8 * Math.cos(angle + 0.4), y - 8 * Math.sin(angle + 0.4));
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fill();
        }

        function drawDashedNormal(p, N) {
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
            ctx.beginPath();
            let screen_N = { x: N.x, y: -N.y };
            
            let px1 = mapX(p.x) + screen_N.x * 120; let py1 = mapY(p.y) + screen_N.y * 120; // Outward
            let px2 = mapX(p.x) - screen_N.x * 120; let py2 = mapY(p.y) - screen_N.y * 120; // Inward
            ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke();
            
            drawNormalArrow(px1, py1, screen_N); 
            drawNormalArrow(px2, py2, {x: -screen_N.x, y: -screen_N.y});
            ctx.restore();
        }

        function drawArcLabel(x, y, a1, a2, radius, label, color) {
            ctx.save();
            const sx = mapX(x), sy = mapY(y);
            let sa1 = -a1; let sa2 = -a2;
            if(sa1 < 0) sa1 += 2*Math.PI; if(sa2 < 0) sa2 += 2*Math.PI;
            
            let start = Math.min(sa1, sa2);
            let end = Math.max(sa1, sa2);
            if(end - start > Math.PI) {
                start = Math.max(sa1, sa2);
                end = Math.min(sa1, sa2) + 2*Math.PI;
            }

            ctx.beginPath(); ctx.arc(sx, sy, radius, start, end);
            ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([3,3]); ctx.stroke();
            
            const mid = (start + end)/2;
            ctx.fillStyle = color; ctx.font = "italic 14px 'Segoe UI'";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(label, sx + (radius + 15)*Math.cos(mid), sy + (radius + 15)*Math.sin(mid));
            ctx.restore();
        }

        function getOutwardNormal(p1, p2, center) {
            let dx = p2.x - p1.x; let dy = p2.y - p1.y; 
            let l = Math.hypot(dx, dy);
            let n = { x: dy/l, y: -dx/l }; 
            let mid = { x: (p1.x + p2.x)/2, y: (p1.y + p2.y)/2 };
            let toCenter = { x: center.x - mid.x, y: center.y - mid.y };
            if (dot(n, toCenter) > 0) { n.x = -n.x; n.y = -n.y; } 
            return n;
        }

        function refract(D, N, n1, n2) {
            let r = n1 / n2;
            let c = -dot(D, N);
            if (c < 0) { N = {x: -N.x, y: -N.y}; c = -c; }
            let sin2_t = r * r * (1 - c * c);
            if (sin2_t > 1.0) return { tir: true };
            let cos_t = Math.sqrt(1 - sin2_t);
            return { tir: false, dir: { x: r * D.x + (r * c - cos_t) * N.x, y: r * D.y + (r * c - cos_t) * N.y } };
        }

        function reflect(D, N) {
            let cosI = -dot(D, N);
            let outN = {x: N.x, y: N.y};
            if (cosI < 0) { outN = {x: -N.x, y: -N.y}; cosI = -cosI; }
            return { x: D.x + 2 * cosI * outN.x, y: D.y + 2 * cosI * outN.y };
        }

        function lineIntersect(x1,y1, dx1,dy1, x3,y3, x4,y4) {
            const x2 = x1+dx1, y2 = y1+dy1;
            const den = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
            if(Math.abs(den) < 1e-6) return null;
            const t = ((x1-x3)*(y3-y4) - (y1-y3)*(x3-x4)) / den;
            const u = -((x1-x2)*(y1-y3) - (y1-y2)*(x1-x3)) / den;
            if(t > 1e-4 && u >= 0 && u <= 1) return { t: t, x: x1+t*dx1, y: y1+t*dy1 };
            return null;
        }

        // --- MAIN RENDER LOOP ---
        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            const A = parseFloat(aSlider.value);
            const n_base = parseFloat(nSlider.value);
            const i_deg = parseFloat(iSlider.value);
            
            const A_rad = A * Math.PI / 180;
            const i_rad = i_deg * Math.PI / 180;
            const side = 300;
            
            // Prism Geometry
            const apex = { x: 0, y: side * Math.cos(A_rad/2) };
            const bl = { x: -side * Math.sin(A_rad/2), y: 0 };
            const br = { x: side * Math.sin(A_rad/2), y: 0 };
            const center = { x: 0, y: (apex.y + bl.y + br.y) / 3 };

            ctx.save();
            ctx.beginPath(); ctx.moveTo(mapX(apex.x), mapY(apex.y)); ctx.lineTo(mapX(bl.x), mapY(bl.y)); ctx.lineTo(mapX(br.x), mapY(br.y)); ctx.closePath();
            ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; ctx.fill();
            ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "center";
            ctx.fillText("A", mapX(apex.x), mapY(apex.y) - 15);
            ctx.fillText("B", mapX(bl.x) - 15, mapY(bl.y) + 15);
            ctx.fillText("C", mapX(br.x) + 15, mapY(br.y) + 15);
            ctx.restore();

            drawArcLabel(apex.x, apex.y, Math.atan2(bl.y-apex.y, bl.x-apex.x), Math.atan2(br.y-apex.y, br.x-apex.x), 35*drawScale, `A=${A}°`, "#fff");

            // Define prism edges for intersection loop
            const edges = [
                { a: bl, b: apex, n: getOutwardNormal(bl, apex, center) }, // left face
                { a: apex, b: br, n: getOutwardNormal(apex, br, center) }, // right face
                { a: br, b: bl, n: getOutwardNormal(br, bl, center) }  // base
            ];

            const n1_out = edges[0].n; 
            const n1_in = { x: -n1_out.x, y: -n1_out.y };
            const in_normal_angle = Math.atan2(n1_in.y, n1_in.x); 
            
            // Incident Ray (From Bottom Left heading up-right)
            const rayAngle = in_normal_angle - i_rad; 
            const d_inc = { x: Math.cos(rayAngle), y: Math.sin(rayAngle) };
            
            const hit1 = { x: bl.x + (apex.x - bl.x)*0.35, y: bl.y + (apex.y - bl.y)*0.35 };
            const startX = hit1.x - d_inc.x * 400, startY = hit1.y - d_inc.y * 400;

            // Draw Incident Ray & Normal
            drawArrowLine(startX, startY, hit1.x, hit1.y, "#ffffff", false, true);
            drawDashedNormal(hit1.x, hit1.y, n1_out.x, n1_out.y);
            drawArcLabel(hit1.x, hit1.y, Math.atan2(-d_inc.y, -d_inc.x), Math.atan2(n1_out.y, n1_out.x), 40*drawScale, `i=${i_deg.toFixed(1)}°`, "#ffffff");

            // Wavelength colors (Red to Violet)
            const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];
            // Exaggerated indices to make dispersion highly visible
            const n_vals = [n_base - 0.05, n_base - 0.03, n_base - 0.01, n_base, n_base + 0.02, n_base + 0.04, n_base + 0.07];

            let dev_v = "TIR", dev_r = "TIR";

            for(let k = 0; k < 7; k++) {
                let n = n_vals[k];
                let col = colors[k];
                
                // Refraction 1
                let ref1 = refract(d_inc, n1_out, 1.0, n);
                if(ref1.tir) continue;
                
                // Find next intersection inside the prism
                let bestHit = null;
                const eps = 1e-4;
                for(let edge of edges) {
                    let hit = lineIntersect(hit1.x + ref1.dir.x*eps, hit1.y + ref1.dir.y*eps, ref1.dir.x, ref1.dir.y, edge.a.x, edge.a.y, edge.b.x, edge.b.y);
                    if (hit && (!bestHit || hit.t < bestHit.t)) bestHit = { ...hit, n: edge.n };
                }

                if(bestHit) {
                    drawArrowLine(hit1.x, hit1.y, bestHit.x, bestHit.y, col, false, false);

                    // Refraction 2 (Emergence or TIR)
                    let inNormal2 = { x: -bestHit.n.x, y: -bestHit.n.y };
                    let ref2 = refract(ref1.dir, inNormal2, n, 1.0);
                    
                    if (ref2.tir) {
                        // TIR Occurs: Bounce inside the prism!
                        let tirDir = reflect(ref1.dir, inNormal2);
                        
                        let bestHit3 = null;
                        const px = bestHit.x + tirDir.x * eps;
                        const py = bestHit.y + tirDir.y * eps;
                        for(let edge of edges) {
                            let hit3 = lineIntersect(px, py, tirDir.x, tirDir.y, edge.a.x, edge.a.y, edge.b.x, edge.b.y);
                            if (hit3 && (!bestHit3 || hit3.t < bestHit3.t)) bestHit3 = { ...hit3, n: edge.n };
                        }

                        if(bestHit3) {
                            drawArrowLine(bestHit.x, bestHit.y, bestHit3.x, bestHit3.y, col, false, true);
                            
                            // Exit bottom face
                            let inNormal3 = { x: -bestHit3.n.x, y: -bestHit3.n.y };
                            let ref3 = refract(tirDir, inNormal3, n, 1.0);
                            
                            if (!ref3.tir) {
                                drawArrowLine(bestHit3.x, bestHit3.y, bestHit3.x + ref3.dir.x*800, bestHit3.y + ref3.dir.y*800, col, false, true);
                            } else {
                                drawArrowLine(bestHit3.x, bestHit3.y, bestHit3.x + tirDir.x*800, bestHit3.y + tirDir.y*800, col, false, true);
                            }
                        } else {
                            drawArrowLine(bestHit.x, bestHit.y, bestHit.x + tirDir.x*800, bestHit.y + tirDir.y*800, col, false, true);
                        }
                        
                    } else {
                        // Normal Emergence
                        drawArrowLine(bestHit.x, bestHit.y, bestHit.x + ref2.dir.x*800, bestHit.y + ref2.dir.y*800, col, false, true);
                        
                        // Calculate Deviation for Red and Violet
                        const e_rad = Math.asin(n * Math.sin(A_rad - Math.asin(Math.sin(i_rad)/n)));
                        const e_deg = e_rad * 180 / Math.PI;
                        const delta_deg = (i_deg + e_deg - A).toFixed(1);
                        
                        if(k === 0) dev_r = delta_deg;
                        if(k === 6) dev_v = delta_deg;
                    }
                }
            }

            document.getElementById('dVOut').textContent = dev_v !== "TIR" ? `${dev_v}°` : "TIR";
            document.getElementById('dROut').textContent = dev_r !== "TIR" ? `${dev_r}°` : "TIR";
            document.getElementById('dispOut').textContent = (dev_v !== "TIR" && dev_r !== "TIR") ? `${(dev_v - dev_r).toFixed(2)}°` : "N/A";
        }
    </script>
</body>
</html>
