    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --border: rgba(0, 229, 255, 0.2);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 12px 20px; background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; position: relative;
        }

        .back-btn {
            color: var(--primary); text-decoration: none; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
        }

        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        /* Workspace & Canvas */
        .workspace {
            position: relative; flex-grow: 1; width: 100%; display: flex; overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; touch-action: none; cursor: crosshair;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%;
            background-image: url('../../logo.png'); background-size: contain;
            background-repeat: no-repeat; background-position: center;
            opacity: 0.06; pointer-events: none; z-index: 0;
        }

        /* HUD Panel */
        .hud-panel {
            position: absolute; z-index: 50; background: var(--panel-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .hud-header {
            padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }

        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .hud-content {
            padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px;
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }

        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        /* Device Specific HUD Layout */
        @media (min-width: 901px) {
            .hud-panel { top: 20px; left: 20px; width: 380px; max-height: calc(100% - 40px); border-radius: 16px; }
        }

        @media (max-width: 900px) {
            .hud-panel { bottom: 0; left: 0; width: 100%; height: 45vh; border-radius: 20px 20px 0 0; border-bottom: none; border-left: none; border-right: none; }
        }

        /* Controls */
        .section-title { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

        .btn {
            flex: 1 1 calc(50% - 8px); min-width: 130px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s ease; text-align: center; text-decoration: none;
            display: inline-block;
        }

        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); color: var(--primary); pointer-events: none; }

        /* Sliders */
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        /* Stats & Formulas */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; }
        .stat strong { color: var(--secondary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat span { font-size: 1.1rem; font-weight: bold; color: var(--text-main); font-family: monospace; }

        .formula-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            text-align: center; color: var(--primary); font-weight: bold; font-size: 0.9rem; overflow-x: auto;
            display: flex; flex-direction: column; gap: 8px; font-family: 'Segoe UI', serif; font-style: italic;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="back-btn">← Dashboard</a>
        <h1>Dispersion</h1>
    </nav>

    <div class="workspace">
        <div class="watermark"></div>
        <canvas id="simCanvas"></canvas>

        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>Controls</h2>
            </div>
            
            <div class="hud-content">
                <div class="toolbar">
                    <a href="index.html" class="btn">Ray Diagram</a>
                    <a href="dispersion.html" class="btn active">Dispersion</a>
                    <a href="deviation-graph.html" class="btn">Deviation Graph</a>
                    <a href="two-prisms.html" class="btn">Two Prisms</a>
                </div>

                <div id="controlsContainer">
                    <div class="section-title">Prism Properties</div>
                    <div class="control-group">
                        <label>Angle of Prism (A) <span id="aVal">60°</span></label>
                        <input id="aSlider" type="range" min="30" max="80" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Base Refractive Index (n) <span id="nVal">1.50</span></label>
                        <input id="nSlider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Angle of Incidence (i) <span id="iVal">45°</span></label>
                        <input id="iSlider" type="range" min="0" max="85" step="1" value="45">
                    </div>
                </div>

                <div class="section-title" style="margin-top: 5px;">Analysis & Results</div>
                <div id="resultsContainer">
                    <div class="stat-grid">
                        <div class="stat"><strong>Δ Violet</strong><span id="dVOut">0°</span></div>
                        <div class="stat"><strong>Δ Red</strong><span id="dROut">0°</span></div>
                        <div class="stat" style="grid-column: span 2;"><strong>Angular Dispersion</strong><span id="dispOut">0°</span></div>
                    </div>
                    <div class="formula-panel">
                        \[ n(\lambda) = A + \frac{B}{\lambda^2} \quad \text{(Cauchy's Eq)} \]
                        \[ \delta_V - \delta_R = (\mu_V - \mu_R)A \]
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");
        const hudPanel = document.getElementById("hudPanel");
        
        const aSlider = document.getElementById("aSlider");
        const nSlider = document.getElementById("nSlider");
        const iSlider = document.getElementById("iSlider");
        
        let W = 0, H = 0, originX = 0, originY = 0, drawScale = 1, initialized = false;

        function updateLayout() {
            if (W > 900) {
                originX = 380 + (W - 380) * 0.45; originY = H * 0.55; drawScale = Math.min(1, H / 600);
            } else {
                const visH = H - (hudPanel.offsetHeight || (H * 0.45));
                originX = W * 0.5; originY = visH * 0.65; drawScale = Math.min(1, visH / 400, W / 600);
            }
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width); H = Math.floor(entry.contentRect.height);
                canvas.width = W; canvas.height = H; updateLayout();
                if (!initialized && W > 10 && H > 10) { initialized = true; draw(); } else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));
        setTimeout(() => { if (!initialized) { W = canvas.parentElement.clientWidth; H = canvas.parentElement.clientHeight || 500; canvas.width = W; canvas.height = H; initialized = true; updateLayout(); draw(); } }, 300);

        function updateUI() {
            document.getElementById("aVal").textContent = `${aSlider.value}°`; document.getElementById("nVal").textContent = parseFloat(nSlider.value).toFixed(2); document.getElementById("iVal").textContent = `${iSlider.value}°`;
            draw();
        }
        [aSlider, nSlider, iSlider].forEach(el => el.addEventListener("input", updateUI));

        function mapX(x) { return originX + x * drawScale; } function mapY(y) { return originY - y * drawScale; }
        function norm(v) { let l = Math.hypot(v.x, v.y) || 1; return { x: v.x/l, y: v.y/l }; }
        function dot(a, b) { return a.x*b.x + a.y*b.y; }
        
        function getOutwardNormal(p1, p2, center) {
            let dx = p2.x - p1.x, dy = p2.y - p1.y, l = Math.hypot(dx, dy), n = { x: dy/l, y: -dx/l }; 
            let mid = { x: (p1.x + p2.x)/2, y: (p1.y + p2.y)/2 }, toCenter = { x: center.x - mid.x, y: center.y - mid.y };
            if (dot(n, toCenter) > 0) { n.x = -n.x; n.y = -n.y; } return n;
        }

        function refract(D, N, n1, n2) {
            let r = n1 / n2, c = -dot(D, N);
            if (c < 0) { N = {x: -N.x, y: -N.y}; c = -c; }
            let sin2_t = r * r * (1 - c * c);
            if (sin2_t > 1.0) return { tir: true };
            return { tir: false, dir: { x: r * D.x + (r * c - Math.sqrt(1 - sin2_t)) * N.x, y: r * D.y + (r * c - Math.sqrt(1 - sin2_t)) * N.y } };
        }

        function reflect(D, N) {
            let cosI = -dot(D, N);
            let outN = {x: N.x, y: N.y};
            if (cosI < 0) { outN = {x: -N.x, y: -N.y}; cosI = -cosI; }
            return { x: D.x + 2 * cosI * outN.x, y: D.y + 2 * cosI * outN.y };
        }

        function lineIntersect(p1, d1, a, b) {
            let v1 = p1, v2 = {x: p1.x + d1.x, y: p1.y + d1.y}, v3 = a, v4 = b;
            let denom = (v1.x - v2.x)*(v3.y - v4.y) - (v1.y - v2.y)*(v3.x - v4.x);
            if (Math.abs(denom) < 1e-6) return null;
            let t = ((v1.x - v3.x)*(v3.y - v4.y) - (v1.y - v3.y)*(v3.x - v4.x)) / denom;
            let u = -((v1.x - v2.x)*(v1.y - v3.y) - (v1.y - v2.y)*(v1.x - v3.x)) / denom;
            if (t > 1e-5 && u >= 0 && u <= 1) return { t: t, p: { x: p1.x + t*d1.x, y: p1.y + t*d1.y } }; return null;
        }

        function getPrismPoints(offsetX, A_rad, n) {
            const side = 260, h = side * Math.cos(A_rad/2), w = side * Math.sin(A_rad/2);
            let pts = [ {x: offsetX, y: h*0.5}, {x: offsetX - w, y: -h*0.5}, {x: offsetX + w, y: -h*0.5} ];
            const center = { x: offsetX, y: (pts[0].y + pts[1].y + pts[2].y) / 3 };
            const edges = [
                { a: pts[1], b: pts[0], n: getOutwardNormal(pts[1], pts[0], center) },
                { a: pts[0], b: pts[2], n: getOutwardNormal(pts[0], pts[2], center) },
                { a: pts[2], b: pts[1], n: getOutwardNormal(pts[2], pts[1], center) }
            ];
            return { pts, edges, n, A_rad };
        }

        function drawArrowLine(p1, p2, color, dashed=false, showArrow=true) {
            const sx1 = mapX(p1.x), sy1 = mapY(p1.y), sx2 = mapX(p2.x), sy2 = mapY(p2.y);
            ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
            if(dashed) { ctx.setLineDash([5,5]); ctx.globalAlpha = 0.5; } else { ctx.shadowBlur = 10; ctx.shadowColor = color; }
            ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
            ctx.setLineDash([]); ctx.shadowBlur = 0;
            const dx = sx2 - sx1, dy = sy2 - sy1, len = Math.hypot(dx, dy);
            if(showArrow && len > 30 && !dashed) {
                const angle = Math.atan2(dy, dx), mx = sx1 + (dx/len) * Math.min(len * 0.6, 120), my = sy1 + (dy/len) * Math.min(len * 0.6, 120);
                ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx - 12*Math.cos(angle-0.4), my - 12*Math.sin(angle-0.4)); ctx.lineTo(mx - 12*Math.cos(angle+0.4), my - 12*Math.sin(angle+0.4)); ctx.closePath(); ctx.fill();
            } ctx.restore();
        }

        function drawNormalArrow(x, y, dir_screen) {
            const angle = Math.atan2(dir_screen.y, dir_screen.x);
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 8*Math.cos(angle-0.4), y - 8*Math.sin(angle-0.4)); ctx.lineTo(x - 8*Math.cos(angle+0.4), y - 8*Math.sin(angle+0.4)); ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fill();
        }

        function drawDashedNormal(p, N) {
            ctx.save(); ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.setLineDash([4,4]); ctx.lineWidth = 1.5; ctx.beginPath();
            let screen_N = { x: N.x, y: -N.y };
            let px1 = mapX(p.x) + screen_N.x * 120, py1 = mapY(p.y) + screen_N.y * 120;
            let px2 = mapX(p.x) - screen_N.x * 120, py2 = mapY(p.y) - screen_N.y * 120;
            ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke();
            drawNormalArrow(px1, py1, screen_N); drawNormalArrow(px2, py2, {x: -screen_N.x, y: -screen_N.y}); ctx.restore();
        }

        function drawArcLabel(p, v1, v2, radius, label, color) {
            const sx = mapX(p.x), sy = mapY(p.y);
            let a1 = Math.atan2(-v1.y, v1.x), a2 = Math.atan2(-v2.y, v2.x);
            if(a1 < 0) a1 += 2*Math.PI; if(a2 < 0) a2 += 2*Math.PI;
            let start = Math.min(a1, a2), end = Math.max(a1, a2);
            if(end - start > Math.PI) { start = Math.max(a1, a2); end = Math.min(a1, a2) + 2*Math.PI; }
            ctx.save(); ctx.beginPath(); ctx.arc(sx, sy, radius, start, end); ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([3,3]); ctx.stroke();
            let mid = start + (end - start > Math.PI ? (end - start - 2*Math.PI)/2 : (end - start)/2);
            ctx.fillStyle = color; ctx.font = "italic 13px 'Segoe UI'"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(label, sx + (radius + 20)*Math.cos(mid), sy + (radius + 20)*Math.sin(mid)); ctx.restore();
        }

        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            const A = parseFloat(aSlider.value), n = parseFloat(nSlider.value), i_deg = parseFloat(iSlider.value);
            const A_rad = A * Math.PI / 180, i_rad = i_deg * Math.PI / 180;
            const p1 = getPrismPoints(0, A_rad, n);

            ctx.save(); ctx.beginPath(); ctx.moveTo(mapX(p1.pts[0].x), mapY(p1.pts[0].y)); ctx.lineTo(mapX(p1.pts[1].x), mapY(p1.pts[1].y)); ctx.lineTo(mapX(p1.pts[2].x), mapY(p1.pts[2].y)); ctx.closePath();
            ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; ctx.fill(); ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "center";
            ctx.fillText("A", mapX(p1.pts[0].x), mapY(p1.pts[0].y) - 15); ctx.fillText("B", mapX(p1.pts[1].x) - 15, mapY(p1.pts[1].y) + 25); ctx.fillText("C", mapX(p1.pts[2].x) + 15, mapY(p1.pts[2].y) + 25);
            drawArcLabel(p1.pts[0], {x: p1.pts[1].x - p1.pts[0].x, y: p1.pts[1].y - p1.pts[0].y}, {x: p1.pts[2].x - p1.pts[0].x, y: p1.pts[2].y - p1.pts[0].y}, 35*drawScale, `A=${A}°`, "#ffffff");
            ctx.restore();

            const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#00e5ff', '#4b0082', '#9400d3'];
            const n_vals = [n - 0.04, n - 0.02, n - 0.01, n, n + 0.02, n + 0.04, n + 0.07];
            
            const outNormalLeft = p1.edges[0].n; 
            const inwardNormalAngle = Math.atan2(-outNormalLeft.y, -outNormalLeft.x);
            const rayAngle = inwardNormalAngle - i_rad; 
            const d_inc = { x: Math.cos(rayAngle), y: Math.sin(rayAngle) };
            const hitTarget = { x: p1.pts[1].x + (p1.pts[0].x - p1.pts[1].x)*0.35, y: p1.pts[1].y + (p1.pts[0].y - p1.pts[1].y)*0.35 };

            let startP = { x: hitTarget.x - d_inc.x * 400, y: hitTarget.y - d_inc.y * 400 };
            
            let bestHit1 = null; const eps = 1e-4; const px = startP.x + d_inc.x * eps, py = startP.y + d_inc.y * eps;
            for (let edge of p1.edges) {
                let hit = lineIntersect({x: px, y: py}, d_inc, edge.a, edge.b);
                if (hit && hit.t > 0 && (!bestHit1 || hit.t < bestHit1.t)) bestHit1 = { t: hit.t + eps, p: { x: startP.x + (hit.t + eps)*d_inc.x, y: startP.y + (hit.t + eps)*d_inc.y }, n: edge.n }; 
            }
            
            let hit1 = bestHit1 || { p: hitTarget, t: 400, n: outNormalLeft }; 
            
            drawArrowLine(startP, hit1.p, "#ffffff");
            drawDashedNormal(hit1.p, hit1.n);
            drawArcLabel(hit1.p, {x: -d_inc.x, y: -d_inc.y}, hit1.n, 40*drawScale, `i=${i_deg.toFixed(1)}°`, "#ffffff");

            let dev_v = "TIR", dev_r = "TIR";

            for(let k=0; k<7; k++) {
                let n_k = n_vals[k], col = colors[k];
                let ref1 = refract(d_inc, hit1.n, 1.0, n_k);
                if (ref1.tir) continue;

                let bestHit2 = null;
                const p2x = hit1.p.x + ref1.dir.x * eps, p2y = hit1.p.y + ref1.dir.y * eps;
                for (let edge of p1.edges) {
                    let hit = lineIntersect({x: p2x, y: p2y}, ref1.dir, edge.a, edge.b);
                    if (hit && hit.t > 0 && (!bestHit2 || hit.t < bestHit2.t)) bestHit2 = { t: hit.t + eps, p: { x: hit1.p.x + (hit.t + eps)*ref1.dir.x, y: hit1.p.y + (hit.t + eps)*ref1.dir.y }, n: edge.n }; 
                }

                let hit2 = bestHit2;
                if (hit2) {
                    drawArrowLine(hit1.p, hit2.p, col, false, false); 
                    
                    let inNormal2 = { x: -hit2.n.x, y: -hit2.n.y };
                    let ref2 = refract(ref1.dir, inNormal2, n_k, 1.0);

                    if (!ref2.tir) {
                        const e_rad = Math.asin(n_k * Math.sin((A - parseFloat((Math.asin(Math.sin(i_rad) / n_k) * 180 / Math.PI))) * Math.PI/180));
                        const delta_deg = (i_deg + (e_rad * 180 / Math.PI) - A).toFixed(1);
                        if(k===0) dev_r = delta_deg;
                        if(k===6) dev_v = delta_deg;

                        let finalEnd = { x: hit2.p.x + ref2.dir.x * 800, y: hit2.p.y + ref2.dir.y * 800 };
                        drawArrowLine(hit2.p, finalEnd, col, false, true);
                        
                    } else {
                        // Tracing TIR reflection path
                        let tirDir = reflect(ref1.dir, inNormal2);
                        let bestHit3 = null;
                        const p3x = hit2.p.x + tirDir.x * eps, p3y = hit2.p.y + tirDir.y * eps;
                        for (let edge of p1.edges) {
                            let hit = lineIntersect({x: p3x, y: p3y}, tirDir, edge.a, edge.b);
                            if (hit && hit.t > 0 && (!bestHit3 || hit.t < bestHit3.t)) bestHit3 = { t: hit.t + eps, p: { x: hit2.p.x + (hit.t + eps)*tirDir.x, y: hit2.p.y + (hit.t + eps)*tirDir.y }, n: edge.n }; 
                        }

                        if(bestHit3) {
                            drawArrowLine(hit2.p, bestHit3.p, col, false, false);
                            let inNormal3 = { x: -bestHit3.n.x, y: -bestHit3.n.y };
                            let ref3 = refract(tirDir, inNormal3, n_k, 1.0);
                            
                            if (!ref3.tir) {
                                let finalEnd = { x: bestHit3.p.x + ref3.dir.x * 800, y: bestHit3.p.y + ref3.dir.y * 800 };
                                drawArrowLine(bestHit3.p, finalEnd, col, false, true);
                            } else {
                                let tirDir2 = reflect(tirDir, inNormal3);
                                let finalEnd = { x: bestHit3.p.x + tirDir2.x * 800, y: bestHit3.p.y + tirDir2.y * 800 };
                                drawArrowLine(bestHit3.p, finalEnd, col, false, true);
                            }
                        } else {
                            let finalEnd = { x: hit2.p.x + tirDir.x * 800, y: hit2.p.y + tirDir.y * 800 };
                            drawArrowLine(hit2.p, finalEnd, col, false, true);
                        }
                    }
                }
            }
            document.getElementById('dVOut').textContent = dev_v !== "TIR" ? `${dev_v}°` : "TIR";
            document.getElementById('dROut').textContent = dev_r !== "TIR" ? `${dev_r}°` : "TIR";
            document.getElementById('dispOut').textContent = (dev_v !== "TIR" && dev_r !== "TIR") ? `${(dev_v - dev_r).toFixed(2)}°` : "N/A";
        }
        setMode('dispersion');
    </script>
</body>
</html>
