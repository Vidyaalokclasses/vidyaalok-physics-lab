<style>
:root{
  --bg-1:#07111c;
  --bg-2:#10253a;
  --bg-3:#183a52;
  --glass:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.18);
  --text:#eef7ff;
  --muted:#bdd3e4;
  --accent:#ffd166;
  --shadow:0 24px 60px rgba(0,0,0,0.35);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:'Segoe UI',sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(86,204,242,0.18), transparent 28%),
    radial-gradient(circle at top right, rgba(255,209,102,0.12), transparent 24%),
    linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
}
.page-shell{min-height:100vh;display:flex;flex-direction:column}
.navbar{
  padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;
  background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.1);
}
.brand{font-size:24px;font-weight:700}
.nav-actions{display:flex;gap:12px;flex-wrap:wrap}
button{
  border:none;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;
  transition:transform 0.22s ease;
}
button:hover{transform:translateY(-2px)}
.primary-btn{background:linear-gradient(135deg,#ffd166,#ffb703);color:#162130}
.ghost-btn{background:rgba(255,255,255,0.08);color:var(--text);border:1px solid rgba(255,255,255,0.15)}
.main{flex:1;width:min(1200px,94vw);margin:0 auto;padding:28px 0 36px}
.hero{display:block;margin-bottom:24px}
.hero-card,.viewer-card{
  background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);
}
.hero-card{padding:28px}
.hero-card h1{margin:0 0 12px;font-size:clamp(28px,4vw,44px);line-height:1.02}
.hero-card p{margin:0;color:var(--muted);font-size:15px;line-height:1.65}
.hero-pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#dff3ff;font-size:13px}
.viewer-card{padding:24px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.breadcrumbs{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.crumb{
  padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);color:var(--text);cursor:pointer;
}
.crumb.active{background:linear-gradient(135deg, rgba(255,209,102,0.22), rgba(86,204,242,0.18));border-color:rgba(255,209,102,0.35)}
.level-tag{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase}
.toolbar-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mini-btn{
  padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);color:var(--text);font-size:13px;
}
.mini-btn:disabled{opacity:0.45;cursor:not-allowed;transform:none}
.flow-stage{min-height:440px}
.formula-browser{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.topic-rail{display:flex;flex-direction:column;gap:12px}
.topic-button{
  width:100%;text-align:left;padding:16px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.12);
  background:linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));color:var(--text);box-shadow:0 16px 32px rgba(0,0,0,0.18);
}
.topic-button.active{border-color:rgba(255,209,102,0.4);background:linear-gradient(180deg, rgba(255,209,102,0.18), rgba(86,204,242,0.08))}
.topic-button-title{display:block;font-size:17px;font-weight:700;margin-bottom:6px}
.topic-button-desc{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.formula-display{
  min-width:0;padding:22px;border-radius:24px;border:1px solid rgba(255,255,255,0.12);
  background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));box-shadow:0 20px 40px rgba(0,0,0,0.2);
}
.display-header{margin-bottom:20px}
.display-kicker{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
.display-title{margin:6px 0 8px;font-size:30px;line-height:1.1}
.display-desc{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
.subtopic-stack{display:flex;flex-direction:column;gap:18px}
.subtopic-panel{padding:18px;border-radius:22px;background:rgba(6,16,28,0.5);border:1px solid rgba(255,255,255,0.08)}
.subtopic-header{margin-bottom:14px}
.subtopic-title{margin:0 0 6px;font-size:20px}
.subtopic-desc{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.formula-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.node-card{
  position:relative;overflow:hidden;text-align:left;padding:18px 18px 16px;border-radius:24px;border:1px solid rgba(255,255,255,0.14);
  background:linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));box-shadow:0 20px 40px rgba(0,0,0,0.22);
}
.card-kicker{display:inline-block;margin-bottom:10px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.importance-tag{
  display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:4px 9px;border-radius:999px;background:rgba(255,209,102,0.14);
  border:1px solid rgba(255,209,102,0.24);color:#ffe39b;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;vertical-align:middle;
}
.card-title{margin:0 0 8px;font-size:20px;line-height:1.2}
.formula-box{margin-top:14px;padding:14px 16px;border-radius:18px;background:rgba(5,14,24,0.58);border:1px solid rgba(124,242,155,0.15);overflow-x:auto}
.formula-main{color:#f8f7c7;font-size:18px;font-weight:700;line-height:1.45;word-break:break-word;text-align:center;white-space:normal}
.formula-main mjx-container{max-width:100%;overflow:visible;padding-bottom:4px}
.formula-note{margin-top:10px;color:#bde8c8;font-size:13px;line-height:1.5}
.empty-state{padding:30px 18px;text-align:center;color:var(--muted)}
@media(max-width:900px){.formula-browser{grid-template-columns:1fr}}
@media(max-width:640px){.viewer-card{padding:18px}.formula-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page-shell">
  <div class="navbar">
    <div class="brand">🔬 Vidyaalok Classes</div>
    <div class="nav-actions">
      <button class="ghost-btn" onclick="goToChapter()">Back To Ray Optics</button>
      <button class="primary-btn" onclick="resetFlow()">Start From Root</button>
    </div>
  </div>
  <main class="main">
    <section class="hero">
      <div class="hero-card">
        <h1>Ray Optics Formula Browser</h1>
        <p>
          Open one topic at a time and see only its formulas on screen. This keeps the revision cleaner for mirrors, lenses, prism systems, optical instruments, and the human eye.
        </p>
        <div class="hero-pills">
          <span class="pill">Reflection</span>
          <span class="pill">Refraction</span>
          <span class="pill">Prism</span>
          <span class="pill">Microscope</span>
          <span class="pill">Human Eye</span>
        </div>
      </div>
    </section>
    <section class="viewer-card">
      <div class="toolbar">
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <div class="toolbar-actions">
          <button class="mini-btn" id="backOneBtn" type="button">← Back One Level</button>
          <div class="level-tag" id="levelTag">Select A Topic</div>
        </div>
      </div>
      <div class="flow-stage" id="flowStage"></div>
    </section>
  </main>
</div>

<script>
const flowData = {
  id: "root",
  title: "Ray Optics",
  type: "root",
  description: "Choose a topic and open its formula set.",
  children: [
    {
      id: "reflection",
      title: "Reflection",
      type: "topic",
      description: "Plane mirrors, curved mirrors, and mirror combinations.",
      children: [
        {
          id: "plane-mirror",
          title: "Plane Mirror",
          type: "subtopic",
          description: "Distance, image motion, and mirror movement.",
          children: [
            { id: "plane-equal-distance", title: "Image Distance", type: "formula", formula: "v = -u", note: "For a plane mirror, image distance equals object distance in magnitude.", important: true },
            { id: "plane-mirror-shift", title: "Mirror Shift", type: "formula", formula: "x_{\\text{image}} = 2x_{\\text{mirror}}", note: "If the plane mirror shifts by x, the image shifts by 2x.", important: true },
            { id: "two-mirror-images", title: "Two Plane Mirrors", type: "formula", formula: "m = \\frac{360^\\circ}{\\theta}", note: "If m is even, N = m - 1. If m is odd, N = m - 1 for a symmetric object and N = m for an asymmetric object." }
          ]
        },
        {
          id: "curved-mirror",
          title: "Curved Mirrors",
          type: "subtopic",
          description: "Concave and convex mirrors.",
          children: [
            { id: "mirror-formula", title: "Mirror Formula", type: "formula", formula: "\\frac{1}{f} = \\frac{1}{v} + \\frac{1}{u}", note: "Use Cartesian sign convention.", important: true },
            { id: "mirror-magnification", title: "Magnification", type: "formula", formula: "m = -\\frac{v}{u} = \\frac{h_i}{h_o}", note: "Negative magnification indicates inverted image.", important: true },
            { id: "mirror-radius", title: "Radius and Focal Length", type: "formula", formula: "f = \\frac{R}{2}", note: "Applies to spherical mirrors.", important: true }
          ]
        }
      ]
    },
    {
      id: "refraction",
      title: "Refraction",
      type: "topic",
      description: "Glass slab, curved surface, and lens formulas.",
      children: [
        {
          id: "basic-refraction",
          title: "Basic Refraction",
          type: "subtopic",
          description: "Snell's law and slab shift.",
          children: [
            { id: "snells-law", title: "Snell's Law", type: "formula", formula: "n_1\\sin i = n_2\\sin r", note: "Fundamental law of refraction.", important: true },
            { id: "refractive-index", title: "Refractive Index", type: "formula", formula: "n = \\frac{c}{v}", note: "Ratio of speed of light in vacuum to that in the medium." },
            { id: "lateral-shift", title: "Glass Slab Lateral Shift", type: "formula", formula: "d = t\\,\\frac{\\sin(i-r)}{\\cos r}", note: "For a parallel-sided slab.", important: true }
          ]
        },
        {
          id: "curved-surface",
          title: "Curved Surface and Lens",
          type: "subtopic",
          description: "Spherical refracting surface and thin lens formulas.",
          children: [
            { id: "spherical-surface", title: "Refraction at Spherical Surface", type: "formula", formula: "\\frac{n_2}{v} - \\frac{n_1}{u} = \\frac{n_2-n_1}{R}", note: "Standard refraction formula for a curved surface.", important: true },
            { id: "lens-formula", title: "Lens Formula", type: "formula", formula: "\\frac{1}{f} = \\frac{1}{v} - \\frac{1}{u}", note: "For thin lenses with Cartesian sign convention.", important: true },
            { id: "lens-magnification", title: "Lens Magnification", type: "formula", formula: "m = \\frac{v}{u} = \\frac{h_i}{h_o}", note: "Positive magnification indicates erect image." }
          ]
        },
        {
          id: "lens-maker",
          title: "Lens Maker and Power",
          type: "subtopic",
          description: "Focal length and power relations.",
          children: [
            { id: "lens-maker-formula", title: "Lens Maker Formula", type: "formula", formula: "\\frac{1}{f} = (\\mu - 1)\\left(\\frac{1}{R_1} - \\frac{1}{R_2}\\right)", note: "For a thin lens in air.", important: true },
            { id: "power-lens", title: "Power of Lens", type: "formula", formula: "P = \\frac{1}{f}", note: "f in metre, P in dioptre.", important: true },
            { id: "power-combination", title: "Lenses in Contact", type: "formula", formula: "P_{\\text{eq}} = P_1 + P_2 + P_3 + \\cdots", note: "Equivalent power for thin lenses in contact.", important: true }
          ]
        }
      ]
    },
    {
      id: "tir-prism",
      title: "TIR and Prism",
      type: "topic",
      description: "Critical angle, prism deviation, and special prism conditions.",
      children: [
        {
          id: "tir",
          title: "Total Internal Reflection",
          type: "subtopic",
          description: "Critical angle and condition.",
          children: [
            { id: "critical-angle", title: "Critical Angle", type: "formula", formula: "\\sin C = \\frac{n_2}{n_1}", note: "For light going from denser to rarer medium, with n1 > n2.", important: true },
            { id: "tir-condition", title: "TIR Condition", type: "formula", formula: "i > C", note: "Total internal reflection occurs only beyond the critical angle." }
          ]
        },
        {
          id: "prism",
          title: "Prism Relations",
          type: "subtopic",
          description: "Deviation and minimum-deviation formulas.",
          children: [
            { id: "prism-deviation", title: "Angle of Deviation", type: "formula", formula: "\\delta = i + e - A", note: "General deviation formula for a prism.", important: true },
            { id: "minimum-deviation", title: "At Minimum Deviation", type: "formula", formula: "\\mu = \\frac{\\sin\\left(\\frac{A+\\delta_m}{2}\\right)}{\\sin\\left(\\frac{A}{2}\\right)}", note: "Most-used prism formula in problems.", important: true },
            { id: "thin-prism", title: "Thin Prism", type: "formula", formula: "\\delta = (\\mu - 1)A", note: "Approximation for a thin prism.", important: true }
          ]
        }
      ]
    },
    {
      id: "instruments",
      title: "Optical Instruments",
      type: "topic",
      description: "Microscope and telescope formulas.",
      children: [
        {
          id: "microscope",
          title: "Microscope",
          type: "subtopic",
          description: "Simple and compound microscope.",
          children: [
            { id: "simple-microscope", title: "Simple Microscope", type: "formula", formula: "M = 1 + \\frac{D}{f}", note: "Magnifying power for final image at near point.", important: true },
            { id: "simple-microscope-infinity", title: "Simple Microscope at Infinity", type: "formula", formula: "M = \\frac{D}{f}", note: "For final image at infinity." },
            { id: "compound-microscope", title: "Compound Microscope", type: "formula", formula: "M = \\frac{L}{f_o}\\left(1 + \\frac{D}{f_e}\\right)", note: "Standard magnifying power formula.", important: true }
          ]
        },
        {
          id: "telescope",
          title: "Telescope",
          type: "subtopic",
          description: "Astronomical telescope formulas.",
          children: [
            { id: "telescope-normal", title: "Normal Adjustment", type: "formula", formula: "M = \\frac{f_o}{f_e}", note: "Magnifying power of astronomical telescope in normal adjustment.", important: true },
            { id: "telescope-near-point", title: "At Near Point", type: "formula", formula: "M = \\frac{f_o}{f_e}\\left(1 + \\frac{f_e}{D}\\right)", note: "When final image is formed at the least distance of distinct vision." }
          ]
        }
      ]
    },
    {
      id: "human-eye",
      title: "Human Eye",
      type: "topic",
      description: "Eye defects and correction relations.",
      children: [
        {
          id: "eye-defects",
          title: "Defects and Correction",
          type: "subtopic",
          description: "Myopia, hypermetropia, and power relations.",
          children: [
            { id: "power-correction", title: "Corrective Lens Power", type: "formula", formula: "P = \\frac{1}{f}", note: "Used for spectacle correction as well, with f in metre." },
            { id: "myopia", title: "Myopia Correction", type: "formula", formula: "P = -\\frac{1}{x}", note: "For far point at x metre, use a diverging lens.", important: true },
            { id: "hypermetropia", title: "Hypermetropia Correction", type: "formula", formula: "P = \\frac{1}{D} - \\frac{1}{x}", note: "For near point shifted to x metre, with D = 0.25 m.", important: true }
          ]
        }
      ]
    }
  ]
};

const pathIds = ["root"];

function goToChapter(){
  window.location.href = "ray-optics.html";
}

function resetFlow(){
  pathIds.length = 0;
  pathIds.push("root");
  renderFlow();
}

function findNodeById(node, id){
  if(node.id === id) return node;
  if(!node.children) return null;
  for(const child of node.children){
    const found = findNodeById(child, id);
    if(found) return found;
  }
  return null;
}

function getPathNodes(){
  return pathIds.map(id => findNodeById(flowData, id)).filter(Boolean);
}

function currentNode(){
  return findNodeById(flowData, pathIds[pathIds.length - 1]);
}

function getTopicNodes(){
  return flowData.children || [];
}

function getSelectedTopic(){
  return pathIds.length > 1 ? currentNode() : null;
}

function formatFormulaText(text){
  return `\\[${text}\\]`;
}

function formatNoteText(text){
  return text;
}

function renderBreadcrumbs(){
  const breadcrumbs = document.getElementById("breadcrumbs");
  const nodes = getPathNodes();
  breadcrumbs.innerHTML = "";
  nodes.forEach((node, index) => {
    const crumb = document.createElement("button");
    crumb.className = "crumb" + (index === nodes.length - 1 ? " active" : "");
    crumb.textContent = node.title;
    crumb.onclick = () => {
      pathIds.splice(index + 1);
      renderFlow();
    };
    breadcrumbs.appendChild(crumb);
  });
  const current = nodes[nodes.length - 1];
  document.getElementById("levelTag").textContent = current.type === "topic" ? `Showing · ${current.title}` : "Select A Topic";
  document.getElementById("backOneBtn").disabled = nodes.length <= 1;
}

function createFormulaCard(node){
  const card = document.createElement("div");
  card.className = "node-card formula";

  const kicker = document.createElement("div");
  kicker.className = "card-kicker";
  kicker.textContent = "Formula";
  if(node.important){
    const tag = document.createElement("span");
    tag.className = "importance-tag";
    tag.textContent = "Most Asked";
    kicker.appendChild(tag);
  }
  card.appendChild(kicker);

  const title = document.createElement("h3");
  title.className = "card-title";
  title.textContent = node.title;
  card.appendChild(title);

  const formulaBox = document.createElement("div");
  formulaBox.className = "formula-box";

  const formulaMain = document.createElement("div");
  formulaMain.className = "formula-main";
  formulaMain.innerHTML = formatFormulaText(node.formula);
  formulaBox.appendChild(formulaMain);

  if(node.note){
    const formulaNote = document.createElement("div");
    formulaNote.className = "formula-note";
    formulaNote.innerHTML = formatNoteText(node.note);
    formulaBox.appendChild(formulaNote);
  }

  card.appendChild(formulaBox);
  return card;
}

function renderFlow(){
  renderBreadcrumbs();
  const stage = document.getElementById("flowStage");
  stage.innerHTML = "";

  const browser = document.createElement("div");
  browser.className = "formula-browser";

  const topicRail = document.createElement("div");
  topicRail.className = "topic-rail";

  const selectedTopic = getSelectedTopic();
  getTopicNodes().forEach(topic => {
    const button = document.createElement("button");
    button.className = "topic-button" + (selectedTopic && selectedTopic.id === topic.id ? " active" : "");
    button.type = "button";
    button.innerHTML = `<span class="topic-button-title">${topic.title}</span><span class="topic-button-desc">${topic.description || ""}</span>`;
    button.addEventListener("click", () => {
      pathIds.length = 0;
      pathIds.push("root", topic.id);
      renderFlow();
    });
    topicRail.appendChild(button);
  });

  const display = document.createElement("div");
  display.className = "formula-display";

  if(selectedTopic){
    const header = document.createElement("div");
    header.className = "display-header";
    header.innerHTML = `<div class="display-kicker">Current Topic</div><h2 class="display-title">${selectedTopic.title}</h2><p class="display-desc">${selectedTopic.description || ""}</p>`;
    display.appendChild(header);

    const stack = document.createElement("div");
    stack.className = "subtopic-stack";
    (selectedTopic.children || []).forEach(group => {
      const panel = document.createElement("section");
      panel.className = "subtopic-panel";
      panel.innerHTML = `<div class="subtopic-header"><h3 class="subtopic-title">${group.title}</h3><p class="subtopic-desc">${group.description || ""}</p></div>`;
      const formulaList = document.createElement("div");
      formulaList.className = "formula-list";
      (group.children || []).forEach(formulaNode => {
        formulaList.appendChild(createFormulaCard(formulaNode));
      });
      panel.appendChild(formulaList);
      stack.appendChild(panel);
    });
    display.appendChild(stack);
  } else {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "Select any topic from the left to show its formulas here. Opening another topic will replace the current one.";
    display.appendChild(empty);
  }

  browser.appendChild(topicRail);
  browser.appendChild(display);
  stage.appendChild(browser);

  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise([stage]);
  }
}

renderFlow();
document.getElementById("backOneBtn").addEventListener("click", () => {
  if(pathIds.length > 1){
    pathIds.pop();
    renderFlow();
  }
});
</script>
</body>
</html>
