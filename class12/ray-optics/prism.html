<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prism, Dispersion & Two Prisms | Vidyaalok Lab</title>

    <!-- MathJax for rendering LaTeX formulas -->
    <script>
      window.MathJax = { 
        tex: { inlineMath: [['\\(', '\\)']] }, 
        svg: { fontCache: 'global' } 
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --real-img: #00ffaa;
            --border: rgba(0, 229, 255, 0.2);
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 12px 20px; background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; position: relative;
        }

        .back-btn {
            color: var(--primary); text-decoration: none; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
        }
        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        /* Workspace & Canvas */
        .workspace {
            position: relative; flex-grow: 1; width: 100%; display: flex; overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; touch-action: none; cursor: crosshair;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%;
            background-image: url('../../logo.png'); background-size: contain;
            background-repeat: no-repeat; background-position: center;
            opacity: 0.06; pointer-events: none; z-index: 0;
        }

        /* HUD Panel */
        .hud-panel {
            position: absolute; z-index: 50; background: var(--panel-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7); transition: all 0.3s ease;
        }

        .hud-header {
            padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .hud-content {
            padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px;
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }
        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        /* Device Specific HUD Layout */
        @media (min-width: 901px) {
            .hud-panel { top: 20px; left: 20px; width: 380px; max-height: calc(100% - 40px); border-radius: 16px; }
        }
        @media (max-width: 900px) {
            .hud-panel { bottom: 0; left: 0; width: 100%; height: 45vh; border-radius: 20px 20px 0 0; border-bottom: none; border-left: none; border-right: none; }
        }

        /* Controls */
        .section-title { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn {
            flex: 1 1 calc(50% - 8px); min-width: 130px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s ease; text-align: center;
        }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); color: var(--primary); }

        /* Sliders */
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        /* Prisms List */
        .element-list { display: flex; flex-direction: column; gap: 6px; }
        .element-item {
            display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        .element-item:hover { border-color: rgba(255,255,255,0.3); }
        .element-item.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
        
        .editor-panel { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); margin-top: 10px;}

        /* Stats & Formulas */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; }
        .stat strong { color: var(--secondary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat span { font-size: 1.1rem; font-weight: bold; color: var(--text-main); font-family: monospace; }
        .stat.alert span { color: #ff3366; }
        
        .formula-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            text-align: center; color: var(--primary); font-weight: bold; font-size: 0.9rem; overflow-x: auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 09</a>
        <h1>Prism & Dispersion</h1>
    </nav>

    <div class="workspace">
        <div class="watermark"></div>
        <canvas id="simCanvas"></canvas>

        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>Simulation Mode</h2>
            </div>
            
            <div class="hud-content">
                <div class="toolbar">
                    <button class="btn active" id="btnRay" onclick="setMode('ray')">Ray Diagram</button>
                    <button class="btn" id="btnDispersion" onclick="setMode('dispersion')">Dispersion</button>
                    <button class="btn" id="btnGraph" onclick="setMode('graph')">Deviation Graph</button>
                    <button class="btn" id="btnTwoPrisms" onclick="setMode('two_prisms')">Two Prisms</button>
                </div>

                <div id="controlsContainer">
                    <div class="section-title">Prism Properties</div>
                    <div class="control-group">
                        <label>Angle of Prism (A) <span id="aVal">60°</span></label>
                        <input id="aSlider" type="range" min="30" max="90" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Refractive Index (n) <span id="nVal">1.50</span></label>
                        <input id="nSlider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Angle of Incidence (i) <span id="iVal">45°</span></label>
                        <input id="iSlider" type="range" min="0" max="90" step="1" value="45">
                    </div>
                </div>

                <!-- Two Prisms Toolkit -->
                <div id="comboContainer" style="display: none;">
                    <div class="section-title">Bring Optical Element</div>
                    <div class="toolbar">
                        <button class="btn" onclick="addPrism(false)">+ Upright Prism</button>
                        <button class="btn" onclick="addPrism(true)">+ Inverted Prism</button>
                    </div>

                    <div class="section-title" style="margin-top: 15px;">Optical Path Sequence</div>
                    <div class="element-list" id="elementList"></div>

                    <div id="editorPanel" class="editor-panel" style="display: none;">
                        <div class="section-title" id="editorTitle" style="color: var(--text-main);">Edit Prism</div>
                        <div class="control-group">
                            <label>Position X <span id="elXVal">0 cm</span></label>
                            <input id="elX" type="range" min="-400" max="800" step="1" value="0">
                        </div>
                        <div class="control-group">
                            <label>Position Y <span id="elYVal">0 cm</span></label>
                            <input id="elY" type="range" min="-300" max="300" step="1" value="0">
                        </div>
                        <div class="control-group">
                            <label>Angle of Prism (A) <span id="elAVal">60°</span></label>
                            <input id="elA" type="range" min="30" max="90" step="1" value="60">
                        </div>
                        <div class="control-group">
                            <label>Refractive Index (n) <span id="elNVal">1.50</span></label>
                            <input id="elN" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                        </div>
                        <button class="btn" style="width: 100%; border-color: rgba(255,51,102,0.4); color: #ff3366;" onclick="deleteSelected()">Remove Prism</button>
                    </div>
                </div>

                <div class="section-title" style="margin-top: 5px;">Analysis & Results</div>
                <div id="resultsContainer">
                    <!-- Populated dynamically by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");
        const hudPanel = document.getElementById("hudPanel");
        
        const aSlider = document.getElementById("aSlider");
        const nSlider = document.getElementById("nSlider");
        const iSlider = document.getElementById("iSlider");
        
        const comboContainer = document.getElementById("comboContainer");
        const elementListUI = document.getElementById("elementList");
        const editorPanel = document.getElementById("editorPanel");
        const elXSlider = document.getElementById("elX");
        const elYSlider = document.getElementById("elY");
        const elASlider = document.getElementById("elA");
        const elNSlider = document.getElementById("elN");
        
        let W = 0, H = 0, originX = 0, originY = 0;
        let drawScale = 1; 
        let initialized = false;
        let mode = 'ray'; // 'ray', 'dispersion', 'graph', 'two_prisms'

        let isDragging = false;
        let dragTarget = null;
        let dragOffsetX = 0, dragOffsetY = 0;

        let prisms = [];
        let selectedId = null;
        let nextId = 2;

        // --- DYNAMIC AUTO-SCALING LAYOUT ENGINE ---
        function updateLayout() {
            if (W > 900) {
                originX = 380 + (W - 380) * 0.35; 
                originY = H / 2;
                drawScale = Math.min(1, H / 600);
                if (mode === 'graph') {
                    originX = 380 + (W - 380) * 0.25; 
                }
            } else {
                const hudHeight = hudPanel.offsetHeight || (H * 0.45);
                const visH = H - hudHeight; // Exact pixel height available above HUD
                originX = W * 0.35; // Prism shifted left for mobile
                originY = visH * 0.5; // Centered vertically in available space
                
                if (mode === 'graph') {
                    originX = W / 2;
                    originY = visH * 0.35; 
                }
                // Aggressively scale to ensure scene fits in visible top area
                drawScale = Math.min(1, visH / 550, W / 800);
            }
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W;
                canvas.height = H;
                updateLayout();
                if (!initialized && W > 10 && H > 10) { initialized = true; draw(); } 
                else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));

        setTimeout(() => {
            if (!initialized && canvas.parentElement.clientWidth > 10) {
                W = canvas.parentElement.clientWidth;
                H = canvas.parentElement.clientHeight || 500; 
                canvas.width = W; canvas.height = H;
                initialized = true; 
                updateLayout(); draw();
            }
        }, 300);

        function initMainPrism() {
            prisms = [{ id: 1, x: 0, y: 0, A: parseFloat(aSlider.value), n: parseFloat(nSlider.value), invert: false }];
            selectedId = 1;
        }

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.toolbar .btn').forEach(btn => btn.classList.remove('active'));
            
            if (mode === 'ray') document.getElementById("btnRay").classList.add('active');
            if (mode === 'dispersion') document.getElementById("btnDispersion").classList.add('active');
            if (mode === 'graph') document.getElementById("btnGraph").classList.add('active');
            if (mode === 'two_prisms') document.getElementById("btnTwoPrisms").classList.add('active');

            comboContainer.style.display = (mode === 'two_prisms') ? "block" : "none";
            document.getElementById("controlsContainer").style.display = (mode === 'two_prisms') ? "none" : "block";

            initMainPrism(); 

            if (mode === 'two_prisms') {
                prisms.push({ id: nextId++, x: 260, y: -70, A: 60, n: 1.50, invert: true });
                selectedId = 1;
            }

            updateLayout();
            updateUI();
        }

        function updateUI() {
            const A = parseFloat(aSlider.value);
            const n = parseFloat(nSlider.value);
            const i_deg = parseFloat(iSlider.value);
            
            if (prisms.length > 0 && prisms[0].id === 1) {
                prisms[0].A = A;
                prisms[0].n = n;
            }

            document.getElementById("aVal").textContent = `${A}°`;
            document.getElementById("nVal").textContent = n.toFixed(2);
            document.getElementById("iVal").textContent = `${i_deg}°`;

            if (mode === 'two_prisms') {
                const sorted = [...prisms].sort((a,b) => a.x - b.x);
                elementListUI.innerHTML = "";
                
                sorted.forEach(el => {
                    const div = document.createElement("div");
                    div.className = "element-item" + (el.id === selectedId ? " active" : "");
                    const name = el.invert ? "Inverted Prism" : "Upright Prism";
                    div.innerHTML = `<span style="color:var(--primary)">P${el.id}: ${name}</span> <small>x:${Math.round(el.x)}, y:${Math.round(el.y)}</small>`;
                    div.onclick = () => { selectedId = el.id; updateUI(); draw(); };
                    elementListUI.appendChild(div);
                });

                const sel = prisms.find(e => e.id === selectedId);
                if (sel) {
                    editorPanel.style.display = "block";
                    document.getElementById("editorTitle").textContent = `Edit P${sel.id}`;
                    elXSlider.value = sel.x; elYSlider.value = sel.y;
                    elASlider.value = sel.A; elNSlider.value = sel.n;
                    document.getElementById("elXVal").textContent = `${Math.round(sel.x)} cm`;
                    document.getElementById("elYVal").textContent = `${Math.round(sel.y)} cm`;
                    document.getElementById("elAVal").textContent = `${Math.round(sel.A)}°`;
                    document.getElementById("elNVal").textContent = `${sel.n.toFixed(2)}`;
                } else {
                    editorPanel.style.display = "none";
                }
            }

            const resultsContainer = document.getElementById("resultsContainer");
            const A_rad = A * Math.PI / 180;
            const i_rad = i_deg * Math.PI / 180;
            
            const r1_rad = Math.asin(Math.sin(i_rad) / n);
            const r1_deg = r1_rad * 180 / Math.PI;
            const r2_rad = A_rad - r1_rad;
            const r2_deg = r2_rad * 180 / Math.PI;
            
            let e_rad = 0, e_deg = 0, delta_deg = 0;
            let isTIR = false;
            
            if (n * Math.sin(r2_rad) > 1) {
                isTIR = true;
            } else {
                e_rad = Math.asin(n * Math.sin(r2_rad));
                e_deg = e_rad * 180 / Math.PI;
                delta_deg = i_deg + e_deg - A;
            }

            if (mode === 'ray' || mode === 'two_prisms') {
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Refract 1 (r₁)</strong><span>${r1_deg.toFixed(1)}°</span></div>
                        <div class="stat"><strong>Refract 2 (r₂)</strong><span>${r2_deg.toFixed(1)}°</span></div>
                        <div class="stat ${isTIR ? 'alert' : ''}"><strong>Emergence (e)</strong><span>${isTIR ? 'TIR' : e_deg.toFixed(1) + '°'}</span></div>
                        <div class="stat ${isTIR ? 'alert' : ''}"><strong>Deviation (δ)</strong><span>${isTIR ? 'N/A' : delta_deg.toFixed(1) + '°'}</span></div>
                    </div>
                    <div class="formula-panel">
                        \\[ r_1 + r_2 = A \\]
                        \\[ \\delta = i + e - A \\]
                    </div>
                `;
            } else if (mode === 'dispersion') {
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Δ Violet</strong><span>${(i_deg + Math.asin((n+0.04)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n+0.04))))*180/Math.PI - A).toFixed(1)}°</span></div>
                        <div class="stat"><strong>Δ Red</strong><span>${(i_deg + Math.asin((n-0.02)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n-0.02))))*180/Math.PI - A).toFixed(1)}°</span></div>
                        <div class="stat" style="grid-column: span 2;"><strong>Angular Dispersion</strong><span>${((Math.asin((n+0.04)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n+0.04))))*180/Math.PI) - (Math.asin((n-0.02)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n-0.02))))*180/Math.PI)).toFixed(2)}°</span></div>
                    </div>
                    <div class="formula-panel" style="font-size: 0.8rem;">
                        \\[ n(\\lambda) = A + \\frac{B}{\\lambda^2} \\quad \\text{(Cauchy's Eq)} \\]
                    </div>
                `;
            } else if (mode === 'graph') {
                const i_min_rad = Math.asin(n * Math.sin(A_rad / 2));
                const d_min_deg = (2 * i_min_rad - A_rad) * 180 / Math.PI;
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Current Deviation (δ)</strong><span>${isTIR ? 'N/A' : delta_deg.toFixed(1) + '°'}</span></div>
                        <div class="stat"><strong>Minimum Deviation (δₘ)</strong><span style="color:var(--gold);">${d_min_deg.toFixed(1)}°</span></div>
                    </div>
                    <div class="formula-panel">
                        \\[ n = \\frac{\\sin\\left(\\frac{A + \\delta_m}{2}\\right)}{\\sin\\left(\\frac{A}{2}\\right)} \\]
                    </div>
                `;
            }

            if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([resultsContainer]);
            draw();
        }

        [aSlider, nSlider, iSlider].forEach(el => el.addEventListener("input", updateUI));

        function addPrism(invert) {
            prisms.push({ id: nextId++, type: 'prism', x: 250, y: 0, A: 60, n: 1.5, invert: invert });
            selectedId = nextId - 1;
            updateUI(); draw();
        }
        function deleteSelected() { 
            if (selectedId === 1) return; // Main prism cannot be deleted
            prisms = prisms.filter(e => e.id !== selectedId); 
            selectedId = prisms.length > 0 ? prisms[0].id : null; 
            updateUI(); draw(); 
        }

        elXSlider.addEventListener("input", (e) => { const sel = prisms.find(el => el.id === selectedId); if(sel) { sel.x = parseFloat(e.target.value); updateUI(); draw(); }});
        elYSlider.addEventListener("input", (e) => { const sel = prisms.find(el => el.id === selectedId); if(sel) { sel.y = parseFloat(e.target.value); updateUI(); draw(); }});
        elASlider.addEventListener("input", (e) => { const sel = prisms.find(el => el.id === selectedId); if(sel) { sel.A = parseFloat(e.target.value); if(sel.id===1){ aSlider.value=sel.A; } updateUI(); draw(); }});
        elNSlider.addEventListener("input", (e) => { const sel = prisms.find(el => el.id === selectedId); if(sel) { sel.n = parseFloat(e.target.value); if(sel.id===1){ nSlider.value=sel.n; } updateUI(); draw(); }});

        // --- INTERACTION ---
        function getEventX(e) {
            const rect = canvas.getBoundingClientRect();
            let cx = e.clientX;
            if (e.touches && e.touches.length > 0) cx = e.touches[0].clientX;
            else if (e.changedTouches && e.changedTouches.length > 0) cx = e.changedTouches[0].clientX;
            return (cx - rect.left) * (canvas.width / rect.width);
        }
        function getEventY(e) {
            const rect = canvas.getBoundingClientRect();
            let cy = e.clientY;
            if (e.touches && e.touches.length > 0) cy = e.touches[0].clientY;
            else if (e.changedTouches && e.changedTouches.length > 0) cy = e.changedTouches[0].clientY;
            return (cy - rect.top) * (canvas.height / rect.height);
        }

        canvas.addEventListener("mousedown", handleInputStart);
        canvas.addEventListener("mousemove", handleInputMove);
        window.addEventListener("mouseup", handleInputEnd);
        canvas.addEventListener("touchstart", handleInputStart, {passive: false});
        canvas.addEventListener("touchmove", handleInputMove, {passive: false});
        window.addEventListener("touchend", handleInputEnd);

        function handleInputStart(e) {
            if (mode !== 'two_prisms' || e.target.closest('.hud-panel')) return; 
            const cx = getEventX(e); const cy = getEventY(e);
            const simX = (cx - originX) / drawScale; const simY = -(cy - originY) / drawScale; 

            for (let i = prisms.length - 1; i >= 0; i--) {
                if (Math.abs(simX - prisms[i].x) < 80 && Math.abs(simY - prisms[i].y) < 120) {
                    isDragging = true; dragTarget = prisms[i].id; selectedId = prisms[i].id;
                    dragOffsetX = prisms[i].x - simX; dragOffsetY = prisms[i].y - simY;
                    updateUI(); draw();
                    if(e.cancelable) e.preventDefault();
                    return;
                }
            }
        }
        function handleInputMove(e) {
            if (!isDragging || !dragTarget) return;
            if(e.cancelable) e.preventDefault();
            const cx = getEventX(e); const cy = getEventY(e);
            const simX = (cx - originX) / drawScale; const simY = -(cy - originY) / drawScale;
            const sel = prisms.find(el => el.id === dragTarget);
            if (sel) { 
                sel.x = simX + dragOffsetX; sel.y = simY + dragOffsetY; 
                elXSlider.value = sel.x; elYSlider.value = sel.y; 
            }
            updateUI(); draw();
        }
        function handleInputEnd() { isDragging = false; dragTarget = null; }

        // --- VECTOR MATH ENGINE ---
        function dot(a, b) { return a.x*b.x + a.y*b.y; }
        
        function getPrismGeometry(prism) {
            const A_rad = prism.A * Math.PI / 180;
            const side = 260; 
            const h = side * Math.cos(A_rad/2);
            const w = side * Math.sin(A_rad/2);
            let apex, bl, br;
            
            if (prism.invert) {
                apex = { x: prism.x, y: prism.y - h/2 }; // Apex pointing down
                bl = { x: prism.x - w, y: prism.y + h/2 };
                br = { x: prism.x + w, y: prism.y + h/2 };
            } else {
                apex = { x: prism.x, y: prism.y + h/2 }; // Apex pointing up
                bl = { x: prism.x - w, y: prism.y - h/2 };
                br = { x: prism.x + w, y: prism.y - h/2 };
            }
            
            // Build faces with outward normals
            const getFace = (p1, p2) => {
                let dx = p2.x - p1.x; let dy = p2.y - p1.y;
                let l = Math.hypot(dx, dy);
                let nx = dy/l, ny = -dx/l; 
                let cx = (apex.x + bl.x + br.x)/3; let cy = (apex.y + bl.y + br.y)/3;
                let mx = (p1.x + p2.x)/2; let my = (p1.y + p2.y)/2;
                if ((mx - cx)*nx + (my - cy)*ny < 0) { nx = -nx; ny = -ny; }
                return { p1, p2, n: {x: nx, y: ny} };
            };
            return { apex, bl, br, faces: [ getFace(bl, apex), getFace(apex, br), getFace(br, bl) ] };
        }

        function lineIntersectRaySeg(p, d, a, b) {
            let v1 = p, v2 = {x: p.x + d.x, y: p.y + d.y};
            let v3 = a, v4 = b;
            let denom = (v1.x - v2.x)*(v3.y - v4.y) - (v1.y - v2.y)*(v3.x - v4.x);
            if (Math.abs(denom) < 1e-6) return null;
            let t = ((v1.x - v3.x)*(v3.y - v4.y) - (v1.y - v3.y)*(v3.x - v4.x)) / denom;
            let u = -((v1.x - v2.x)*(v1.y - v3.y) - (v1.y - v2.y)*(v1.x - v3.x)) / denom;
            if (t > 1e-5 && u >= 0 && u <= 1) return { t: t, p: { x: p.x + t*d.x, y: p.y + t*d.y } };
            return null;
        }

        function rayIntersectLine(p1, d1, p2, d2) {
            let cross = d1.x * d2.y - d1.y * d2.x;
            if (Math.abs(cross) < 1e-6) return null;
            let t = ((p2.x - p1.x) * d2.y - (p2.y - p1.y) * d2.x) / cross;
            return { x: p1.x + t * d1.x, y: p1.y + t * d1.y };
        }

        function refract(D, N, n1, n2) {
            let r = n1 / n2;
            let c = -dot(D, N);
            if (c < 0) { N = {x: -N.x, y: -N.y}; c = -c; }
            let sin2_t = r * r * (1 - c * c);
            if (sin2_t > 1.0) return { tir: true, dir: { x: D.x + 2*c*N.x, y: D.y + 2*c*N.y } };
            let cos_t = Math.sqrt(1 - sin2_t);
            return { tir: false, dir: { x: r * D.x + (r * c - cos_t) * N.x, y: r * D.y + (r * c - cos_t) * N.y } };
        }

        function getEffectiveRefractiveIndex(baseN, wl) {
            if (baseN === 1.0) return 1.0; 
            const dispersionFactor = 20000;
            const refWl = 550;
            return baseN + (baseN - 1) * dispersionFactor * ((1 / (wl * wl)) - (1 / (refWl * refWl)));
        }

        // --- DRAWING UTILS ---
        function mapX(x) { return originX + x * drawScale; }
        function mapY(y) { return originY - y * drawScale; } // Mathematical Y is UP, Canvas Y is DOWN

        function drawRaySegment(p1, p2, color, dashed = false) {
            const sx1 = mapX(p1.x), sy1 = mapY(p1.y);
            const sx2 = mapX(p2.x), sy2 = mapY(p2.y);
            
            ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2;
            if (dashed) { ctx.setLineDash([5, 5]); ctx.globalAlpha = 0.5; }
            else { ctx.shadowBlur = 10; ctx.shadowColor = color; }
            
            ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
            ctx.setLineDash([]); ctx.shadowBlur = 0;
            
            const dx = sx2 - sx1; const dy = sy2 - sy1; const len = Math.hypot(dx, dy);
            if (len > 30 && !dashed) {
                const angle = Math.atan2(dy, dx);
                const mx = sx1 + (dx / len) * Math.min(len * 0.5, 100);
                const my = sy1 + (dy / len) * Math.min(len * 0.5, 100);
                ctx.beginPath(); ctx.fillStyle = color;
                ctx.moveTo(mx, my);
                ctx.lineTo(mx - 12 * Math.cos(angle - 0.4), my - 12 * Math.sin(angle - 0.4));
                ctx.lineTo(mx - 12 * Math.cos(angle + 0.4), my - 12 * Math.sin(angle + 0.4));
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawNormalArrow(x, y, angle) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 8 * Math.cos(angle - 0.4), y - 8 * Math.sin(angle - 0.4));
            ctx.lineTo(x - 8 * Math.cos(angle + 0.4), y - 8 * Math.sin(angle + 0.4));
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fill();
        }

        function drawDashedNormal(p, N) {
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
            ctx.beginPath();
            
            // N is outward normal in logical space
            let px1 = mapX(p.x + N.x * 120); let py1 = mapY(p.y + N.y * 120); // Out
            let px2 = mapX(p.x - N.x * 120); let py2 = mapY(p.y - N.y * 120); // In
            ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke();
            
            // Draw arrows on the normal ends. Canvas Y is inverted
            const angleOut = Math.atan2(-N.y, N.x);
            const angleIn = Math.atan2(N.y, -N.x);
            drawNormalArrow(px1, py1, angleOut); 
            drawNormalArrow(px2, py2, angleIn);
            ctx.restore();
        }

        function drawArcAngle(p, v1, v2, radius, label, color) {
            // Convert physical vectors to screen vectors (invert Y)
            let sv1 = {x: v1.x, y: -v1.y};
            let sv2 = {x: v2.x, y: -v2.y};
            
            let a1 = Math.atan2(sv1.y, sv1.x);
            let a2 = Math.atan2(sv2.y, sv2.x);
            
            if (a1 < 0) a1 += 2 * Math.PI;
            if (a2 < 0) a2 += 2 * Math.PI;
            
            let start = Math.min(a1, a2);
            let end = Math.max(a1, a2);
            
            if (end - start > Math.PI) {
                start = Math.max(a1, a2);
                end = Math.min(a1, a2) + 2 * Math.PI;
            }
            
            ctx.save();
            ctx.beginPath();
            ctx.arc(mapX(p.x), mapY(p.y), radius, start, end);
            ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
            
            let mid = start + (end - start) / 2;
            ctx.fillStyle = color; ctx.font = "italic 13px 'Segoe UI'";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(label, mapX(p.x) + (radius + 20) * Math.cos(mid), mapY(p.y) + (radius + 20) * Math.sin(mid));
            ctx.restore();
        }

        // --- MAIN RENDER LOOP ---
        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);

            if (prisms.length === 0) initMainPrism();
            
            const i_deg = parseFloat(iSlider.value);
            let geometries = prisms.map(p => {
                let geo = getPrismGeometry(p);
                geo.n = p.n; geo.id = p.id;
                return geo;
            });

            // Draw Prisms
            geometries.forEach(geo => {
                ctx.save();
                ctx.beginPath(); ctx.moveTo(mapX(geo.apex.x), mapY(geo.apex.y)); ctx.lineTo(mapX(geo.bl.x), mapY(geo.bl.y)); ctx.lineTo(mapX(geo.br.x), mapY(geo.br.y)); ctx.closePath();
                ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; ctx.fill();
                ctx.strokeStyle = geo.id === selectedId && mode === 'two_prisms' ? "var(--gold)" : "#00e5ff"; 
                ctx.lineWidth = geo.id === selectedId ? 4 : 3; ctx.stroke();
                
                ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "center";
                let apexDir = geo.apex.y > geo.bl.y ? 15 : -15; // Logically up or down
                ctx.fillText("A", mapX(geo.apex.x), mapY(geo.apex.y) - apexDir);
                ctx.fillText("B", mapX(geo.bl.x) - 15, mapY(geo.bl.y) + apexDir);
                ctx.fillText("C", mapX(geo.br.x) + 15, mapY(geo.br.y) + apexDir);
                ctx.restore();

                if (geo.id === 1 && (mode === 'ray' || mode === 'graph')) {
                    const v1 = {x: geo.bl.x - geo.apex.x, y: geo.bl.y - geo.apex.y};
                    const v2 = {x: geo.br.x - geo.apex.x, y: geo.br.y - geo.apex.y};
                    drawArcAngle(geo.apex, v1, v2, 30 * drawScale, `A=${aSlider.value}°`, "#ffffff");
                }
            });

            // Setup Ray Arrays
            let activeRays = [];
            const n_base = prisms[0].n;
            
            if (mode === 'dispersion') {
                const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];
                const n_vals = [n_base - 0.02, n_base - 0.015, n_base - 0.01, n_base, n_base + 0.01, n_base + 0.02, n_base + 0.035];
                for(let k=0; k<7; k++) activeRays.push({ wl: k, color: colors[k], offset: 0, isLabelRay: k===3 });
            } else if (mode === 'two_prisms') {
                // Shoot a bundle of 5 parallel rays to show dispersion and recombination
                const colors = ['#ff0000', '#ffff00', '#0000ff']; // Simulate basic spectrum per ray
                const n_vals = [n_base - 0.02, n_base, n_base + 0.035];
                const offsets = [-30, -15, 0, 15, 30];
                offsets.forEach((off, idx) => {
                    for(let k=0; k<3; k++) {
                        activeRays.push({ n: n_vals[k], color: colors[k], offset: off, isLabelRay: false });
                    }
                });
            } else {
                activeRays.push({ wl: 3, color: "#ffffff", offset: 0, isLabelRay: true });
            }

            // Incident Ray Setup (Fires from Bottom-Left upwards to the Main Prism P1)
            const mainGeo = geometries[0];
            const leftFace = mainGeo.faces[0]; // bl to apex
            const N_out = leftFace.n; 

            // Hit point is on lower third of the left face
            const hitPoint = { x: leftFace.p1.x + (leftFace.p2.x - leftFace.p1.x) * 0.35, y: leftFace.p1.y + (leftFace.p2.y - leftFace.p1.y) * 0.35 };
            
            // i_deg is angle between normal (N_out) and reversed incident ray (-D)
            const normalAngle = Math.atan2(N_out.y, N_out.x);
            // Ray comes from bottom-left, so direction is pointing into the prism.
            // Reversed ray (-D) is at angle (normalAngle - i_deg)
            const revRayAngle = normalAngle - i_deg * Math.PI / 180; 
            const d_inc = { x: -Math.cos(revRayAngle), y: -Math.sin(revRayAngle) };
            const perp_d = { x: -d_inc.y, y: d_inc.x }; // For generating parallel offset bundles

            // Draw Initial Incident Rays (for the bundle)
            if (mode === 'two_prisms') {
                const offsets = [-30, -15, 0, 15, 30];
                offsets.forEach(off => {
                    let startP = { x: hitPoint.x - d_inc.x * 600 + off * perp_d.x, y: hitPoint.y - d_inc.y * 600 + off * perp_d.y };
                    let hp = { x: hitPoint.x + off * perp_d.x, y: hitPoint.y + off * perp_d.y };
                    drawRaySegment(startP, hp, "#ffffff", false, true);
                });
            }

            // Universal Ray-Polygon Tracing Engine
            activeRays.forEach(ray => {
                let curP = { x: hitPoint.x - d_inc.x * 600 + ray.offset * perp_d.x, y: hitPoint.y - d_inc.y * 600 + ray.offset * perp_d.y };
                let curD = { x: d_inc.x, y: d_inc.y };
                let bounces = 0;

                while (bounces < 6) {
                    let bestHit = null;
                    
                    // Look for the next face intersection across ALL prisms
                    for (let geo of geometries) {
                        for (let face of geo.faces) {
                            let hit = lineIntersectRaySeg(curP, curD, face.p1, face.p2);
                            if (hit && (!bestHit || hit.t < bestHit.t)) {
                                bestHit = { ...hit, face, geo };
                            }
                        }
                    }
                    
                    if (!bestHit) {
                        let finalEnd = { x: curP.x + curD.x * 1500, y: curP.y + curD.y * 1500 };
                        drawRaySegment(curP, finalEnd, ray.color, false, true);
                        break; 
                    }

                    // Only draw if it's the main ray (avoid overdrawing incident bundles)
                    if (bounces > 0 || mode !== 'two_prisms') {
                        drawRaySegment(curP, bestHit.p, ray.color, false, true);
                    }

                    let N = bestHit.face.n; // Outward normal
                    let dot_dN = dot(curD, N);
                    let n1 = 1.0, n2 = 1.0;
                    
                    if (dot_dN < 0) {
                        // Entering Prism
                        n2 = mode === 'dispersion' || mode === 'two_prisms' ? getEffectiveRefractiveIndex(bestHit.geo.n, ray.wl) : bestHit.geo.n;
                    } else {
                        // Exiting Prism
                        n1 = mode === 'dispersion' || mode === 'two_prisms' ? getEffectiveRefractiveIndex(bestHit.geo.n, ray.wl) : bestHit.geo.n;
                        N = { x: -N.x, y: -N.y }; // Flip normal to face incoming ray
                    }
                    
                    let ref = refract(curD, N, n1, n2);

                    // Annotations (Only for the primary label ray on Prism 1)
                    if (ray.isLabelRay && bestHit.geo.id === 1 && (mode === 'ray' || mode === 'graph')) {
                        if (bounces === 0) {
                            drawDashedNormal(bestHit.p, bestHit.face.n);
                            drawArcAngle(bestHit.p, {x: -curD.x, y: -curD.y}, bestHit.face.n, 40 * drawScale, `i=${i_deg.toFixed(1)}°`, "#ffffff");
                            
                            // Extended incident for deviation
                            let extEnd = { x: bestHit.p.x + curD.x * 500, y: bestHit.p.y + curD.y * 500 };
                            drawRaySegment(bestHit.p, extEnd, "rgba(255, 255, 255, 0.2)", true, false);

                            const r1_val = (Math.asin(Math.sin(i_deg * Math.PI/180) / n2) * 180 / Math.PI).toFixed(1);
                            drawArcAngle(bestHit.p, ref.dir, {x: -bestHit.face.n.x, y: -bestHit.face.n.y}, 40 * drawScale, `r₁=${r1_val}°`, ray.color);

                        } else if (bounces === 1 && !ref.tir) {
                            drawDashedNormal(bestHit.p, {x: -N.x, y: -N.y}); // Re-flip normal to point outward for drawing
                            
                            const r2_val = (parseFloat(aSlider.value) - parseFloat((Math.asin(Math.sin(i_deg * Math.PI/180) / n1) * 180 / Math.PI))).toFixed(1);
                            drawArcAngle(bestHit.p, {x: -curD.x, y: -curD.y}, N, 40 * drawScale, `r₂=${r2_val}°`, ray.color);
                            
                            const e_val = (Math.asin(n1 * Math.sin(parseFloat(r2_val) * Math.PI/180)) * 180 / Math.PI).toFixed(1);
                            drawArcAngle(bestHit.p, ref.dir, {x: -N.x, y: -N.y}, 40 * drawScale, `e=${e_val}°`, ray.color);
                            
                            // Angle of Deviation Calculation
                            const devP = rayIntersectLine(hitPoint, d_inc, bestHit.p, ref.dir);
                            if (devP) {
                                drawRaySegment(bestHit.p, devP, ray.color, true, false); // Backward dashed line
                                const dev_val = (i_deg + parseFloat(e_val) - parseFloat(aSlider.value)).toFixed(1);
                                drawArcAngle(devP, d_inc, ref.dir, 30 * drawScale, `δ=${dev_val}°`, "#ffd166");
                            }
                        }
                    }

                    curD = ref.dir;
                    curP = bestHit.p;
                    bounces++;
                }
            });

            // Deviation Graph Overlay Calculation
            if (mode === 'graph') {
                const gW = 300 * drawScale; const gH = 200 * drawScale;
                let gX = originX - gW / 2; 
                let gY = originY - gH - 50 * drawScale; // Position graph safely above HUD and prism
                
                ctx.save();
                ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(gX, gY, gW, gH);
                ctx.fill(); ctx.stroke(); ctx.clip(); 
                
                ctx.beginPath();
                ctx.moveTo(gX, gY); ctx.lineTo(gX, gY + gH);
                ctx.lineTo(gX + gW, gY + gH);
                ctx.stroke();

                ctx.fillStyle = "#fff"; ctx.font = "12px 'Segoe UI'";
                ctx.fillText("δ (Deviation)", gX + 10, gY + 15);
                ctx.fillText("i (Incidence)", gX + gW - 70, gY + gH - 10);
                ctx.fillText("0", gX + 5, gY + gH - 5);

                const baseN = parseFloat(nSlider.value);
                ctx.beginPath();
                for(let i = 0; i <= 90; i++) {
                    let i_r = i * Math.PI / 180;
                    let sin_r1 = Math.sin(i_r) / baseN;
                    if(sin_r1 > 1) continue;
                    let r1_r = Math.asin(sin_r1);
                    let r2_r = A_rad - r1_r;
                    let sin_e = baseN * Math.sin(r2_r);
                    if(sin_e > 1) continue;
                    let e_r = Math.asin(sin_e);
                    let delta = (i_r + e_r - A_rad) * 180 / Math.PI;
                    
                    let px = gX + (i / 90) * gW;
                    let py = gY + gH - (delta / 90) * gH;
                    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.strokeStyle = "var(--primary)"; ctx.lineWidth = 2; ctx.stroke();

                // Plot Minimum Deviation Point (iₘ, δₘ)
                const i_min_rad = Math.asin(baseN * Math.sin(A_rad / 2));
                const d_min_deg = (2 * i_min_rad - A_rad) * 180 / Math.PI;
                const i_min_deg = i_min_rad * 180 / Math.PI;
                
                let px_min = gX + (i_min_deg / 90) * gW;
                let py_min = gY + gH - (d_min_deg / 90) * gH;

                ctx.setLineDash([4,4]); ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.beginPath(); ctx.moveTo(px_min, gY + gH); ctx.lineTo(px_min, py_min); ctx.lineTo(gX, py_min); ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = "var(--gold)"; 
                ctx.fillText("iₘ", px_min - 8, gY + gH - 5);
                ctx.fillText("δₘ", gX + 5, py_min + 4);

                // Plot Current Point
                const r1_rad = Math.asin(Math.sin(i_rad) / baseN);
                const r2_rad = A_rad - r1_rad;
                if (baseN * Math.sin(r2_rad) <= 1) {
                    const e_rad = Math.asin(baseN * Math.sin(r2_rad));
                    const delta_deg = (i_rad + e_rad - A_rad) * 180 / Math.PI;
                    const cX = gX + (i_deg / 90) * gW;
                    const cY = gY + gH - (delta_deg / 90) * gH;
                    
                    ctx.shadowBlur = 10; ctx.shadowColor = "var(--gold)"; ctx.fillStyle = "var(--gold)";
                    ctx.beginPath(); ctx.arc(cX, cY, 5, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }
        }

        setMode('ray');
    </script>
</body>
