<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prism, Dispersion & Combos | Vidyaalok Lab</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L8DFSQTR66"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L8DFSQTR66');

    <!-- MathJax for rendering LaTeX formulas -->
    <script>
      window.MathJax = { 
        tex: { inlineMath: [['\\(', '\\)']] }, 
        svg: { fontCache: 'global' } 
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --real-img: #00ffaa;
            --virtual-img: #c7a6ff;
            --border: rgba(0, 229, 255, 0.2);
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 12px 20px; background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; position: relative;
        }

        .back-btn {
            color: var(--primary); text-decoration: none; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
        }
        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        /* Workspace & Canvas */
        .workspace {
            position: relative; flex-grow: 1; width: 100%; display: flex; overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; touch-action: none; cursor: crosshair;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%;
            background-image: url('../../logo.png'); background-size: contain;
            background-repeat: no-repeat; background-position: center;
            opacity: 0.06; pointer-events: none; z-index: 0;
        }

        /* HUD Panel */
        .hud-panel {
            position: absolute; z-index: 50; background: var(--panel-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7); transition: all 0.3s ease;
        }

        .hud-header {
            padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .hud-content {
            padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px;
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }
        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        /* Device Specific HUD Layout */
        @media (min-width: 901px) {
            .hud-panel { top: 20px; left: 20px; width: 380px; max-height: calc(100% - 40px); border-radius: 16px; }
        }
        @media (max-width: 900px) {
            .hud-panel { bottom: 0; left: 0; width: 100%; height: 45vh; border-radius: 20px 20px 0 0; border-bottom: none; border-left: none; border-right: none; }
        }

        /* Controls */
        .section-title { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn {
            flex: 1 1 calc(50% - 8px); min-width: 130px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s ease; text-align: center;
        }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); color: var(--primary); }
        .btn.full { flex: 1 1 100%; }

        /* Sliders */
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        /* Optical Elements List */
        .element-list { display: flex; flex-direction: column; gap: 6px; }
        .element-item {
            display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        .element-item:hover { border-color: rgba(255,255,255,0.3); }
        .element-item.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
        
        .editor-panel { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }

        /* Stats & Formulas */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; }
        .stat strong { color: var(--secondary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat span { font-size: 1.1rem; font-weight: bold; color: var(--text-main); font-family: monospace; }
        .stat.alert span { color: #ff3366; }
        
        .formula-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            text-align: center; color: var(--primary); font-weight: bold; font-size: 0.9rem; overflow-x: auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 09</a>
        <h1>Prism, Dispersion & Combos</h1>
    </nav>

    <div class="workspace">
        <div class="watermark"></div>
        <canvas id="simCanvas"></canvas>

        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>Simulation Mode</h2>
            </div>
            
            <div class="hud-content">
                <div class="toolbar">
                    <button class="btn active" id="btnRay" onclick="setMode('ray')">Ray Diagram</button>
                    <button class="btn" id="btnDispersion" onclick="setMode('dispersion')">Dispersion</button>
                    <button class="btn" id="btnGraph" onclick="setMode('graph')">Deviation Graph</button>
                    <button class="btn" id="btnCombo" onclick="setMode('combo')">Optical Combos</button>
                </div>

                <div id="controlsContainer">
                    <div class="section-title">Prism Properties</div>
                    <div class="control-group">
                        <!-- Used proper HTML formatting instead of MathJax to fix invisible spacing issues -->
                        <label>Angle of Prism (<i>A</i>) <span id="aVal">60°</span></label>
                        <input id="aSlider" type="range" min="30" max="90" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Refractive Index (<i>n</i>) <span id="nVal">1.50</span></label>
                        <input id="nSlider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Angle of Incidence (<i>i</i>) <span id="iVal">45°</span></label>
                        <input id="iSlider" type="range" min="0" max="90" step="1" value="45">
                    </div>
                </div>

                <!-- Optical Combo Elements Toolkit -->
                <div id="comboContainer" style="display: none;">
                    <div class="section-title">Bring Optical Element</div>
                    <div class="toolbar">
                        <button class="btn" onclick="addElement('lens', 'convex')">+ Convex Lens</button>
                        <button class="btn" onclick="addElement('lens', 'concave')">+ Concave Lens</button>
                        <button class="btn" onclick="addElement('mirror', 'concave')">+ Concave Mirror</button>
                        <button class="btn" onclick="addElement('mirror', 'convex')">+ Convex Mirror</button>
                        <button class="btn" style="flex-basis: 100%;" onclick="addElement('mirror', 'plane')">+ Plane Mirror</button>
                    </div>

                    <div class="section-title" style="margin-top: 15px;">Optical Path Sequence</div>
                    <div class="element-list" id="elementList"></div>

                    <div id="editorPanel" class="editor-panel" style="display: none; margin-top: 10px;">
                        <div class="section-title" id="editorTitle" style="color: var(--text-main);">Edit Element</div>
                        <div class="control-group">
                            <label>Position X <span id="elXVal">0 cm</span></label>
                            <input id="elX" type="range" min="-400" max="800" step="5" value="0">
                        </div>
                        <div class="control-group">
                            <label>Position Y <span id="elYVal">0 cm</span></label>
                            <input id="elY" type="range" min="-300" max="300" step="5" value="0">
                        </div>
                        <div class="control-group">
                            <label>Rotation Angle (<i>θ</i>) <span id="elAngleVal">0°</span></label>
                            <input id="elAngle" type="range" min="-180" max="180" step="1" value="0">
                        </div>
                        <div class="control-group" id="focalGroup">
                            <label>Focal Length (<i>f</i>) <span id="elFVal">100 cm</span></label>
                            <input id="elF" type="range" min="20" max="400" step="5" value="100">
                        </div>
                        <button class="btn" style="width: 100%; border-color: rgba(255,51,102,0.4); color: #ff3366;" onclick="deleteSelected()">Remove Element</button>
                    </div>
                </div>

                <div class="section-title" style="margin-top: 5px;">Analysis & Results</div>
                <div id="resultsContainer">
                    <!-- Populated dynamically by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");
        const hudPanel = document.getElementById("hudPanel");
        
        // UI Sliders
        const aSlider = document.getElementById("aSlider");
        const nSlider = document.getElementById("nSlider");
        const iSlider = document.getElementById("iSlider");
        
        // Combo UI Elements
        const comboContainer = document.getElementById("comboContainer");
        const elementListUI = document.getElementById("elementList");
        const editorPanel = document.getElementById("editorPanel");
        const elXSlider = document.getElementById("elX");
        const elYSlider = document.getElementById("elY");
        const elAngleSlider = document.getElementById("elAngle");
        const elFSlider = document.getElementById("elF");
        
        let W = 0, H = 0, originX = 0, originY = 0;
        let drawScale = 1; 
        let initialized = false;
        let mode = 'ray'; // 'ray', 'dispersion', 'graph', 'combo'

        // Interaction State
        let isDragging = false;
        let dragTarget = null;
        let dragOffsetX = 0, dragOffsetY = 0;

        // Physics Combo State
        let elements = [];
        let selectedId = null;
        let nextId = 1;
        const rayColors = ['#00e5ff', '#ff007f', '#00ffaa', '#ffd166', '#c7a6ff', '#ff5e00'];

        // --- DYNAMIC AUTO-SCALING LAYOUT ENGINE ---
        function updateLayout() {
            if (W > 900) {
                originX = 380 + (W - 380) * 0.35; // Prism shifted left to allow space on right
                originY = H / 2;
                drawScale = Math.min(1, H / 600);
            } else {
                const hudHeight = hudPanel.offsetHeight || (H * 0.45);
                const visH = H - hudHeight;
                originX = W * 0.4; // Shift prism left for mobile too
                originY = visH * 0.55; 
                
                if (mode === 'graph') {
                    originX = W / 2;
                    originY = visH * 0.4;
                }
                
                // Aggressively scale so the entire prism and rays fit in the visible top area
                drawScale = Math.min(1, visH / 500, W / 800);
            }
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W;
                canvas.height = H;
                updateLayout();
                if (!initialized && W > 10 && H > 10) { initialized = true; draw(); } 
                else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));

        setTimeout(() => {
            if (!initialized && canvas.parentElement.clientWidth > 10) {
                W = canvas.parentElement.clientWidth;
                H = canvas.parentElement.clientHeight || 500; 
                canvas.width = W; canvas.height = H;
                initialized = true; 
                updateLayout(); draw();
            }
        }, 300);

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.toolbar .btn').forEach(btn => btn.classList.remove('active'));
            
            if (mode === 'ray') document.getElementById("btnRay").classList.add('active');
            if (mode === 'dispersion') document.getElementById("btnDispersion").classList.add('active');
            if (mode === 'graph') document.getElementById("btnGraph").classList.add('active');
            if (mode === 'combo') document.getElementById("btnCombo").classList.add('active');

            comboContainer.style.display = (mode === 'combo') ? "block" : "none";

            if (mode === 'combo' && elements.length === 0) {
                addElement('lens', 'convex'); // Auto spawn one for demo
            }

            updateLayout();
            updateUI();
        }

        function updateUI() {
            const A = parseFloat(aSlider.value);
            const n = parseFloat(nSlider.value);
            const i_deg = parseFloat(iSlider.value);
            
            document.getElementById("aVal").textContent = `${A}°`;
            document.getElementById("nVal").textContent = n.toFixed(2);
            document.getElementById("iVal").textContent = `${i_deg}°`;

            // --- Combo Element UI ---
            if (mode === 'combo') {
                const sorted = [...elements].sort((a,b) => a.x - b.x);
                elementListUI.innerHTML = "";
                if(sorted.length === 0) elementListUI.innerHTML = "<div style='color:var(--text-muted); font-size:0.8rem; text-align:center;'>No elements in path.</div>";
                
                sorted.forEach(el => {
                    const div = document.createElement("div");
                    div.className = "element-item" + (el.id === selectedId ? " active" : "");
                    const name = el.subtype.charAt(0).toUpperCase() + el.subtype.slice(1) + " " + el.type.charAt(0).toUpperCase() + el.type.slice(1);
                    div.innerHTML = `<span style="color:${el.color}">E${el.id}: ${name}</span> <small>x:${Math.round(el.x)}, y:${Math.round(el.y)}</small>`;
                    div.onclick = () => { selectedId = el.id; updateUI(); draw(); };
                    elementListUI.appendChild(div);
                });

                const sel = elements.find(e => e.id === selectedId);
                if (sel) {
                    editorPanel.style.display = "block";
                    document.getElementById("editorTitle").textContent = `Edit E${sel.id}`;
                    document.getElementById("editorTitle").style.color = sel.color;
                    elXSlider.value = sel.x; elYSlider.value = sel.y;
                    elAngleSlider.value = sel.angle;

                    document.getElementById("elXVal").textContent = `${Math.round(sel.x)} cm`;
                    document.getElementById("elYVal").textContent = `${Math.round(sel.y)} cm`;
                    document.getElementById("elAngleVal").textContent = `${Math.round(sel.angle)}°`;
                    
                    if (sel.subtype === 'plane') {
                        document.getElementById("focalGroup").style.display = "none";
                    } else {
                        document.getElementById("focalGroup").style.display = "flex";
                        elFSlider.value = sel.f;
                        document.getElementById("elFVal").textContent = `${Math.round(sel.f)} cm`;
                    }
                } else {
                    editorPanel.style.display = "none";
                }
            }

            // --- Physics Math & Formulas ---
            const resultsContainer = document.getElementById("resultsContainer");
            const A_rad = A * Math.PI / 180;
            const i_rad = i_deg * Math.PI / 180;
            
            const r1_rad = Math.asin(Math.sin(i_rad) / n);
            const r1_deg = r1_rad * 180 / Math.PI;
            
            const r2_rad = A_rad - r1_rad;
            const r2_deg = r2_rad * 180 / Math.PI;
            
            let e_rad = 0, e_deg = 0, delta_deg = 0;
            let isTIR = false;
            
            if (n * Math.sin(r2_rad) > 1) {
                isTIR = true;
            } else {
                e_rad = Math.asin(n * Math.sin(r2_rad));
                e_deg = e_rad * 180 / Math.PI;
                delta_deg = i_deg + e_deg - A;
            }

            if (mode === 'ray' || mode === 'combo') {
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Refract 1 (r₁)</strong><span>${r1_deg.toFixed(1)}°</span></div>
                        <div class="stat"><strong>Refract 2 (r₂)</strong><span>${r2_deg.toFixed(1)}°</span></div>
                        <div class="stat ${isTIR ? 'alert' : ''}"><strong>Emergence (e)</strong><span>${isTIR ? 'TIR' : e_deg.toFixed(1) + '°'}</span></div>
                        <div class="stat ${isTIR ? 'alert' : ''}"><strong>Deviation (δ)</strong><span>${isTIR ? 'N/A' : delta_deg.toFixed(1) + '°'}</span></div>
                    </div>
                    <div class="formula-panel">
                        \\[ r_1 + r_2 = A \\]
                        \\[ \\delta = i + e - A \\]
                    </div>
                `;
            } else if (mode === 'dispersion') {
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Δ Violet</strong><span>${(i_deg + Math.asin((n+0.04)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n+0.04))))*180/Math.PI - A).toFixed(1)}°</span></div>
                        <div class="stat"><strong>Δ Red</strong><span>${(i_deg + Math.asin((n-0.02)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n-0.02))))*180/Math.PI - A).toFixed(1)}°</span></div>
                        <div class="stat" style="grid-column: span 2;"><strong>Angular Dispersion</strong><span>${((Math.asin((n+0.04)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n+0.04))))*180/Math.PI) - (Math.asin((n-0.02)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n-0.02))))*180/Math.PI)).toFixed(2)}°</span></div>
                    </div>
                    <div class="formula-panel" style="font-size: 0.8rem;">
                        \\[ n(\\lambda) = A + \\frac{B}{\\lambda^2} \\quad \\text{(Cauchy's Eq)} \\]
                    </div>
                `;
            } else if (mode === 'graph') {
                const i_min_rad = Math.asin(n * Math.sin(A_rad / 2));
                const d_min_deg = (2 * i_min_rad - A_rad) * 180 / Math.PI;
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Current Deviation (δ)</strong><span>${isTIR ? 'N/A' : delta_deg.toFixed(1) + '°'}</span></div>
                        <div class="stat"><strong>Minimum Deviation (δₘ)</strong><span style="color:var(--gold);">${d_min_deg.toFixed(1)}°</span></div>
                    </div>
                    <div class="formula-panel">
                        \\[ n = \\frac{\\sin\\left(\\frac{A + \\delta_m}{2}\\right)}{\\sin\\left(\\frac{A}{2}\\right)} \\]
                    </div>
                `;
            }

            if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([resultsContainer]);
            draw();
        }

        // Only Prism sliders trigger global updateUI
        [aSlider, nSlider, iSlider].forEach(el => el.addEventListener("input", updateUI));

        // --- COMBO CONTROLS ---
        function addElement(type, subtype) {
            elements.push({ id: nextId++, type, subtype, x: 250, y: 0, f: 120, angle: 0, color: rayColors[(nextId - 1) % rayColors.length], aperture: 200 });
            selectedId = nextId - 1;
            updateUI(); draw();
        }
        function selectElement(id) { selectedId = id; updateUI(); draw(); }
        function deleteSelected() { elements = elements.filter(e => e.id !== selectedId); selectedId = null; updateUI(); draw(); }

        elXSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.x = parseFloat(e.target.value); updateUI(); draw(); }});
        elYSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.y = parseFloat(e.target.value); updateUI(); draw(); }});
        elAngleSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.angle = parseFloat(e.target.value); updateUI(); draw(); }});
        elFSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.f = parseFloat(e.target.value); updateUI(); draw(); }});

        // --- INTERACTION (DRAGGING ELEMENTS) ---
        function getEventX(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
            else if (e.changedTouches && e.changedTouches.length > 0) clientX = e.changedTouches[0].clientX;
            return (clientX - rect.left) * (canvas.width / rect.width);
        }
        function getEventY(e) {
            const rect = canvas.getBoundingClientRect();
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) clientY = e.touches[0].clientY;
            else if (e.changedTouches && e.changedTouches.length > 0) clientY = e.changedTouches[0].clientY;
            return (clientY - rect.top) * (canvas.height / rect.height);
        }

        canvas.addEventListener("mousedown", handleInputStart);
        canvas.addEventListener("mousemove", handleInputMove);
        window.addEventListener("mouseup", handleInputEnd);
        canvas.addEventListener("touchstart", handleInputStart, {passive: false});
        canvas.addEventListener("touchmove", handleInputMove, {passive: false});
        window.addEventListener("touchend", handleInputEnd);

        function handleInputStart(e) {
            if (mode !== 'combo' || e.target.closest('.hud-panel')) return; 
            const cx = getEventX(e); const cy = getEventY(e);
            const simX = (cx - originX) / drawScale; const simY = (originY - cy) / drawScale;

            for (let i = elements.length - 1; i >= 0; i--) {
                if (Math.abs(simX - elements[i].x) < 40 && Math.abs(simY - elements[i].y) < 100) {
                    isDragging = true; dragTarget = elements[i].id; selectedId = elements[i].id;
                    dragOffsetX = elements[i].x - simX; dragOffsetY = elements[i].y - simY;
                    updateUI(); draw();
                    if(e.cancelable) e.preventDefault();
                    return;
                }
            }
        }
        function handleInputMove(e) {
            if (!isDragging || !dragTarget) return;
            if(e.cancelable) e.preventDefault();
            const cx = getEventX(e); const cy = getEventY(e);
            const simX = (cx - originX) / drawScale; const simY = (originY - cy) / drawScale;
            const sel = elements.find(el => el.id === dragTarget);
            if (sel) { sel.x = simX + dragOffsetX; sel.y = simY + dragOffsetY; elXSlider.value = sel.x; elYSlider.value = sel.y; }
            updateUI(); draw();
        }
        function handleInputEnd() { isDragging = false; dragTarget = null; }

        // --- VECTOR MATH ENGINE ---
        function norm(v) { let l = Math.hypot(v.x, v.y) || 1; return { x: v.x/l, y: v.y/l }; }
        function dot(a, b) { return a.x*b.x + a.y*b.y; }
        
        // Ensure normal always points towards the center of the prism mathematically
        function getInwardNormal(p1, p2, center) {
            let dx = p2.x - p1.x; let dy = p2.y - p1.y; 
            let l = Math.hypot(dx, dy);
            let n = { x: dy/l, y: -dx/l }; 
            let mid = { x: (p1.x + p2.x)/2, y: (p1.y + p2.y)/2 };
            let toCenter = { x: center.x - mid.x, y: center.y - mid.y };
            if (n.x * toCenter.x + n.y * toCenter.y < 0) { n.x = -n.x; n.y = -n.y; }
            return n;
        }

        function refract(D, N, n1, n2) {
            let r = n1 / n2;
            let c = -dot(D, N);
            if (c < 0) { N = {x: -N.x, y: -N.y}; c = -c; }
            let sin2_t = r * r * (1 - c * c);
            if (sin2_t > 1.0) return { tir: true, dir: { x: D.x + 2*c*N.x, y: D.y + 2*c*N.y } };
            let cos_t = Math.sqrt(1 - sin2_t);
            return { tir: false, dir: { x: r * D.x + (r * c - cos_t) * N.x, y: r * D.y + (r * c - cos_t) * N.y } };
        }

        function lineIntersect(p1, d1, a, b) {
            let v1 = p1, v2 = {x: p1.x + d1.x, y: p1.y + d1.y};
            let v3 = a, v4 = b;
            let denom = (v1.x - v2.x)*(v3.y - v4.y) - (v1.y - v2.y)*(v3.x - v4.x);
            if (Math.abs(denom) < 1e-6) return null;
            let t = ((v1.x - v3.x)*(v3.y - v4.y) - (v1.y - v3.y)*(v3.x - v4.x)) / denom;
            let u = -((v1.x - v2.x)*(v1.y - v3.y) - (v1.y - v2.y)*(v1.x - v3.x)) / denom;
            if (t > 1e-5 && u >= 0 && u <= 1) return { t: t, p: { x: p1.x + t*d1.x, y: p1.y + t*d1.y } };
            return null;
        }

        function rayIntersect(p1, d1, p2, d2) {
            let cross = d1.x * d2.y - d1.y * d2.x;
            if (Math.abs(cross) < 1e-6) return null;
            let t = ((p2.x - p1.x) * d2.y - (p2.y - p1.y) * d2.x) / cross;
            return { x: p1.x + t * d1.x, y: p1.y + t * d1.y };
        }

        // --- DRAWING UTILS ---
        function mapX(x) { return originX + x * drawScale; }
        function mapY(y) { return originY - y * drawScale; } // Canvas Y inverted logically

        function drawArrow(p1, p2, color, dashed = false) {
            const sx1 = mapX(p1.x), sy1 = mapY(p1.y);
            const sx2 = mapX(p2.x), sy2 = mapY(p2.y);
            
            ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2;
            if (dashed) { ctx.setLineDash([5, 5]); ctx.globalAlpha = 0.5; }
            else { ctx.shadowBlur = 10; ctx.shadowColor = color; }
            
            ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
            ctx.setLineDash([]); ctx.shadowBlur = 0;
            
            const dx = sx2 - sx1; const dy = sy2 - sy1; const len = Math.hypot(dx, dy);
            if (len > 30 && !dashed) {
                const angle = Math.atan2(dy, dx);
                // Guaranteed visible arrowhead distance 
                const mx = sx1 + (dx / len) * Math.min(len * 0.5, 100);
                const my = sy1 + (dy / len) * Math.min(len * 0.5, 100);
                ctx.beginPath(); ctx.fillStyle = color;
                ctx.moveTo(mx, my);
                ctx.lineTo(mx - 12 * Math.cos(angle - 0.4), my - 12 * Math.sin(angle - 0.4));
                ctx.lineTo(mx - 12 * Math.cos(angle + 0.4), my - 12 * Math.sin(angle + 0.4));
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawNormalArrow(x, y, dir_screen) {
            const angle = Math.atan2(dir_screen.y, dir_screen.x);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 8 * Math.cos(angle - 0.4), y - 8 * Math.sin(angle - 0.4));
            ctx.lineTo(x - 8 * Math.cos(angle + 0.4), y - 8 * Math.sin(angle + 0.4));
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fill();
        }

        function drawDashedNormal(p, N) {
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
            ctx.beginPath();
            // N points INTO prism. We draw it extending outwards and inwards.
            let px1 = mapX(p.x - N.x * 120); let py1 = mapY(p.y - N.y * 120); // Out
            let px2 = mapX(p.x + N.x * 120); let py2 = mapY(p.y + N.y * 120); // In
            ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke();
            
            // Draw arrows on the normal ends
            drawNormalArrow(px1, py1, {x: -N.x, y: N.y}); // Canvas Y inverted
            drawNormalArrow(px2, py2, {x: N.x, y: -N.y});
            ctx.restore();
        }

        function drawArcBetweenVectors(p, v1, v2, radius, label, color) {
            // Convert physical vectors to screen vectors (invert Y)
            let sv1 = {x: v1.x, y: -v1.y};
            let sv2 = {x: v2.x, y: -v2.y};
            
            let a1 = Math.atan2(sv1.y, sv1.x);
            let a2 = Math.atan2(sv2.y, sv2.x);
            
            if (a1 < 0) a1 += 2 * Math.PI;
            if (a2 < 0) a2 += 2 * Math.PI;
            
            let start = Math.min(a1, a2);
            let end = Math.max(a1, a2);
            
            if (end - start > Math.PI) {
                start = Math.max(a1, a2);
                end = Math.min(a1, a2) + 2 * Math.PI;
            }
            
            ctx.save();
            ctx.beginPath();
            ctx.arc(mapX(p.x), mapY(p.y), radius, start, end);
            ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
            
            let mid = (start + end) / 2;
            ctx.fillStyle = color; ctx.font = "italic 13px 'Segoe UI'";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(label, mapX(p.x) + (radius + 20) * Math.cos(mid), mapY(p.y) + (radius + 20) * Math.sin(mid));
            ctx.restore();
        }

        function drawElementGeometry(el) {
            const cx = mapX(el.x); const cy = mapY(el.y); const h = el.aperture * drawScale; 
            ctx.save();
            ctx.translate(cx, cy); ctx.rotate(-el.angle * Math.PI / 180); ctx.scale(drawScale, drawScale);
            
            if (el.id === selectedId) { ctx.shadowBlur = 15; ctx.shadowColor = el.color; }

            if (el.type === 'lens') {
                ctx.strokeStyle = el.color; ctx.fillStyle = el.color.replace(')', ', 0.15)').replace('rgb', 'rgba'); 
                ctx.lineWidth = 3; ctx.beginPath();
                if (el.subtype === 'convex') {
                    ctx.moveTo(0, -h/2); ctx.quadraticCurveTo(25, 0, 0, h/2); ctx.quadraticCurveTo(-25, 0, 0, -h/2);
                } else {
                    ctx.moveTo(-15, -h/2); ctx.lineTo(15, -h/2);
                    ctx.quadraticCurveTo(-5, 0, 15, h/2); ctx.lineTo(-15, h/2);
                    ctx.quadraticCurveTo(5, 0, -15, -h/2);
                }
                ctx.fill(); ctx.stroke();
            } 
            else if (el.type === 'mirror') {
                ctx.lineWidth = 4; ctx.strokeStyle = el.color; ctx.beginPath();
                if (el.subtype === 'plane') {
                    ctx.moveTo(0, -h/2); ctx.lineTo(0, h/2); ctx.stroke();
                    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    for(let y = -h/2 + 5; y < h/2; y += 10) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(-8, y + 8); ctx.stroke(); }
                } else {
                    let a = (el.subtype === 'concave' ? 1 : -1) / (4 * el.f);
                    for(let y = -h/2; y <= h/2; y += 5) { if(y === -h/2) ctx.moveTo(a*y*y, y); else ctx.lineTo(a*y*y, y); }
                    ctx.stroke();
                    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    for(let y = -h/2 + 10; y < h/2; y += 12) { let px = a*y*y; ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px - 8, y + 8); ctx.stroke(); }
                }
            }
            ctx.restore();
            ctx.fillStyle = el.id === selectedId ? el.color : "#a0aabf"; ctx.font = "bold 13px 'Segoe UI'"; ctx.textAlign = "center";
            ctx.fillText(`E${el.id}`, cx, cy + h/2 + 20);
        }

        // --- MAIN RENDER LOOP ---
        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            const A = parseFloat(aSlider.value);
            const n = parseFloat(nSlider.value);
            const i_deg = parseFloat(iSlider.value);
            const A_rad = A * Math.PI / 180;
            
            // Prism Geometry (Apex points UP, Left entry orientation)
            const side = 260; // Logical size
            const apex = { x: 0, y: side * Math.cos(A_rad/2) * 0.5 }; // Y is up logically
            const bl = { x: -side * Math.sin(A_rad/2), y: apex.y - side * Math.cos(A_rad/2) };
            const br = { x: side * Math.sin(A_rad/2), y: bl.y };
            const centerP = { x: 0, y: (apex.y + bl.y + br.y) / 3 };

            // Draw Prism
            ctx.save();
            ctx.beginPath(); ctx.moveTo(mapX(apex.x), mapY(apex.y)); ctx.lineTo(mapX(bl.x), mapY(bl.y)); ctx.lineTo(mapX(br.x), mapY(br.y)); ctx.closePath();
            ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; ctx.fill();
            ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "center";
            ctx.fillText("A", mapX(apex.x), mapY(apex.y) - 15);
            ctx.fillText("B", mapX(bl.x) - 15, mapY(bl.y) + 15);
            ctx.fillText("C", mapX(br.x) + 15, mapY(br.y) + 15);
            ctx.restore();

            // Apex Angle Arc
            if (mode === 'ray' || mode === 'combo') {
                drawArcBetweenVectors(apex, {x: bl.x - apex.x, y: bl.y - apex.y}, {x: br.x - apex.x, y: br.y - apex.y}, 30 * drawScale, `A=${A}°`, "#ffffff");
            }

            // Setup Ray Arrays
            let activeRays = [];
            if (mode === 'dispersion') {
                const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];
                const n_vals = [n - 0.02, n - 0.015, n - 0.01, n, n + 0.01, n + 0.02, n + 0.035];
                for(let k=0; k<7; k++) activeRays.push({ n: n_vals[k], color: colors[k], offset: 0, isLabelRay: k===3 });
            } else if (mode === 'combo') {
                const offsets = [-40, -20, 0, 20, 40];
                offsets.forEach((off, idx) => activeRays.push({ n: n, color: rayColors[idx % rayColors.length], offset: off, isLabelRay: idx===2 }));
            } else {
                activeRays.push({ n: n, color: "#ffffff", offset: 0, isLabelRay: true });
            }

            // Normals (pointing INTO the prism)
            const n_left = getInwardNormal(bl, apex, centerP);
            const n_right = getInwardNormal(apex, br, centerP);
            const n_bottom = getInwardNormal(br, bl, centerP);

            // Establish Incident Direction & Midpoint
            const normalAngle = Math.atan2(n_left.y, n_left.x);
            // i_deg is added so ray comes from BOTTOM LEFT heading UP and RIGHT
            const rayAngle = normalAngle + i_deg * Math.PI / 180; 
            const d_inc = { x: Math.cos(rayAngle), y: Math.sin(rayAngle) };
            const perp_d = { x: -d_inc.y, y: d_inc.x }; // For generating parallel offset bundles

            const midLeft = { x: bl.x + (apex.x - bl.x) * 0.4, y: bl.y + (apex.y - bl.y) * 0.4 };

            // Draw Combo Elements Early
            if (mode === 'combo') elements.forEach(drawElementGeometry);

            // Main Ray Tracing Execution
            activeRays.forEach(r => {
                let startP = { 
                    x: midLeft.x - d_inc.x * 400 + r.offset * perp_d.x, 
                    y: midLeft.y - d_inc.y * 400 + r.offset * perp_d.y 
                };
                
                let hit1 = lineIntersect(startP, d_inc, apex, bl);
                if (!hit1) hit1 = { p: midLeft, t: 400 }; 
                const hitPoint = hit1.p;

                // Draw Incident Ray
                drawArrow(startP, hitPoint, "#ffffff");

                if (r.isLabelRay && (mode === 'ray' || mode === 'combo')) {
                    drawDashedNormal(hitPoint, n_left);
                    drawArcBetweenVectors(hitPoint, {x: -d_inc.x, y: -d_inc.y}, {x: -n_left.x, y: -n_left.y}, 40 * drawScale, `i=${i_deg.toFixed(1)}°`, "#ffffff");
                    
                    if (mode !== 'combo') {
                        const extEnd = { x: hitPoint.x + d_inc.x * 400, y: hitPoint.y + d_inc.y * 400 };
                        drawArrow(hitPoint, extEnd, "rgba(255, 255, 255, 0.2)", true);
                    }
                }

                let ref1 = refract(d_inc, n_left, 1.0, r.n);
                let p2 = lineIntersect(hitPoint, ref1.dir, apex, br); 
                let nextNormal = n_right;
                
                if (!p2) { p2 = lineIntersect(hitPoint, ref1.dir, bl, br); nextNormal = n_bottom; }

                if (p2) {
                    drawArrow(hitPoint, p2.p, r.color);
                    
                    if (r.isLabelRay && mode === 'ray') {
                        const r1_val = (Math.asin(Math.sin(i_deg * Math.PI/180) / r.n) * 180 / Math.PI).toFixed(1);
                        drawArcBetweenVectors(hitPoint, ref1.dir, n_left, 40 * drawScale, `r₁=${r1_val}°`, r.color);
                    }

                    let outNormal = { x: -nextNormal.x, y: -nextNormal.y };
                    let ref2 = refract(ref1.dir, outNormal, r.n, 1.0);
                    
                    if (r.isLabelRay && mode === 'ray') {
                        drawDashedNormal(p2.p, nextNormal);
                        const r2_val = (A - parseFloat((Math.asin(Math.sin(i_deg * Math.PI/180) / r.n) * 180 / Math.PI))).toFixed(1);
                        drawArcBetweenVectors(p2.p, {x: -ref1.dir.x, y: -ref1.dir.y}, nextNormal, 40 * drawScale, `r₂=${r2_val}°`, r.color);
                    }

                    if (ref2.tir) {
                        let p3 = lineIntersect(p2.p, ref2.dir, bl, br); 
                        if(p3) {
                            drawArrow(p2.p, p3.p, r.color);
                            let ref3 = refract(ref2.dir, {x:0, y:-1}, r.n, 1.0);
                            let finalEnd = { x: p3.p.x + ref3.dir.x * 600, y: p3.p.y + ref3.dir.y * 600 };
                            drawArrow(p3.p, finalEnd, r.color);
                        } else {
                            let finalEnd = { x: p2.p.x + ref2.dir.x * 600, y: p2.p.y + ref2.dir.y * 600 };
                            drawArrow(p2.p, finalEnd, r.color);
                        }
                    } else {
                        // Emergent Ray
                        let finalEnd = { x: p2.p.x + ref2.dir.x * 1200, y: p2.p.y + ref2.dir.y * 1200 };
                        
                        if (mode === 'ray' && r.isLabelRay) {
                            const e_val = (Math.asin(r.n * Math.sin((A - parseFloat((Math.asin(Math.sin(i_deg * Math.PI/180) / r.n) * 180 / Math.PI))) * Math.PI/180)) * 180 / Math.PI).toFixed(1);
                            drawArcBetweenVectors(p2.p, ref2.dir, {x: -nextNormal.x, y: -nextNormal.y}, 40 * drawScale, `e=${e_val}°`, r.color);
                            
                            // Deviation
                            const devP = rayIntersect(hitPoint, d_inc, p2.p, ref2.dir);
                            if (devP) {
                                drawArrow(p2.p, devP, r.color, true);
                                const dev_val = (i_deg + parseFloat(e_val) - A).toFixed(1);
                                drawArcBetweenVectors(devP, d_inc, ref2.dir, 30 * drawScale, `δ=${dev_val}°`, "#ffd166");
                            }
                        }

                        if (mode === 'combo') {
                            let curP = p2.p; let curD = ref2.dir;
                            let b = 0;
                            
                            while (b < 5) {
                                let nextEl = null; let minD = Infinity;
                                for (let el of elements) {
                                    let d = (el.x - curP.x) / curD.x;
                                    if (d > 0.001 && d < minD) { minD = d; nextEl = el; }
                                }
                                
                                if (!nextEl) {
                                    drawArrow(curP, { x: curP.x + curD.x * 1200, y: curP.y + curD.y * 1200 }, r.color);
                                    break; 
                                }
                                
                                let hitY = curP.y + minD * curD.y;
                                if (Math.abs(hitY - nextEl.y) > nextEl.aperture / 2) {
                                    drawArrow(curP, { x: curP.x + curD.x * 1200, y: curP.y + curD.y * 1200 }, r.color);
                                    break;
                                }

                                drawArrow(curP, { x: nextEl.x, y: hitY }, r.color);
                                
                                let Power = 0;
                                let slope = curD.y / curD.x;
                                if (nextEl.type === 'lens') {
                                    Power = nextEl.subtype === 'convex' ? 1/nextEl.f : -1/nextEl.f;
                                    slope -= (hitY - nextEl.y) * Power * Math.sign(curD.x);
                                    let dirSign = Math.sign(curD.x);
                                    curD = norm({ x: dirSign, y: slope * dirSign });
                                } else {
                                    Power = nextEl.subtype === 'plane' ? 0 : (nextEl.subtype === 'concave' ? 1/nextEl.f : -1/nextEl.f);
                                    slope -= (hitY - nextEl.y) * Power * Math.sign(curD.x);
                                    let newSlope = -slope;
                                    let dirSign = -Math.sign(curD.x); 
                                    curD = norm({ x: dirSign, y: newSlope * dirSign });
                                }
                                curP = { x: nextEl.x, y: hitY };
                                b++;
                            }
                        } else {
                            drawArrow(p2.p, finalEnd, r.color);
                        }
                    }
                }
            });

            if (mode === 'graph') {
                const gW = 300 * drawScale; const gH = 200 * drawScale;
                let gX, gY;
                if (W > 900) {
                    gX = originX + 250 * drawScale; gY = originY - gH / 2;
                } else {
                    gX = originX - gW / 2; gY = originY + 140 * drawScale;
                }
                
                ctx.save();
                ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 1;
                ctx.fillRect(gX, gY, gW, gH); 
                
                ctx.beginPath();
                ctx.moveTo(gX, gY); ctx.lineTo(gX, gY + gH);
                ctx.lineTo(gX + gW, gY + gH);
                ctx.stroke();

                ctx.fillStyle = "#fff"; ctx.font = "12px 'Segoe UI'";
                ctx.fillText("δ (Deviation)", gX + 10, gY + 15);
                ctx.fillText("i (Incidence)", gX + gW - 70, gY + gH - 10);
                ctx.fillText("0", gX - 10, gY + gH + 15);

                ctx.beginPath();
                for(let i = 0; i <= 90; i++) {
                    let i_r = i * Math.PI / 180;
                    let sin_r1 = Math.sin(i_r) / n;
                    if(sin_r1 > 1) continue;
                    let r1_r = Math.asin(sin_r1);
                    let r2_r = A_rad - r1_r;
                    let sin_e = n * Math.sin(r2_r);
                    if(sin_e > 1) continue;
                    let e_r = Math.asin(sin_e);
                    let delta = (i_r + e_r - A_rad) * 180 / Math.PI;
                    
                    let px = gX + (i / 90) * gW;
                    let py = gY + gH - (delta / 90) * gH;
                    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.strokeStyle = "var(--primary)"; ctx.lineWidth = 2; ctx.stroke();

                const i_min_rad = Math.asin(n * Math.sin(A_rad / 2));
                const d_min_deg = (2 * i_min_rad - A_rad) * 180 / Math.PI;
                const i_min_deg = i_min_rad * 180 / Math.PI;
                
                let px_min = gX + (i_min_deg / 90) * gW;
                let py_min = gY + gH - (d_min_deg / 90) * gH;

                ctx.setLineDash([4,4]); ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.beginPath(); ctx.moveTo(px_min, gY + gH); ctx.lineTo(px_min, py_min); ctx.lineTo(gX, py_min); ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = "var(--gold)"; ctx.fillText("iₘ", px_min - 8, gY + gH + 15);
                ctx.fillText("δₘ", gX - 25, py_min + 4);

                const r1_rad = Math.asin(Math.sin(i_rad) / n);
                const r2_rad = A_rad - r1_rad;
                if (n * Math.sin(r2_rad) <= 1) {
                    const e_rad = Math.asin(n * Math.sin(r2_rad));
                    const delta_deg = (i_rad + e_rad - A_rad) * 180 / Math.PI;
                    const cX = gX + (i_deg / 90) * gW;
                    const cY = gY + gH - (delta_deg / 90) * gH;
                    
                    ctx.shadowBlur = 10; ctx.shadowColor = "var(--gold)"; ctx.fillStyle = "var(--gold)";
                    ctx.beginPath(); ctx.arc(cX, cY, 5, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }
        }

        setMode('ray');
    </script>
</body>
