<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prisms & Dispersion | Vidyaalok Lab</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L8DFSQTR66"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L8DFSQTR66');

    <!-- MathJax for rendering LaTeX formulas -->
    <script>
      window.MathJax = { 
        tex: { inlineMath: [['\\(', '\\)']] }, 
        svg: { fontCache: 'global' } 
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --border: rgba(0, 229, 255, 0.2);
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 12px 20px; background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; position: relative;
        }

        .back-btn {
            color: var(--primary); text-decoration: none; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
        }
        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        /* Workspace & Canvas */
        .workspace {
            position: relative; flex-grow: 1; width: 100%; display: flex; overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; touch-action: none; cursor: crosshair;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%;
            background-image: url('../../logo.png'); background-size: contain;
            background-repeat: no-repeat; background-position: center;
            opacity: 0.06; pointer-events: none; z-index: 0;
        }

        /* HUD Panel */
        .hud-panel {
            position: absolute; z-index: 50; background: var(--panel-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7); transition: all 0.3s ease;
        }

        .hud-header {
            padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .hud-content {
            padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px;
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }
        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        /* Device Specific HUD Layout */
        @media (min-width: 901px) {
            .hud-panel { top: 20px; left: 20px; width: 380px; max-height: calc(100% - 40px); border-radius: 16px; }
        }
        @media (max-width: 900px) {
            .hud-panel { bottom: 0; left: 0; width: 100%; height: 45vh; border-radius: 20px 20px 0 0; border-bottom: none; border-left: none; border-right: none; }
        }

        /* Controls */
        .section-title { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn {
            flex: 1 1 calc(50% - 8px); min-width: 130px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s ease; text-align: center;
        }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); color: var(--primary); }

        /* Sliders */
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        /* Stats & Formulas */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; }
        .stat strong { color: var(--secondary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat span { font-size: 1.1rem; font-weight: bold; color: var(--text-main); font-family: monospace; }
        .stat.alert span { color: #ff3366; }
        
        .formula-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            text-align: center; color: var(--primary); font-weight: bold; font-size: 0.9rem; overflow-x: auto;
        }

        .toggle-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .toggle-btn { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .toggle-btn.active { background: rgba(255,209,102,0.15); border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 09</a>
        <h1>Prism & Dispersion</h1>
    </nav>

    <div class="workspace">
        <div class="watermark"></div>
        <canvas id="simCanvas"></canvas>

        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>Simulation Mode</h2>
            </div>
            
            <div class="hud-content">
                <div class="toolbar">
                    <button class="btn active" id="btnRay" onclick="setMode('ray')">Ray Diagram</button>
                    <button class="btn" id="btnDispersion" onclick="setMode('dispersion')">Dispersion</button>
                    <button class="btn" id="btnGraph" onclick="setMode('graph')">Deviation Graph</button>
                    <button class="btn" id="btnTwoPrisms" onclick="setMode('two_prisms')">Two Prisms</button>
                </div>

                <div id="controlsContainer">
                    <div class="section-title">Primary Prism (P1)</div>
                    <div class="control-group">
                        <label>Angle of Prism (<i>A</i>) <span id="aVal">60°</span></label>
                        <input id="aSlider" type="range" min="30" max="90" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Refractive Index (<i>n</i>) <span id="nVal">1.50</span></label>
                        <input id="nSlider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Angle of Incidence (<i>i</i>) <span id="iVal">45°</span></label>
                        <input id="iSlider" type="range" min="0" max="90" step="1" value="45">
                    </div>
                </div>

                <!-- Second Prism Controls -->
                <div id="twoPrismsContainer" style="display: none;">
                    <div class="section-title" style="margin-top: 10px;">Secondary Prism (P2)</div>
                    
                    <div class="toggle-row">
                        <button class="toggle-btn active" id="p2Upright" onclick="setP2Inverted(false)">▲ Upright</button>
                        <button class="toggle-btn" id="p2Inverted" onclick="setP2Inverted(true)">▼ Inverted</button>
                    </div>

                    <div class="control-group">
                        <label>Position X <span id="p2XVal">280 cm</span></label>
                        <input id="p2XSlider" type="range" min="150" max="600" step="5" value="280">
                    </div>
                    <div class="control-group">
                        <label>Position Y <span id="p2YVal">0 cm</span></label>
                        <input id="p2YSlider" type="range" min="-200" max="200" step="5" value="0">
                    </div>
                    <div class="control-group">
                        <label>Angle of Prism (<i>A₂</i>) <span id="p2AVal">60°</span></label>
                        <input id="p2ASlider" type="range" min="30" max="90" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Refractive Index (<i>n₂</i>) <span id="p2NVal">1.50</span></label>
                        <input id="p2NSlider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                </div>

                <div class="section-title" style="margin-top: 5px;">Analysis & Results</div>
                <div id="resultsContainer">
                    <!-- Populated dynamically by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");
        const hudPanel = document.getElementById("hudPanel");
        
        // UI Sliders (P1)
        const aSlider = document.getElementById("aSlider");
        const nSlider = document.getElementById("nSlider");
        const iSlider = document.getElementById("iSlider");
        
        // UI Sliders (P2)
        const twoPrismsContainer = document.getElementById("twoPrismsContainer");
        const p2XSlider = document.getElementById("p2XSlider");
        const p2YSlider = document.getElementById("p2YSlider");
        const p2ASlider = document.getElementById("p2ASlider");
        const p2NSlider = document.getElementById("p2NSlider");
        
        let W = 0, H = 0, originX = 0, originY = 0;
        let drawScale = 1; 
        let initialized = false;
        let mode = 'ray'; // 'ray', 'dispersion', 'graph', 'two_prisms'

        let p2Inverted = false;

        // --- DYNAMIC AUTO-SCALING LAYOUT ENGINE ---
        function updateLayout() {
            if (W > 900) {
                originX = 380 + (W - 380) * 0.35;
                originY = H / 2;
                drawScale = Math.min(1, H / 600);
                if (mode === 'graph') { originX = 380 + (W - 380) * 0.25; }
                if (mode === 'two_prisms') { originX = 380 + (W - 380) * 0.25; drawScale = Math.min(1, H / 700, W / 1000); }
            } else {
                const hudHeight = hudPanel.offsetHeight || (H * 0.45);
                const visH = H - hudHeight;
                originX = W * 0.4; 
                originY = visH * 0.5; 
                
                if (mode === 'graph') { originX = W / 2; originY = visH * 0.4; }
                if (mode === 'two_prisms') { originX = W * 0.25; }
                
                drawScale = Math.min(1, visH / 550, W / 800);
            }
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W; canvas.height = H;
                updateLayout();
                if (!initialized && W > 10 && H > 10) { initialized = true; draw(); } 
                else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));

        setTimeout(() => {
            if (!initialized && canvas.parentElement.clientWidth > 10) {
                W = canvas.parentElement.clientWidth; H = canvas.parentElement.clientHeight || 500; 
                canvas.width = W; canvas.height = H;
                initialized = true; updateLayout(); draw();
            }
        }, 300);

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.toolbar .btn').forEach(btn => btn.classList.remove('active'));
            
            if (mode === 'ray') document.getElementById("btnRay").classList.add('active');
            if (mode === 'dispersion') document.getElementById("btnDispersion").classList.add('active');
            if (mode === 'graph') document.getElementById("btnGraph").classList.add('active');
            if (mode === 'two_prisms') document.getElementById("btnTwoPrisms").classList.add('active');

            twoPrismsContainer.style.display = (mode === 'two_prisms') ? "block" : "none";

            updateLayout(); updateUI();
        }

        function setP2Inverted(isInverted) {
            p2Inverted = isInverted;
            document.getElementById("p2Upright").classList.toggle('active', !isInverted);
            document.getElementById("p2Inverted").classList.toggle('active', isInverted);
            updateUI();
        }

        function updateUI() {
            const A = parseFloat(aSlider.value);
            const n = parseFloat(nSlider.value);
            const i_deg = parseFloat(iSlider.value);
            
            document.getElementById("aVal").textContent = `${A}°`;
            document.getElementById("nVal").textContent = n.toFixed(2);
            document.getElementById("iVal").textContent = `${i_deg}°`;

            if (mode === 'two_prisms') {
                document.getElementById("p2XVal").textContent = `${p2XSlider.value} cm`;
                document.getElementById("p2YVal").textContent = `${p2YSlider.value} cm`;
                document.getElementById("p2AVal").textContent = `${p2ASlider.value}°`;
                document.getElementById("p2NVal").textContent = parseFloat(p2NSlider.value).toFixed(2);
            }

            // --- Single Prism Physics Math (for stats) ---
            const resultsContainer = document.getElementById("resultsContainer");
            const A_rad = A * Math.PI / 180;
            const i_rad = i_deg * Math.PI / 180;
            
            const r1_rad = Math.asin(Math.sin(i_rad) / n);
            const r1_deg = r1_rad * 180 / Math.PI;
            const r2_rad = A_rad - r1_rad;
            const r2_deg = r2_rad * 180 / Math.PI;
            
            let e_rad = 0, e_deg = 0, delta_deg = 0, isTIR = false;
            
            if (n * Math.sin(r2_rad) > 1) {
                isTIR = true;
            } else {
                e_rad = Math.asin(n * Math.sin(r2_rad));
                e_deg = e_rad * 180 / Math.PI;
                delta_deg = i_deg + e_deg - A;
            }

            if (mode === 'ray') {
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Refract 1 (r₁)</strong><span>${r1_deg.toFixed(1)}°</span></div>
                        <div class="stat"><strong>Refract 2 (r₂)</strong><span>${r2_deg.toFixed(1)}°</span></div>
                        <div class="stat ${isTIR ? 'alert' : ''}"><strong>Emergence (e)</strong><span>${isTIR ? 'TIR' : e_deg.toFixed(1) + '°'}</span></div>
                        <div class="stat ${isTIR ? 'alert' : ''}"><strong>Deviation (δ)</strong><span>${isTIR ? 'N/A' : delta_deg.toFixed(1) + '°'}</span></div>
                    </div>
                    <div class="formula-panel">\\[ r_1 + r_2 = A \\] \\[ \\delta = i + e - A \\]</div>
                `;
            } else if (mode === 'dispersion') {
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Δ Violet</strong><span>${(i_deg + Math.asin((n+0.04)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n+0.04))))*180/Math.PI - A).toFixed(1)}°</span></div>
                        <div class="stat"><strong>Δ Red</strong><span>${(i_deg + Math.asin((n-0.02)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n-0.02))))*180/Math.PI - A).toFixed(1)}°</span></div>
                        <div class="stat" style="grid-column: span 2;"><strong>Angular Dispersion</strong><span>${((Math.asin((n+0.04)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n+0.04))))*180/Math.PI) - (Math.asin((n-0.02)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n-0.02))))*180/Math.PI)).toFixed(2)}°</span></div>
                    </div>
                    <div class="formula-panel" style="font-size: 0.8rem;">\\[ n(\\lambda) = A + \\frac{B}{\\lambda^2} \\quad \\text{(Cauchy's Eq)} \\]</div>
                `;
            } else if (mode === 'graph') {
                const i_min_rad = Math.asin(n * Math.sin(A_rad / 2));
                const d_min_deg = (2 * i_min_rad - A_rad) * 180 / Math.PI;
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Current Deviation (δ)</strong><span>${isTIR ? 'N/A' : delta_deg.toFixed(1) + '°'}</span></div>
                        <div class="stat"><strong>Minimum Deviation (δₘ)</strong><span style="color:var(--gold);">${d_min_deg.toFixed(1)}°</span></div>
                    </div>
                    <div class="formula-panel">\\[ n = \\frac{\\sin\\left(\\frac{A + \\delta_m}{2}\\right)}{\\sin\\left(\\frac{A}{2}\\right)} \\]</div>
                `;
            } else if (mode === 'two_prisms') {
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat" style="grid-column: span 2;"><strong>Combined Physics</strong><span style="font-size:0.85rem; color:var(--text-muted); font-weight:normal;">Watch the dispersion and deviation interact through both prisms.</span></div>
                    </div>
                `;
            }

            if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([resultsContainer]);
            draw();
        }

        [aSlider, nSlider, iSlider, p2XSlider, p2YSlider, p2ASlider, p2NSlider].forEach(el => el.addEventListener("input", updateUI));

        // --- VECTOR MATH ENGINE ---
        function norm(v) { let l = Math.hypot(v.x, v.y) || 1; return { x: v.x/l, y: v.y/l }; }
        function dot(a, b) { return a.x*b.x + a.y*b.y; }
        
        function getOutwardNormal(A, B, center) {
            let dx = B.x - A.x; let dy = B.y - A.y; let l = Math.hypot(dx, dy);
            let n = { x: dy/l, y: -dx/l }; 
            let mid = { x: (A.x + B.x)/2, y: (A.y + B.y)/2 };
            let toCenter = { x: center.x - mid.x, y: center.y - mid.y };
            if (dot(n, toCenter) > 0) { n.x = -n.x; n.y = -n.y; }
            return n;
        }

        function refract(D, N, n1, n2) {
            let r = n1 / n2;
            let c = -dot(D, N);
            if (c < 0) { N = {x: -N.x, y: -N.y}; c = -c; }
            let sin2_t = r * r * (1 - c * c);
            if (sin2_t > 1.0) return { tir: true, dir: { x: D.x + 2*c*N.x, y: D.y + 2*c*N.y } };
            let cos_t = Math.sqrt(1 - sin2_t);
            return { tir: false, dir: { x: r * D.x + (r * c - cos_t) * N.x, y: r * D.y + (r * c - cos_t) * N.y } };
        }

        function lineIntersectSegment(p1, d1, a, b) {
            let v1 = p1, v2 = {x: p1.x + d1.x, y: p1.y + d1.y};
            let v3 = a, v4 = b;
            let denom = (v1.x - v2.x)*(v3.y - v4.y) - (v1.y - v2.y)*(v3.x - v4.x);
            if (Math.abs(denom) < 1e-6) return null;
            let t = ((v1.x - v3.x)*(v3.y - v4.y) - (v1.y - v3.y)*(v3.x - v4.x)) / denom;
            let u = -((v1.x - v2.x)*(v1.y - v3.y) - (v1.y - v2.y)*(v1.x - v3.x)) / denom;
            if (t > 1e-4 && u >= 0 && u <= 1) return { t: t, p: { x: p1.x + t*d1.x, y: p1.y + t*d1.y } };
            return null;
        }

        function rayIntersect(p1, d1, p2, d2) {
            let cross = d1.x * d2.y - d1.y * d2.x;
            if (Math.abs(cross) < 1e-6) return null;
            let t = ((p2.x - p1.x) * d2.y - (p2.y - p1.y) * d2.x) / cross;
            return { x: p1.x + t * d1.x, y: p1.y + t * d1.y };
        }

        // --- DRAWING UTILS ---
        function mapX(x) { return originX + x * drawScale; }
        function mapY(y) { return originY - y * drawScale; } // Logical Y is UP, Canvas Y is DOWN

        function getPrismData(id, cx, cy, A_deg, n_base, isInverted) {
            const A_rad = A_deg * Math.PI / 180;
            const side = 260; 
            const h = side * Math.cos(A_rad/2);
            const w = side * Math.sin(A_rad/2);

            let apexY = isInverted ? cy - h/2 : cy + h/2; // Logical Y
            let baseY = isInverted ? cy + h/2 : cy - h/2;

            let apex = { x: cx, y: apexY };
            let bl = { x: cx - w, y: baseY };
            let br = { x: cx + w, y: baseY };
            
            let center = { x: cx, y: cy };
            if(isInverted) center.y += h/6; else center.y -= h/6;

            let edges = [
                { A: bl, B: apex, label: "left" }, 
                { A: apex, B: br, label: "right" }, 
                { A: br, B: bl, label: "bottom" }
            ];

            edges.forEach(e => { e.normal = getOutwardNormal(e.A, e.B, center); });

            return { id, apex, bl, br, edges, n_base, A_deg, isInverted };
        }

        function drawPrism(p, labelA, labelB, labelC) {
            ctx.save();
            ctx.beginPath(); ctx.moveTo(mapX(p.apex.x), mapY(p.apex.y)); ctx.lineTo(mapX(p.bl.x), mapY(p.bl.y)); ctx.lineTo(mapX(p.br.x), mapY(p.br.y)); ctx.closePath();
            ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; ctx.fill();
            ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 3; ctx.stroke();
            
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "center";
            let apexOff = p.isInverted ? 20 : -15;
            let baseOff = p.isInverted ? -15 : 20;
            ctx.fillText(labelA, mapX(p.apex.x), mapY(p.apex.y) + apexOff);
            ctx.fillText(labelB, mapX(p.bl.x) - 15, mapY(p.bl.y) + baseOff);
            ctx.fillText(labelC, mapX(p.br.x) + 15, mapY(p.br.y) + baseOff);
            ctx.restore();
        }

        function drawRaySegment(p1, p2, color, dashed = false) {
            const sx1 = mapX(p1.x), sy1 = mapY(p1.y);
            const sx2 = mapX(p2.x), sy2 = mapY(p2.y);
            
            ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2.5;
            if (dashed) { ctx.setLineDash([5, 5]); ctx.globalAlpha = 0.5; }
            else { ctx.shadowBlur = 10; ctx.shadowColor = color; }
            
            ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
            ctx.setLineDash([]); ctx.shadowBlur = 0;
            
            const dx = sx2 - sx1; const dy = sy2 - sy1; const len = Math.hypot(dx, dy);
            if (len > 30 && !dashed) {
                const angle = Math.atan2(dy, dx);
                const mx = sx1 + (dx / len) * Math.min(len * 0.5, 100);
                const my = sy1 + (dy / len) * Math.min(len * 0.5, 100);
                ctx.beginPath(); ctx.fillStyle = color;
                ctx.moveTo(mx, my);
                ctx.lineTo(mx - 12 * Math.cos(angle - 0.4), my - 12 * Math.sin(angle - 0.4));
                ctx.lineTo(mx - 12 * Math.cos(angle + 0.4), my - 12 * Math.sin(angle + 0.4));
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawDashedNormal(p, N) {
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
            ctx.beginPath();
            let px1 = mapX(p.x - N.x * 120); let py1 = mapY(p.y - N.y * 120); // Extends Out
            let px2 = mapX(p.x + N.x * 120); let py2 = mapY(p.y + N.y * 120); // Extends In
            ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke();
            
            // Arrowheads on normal
            const a1 = Math.atan2(py1 - mapY(p.y), px1 - mapX(p.x));
            ctx.beginPath(); ctx.moveTo(px1, py1); ctx.lineTo(px1 - 8*Math.cos(a1-0.4), py1 - 8*Math.sin(a1-0.4)); ctx.lineTo(px1 - 8*Math.cos(a1+0.4), py1 - 8*Math.sin(a1+0.4)); ctx.fillStyle="rgba(255,255,255,0.7)"; ctx.fill();
            
            const a2 = Math.atan2(py2 - mapY(p.y), px2 - mapX(p.x));
            ctx.beginPath(); ctx.moveTo(px2, py2); ctx.lineTo(px2 - 8*Math.cos(a2-0.4), py2 - 8*Math.sin(a2-0.4)); ctx.lineTo(px2 - 8*Math.cos(a2+0.4), py2 - 8*Math.sin(a2+0.4)); ctx.fill();
            ctx.restore();
        }

        function drawArcBetweenVectors(p, v1, v2, radius, label, color) {
            let sv1 = {x: v1.x, y: -v1.y};
            let sv2 = {x: v2.x, y: -v2.y};
            let a1 = Math.atan2(sv1.y, sv1.x); let a2 = Math.atan2(sv2.y, sv2.x);
            if (a1 < 0) a1 += 2 * Math.PI; if (a2 < 0) a2 += 2 * Math.PI;
            
            let start = Math.min(a1, a2); let end = Math.max(a1, a2);
            if (end - start > Math.PI) { start = Math.max(a1, a2); end = Math.min(a1, a2) + 2 * Math.PI; }
            
            ctx.save();
            ctx.beginPath(); ctx.arc(mapX(p.x), mapY(p.y), radius, start, end);
            ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
            
            let mid = (start + end) / 2;
            ctx.fillStyle = color; ctx.font = "italic 13px 'Segoe UI'";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(label, mapX(p.x) + (radius + 20) * Math.cos(mid), mapY(p.y) + (radius + 20) * Math.sin(mid));
            ctx.restore();
        }

        // --- MAIN RENDER LOOP ---
        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            const A = parseFloat(aSlider.value);
            const n = parseFloat(nSlider.value);
            const i_deg = parseFloat(iSlider.value);
            
            let prisms = [];
            prisms.push(getPrismData(1, 0, 0, A, n, false));
            
            if (mode === 'two_prisms') {
                prisms.push(getPrismData(2, parseFloat(p2XSlider.value), parseFloat(p2YSlider.value), parseFloat(p2ASlider.value), parseFloat(p2NSlider.value), p2Inverted));
            }

            // Draw Prisms
            drawPrism(prisms[0], "A", "B", "C");
            if (prisms[1]) drawPrism(prisms[1], "A'", "B'", "C'");

            // Apex Arc for Main Prism
            if (mode === 'ray' || mode === 'graph' || mode === 'two_prisms') {
                drawArcBetweenVectors(prisms[0].apex, {x: prisms[0].bl.x - prisms[0].apex.x, y: prisms[0].bl.y - prisms[0].apex.y}, {x: prisms[0].br.x - prisms[0].apex.x, y: prisms[0].br.y - prisms[0].apex.y}, 30 * drawScale, `A=${A}°`, "#ffffff");
            }

            // Setup Rays
            let activeRays = [];
            if (mode === 'dispersion' || mode === 'two_prisms') {
                const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#00e5ff', '#4b0082', '#9400d3'];
                const offsets = [-0.02, -0.015, -0.01, 0, 0.01, 0.02, 0.035];
                for(let k=0; k<7; k++) {
                    activeRays.push({ wlColor: colors[k], n_offset: offsets[k], p: null, d: null, inPrismId: null, isLabelRay: k===3 });
                }
            } else {
                activeRays.push({ wlColor: "#ffffff", n_offset: 0, p: null, d: null, inPrismId: null, isLabelRay: true });
            }

            // Incident Ray Setup (Bottom Left striking Left Face)
            const p1 = prisms[0];
            const hitPoint = { x: p1.bl.x + (p1.apex.x - p1.bl.x) * 0.4, y: p1.bl.y + (p1.apex.y - p1.bl.y) * 0.4 };
            const n_left = p1.edges[0].normal; // Points Outward
            
            // Ray enters from bottom left. Normal points out (left/up). i is angle below the inward normal (-n_left).
            const inNormalAngle = Math.atan2(-n_left.y, -n_left.x);
            const rayAngle = inNormalAngle - i_deg * Math.PI / 180;
            const d_inc = { x: Math.cos(rayAngle), y: Math.sin(rayAngle) };
            const startP = { x: hitPoint.x - d_inc.x * 400, y: hitPoint.y - d_inc.y * 400 };

            // Draw Initial Incident Ray and its extension
            drawRaySegment(startP, hitPoint, "#ffffff");
            const extEnd = { x: hitPoint.x + d_inc.x * 600, y: hitPoint.y + d_inc.y * 600 };
            
            if (mode === 'ray' || mode === 'graph') {
                drawDashedNormal(hitPoint, n_left);
                drawArcBetweenVectors(hitPoint, {x: -d_inc.x, y: -d_inc.y}, n_left, 40 * drawScale, `i=${i_deg.toFixed(1)}°`, "#ffffff");
                drawRaySegment(hitPoint, extEnd, "rgba(255, 255, 255, 0.2)", true, false);
            } else if (mode === 'dispersion') {
                // Just normal and i for dispersion mode as requested
                drawDashedNormal(hitPoint, n_left);
                drawArcBetweenVectors(hitPoint, {x: -d_inc.x, y: -d_inc.y}, n_left, 40 * drawScale, `i=${i_deg.toFixed(1)}°`, "#ffffff");
            }

            // Execute Ray Tracing through all prisms
            activeRays.forEach(ray => {
                ray.p = hitPoint;
                ray.d = d_inc;
                ray.inPrismId = null;

                let bounces = 0;
                while (bounces < 5) {
                    let closestHit = null;
                    for (let prism of prisms) {
                        for (let edge of prism.edges) {
                            let hit = lineIntersectSegment(ray.p, ray.d, edge.A, edge.B);
                            if (hit && (!closestHit || hit.t < closestHit.t)) {
                                closestHit = { t: hit.t, p: hit.p, edge: edge, prism: prism };
                            }
                        }
                    }

                    if (!closestHit) {
                        let finalEnd = { x: ray.p.x + ray.d.x * 1200, y: ray.p.y + ray.d.y * 1200 };
                        drawRaySegment(ray.p, finalEnd, ray.wlColor);
                        break; 
                    }

                    drawRaySegment(ray.p, closestHit.p, ray.wlColor);

                    let prism = closestHit.prism;
                    let isEntering = (ray.inPrismId !== prism.id);
                    let effectiveN = prism.n_base + ray.n_offset;
                    let n1 = isEntering ? 1.0 : effectiveN;
                    let n2 = isEntering ? effectiveN : 1.0;

                    let N = closestHit.edge.normal; // Outward
                    let normalForRefract = isEntering ? {x: -N.x, y: -N.y} : N;
                    
                    if (dot(ray.d, N) > 0) normalForRefract = {x: -N.x, y: -N.y}; else normalForRefract = N;

                    let ref = refract(ray.d, normalForRefract, n1, n2);
                    
                    // Draw Geometry Labels for the main ray in 'ray' or 'graph' mode
                    if (ray.isLabelRay && (mode === 'ray' || mode === 'graph') && prism.id === 1) {
                        if (bounces === 0 && isEntering) {
                            const r1_val = (Math.asin(Math.sin(i_deg * Math.PI/180) / n2) * 180 / Math.PI).toFixed(1);
                            drawArcBetweenVectors(closestHit.p, ref.dir, {x: -normalForRefract.x, y: -normalForRefract.y}, 40 * drawScale, `r₁=${r1_val}°`, ray.wlColor);
                        } else if (bounces === 1 && !isEntering) {
                            drawDashedNormal(closestHit.p, N);
                            const r2_val = (A - parseFloat((Math.asin(Math.sin(i_deg * Math.PI/180) / n1) * 180 / Math.PI))).toFixed(1);
                            drawArcBetweenVectors(closestHit.p, {x: -ray.d.x, y: -ray.d.y}, N, 40 * drawScale, `r₂=${r2_val}°`, ray.wlColor);
                            
                            if (!ref.tir) {
                                const e_val = (Math.asin(n1 * Math.sin(r2_val * Math.PI/180)) * 180 / Math.PI).toFixed(1);
                                drawArcBetweenVectors(closestHit.p, ref.dir, N, 40 * drawScale, `e=${e_val}°`, ray.wlColor);
                                
                                // Deviation
                                const devP = rayIntersect(hitPoint, d_inc, closestHit.p, ref.dir);
                                if (devP) {
                                    drawRaySegment(closestHit.p, devP, ray.wlColor, true, false);
                                    const dev_val = (i_deg + parseFloat(e_val) - A).toFixed(1);
                                    drawArcBetweenVectors(devP, d_inc, ref.dir, 30 * drawScale, `δ=${dev_val}°`, "#ffd166");
                                }
                            }
                        }
                    }

                    ray.d = ref.dir;
                    ray.p = closestHit.p;
                    if (!ref.tir) ray.inPrismId = isEntering ? prism.id : null;
                    bounces++;
                }
            });

            // Deviation Graph Overlay
            if (mode === 'graph') {
                const gW = 300 * drawScale; const gH = 200 * drawScale;
                let gX, gY;
                if (W > 900) {
                    gX = originX + 250 * drawScale; gY = originY - gH / 2;
                } else {
                    gX = originX - gW / 2; gY = originY + 120 * drawScale;
                }
                
                ctx.save();
                ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 1;
                ctx.fillRect(gX, gY, gW, gH); 
                
                // Draw Axes
                ctx.beginPath();
                ctx.moveTo(gX, gY); ctx.lineTo(gX, gY + gH);
                ctx.lineTo(gX + gW, gY + gH);
                ctx.stroke();

                ctx.fillStyle = "#fff"; ctx.font = "12px 'Segoe UI'";
                ctx.fillText("δ (Deviation)", gX + 10, gY + 15);
                ctx.fillText("i (Incidence)", gX + gW - 70, gY + gH - 10);
                ctx.fillText("0", gX - 10, gY + gH + 15);

                ctx.beginPath();
                for(let i = 0; i <= 90; i++) {
                    let i_r = i * Math.PI / 180;
                    let sin_r1 = Math.sin(i_r) / n;
                    if(sin_r1 > 1) continue;
                    let r1_r = Math.asin(sin_r1);
                    let r2_r = A_rad - r1_r;
                    let sin_e = n * Math.sin(r2_r);
                    if(sin_e > 1) continue;
                    let e_r = Math.asin(sin_e);
                    let delta = (i_r + e_r - A_rad) * 180 / Math.PI;
                    
                    let px = gX + (i / 90) * gW;
                    let py = gY + gH - (delta / 90) * gH;
                    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.strokeStyle = "var(--primary)"; ctx.lineWidth = 2; ctx.stroke();

                // Plot Minimum Deviation Point
                const i_min_rad = Math.asin(n * Math.sin(A_rad / 2));
                const d_min_deg = (2 * i_min_rad - A_rad) * 180 / Math.PI;
                const i_min_deg = i_min_rad * 180 / Math.PI;
                
                let px_min = gX + (i_min_deg / 90) * gW;
                let py_min = gY + gH - (d_min_deg / 90) * gH;

                ctx.setLineDash([4,4]); ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.beginPath(); ctx.moveTo(px_min, gY + gH); ctx.lineTo(px_min, py_min); ctx.lineTo(gX, py_min); ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = "var(--gold)"; ctx.fillText("iₘ", px_min - 8, gY + gH + 15);
                ctx.fillText("δₘ", gX - 25, py_min + 4);

                // Plot Current Point
                const r1_rad = Math.asin(Math.sin(i_rad) / n);
                const r2_rad = A_rad - r1_rad;
                if (n * Math.sin(r2_rad) <= 1) {
                    const e_rad = Math.asin(n * Math.sin(r2_rad));
                    const delta_deg = (i_rad + e_rad - A_rad) * 180 / Math.PI;
                    const cX = gX + (i_deg / 90) * gW;
                    const cY = gY + gH - (delta_deg / 90) * gH;
                    
                    ctx.shadowBlur = 10; ctx.shadowColor = "var(--gold)"; ctx.fillStyle = "var(--gold)";
                    ctx.beginPath(); ctx.arc(cX, cY, 5, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }
        }

        setMode('ray');
    </script>
</body>
</html>
