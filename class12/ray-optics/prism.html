<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prism & Dispersion | Vidyaalok Lab</title>

    <!-- MathJax for rendering LaTeX formulas -->
    <script>
        window.MathJax = { 
            tex: { inlineMath: [['\\(', '\\)']] }, 
            svg: { fontCache: 'global' } 
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --border: rgba(0, 229, 255, 0.2);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 12px 20px; background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; position: relative;
        }

        .back-btn {
            color: var(--primary); text-decoration: none; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
        }

        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        /* Workspace & Canvas */
        .workspace {
            position: relative; flex-grow: 1; width: 100%; display: flex; overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; touch-action: none; cursor: crosshair;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%;
            background-image: url('../../logo.png'); background-size: contain;
            background-repeat: no-repeat; background-position: center;
            opacity: 0.06; pointer-events: none; z-index: 0;
        }

        /* HUD Panel */
        .hud-panel {
            position: absolute; z-index: 50; background: var(--panel-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7); transition: all 0.3s ease;
        }

        .hud-header {
            padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }

        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .hud-content {
            padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px;
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }

        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        /* Device Specific HUD Layout */
        @media (min-width: 901px) {
            .hud-panel { top: 20px; left: 20px; width: 380px; max-height: calc(100% - 40px); border-radius: 16px; }
        }

        @media (max-width: 900px) {
            .hud-panel { bottom: 0; left: 0; width: 100%; height: 45vh; border-radius: 20px 20px 0 0; border-bottom: none; border-left: none; border-right: none; }
        }

        /* Controls */
        .section-title { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

        .btn {
            flex: 1 1 calc(50% - 8px); min-width: 130px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s ease; text-align: center;
        }

        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); color: var(--primary); }
        .btn.full { flex: 1 1 100%; }

        /* Sliders */
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        /* Stats & Formulas */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; }
        .stat strong { color: var(--secondary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat span { font-size: 1.1rem; font-weight: bold; color: var(--text-main); font-family: monospace; }
        .stat.alert span { color: #ff3366; }

        .formula-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            text-align: center; color: var(--primary); font-weight: bold; font-size: 0.9rem; overflow-x: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 09</a>
        <h1>Prism & Dispersion</h1>
    </nav>

    <div class="workspace">
        <div class="watermark"></div>
        <canvas id="simCanvas"></canvas>

        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>Simulation Mode</h2>
            </div>
            
            <div class="hud-content">
                <div class="toolbar">
                    <button class="btn active" id="btnRay" onclick="setMode('ray')">Ray Diagram</button>
                    <button class="btn" id="btnDispersion" onclick="setMode('dispersion')">Dispersion</button>
                    <button class="btn" id="btnGraph" onclick="setMode('graph')">Deviation Graph</button>
                    <button class="btn" id="btnTwoPrisms" onclick="setMode('two-prisms')">Two Prisms</button>
                </div>

                <div id="controlsContainer">
                    <div class="section-title">Prism Properties</div>
                    <div class="control-group">
                        <label>Angle of Prism (A) <span id="aVal">60°</span></label>
                        <input id="aSlider" type="range" min="30" max="90" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Refractive Index (n) <span id="nVal">1.50</span></label>
                        <input id="nSlider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Angle of Incidence (i) <span id="iVal">45°</span></label>
                        <input id="iSlider" type="range" min="0" max="89" step="1" value="45">
                    </div>
                </div>

                <!-- Two Prisms Toolkit -->
                <div id="twoPrismsContainer" style="display: none;">
                    <div class="section-title">Second Prism Properties</div>
                    <div class="control-group">
                        <label>Angle of Prism 2 (A₂) <span id="a2Val">60°</span></label>
                        <input id="a2Slider" type="range" min="30" max="90" step="1" value="60">
                    </div>
                    <div class="control-group">
                        <label>Refractive Index 2 (n₂) <span id="n22Val">1.50</span></label>
                        <input id="n22Slider" type="range" min="1.1" max="2.0" step="0.01" value="1.50">
                    </div>
                    <div class="control-group">
                        <label>Orientation</label>
                        <div class="toolbar" style="margin-bottom:0;">
                            <button class="btn" id="btnUpright" onclick="setP2Inverted(false)">Upright</button>
                            <button class="btn active" id="btnInverted" onclick="setP2Inverted(true)">Inverted</button>
                        </div>
                    </div>
                </div>

                <div class="section-title" style="margin-top: 5px;">Analysis & Results</div>
                <div id="resultsContainer">
                    <!-- Populated dynamically by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");
        const hudPanel = document.getElementById("hudPanel");
        
        // UI Sliders
        const aSlider = document.getElementById("aSlider");
        const nSlider = document.getElementById("nSlider");
        const iSlider = document.getElementById("iSlider");
        
        // Two Prisms UI Elements
        const twoPrismsContainer = document.getElementById("twoPrismsContainer");
        const a2Slider = document.getElementById("a2Slider");
        const n22Slider = document.getElementById("n22Slider");
        let p2Inverted = true;
        
        let W = 0, H = 0, originX = 0, originY = 0;
        let drawScale = 1; 
        let initialized = false;
        let mode = 'ray'; // 'ray', 'dispersion', 'graph', 'two-prisms'

        const rayColors = ['#00e5ff', '#ff007f', '#00ffaa', '#ffd166', '#c7a6ff', '#ff5e00'];

        // --- DYNAMIC AUTO-SCALING LAYOUT ENGINE ---
        function updateLayout() {
            if (W > 900) {
                originX = W * 0.3; // Prism shifted left
                originY = H * 0.55;
                drawScale = Math.min(1, H / 600);
                if (mode === 'two-prisms') originX = W * 0.2; // Shift extra left for two prisms
            } else {
                const hudHeight = hudPanel.offsetHeight || (H * 0.45);
                const visH = H - hudHeight;
                originX = W * 0.4; // Shift prism left for mobile
                originY = visH * 0.65; 
                
                if (mode === 'graph') {
                    originX = W / 2;
                    originY = visH * 0.5;
                }
                
                // Aggressively scale so the entire prism and rays fit in the visible top area
                drawScale = Math.min(1, visH / 500, W / 800);
                
                if (mode === 'two-prisms') {
                    originX = W * 0.25;
                    drawScale = Math.min(1, visH / 500, W / 1000);
                }
            }
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W;
                canvas.height = H;
                updateLayout();
                if (!initialized && W > 10 && H > 10) { initialized = true; draw(); } 
                else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));

        setTimeout(() => {
            if (!initialized && canvas.parentElement.clientWidth > 10) {
                W = canvas.parentElement.clientWidth;
                H = canvas.parentElement.clientHeight || 500; 
                canvas.width = W; canvas.height = H;
                initialized = true; 
                updateLayout(); draw();
            }
        }, 300);

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.toolbar .btn').forEach(btn => btn.classList.remove('active'));
            
            if (mode === 'ray') document.getElementById("btnRay").classList.add('active');
            if (mode === 'dispersion') document.getElementById("btnDispersion").classList.add('active');
            if (mode === 'graph') document.getElementById("btnGraph").classList.add('active');
            if (mode === 'two-prisms') document.getElementById("btnTwoPrisms").classList.add('active');

            twoPrismsContainer.style.display = (mode === 'two-prisms') ? "block" : "none";
            
            updateLayout();
            updateUI();
        }

        function setP2Inverted(val) {
            p2Inverted = val;
            document.getElementById("btnInverted").classList.toggle("active", val);
            document.getElementById("btnUpright").classList.toggle("active", !val);
            draw();
        }

        function updateUI() {
            const A = parseFloat(aSlider.value);
            const n = parseFloat(nSlider.value);
            const i_deg = parseFloat(iSlider.value);
            
            document.getElementById("aVal").textContent = `${A}°`;
            document.getElementById("nVal").textContent = n.toFixed(2);
            document.getElementById("iVal").textContent = `${i_deg}°`;

            if (mode === 'two-prisms') {
                document.getElementById("a2Val").textContent = `${a2Slider.value}°`;
                document.getElementById("n22Val").textContent = parseFloat(n22Slider.value).toFixed(2);
            }

            // --- Physics Math & Formulas ---
            const resultsContainer = document.getElementById("resultsContainer");
            const A_rad = A * Math.PI / 180;
            const i_rad = i_deg * Math.PI / 180;
            
            const r1_rad = Math.asin(Math.sin(i_rad) / n);
            const r1_deg = r1_rad * 180 / Math.PI;
            
            const r2_rad = A_rad - r1_rad;
            const r2_deg = r2_rad * 180 / Math.PI;
            
            let e_rad = 0, e_deg = 0, delta_deg = 0;
            let isTIR = false;
            
            if (n * Math.sin(r2_rad) > 1) {
                isTIR = true;
            } else {
                e_rad = Math.asin(n * Math.sin(r2_rad));
                e_deg = e_rad * 180 / Math.PI;
                delta_deg = i_deg + e_deg - A;
            }

            if (mode === 'ray' || mode === 'two-prisms') {
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Refract 1 (r₁)</strong><span>${r1_deg.toFixed(1)}°</span></div>
                        <div class="stat"><strong>Refract 2 (r₂)</strong><span>${r2_deg.toFixed(1)}°</span></div>
                        <div class="stat ${isTIR ? 'alert' : ''}"><strong>Emergence (e)</strong><span>${isTIR ? 'TIR' : e_deg.toFixed(1) + '°'}</span></div>
                        <div class="stat ${isTIR ? 'alert' : ''}"><strong>Deviation (δ)</strong><span>${isTIR ? 'N/A' : delta_deg.toFixed(1) + '°'}</span></div>
                    </div>
                    <div class="formula-panel">
                        \\[ r_1 + r_2 = A \\]
                        \\[ \\delta = i + e - A \\]
                    </div>
                `;
            } else if (mode === 'dispersion') {
                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Δ Violet</strong><span>${(i_deg + Math.asin((n+0.04)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n+0.04))))*180/Math.PI - A).toFixed(1)}°</span></div>
                        <div class="stat"><strong>Δ Red</strong><span>${(i_deg + Math.asin((n-0.02)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n-0.02))))*180/Math.PI - A).toFixed(1)}°</span></div>
                        <div class="stat" style="grid-column: span 2;"><strong>Angular Dispersion</strong><span>${((Math.asin((n+0.04)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n+0.04))))*180/Math.PI) - (Math.asin((n-0.02)*Math.sin(A_rad - Math.asin(Math.sin(i_rad)/(n-0.02))))*180/Math.PI)).toFixed(2)}°</span></div>
                    </div>
                    <div class="formula-panel" style="font-size: 0.8rem;">
                        \\[ n(\\lambda) = A + \\frac{B}{\\lambda^2} \\quad \\text{(Cauchy's Eq)} \\]
                        \\[ \\delta_V - \\delta_R = (\\mu_V - \\mu_R)A \\]
                    </div>
                `;
            } else if (mode === 'graph') {
                const i_min_rad = Math.asin(n * Math.sin(A_rad / 2));
                const d_min_deg = (2 * i_min_rad - A_rad) * 180 / Math.PI;

                resultsContainer.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat"><strong>Current Deviation (δ)</strong><span>${isTIR ? 'N/A' : delta_deg.toFixed(1) + '°'}</span></div>
                        <div class="stat"><strong>Minimum Deviation (δₘ)</strong><span style="color:var(--gold);">${d_min_deg.toFixed(1)}°</span></div>
                    </div>
                    <div class="formula-panel">
                        \\[ n = \\frac{\\sin\\left(\\frac{A + \\delta_m}{2}\\right)}{\\sin\\left(\\frac{A}{2}\\right)} \\]
                    </div>
                `;
            }

            if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([resultsContainer]);
            draw();
        }

        // Sliders trigger global updateUI
        [aSlider, nSlider, iSlider, a2Slider, n22Slider].forEach(el => el.addEventListener("input", updateUI));

        // --- VECTOR MATH ENGINE ---
        function norm(v) { let l = Math.hypot(v.x, v.y) || 1; return { x: v.x/l, y: v.y/l }; }
        function dot(a, b) { return a.x*b.x + a.y*b.y; }
        
        // Return Outward normal (pointing out from the prism face)
        function getOutwardNormal(p1, p2, center) {
            let dx = p2.x - p1.x; let dy = p2.y - p1.y; 
            let l = Math.hypot(dx, dy);
            let n = { x: dy/l, y: -dx/l }; 
            let mid = { x: (p1.x + p2.x)/2, y: (p1.y + p2.y)/2 };
            let toCenter = { x: center.x - mid.x, y: center.y - mid.y };
            if (dot(n, toCenter) > 0) { n.x = -n.x; n.y = -n.y; } 
            return n;
        }

        function refract(D, N, n1, n2) {
            let r = n1 / n2;
            let c = -dot(D, N);
            if (c < 0) { N = {x: -N.x, y: -N.y}; c = -c; }
            let sin2_t = r * r * (1 - c * c);
            if (sin2_t > 1.0) return { tir: true, dir: { x: D.x + 2*c*N.x, y: D.y + 2*c*N.y } };
            let cos_t = Math.sqrt(1 - sin2_t);
            return { tir: false, dir: { x: r * D.x + (r * c - cos_t) * N.x, y: r * D.y + (r * c - cos_t) * N.y } };
        }

        function lineIntersect(p1, d1, a, b) {
            let v1 = p1, v2 = {x: p1.x + d1.x, y: p1.y + d1.y};
            let v3 = a, v4 = b;
            let denom = (v1.x - v2.x)*(v3.y - v4.y) - (v1.y - v2.y)*(v3.x - v4.x);
            if (Math.abs(denom) < 1e-6) return null;
            let t = ((v1.x - v3.x)*(v3.y - v4.y) - (v1.y - v3.y)*(v3.x - v4.x)) / denom;
            let u = -((v1.x - v2.x)*(v1.y - v3.y) - (v1.y - v2.y)*(v1.x - v3.x)) / denom;
            if (t > 1e-5 && u >= 0 && u <= 1) return { t: t, p: { x: p1.x + t*d1.x, y: p1.y + t*d1.y } };
            return null;
        }

        function rayIntersect(p1, d1, p2, d2) {
            let cross = d1.x * d2.y - d1.y * d2.x;
            if (Math.abs(cross) < 1e-6) return null;
            let t = ((p2.x - p1.x) * d2.y - (p2.y - p1.y) * d2.x) / cross;
            return { x: p1.x + t * d1.x, y: p1.y + t * d1.y };
        }

        // Generates universal prism geometry given an origin offset and inversion flag
        function getPrismPoints(offsetX, A_rad, inverted, refractiveIndex) {
            const side = 260; // Base logical size
            const h = side * Math.cos(A_rad/2);
            const w = side * Math.sin(A_rad/2);
            let p1, p2, p3;
            
            // Note: logical Y is UP. mapY handles the screen inversion.
            if (!inverted) {
                p1 = { x: offsetX, y: h * 0.5 }; // apex up
                p2 = { x: offsetX - w, y: -h * 0.5 }; // bottom left
                p3 = { x: offsetX + w, y: -h * 0.5 }; // bottom right
            } else {
                p1 = { x: offsetX, y: -h * 0.5 }; // apex down
                p2 = { x: offsetX - w, y: h * 0.5 }; // top left
                p3 = { x: offsetX + w, y: h * 0.5 }; // top right
            }
            
            const center = { x: offsetX, y: (p1.y + p2.y + p3.y) / 3 };
            
            const edges = [
                { a: p2, b: p1, n: getOutwardNormal(p2, p1, center) }, // left face
                { a: p1, b: p3, n: getOutwardNormal(p1, p3, center) }, // right face
                { a: p3, b: p2, n: getOutwardNormal(p3, p2, center) }  // base
            ];
            
            return { p1, p2, p3, edges, n: refractiveIndex, inverted, A_rad };
        }

        function getPrismIntersection(p, d, prism) {
            let bestHit = null;
            for (let edge of prism.edges) {
                let hit = lineIntersect(p, d, edge.a, edge.b);
                if (hit && hit.t > 1e-4) {
                    if (!bestHit || hit.t < bestHit.t) {
                        bestHit = { ...hit, n: edge.n }; // n is OUTWARD normal
                    }
                }
            }
            return bestHit;
        }

        // --- DRAWING UTILS ---
        function mapX(x) { return originX + x * drawScale; }
        function mapY(y) { return originY - y * drawScale; } // Canvas Y inverted logically

        function drawArrow(p1, p2, color, dashed = false) {
            const sx1 = mapX(p1.x), sy1 = mapY(p1.y);
            const sx2 = mapX(p2.x), sy2 = mapY(p2.y);
            
            ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2;
            if (dashed) { ctx.setLineDash([5, 5]); ctx.globalAlpha = 0.5; }
            else { ctx.shadowBlur = 10; ctx.shadowColor = color; }
            
            ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
            ctx.setLineDash([]); ctx.shadowBlur = 0;
            
            const dx = sx2 - sx1; const dy = sy2 - sy1; const len = Math.hypot(dx, dy);
            
            if (len > 30 && !dashed) {
                const angle = Math.atan2(dy, dx);
                // Guaranteed visible arrowhead distance 
                const mx = sx1 + (dx / len) * Math.min(len * 0.5, 100);
                const my = sy1 + (dy / len) * Math.min(len * 0.5, 100);
                ctx.beginPath(); ctx.fillStyle = color;
                ctx.moveTo(mx, my);
                ctx.lineTo(mx - 12 * Math.cos(angle - 0.4), my - 12 * Math.sin(angle - 0.4));
                ctx.lineTo(mx - 12 * Math.cos(angle + 0.4), my - 12 * Math.sin(angle + 0.4));
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawNormalArrow(x, y, dir_screen) {
            const angle = Math.atan2(dir_screen.y, dir_screen.x);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 8 * Math.cos(angle - 0.4), y - 8 * Math.sin(angle - 0.4));
            ctx.lineTo(x - 8 * Math.cos(angle + 0.4), y - 8 * Math.sin(angle + 0.4));
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fill();
        }

        function drawDashedNormal(p, N) {
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
            ctx.beginPath();
            // N is outward normal in physics space. In screen space, Y is inverted.
            let screen_N = { x: N.x, y: -N.y };
            
            let px1 = mapX(p.x) + screen_N.x * 120; let py1 = mapY(p.y) + screen_N.y * 120; // Out
            let px2 = mapX(p.x) - screen_N.x * 120; let py2 = mapY(p.y) - screen_N.y * 120; // In
            ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke();
            
            drawNormalArrow(px1, py1, screen_N); 
            drawNormalArrow(px2, py2, {x: -screen_N.x, y: -screen_N.y});
            ctx.restore();
        }

        function drawArcBetweenVectors(p, v1, v2, radius, label, color) {
            // Convert physical vectors to screen vectors (invert Y)
            let sv1 = {x: v1.x, y: -v1.y};
            let sv2 = {x: v2.x, y: -v2.y};
            
            let a1 = Math.atan2(sv1.y, sv1.x);
            let a2 = Math.atan2(sv2.y, sv2.x);
            
            if (a1 < 0) a1 += 2 * Math.PI;
            if (a2 < 0) a2 += 2 * Math.PI;
            
            let start = Math.min(a1, a2);
            let end = Math.max(a1, a2);
            
            if (end - start > Math.PI) {
                start = Math.max(a1, a2);
                end = Math.min(a1, a2) + 2 * Math.PI;
            }
            
            ctx.save();
            ctx.beginPath();
            ctx.arc(mapX(p.x), mapY(p.y), radius, start, end);
            ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); ctx.stroke();
            
            let mid = (start + end) / 2;
            ctx.fillStyle = color; ctx.font = "italic 13px 'Segoe UI'";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(label, mapX(p.x) + (radius + 20) * Math.cos(mid), mapY(p.y) + (radius + 20) * Math.sin(mid));
            ctx.restore();
        }

        function drawPrismShape(prism) {
            ctx.save();
            ctx.beginPath(); 
            ctx.moveTo(mapX(prism.p1.x), mapY(prism.p1.y)); 
            ctx.lineTo(mapX(prism.p2.x), mapY(prism.p2.y)); 
            ctx.lineTo(mapX(prism.p3.x), mapY(prism.p3.y)); 
            ctx.closePath();
            
            ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; ctx.fill();
            ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 3; ctx.stroke();
            
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "center";
            let apexLabelYOffset = prism.inverted ? 25 : -15;
            let baseLabelYOffset = prism.inverted ? -15 : 25;

            ctx.fillText("A", mapX(prism.p1.x), mapY(prism.p1.y) + apexLabelYOffset);
            ctx.fillText("B", mapX(prism.p2.x) - 15, mapY(prism.p2.y) + baseLabelYOffset);
            ctx.fillText("C", mapX(prism.p3.x) + 15, mapY(prism.p3.y) + baseLabelYOffset);
            ctx.restore();

            // Apex Angle Arc
            if (mode !== 'dispersion') {
                drawArcBetweenVectors(prism.p1, {x: prism.p2.x - prism.p1.x, y: prism.p2.y - prism.p1.y}, {x: prism.p3.x - prism.p1.x, y: prism.p3.y - prism.p1.y}, 30 * drawScale, `A=${(prism.A_rad * 180 / Math.PI).toFixed(0)}°`, "#ffffff");
            }
        }

        // --- MAIN RENDER LOOP ---
        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            const A_rad = parseFloat(aSlider.value) * Math.PI / 180;
            const n = parseFloat(nSlider.value);
            const i_deg = parseFloat(iSlider.value);
            const i_rad = i_deg * Math.PI / 180;
            
            // Build Prism 1 (Upright, Base at originX)
            const p1 = getPrismPoints(0, A_rad, false, n);
            drawPrismShape(p1);

            let p2 = null;
            if (mode === 'two-prisms') {
                const A2_rad = parseFloat(a2Slider.value) * Math.PI / 180;
                const n2 = parseFloat(n22Slider.value);
                // Place second prism to the right, gap determined by size
                p2 = getPrismPoints(260 * Math.sin(A_rad/2) + 260 * Math.sin(A2_rad/2) + 40, A2_rad, p2Inverted, n2);
                drawPrismShape(p2);
            }

            // Setup Ray Arrays
            let activeRays = [];
            if (mode === 'dispersion') {
                const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];
                const n_vals = [n - 0.02, n - 0.015, n - 0.01, n, n + 0.01, n + 0.02, n + 0.035];
                for(let k=0; k<7; k++) activeRays.push({ n: n_vals[k], color: colors[k], offset: 0, isLabelRay: k===3 });
            } else if (mode === 'two-prisms') {
                // Shoot a bundle of 5 parallel white rays
                const offsets = [-40, -20, 0, 20, 40];
                offsets.forEach((off, idx) => activeRays.push({ n: n, color: rayColors[idx % rayColors.length], offset: off, isLabelRay: idx===2 }));
            } else {
                activeRays.push({ n: n, color: "#ffffff", offset: 0, isLabelRay: true });
            }

            // Establish Incident Direction & Midpoint
            // We want the ray to strike the left face (p2 to p1) from the bottom-left, going up-right.
            // Outward normal of left face points up-left. Ray must go against it.
            const outNormalLeft = p1.edges[0].n; 
            const inwardNormalAngle = Math.atan2(-outNormalLeft.y, -outNormalLeft.x);
            // Incident angle i is measured from the inward normal. Ray is below the normal.
            const rayAngle = inwardNormalAngle + i_rad; 
            const d_inc = { x: Math.cos(rayAngle), y: Math.sin(rayAngle) };
            const perp_d = { x: -d_inc.y, y: d_inc.x }; 

            const hitTarget = { x: p1.p2.x + (p1.p1.x - p1.p2.x) * 0.35, y: p1.p2.y + (p1.p1.y - p1.p2.y) * 0.35 };

            // Main Ray Tracing Execution
            activeRays.forEach(r => {
                let startP = { 
                    x: hitTarget.x - d_inc.x * 400 + r.offset * perp_d.x, 
                    y: hitTarget.y - d_inc.y * 400 + r.offset * perp_d.y 
                };
                
                let hit1 = getPrismIntersection(startP, d_inc, p1);
                if (!hit1) hit1 = { p: hitTarget, t: 400, n: outNormalLeft }; 
                
                drawArrow(startP, hit1.p, "#ffffff");

                // Incidence Labels
                if (r.isLabelRay) {
                    drawDashedNormal(hit1.p, hit1.n);
                    drawArcBetweenVectors(hit1.p, {x: -d_inc.x, y: -d_inc.y}, hit1.n, 40 * drawScale, `i=${i_deg.toFixed(1)}°`, "#ffffff");
                    
                    if (mode !== 'two-prisms') {
                        // Extended incident forward
                        const extEnd = { x: hit1.p.x + d_inc.x * 400, y: hit1.p.y + d_inc.y * 400 };
                        drawArrow(hit1.p, extEnd, "rgba(255, 255, 255, 0.2)", true);
                    }
                }

                // Refract into Prism 1 (n points outward, so ray goes against it)
                let ref1 = refract(d_inc, hit1.n, 1.0, r.n);
                if (ref1.tir) return;

                let hit2 = getPrismIntersection(hit1.p, ref1.dir, p1);
                if (hit2) {
                    drawArrow(hit1.p, hit2.p, r.color); // Ray inside Prism 1
                    
                    if (r.isLabelRay) {
                        const r1_val = (Math.asin(Math.sin(i_rad) / r.n) * 180 / Math.PI).toFixed(1);
                        drawArcBetweenVectors(hit1.p, ref1.dir, {x: -hit1.n.x, y: -hit1.n.y}, 40 * drawScale, `r₁=${r1_val}°`, r.color);
                    }

                    // Refract out of Prism 1 (Normal points outward, ray points along it)
                    // We must pass inward normal to refract()
                    let inNormal2 = { x: -hit2.n.x, y: -hit2.n.y };
                    let ref2 = refract(ref1.dir, inNormal2, r.n, 1.0);
                    
                    if (r.isLabelRay) {
                        drawDashedNormal(hit2.p, hit2.n);
                        const r2_val = (A - parseFloat((Math.asin(Math.sin(i_rad) / r.n) * 180 / Math.PI))).toFixed(1);
                        drawArcBetweenVectors(hit2.p, {x: -ref1.dir.x, y: -ref1.dir.y}, inNormal2, 40 * drawScale, `r₂=${r2_val}°`, r.color);
                    }

                    if (!ref2.tir) {
                        if (mode === 'two-prisms') {
                            let hit3 = getPrismIntersection(hit2.p, ref2.dir, p2);
                            if (hit3) {
                                drawArrow(hit2.p, hit3.p, r.color); // Between prisms
                                let ref3 = refract(ref2.dir, hit3.n, 1.0, p2.n);
                                if (!ref3.tir) {
                                    let hit4 = getPrismIntersection(hit3.p, ref3.dir, p2);
                                    if (hit4) {
                                        drawArrow(hit3.p, hit4.p, r.color); // Inside Prism 2
                                        let inNormal4 = { x: -hit4.n.x, y: -hit4.n.y };
                                        let ref4 = refract(ref3.dir, inNormal4, p2.n, 1.0);
                                        if(!ref4.tir){
                                            let finalEnd = { x: hit4.p.x + ref4.dir.x * 1200, y: hit4.p.y + ref4.dir.y * 1200 };
                                            drawArrow(hit4.p, finalEnd, r.color);
                                        }
                                    }
                                }
                            } else {
                                let finalEnd = { x: hit2.p.x + ref2.dir.x * 1200, y: hit2.p.y + ref2.dir.y * 1200 };
                                drawArrow(hit2.p, finalEnd, r.color);
                            }
                        } else {
                            // Single Prism Emergent
                            let finalEnd = { x: hit2.p.x + ref2.dir.x * 1200, y: hit2.p.y + ref2.dir.y * 1200 };
                            drawArrow(hit2.p, finalEnd, r.color);
                            
                            if (r.isLabelRay) {
                                const e_val = (Math.asin(r.n * Math.sin((A - parseFloat((Math.asin(Math.sin(i_rad) / r.n) * 180 / Math.PI))) * Math.PI/180)) * 180 / Math.PI).toFixed(1);
                                drawArcBetweenVectors(hit2.p, ref2.dir, hit2.n, 40 * drawScale, `e=${e_val}°`, r.color);
                                
                                // Deviation Calculation and Arc
                                const devP = rayIntersect(hit1.p, d_inc, hit2.p, ref2.dir);
                                if (devP) {
                                    drawArrow(hit2.p, devP, r.color, true); // Backward dashed line
                                    const dev_val = (i_deg + parseFloat(e_val) - A).toFixed(1);
                                    drawArcBetweenVectors(devP, d_inc, ref2.dir, 30 * drawScale, `δ=${dev_val}°`, "#ffd166");
                                }
                            }
                        }
                    }
                }
            });

            // Deviation Graph Overlay Calculation
            if (mode === 'graph') {
                const gW = 300 * drawScale; const gH = 200 * drawScale;
                let gX, gY;

                if (W > 900) {
                    gX = originX + 250 * drawScale; gY = originY - gH / 2;
                } else {
                    gX = originX - gW / 2; gY = originY + 140 * drawScale;
                }
                
                ctx.save();
                // Solid background to hide rays
                ctx.fillStyle = "rgba(7, 11, 25, 0.95)"; 
                ctx.fillRect(gX, gY, gW, gH); 
                
                // Draw Axes Box
                ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(gX, gY); ctx.lineTo(gX, gY + gH); // Y Axis
                ctx.lineTo(gX + gW, gY + gH); // X Axis
                ctx.stroke();

                ctx.fillStyle = "#fff"; ctx.font = "12px 'Segoe UI'";
                ctx.fillText("δ (Deviation)", gX + 10, gY + 15);
                ctx.fillText("i (Incidence)", gX + gW - 70, gY + gH - 10);
                ctx.fillText("0", gX - 10, gY + gH + 15);

                // CLIPPING MASK FOR GRAPH
                ctx.beginPath();
                ctx.rect(gX, gY, gW, gH);
                ctx.clip();

                // Draw curve
                ctx.beginPath();
                for(let i = 0; i <= 90; i++) {
                    let i_r = i * Math.PI / 180;
                    let sin_r1 = Math.sin(i_r) / n;
                    if(sin_r1 > 1) continue;
                    let r1_r = Math.asin(sin_r1);
                    let r2_r = A_rad - r1_r;
                    let sin_e = n * Math.sin(r2_r);
                    if(sin_e > 1) continue;
                    let e_r = Math.asin(sin_e);
                    let delta = (i_r + e_r - A_rad) * 180 / Math.PI;
                    
                    let px = gX + (i / 90) * gW;
                    let py = gY + gH - (delta / 90) * gH;
                    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.strokeStyle = "var(--primary)"; ctx.lineWidth = 2; ctx.stroke();

                // Plot Minimum Deviation Point
                const i_min_rad = Math.asin(n * Math.sin(A_rad / 2));
                const d_min_deg = (2 * i_min_rad - A_rad) * 180 / Math.PI;
                const i_min_deg = i_min_rad * 180 / Math.PI;
                
                let px_min = gX + (i_min_deg / 90) * gW;
                let py_min = gY + gH - (d_min_deg / 90) * gH;

                ctx.setLineDash([4,4]); ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.beginPath(); ctx.moveTo(px_min, gY + gH); ctx.lineTo(px_min, py_min); ctx.lineTo(gX, py_min); ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = "var(--gold)"; ctx.font = "italic 13px 'Segoe UI'";
                ctx.fillText("iₘ", px_min - 8, gY + gH - 5);
                ctx.fillText("δₘ", gX + 5, py_min + 4);

                // Plot Current Point
                const r1_rad = Math.asin(Math.sin(i_rad) / n);
                const r2_rad = A_rad - r1_rad;
                if (n * Math.sin(r2_rad) <= 1) {
                    const e_rad = Math.asin(n * Math.sin(r2_rad));
                    const delta_deg = (i_rad + e_rad - A_rad) * 180 / Math.PI;
                    const cX = gX + (i_deg / 90) * gW;
                    const cY = gY + gH - (delta_deg / 90) * gH;
                    
                    ctx.shadowBlur = 10; ctx.shadowColor = "var(--gold)"; ctx.fillStyle = "var(--gold)";
                    ctx.beginPath(); ctx.arc(cX, cY, 5, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore(); // Removes clip and restores styles
            }
        }

        setMode('ray');
    </script>
</body>
