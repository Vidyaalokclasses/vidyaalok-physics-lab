    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.75);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --border: rgba(0, 229, 255, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 12px 20px;
            background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
            position: relative;
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.8);
        }

        /* Workspace & Canvas */
        .workspace {
            position: relative;
            flex-grow: 1;
            width: 100%;
            display: flex;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            touch-action: none;
            cursor: crosshair;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%; 
            height: 60%;
            background-image: url('../../logo.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.08; 
            pointer-events: none; 
            z-index: 0;
        }

        /* Mobile-First HUD Panel */
        .hud-panel {
            position: absolute;
            z-index: 50;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            transition: all 0.3s ease;
        }

        .hud-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .hud-header h2 {
            margin: 0;
            font-size: 1rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-content {
            padding: 16px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }
        
        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        /* Desktop Positioning */
        @media (min-width: 901px) {
            .hud-panel {
                top: 20px;
                left: 20px;
                width: 360px;
                max-height: calc(100% - 40px);
                border-radius: 16px;
            }
        }

        /* Mobile Positioning (Bottom Overlay) */
        @media (max-width: 900px) {
            .hud-panel {
                bottom: 0;
                left: 0;
                width: 100%;
                height: 45vh;
                border-radius: 20px 20px 0 0;
                border-bottom: none;
                border-left: none;
                border-right: none;
            }
        }

        /* UI Controls */
        .section-title {
            font-size: 0.75rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.danger { border-color: rgba(255, 51, 102, 0.4); color: #ff3366; }
        .btn.danger:hover { background: rgba(255, 51, 102, 0.15); border-color: #ff3366; }

        .element-list { display: flex; flex-direction: column; gap: 6px; }
        
        .element-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        
        .element-item:hover { border-color: rgba(255,255,255,0.3); }
        .element-item.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
        .element-item small { color: var(--text-muted); font-family: monospace; }

        /* Sliders */
        .control-group { margin-bottom: 10px; }
        .control-group label {
            display: flex; justify-content: space-between; color: var(--text-muted);
            font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px;
        }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        .editor-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.2s ease-out;
        }

        .legend {
            display: flex; flex-wrap: wrap; gap: 10px; padding: 10px;
            font-size: 0.7rem; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.1);
        }
        .leg { display: flex; align-items: center; gap: 6px; }
        .leg-dot { width: 10px; height: 10px; border-radius: 50%; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 09</a>
        <h1>Lens & Mirror Combinations</h1>
    </nav>

    <div class="workspace">
        <!-- Canvas Layer -->
        <div class="watermark"></div>
        <canvas id="comboCanvas"></canvas>

        <!-- Floating HUD Panel -->
        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>System Controls</h2>
                <button class="btn" style="padding: 4px 8px; border: none; background: transparent; color: var(--text-muted);" onclick="resetScene()">↺ RESET</button>
            </div>
            
            <div class="hud-content">
                <!-- Add Optics -->
                <div>
                    <div class="section-title">Bring Optical Element</div>
                    <div class="toolbar">
                        <button class="btn" onclick="addElement('lens', 'convex')">+ Convex Lens</button>
                        <button class="btn" onclick="addElement('lens', 'concave')">+ Concave Lens</button>
                        <button class="btn" onclick="addElement('mirror', 'concave')">+ Concave Mirror</button>
                        <button class="btn" onclick="addElement('mirror', 'convex')">+ Convex Mirror</button>
                        <button class="btn" onclick="addElement('mirror', 'plane')" style="grid-column: span 2;">+ Plane Mirror</button>
                    </div>
                </div>

                <!-- Active Elements -->
                <div>
                    <div class="section-title">Optical Path</div>
                    <div class="element-list" id="elementList"></div>
                </div>

                <!-- Live Editor -->
                <div id="editorPanel" class="editor-panel" style="display: none;">
                    <div class="section-title" id="editorTitle" style="color: var(--text-main);">Edit Element</div>
                    <div class="control-group">
                        <label>Position (X) <span id="elXVal">0 px</span></label>
                        <input id="elX" type="range" min="50" max="800" step="5" value="100">
                    </div>
                    <div class="control-group" id="focalGroup">
                        <label>Focal Length (f) <span id="elFVal">100 px</span></label>
                        <input id="elF" type="range" min="20" max="300" step="5" value="100">
                    </div>
                    <button class="btn danger" style="width: 100%; margin-top: 5px;" onclick="deleteSelected()">Remove Element</button>
                </div>

                <div class="legend" id="legendBox">
                    <div class="leg"><div class="leg-dot" style="background: var(--gold); box-shadow: 0 0 8px var(--gold);"></div> Point Object (Fixed)</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("comboCanvas");
        const ctx = canvas.getContext("2d");
        
        // UI Elements
        const elXSlider = document.getElementById("elX");
        const elFSlider = document.getElementById("elF");
        const elementListUI = document.getElementById("elementList");
        const editorPanel = document.getElementById("editorPanel");
        const hudPanel = document.getElementById("hudPanel");
        const legendBox = document.getElementById("legendBox");
        
        let W = 0, H = 0;
        let originX = 0, originY = 0;
        let initialized = false;

        // Interactive State
        let isDragging = false;
        let dragTarget = null;
        let dragOffsetX = 0;

        // Physics State
        const rayColors = ['#ffffff', '#00e5ff', '#ff007f', '#00ffaa', '#c7a6ff', '#ffd166', '#ff5e00'];
        const objectX = 0; // Object is strictly fixed at 0 in logical space
        let elements = [];
        let selectedId = null;
        let nextId = 1;

        // --- RESIZE OBSERVER & DYNAMIC ORIGIN ---
        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W;
                canvas.height = H;
                
                // Dynamic Origin Calculation to avoid HUD overlap and keep Object fixed on the left
                if (W > 900) {
                    originX = 420; // Room for left HUD
                    originY = H / 2;
                } else {
                    const hudHeight = hudPanel.offsetHeight || (H * 0.45);
                    originX = 40; // Push Object to far left edge to maximize mobile canvas
                    originY = (H - hudHeight) / 2;
                }

                if (!initialized && W > 10 && H > 10) {
                    initialized = true;
                    resetScene();
                } else if (initialized) {
                    draw();
                }
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));

        function resetScene() {
            elements = [
                { id: nextId++, type: 'lens', subtype: 'convex', x: 200, f: 120 },
                { id: nextId++, type: 'mirror', subtype: 'concave', x: 450, f: 150 }
            ];
            selectedId = elements[0].id;
            updateUI();
            draw();
        }

        // --- HUD UI LOGIC ---
        function updateUI() {
            const sorted = [...elements].sort((a,b) => a.x - b.x);
            
            elementListUI.innerHTML = "";
            if(sorted.length === 0) {
                elementListUI.innerHTML = "<div style='color:var(--text-muted); font-size:0.8rem; text-align:center; padding: 10px;'>No elements in path.</div>";
            }
            
            sorted.forEach(el => {
                const div = document.createElement("div");
                div.className = "element-item" + (el.id === selectedId ? " active" : "");
                const name = el.subtype.charAt(0).toUpperCase() + el.subtype.slice(1) + " " + el.type.charAt(0).toUpperCase() + el.type.slice(1);
                div.innerHTML = `<span>${name}</span> <small>x: ${Math.round(el.x)}</small>`;
                div.onclick = () => selectElement(el.id);
                elementListUI.appendChild(div);
            });

            const sel = elements.find(e => e.id === selectedId);
            if (sel) {
                editorPanel.style.display = "block";
                document.getElementById("editorTitle").textContent = `Edit ${sel.subtype.charAt(0).toUpperCase() + sel.subtype.slice(1)} ${sel.type.charAt(0).toUpperCase() + sel.type.slice(1)}`;
                
                elXSlider.value = sel.x;
                document.getElementById("elXVal").textContent = `${Math.round(sel.x)} px`;
                
                if (sel.subtype === 'plane') {
                    document.getElementById("focalGroup").style.display = "none";
                } else {
                    document.getElementById("focalGroup").style.display = "flex";
                    elFSlider.value = sel.f;
                    document.getElementById("elFVal").textContent = `${Math.round(sel.f)} px`;
                }
            } else {
                editorPanel.style.display = "none";
            }
        }

        function addElement(type, subtype) {
            elements.push({ id: nextId++, type, subtype, x: 250, f: 100 });
            selectedId = nextId - 1;
            updateUI(); 
            draw();
        }

        function selectElement(id) {
            selectedId = id;
            updateUI(); 
            draw();
        }

        function deleteSelected() {
            elements = elements.filter(e => e.id !== selectedId);
            selectedId = null;
            updateUI(); 
            draw();
        }

        // HUD Listeners
        elXSlider.addEventListener("input", (e) => {
            const sel = elements.find(el => el.id === selectedId);
            if(sel) { sel.x = parseFloat(e.target.value); updateUI(); draw(); }
        });
        
        elFSlider.addEventListener("input", (e) => {
            const sel = elements.find(el => el.id === selectedId);
            if(sel) { sel.f = parseFloat(e.target.value); updateUI(); draw(); }
        });

        // --- INTERACTION / DRAGGING ---
        function getEventX(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
            else if (e.changedTouches && e.changedTouches.length > 0) clientX = e.changedTouches[0].clientX;
            return (clientX - rect.left) * (canvas.width / rect.width);
        }

        function getEventY(e) {
            const rect = canvas.getBoundingClientRect();
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) clientY = e.touches[0].clientY;
            else if (e.changedTouches && e.changedTouches.length > 0) clientY = e.changedTouches[0].clientY;
            return (clientY - rect.top) * (canvas.height / rect.height);
        }

        function handleInputStart(e) {
            if (e.target.closest('.hud-panel')) return; 
            const cx = getEventX(e);
            const cy = getEventY(e);
            const simX = cx - originX;

            for (let i = elements.length - 1; i >= 0; i--) {
                if (Math.abs(simX - elements[i].x) < 25 && Math.abs(cy - originY) < 80) {
                    isDragging = true;
                    dragTarget = elements[i].id;
                    selectedId = elements[i].id;
                    dragOffsetX = elements[i].x - simX;
                    updateUI();
                    draw();
                    if(e.cancelable) e.preventDefault();
                    return;
                }
            }
        }

        function handleInputMove(e) {
            if (!isDragging || !dragTarget) return;
            if(e.cancelable) e.preventDefault();
            
            const cx = getEventX(e);
            const simX = cx - originX;
            let newX = simX + dragOffsetX;
            
            // Object is fixed at 0. Lenses must stay to the right of it.
            if (newX < 20) newX = 20;

            const sel = elements.find(el => el.id === dragTarget);
            if (sel) {
                sel.x = newX;
                elXSlider.value = newX;
            }
            updateUI();
            draw();
        }

        function handleInputEnd() { isDragging = false; dragTarget = null; }

        canvas.addEventListener("mousedown", handleInputStart);
        canvas.addEventListener("mousemove", handleInputMove);
        window.addEventListener("mouseup", handleInputEnd);

        canvas.addEventListener("touchstart", handleInputStart, {passive: false});
        canvas.addEventListener("touchmove", handleInputMove, {passive: false});
        window.addEventListener("touchend", handleInputEnd);

        // --- PARAXIAL RAY TRACING ENGINE (POINT IMAGES) ---
        function traceSystem() {
            // We shoot a fan of rays from the point object to visualize
            const slopes = [-0.12, -0.06, 0.06, 0.12];
            let allPaths = [];
            let images = [];
            let dashedExtensions = [];
            
            for (let i = 0; i < slopes.length; i++) {
                let r = { x: objectX, y: 0, dx: 1, dy: slopes[i] };
                let path = [{ x: r.x, y: r.y }];
                let bounces = 0;
                
                while (bounces < 10) {
                    let nextEl = null; let minDist = Infinity;
                    
                    for (let el of elements) {
                        let d = (el.x - r.x) * r.dx;
                        if (d > 0.001 && d < minDist) { minDist = d; nextEl = el; }
                    }
                    
                    if (!nextEl) {
                        path.push({ x: r.x + r.dx * 3000, y: r.y + r.dy * 3000 });
                        break;
                    }
                    
                    let hitY = r.y + minDist * r.dy / r.dx;
                    // Cap aperture
                    if(Math.abs(hitY) > 120) {
                        path.push({ x: r.x + r.dx * 3000, y: r.y + r.dy * 3000 });
                        break;
                    }

                    path.push({ x: nextEl.x, y: hitY });
                    
                    // Unified Matrix Transformation
                    let Power = 0;
                    if (nextEl.type === 'lens') {
                        Power = nextEl.subtype === 'convex' ? 1/nextEl.f : -1/nextEl.f;
                        r.dy = r.dy - hitY * Power; // Paraxial approximation applies universally here
                    } else {
                        Power = nextEl.subtype === 'plane' ? 0 : (nextEl.subtype === 'concave' ? 1/nextEl.f : -1/nextEl.f);
                        r.dy = r.dy - hitY * Power;
                        r.dx = -r.dx; // Reflect
                    }
                    r.x = nextEl.x;
                    r.y = hitY;
                    
                    // Calculate and Store Analytical Image Point using Outermost Rays
                    if (i === 0) {
                        let imgX = Infinity;
                        if (Math.abs(r.dy) > 1e-6) {
                            imgX = r.x - r.y * r.dx / r.dy;
                        }
                        
                        const bounceColor = rayColors[(bounces + 1) % rayColors.length];
                        images.push({ 
                            x: imgX, 
                            color: bounceColor, 
                            label: `I${bounces+1}`,
                            elX: nextEl.x,
                            dx: r.dx
                        });
                    }

                    // Save dashed extensions to Image Point for Top and Bottom rays
                    if (i === 0 || i === slopes.length - 1) {
                        if (Math.abs(r.dy) > 1e-6) {
                            let imgX = r.x - r.y * r.dx / r.dy;
                            dashedExtensions.push({
                                x1: nextEl.x, y1: hitY,
                                x2: imgX, y2: 0,
                                color: rayColors[(bounces + 1) % rayColors.length]
                            });
                        }
                    }
                    bounces++;
                }
                allPaths.push(path);
            }
            return { paths: allPaths, images, dashedExtensions };
        }

        // --- DRAWING UTILS ---
        function mapX(x) { return originX + x; }
        function mapY(y) { return originY - y; }

        function drawElementGeometry(el) {
            const cx = mapX(el.x);
            const cy = originY;
            const h = 180; 
            ctx.save();
            
            if (el.id === selectedId) {
                ctx.shadowBlur = 15; ctx.shadowColor = "var(--gold)";
            }

            if (el.type === 'lens') {
                ctx.strokeStyle = "#00e5ff"; ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; ctx.lineWidth = 3;
                ctx.beginPath();
                if (el.subtype === 'convex') {
                    ctx.moveTo(cx, cy - h/2);
                    ctx.quadraticCurveTo(cx + 25, cy, cx, cy + h/2);
                    ctx.quadraticCurveTo(cx - 25, cy, cx, cy - h/2);
                } else {
                    ctx.moveTo(cx - 15, cy - h/2); ctx.lineTo(cx + 15, cy - h/2);
                    ctx.quadraticCurveTo(cx - 5, cy, cx + 15, cy + h/2); ctx.lineTo(cx - 15, cy + h/2);
                    ctx.quadraticCurveTo(cx + 5, cy, cx - 15, cy - h/2);
                }
                ctx.fill(); ctx.stroke();
            } 
            else if (el.type === 'mirror') {
                ctx.lineWidth = 4;
                const facesRight = el.x < objectX; 
                const curveDir = facesRight ? -1 : 1; 

                if (el.subtype === 'plane') {
                    ctx.strokeStyle = "#8de5ff";
                    ctx.beginPath(); ctx.moveTo(cx, cy - h/2); ctx.lineTo(cx, cy + h/2); ctx.stroke();
                    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    for(let y = cy - h/2 + 5; y < cy + h/2; y += 10) {
                        ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx + 8 * curveDir, y + 8); ctx.stroke();
                    }
                } 
                else {
                    ctx.strokeStyle = "#ff007f";
                    ctx.beginPath();
                    const bulge = el.subtype === 'concave' ? 25 * curveDir : -25 * curveDir;
                    ctx.moveTo(cx, cy - h/2);
                    ctx.quadraticCurveTo(cx + bulge, cy, cx, cy + h/2);
                    ctx.stroke();
                    
                    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    for(let t = 0.1; t < 1; t += 0.08) {
                        const px = cx + bulge * 2 * (1 - t) * t;
                        const py = (cy - h/2) * Math.pow(1 - t, 2) + cy * 2 * (1 - t) * t + (cy + h/2) * Math.pow(t, 2);
                        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 8 * curveDir, py + 8); ctx.stroke();
                    }
                }
            }
            ctx.restore();
            
            ctx.fillStyle = el.id === selectedId ? "var(--gold)" : "#fff";
            ctx.font = "bold 12px 'Segoe UI'";
            ctx.fillText(`E${el.id}`, cx - 8, cy + h/2 + 20);
        }

        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            // Principal Axis
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(W, originY); ctx.stroke();

            // Draw Elements
            elements.forEach(drawElementGeometry);

            // Execute Ray Tracing
            const { paths, images, dashedExtensions } = traceSystem();
            
            // Draw Virtual Extensions to Image Points
            dashedExtensions.forEach(ext => {
                if (ext.x2 > -W && ext.x2 < W*2) { // Only draw if roughly on screen
                    ctx.save();
                    ctx.strokeStyle = ext.color;
                    ctx.globalAlpha = 0.4;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.moveTo(mapX(ext.x1), mapY(ext.y1));
                    ctx.lineTo(mapX(ext.x2), mapY(ext.y2));
                    ctx.stroke();
                    ctx.restore();
                }
            });

            // Draw Real Solid Rays
            paths.forEach(path => {
                for(let i = 0; i < path.length - 1; i++) {
                    let p1 = path[i];
                    let p2 = path[i+1];
                    
                    ctx.strokeStyle = path[i].color || rayColors[i % rayColors.length];
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(mapX(p1.x), mapY(p1.y));
                    ctx.lineTo(mapX(p2.x), mapY(p2.y));
                    ctx.stroke();
                }
            });

            // Draw Fixed Point Object (O)
            const ox = mapX(objectX);
            ctx.save();
            ctx.shadowBlur = 15; ctx.shadowColor = "var(--gold)";
            ctx.fillStyle = "var(--gold)";
            ctx.beginPath(); ctx.arc(ox, originY, 6, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'";
            ctx.fillText("O", ox - 6, originY - 15);
            ctx.restore();

            // Update Dynamic Legend & Draw Point Images (I)
            let legendHTML = `<div class="leg"><div class="leg-dot" style="background: var(--gold); box-shadow: 0 0 8px var(--gold);"></div> Point Object (O)</div>`;
            
            images.forEach((img) => {
                if (img.x > -W && img.x < W*2) {
                    const ix = mapX(img.x);
                    ctx.save();
                    ctx.shadowBlur = 15; ctx.shadowColor = img.color;
                    ctx.fillStyle = img.color;
                    ctx.beginPath(); ctx.arc(ix, originY, 5, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#fff"; ctx.font = "bold 14px 'Segoe UI'";
                    ctx.fillText(img.label, ix - 6, originY + 22);
                    ctx.restore();
                    
                    legendHTML += `<div class="leg"><div class="leg-dot" style="background: ${img.color}; box-shadow: 0 0 8px ${img.color};"></div> Image ${img.label}</div>`;
                }
            });
            legendBox.innerHTML = legendHTML;
        }

        updateUI();
    </script>
</body>
</html>
