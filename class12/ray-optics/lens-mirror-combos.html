    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.75);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --real-img: #00ffaa;
            --virtual-img: #c7a6ff;
            --border: rgba(0, 229, 255, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 12px 20px;
            background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
            position: relative;
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.8);
        }

        /* Workspace & Canvas */
        .workspace {
            position: relative;
            flex-grow: 1;
            width: 100%;
            display: flex;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            touch-action: none;
            cursor: crosshair;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%; 
            height: 60%;
            background-image: url('../../logo.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.08; 
            pointer-events: none; 
            z-index: 0;
        }

        /* Mobile-First HUD Panel */
        .hud-panel {
            position: absolute;
            z-index: 50;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            transition: all 0.3s ease;
        }

        .hud-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .hud-header h2 {
            margin: 0;
            font-size: 1rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-content {
            padding: 16px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }
        
        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        /* Desktop Positioning */
        @media (min-width: 901px) {
            .hud-panel {
                top: 20px;
                left: 20px;
                width: 360px;
                max-height: calc(100% - 40px);
                border-radius: 16px;
            }
        }

        /* Mobile Positioning (Bottom Overlay) */
        @media (max-width: 900px) {
            .hud-panel {
                bottom: 0;
                left: 0;
                width: 100%;
                height: 45vh;
                border-radius: 20px 20px 0 0;
                border-bottom: none;
                border-left: none;
                border-right: none;
            }
        }

        /* UI Controls */
        .section-title {
            font-size: 0.75rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.danger { border-color: rgba(255, 51, 102, 0.4); color: #ff3366; }
        .btn.danger:hover { background: rgba(255, 51, 102, 0.15); border-color: #ff3366; }

        .element-list { display: flex; flex-direction: column; gap: 6px; }
        
        .element-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        
        .element-item:hover { border-color: rgba(255,255,255,0.3); }
        .element-item.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
        .element-item small { color: var(--text-muted); font-family: monospace; }

        /* Sliders */
        .control-group { margin-bottom: 10px; }
        .control-group label {
            display: flex; justify-content: space-between; color: var(--text-muted);
            font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px;
        }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        .editor-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>

<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 09</a>
        <h1>Lens & Mirror Combinations</h1>
    </nav>

    <div class="workspace">
        <!-- Canvas Layer -->
        <div class="watermark"></div>
        <canvas id="comboCanvas"></canvas>

        <!-- Floating HUD Panel -->
        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>System Controls</h2>
                <button class="btn" style="padding: 4px 8px; border: none; background: transparent; color: var(--text-muted);" onclick="resetScene()">↺ RESET</button>
            </div>
            
            <div class="hud-content">
                <!-- Object Controls -->
                <div>
                    <div class="section-title">Object Settings</div>
                    <div class="control-group">
                        <label>Position (X) <span id="objXVal">-150 px</span></label>
                        <input id="objX" type="range" min="-400" max="400" step="1" value="-150">
                    </div>
                    <div class="control-group">
                        <label>Height (h) <span id="objHVal">40 px</span></label>
                        <input id="objH" type="range" min="10" max="100" step="1" value="40">
                    </div>
                </div>

                <!-- Add Optics -->
                <div>
                    <div class="section-title">Add Optical Element</div>
                    <div class="toolbar">
                        <button class="btn" onclick="addElement('lens', 'convex')">+ Convex Lens</button>
                        <button class="btn" onclick="addElement('lens', 'concave')">+ Concave Lens</button>
                        <button class="btn" onclick="addElement('mirror', 'concave')">+ Concave Mirror</button>
                        <button class="btn" onclick="addElement('mirror', 'convex')">+ Convex Mirror</button>
                        <button class="btn" onclick="addElement('mirror', 'plane')" style="grid-column: span 2;">+ Plane Mirror</button>
                    </div>
                </div>

                <!-- Active Elements -->
                <div>
                    <div class="section-title">Optical Path</div>
                    <div class="element-list" id="elementList"></div>
                </div>

                <!-- Live Editor -->
                <div id="editorPanel" class="editor-panel" style="display: none;">
                    <div class="section-title" id="editorTitle" style="color: var(--text-main);">Edit Element</div>
                    <div class="control-group">
                        <label>Position (X) <span id="elXVal">0 px</span></label>
                        <input id="elX" type="range" min="-400" max="400" step="1" value="0">
                    </div>
                    <div class="control-group" id="focalGroup">
                        <label>Focal Length (f) <span id="elFVal">100 px</span></label>
                        <input id="elF" type="range" min="20" max="300" step="1" value="100">
                    </div>
                    <button class="btn danger" style="width: 100%; margin-top: 5px;" onclick="deleteSelected()">Remove Element</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("comboCanvas");
        const ctx = canvas.getContext("2d");
        
        // UI Elements
        const objXSlider = document.getElementById("objX");
        const objHSlider = document.getElementById("objH");
        const elXSlider = document.getElementById("elX");
        const elFSlider = document.getElementById("elF");
        const elementListUI = document.getElementById("elementList");
        const editorPanel = document.getElementById("editorPanel");
        const hudPanel = document.getElementById("hudPanel");
        
        let W = 0, H = 0;
        let originX = 0, originY = 0;
        let initialized = false;

        // Interactive State
        let isDragging = false;
        let dragTarget = null; // 'object' or element ID
        let dragOffsetX = 0;

        // Physics State
        let object = { x: -150, h: 40 };
        let elements = [];
        let selectedId = null;
        let nextId = 1;

        // --- RESIZE OBSERVER & DYNAMIC ORIGIN ---
        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W;
                canvas.height = H;
                
                // Dynamic Origin Calculation to avoid HUD overlap
                if (W > 900) {
                    // Desktop: HUD is on the left. Center optical axis in remaining right space
                    originX = 380 + (W - 380) / 2;
                    originY = H / 2;
                } else {
                    // Mobile: HUD is at the bottom (45vh). Center in top 55vh.
                    const hudHeight = hudPanel.offsetHeight || (H * 0.45);
                    originX = W / 2;
                    originY = (H - hudHeight) / 2;
                }

                if (!initialized && W > 10 && H > 10) {
                    initialized = true;
                    resetScene();
                } else if (initialized) {
                    draw();
                }
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));

        function resetScene() {
            object = { x: -150, h: 40 };
            elements = [
                { id: nextId++, type: 'lens', subtype: 'convex', x: 0, f: 100 },
                { id: nextId++, type: 'mirror', subtype: 'concave', x: 200, f: 120 }
            ];
            selectedId = elements[0].id;
            updateUI();
            draw();
        }

        // --- HUD UI LOGIC ---
        function updateUI() {
            document.getElementById("objXVal").textContent = `${Math.round(object.x)} px`;
            document.getElementById("objHVal").textContent = `${Math.round(object.h)} px`;
            objXSlider.value = object.x;
            objHSlider.value = object.h;
            
            // Sort elements left-to-right visually in the list
            const sorted = [...elements].sort((a,b) => a.x - b.x);
            
            elementListUI.innerHTML = "";
            if(sorted.length === 0) {
                elementListUI.innerHTML = "<div style='color:var(--text-muted); font-size:0.8rem; text-align:center; padding: 10px;'>No elements in path.</div>";
            }
            
            sorted.forEach(el => {
                const div = document.createElement("div");
                div.className = "element-item" + (el.id === selectedId ? " active" : "");
                const name = el.subtype.charAt(0).toUpperCase() + el.subtype.slice(1) + " " + el.type.charAt(0).toUpperCase() + el.type.slice(1);
                div.innerHTML = `<span>${name}</span> <small>x: ${Math.round(el.x)}</small>`;
                div.onclick = () => selectElement(el.id);
                elementListUI.appendChild(div);
            });

            const sel = elements.find(e => e.id === selectedId);
            if (sel) {
                editorPanel.style.display = "block";
                document.getElementById("editorTitle").textContent = `Edit ${sel.subtype.charAt(0).toUpperCase() + sel.subtype.slice(1)} ${sel.type.charAt(0).toUpperCase() + sel.type.slice(1)}`;
                
                elXSlider.value = sel.x;
                document.getElementById("elXVal").textContent = `${Math.round(sel.x)} px`;
                
                if (sel.subtype === 'plane') {
                    document.getElementById("focalGroup").style.display = "none";
                } else {
                    document.getElementById("focalGroup").style.display = "flex";
                    elFSlider.value = sel.f;
                    document.getElementById("elFVal").textContent = `${Math.round(sel.f)} px`;
                }
            } else {
                editorPanel.style.display = "none";
            }
        }

        function addElement(type, subtype) {
            elements.push({ id: nextId++, type, subtype, x: 50, f: 100 });
            selectedId = nextId - 1;
            updateUI(); 
            draw();
        }

        function selectElement(id) {
            selectedId = id;
            updateUI(); 
            draw();
        }

        function deleteSelected() {
            elements = elements.filter(e => e.id !== selectedId);
            selectedId = null;
            updateUI(); 
            draw();
        }

        // HUD Listeners
        objXSlider.addEventListener("input", (e) => { object.x = parseFloat(e.target.value); updateUI(); draw(); });
        objHSlider.addEventListener("input", (e) => { object.h = parseFloat(e.target.value); updateUI(); draw(); });
        
        elXSlider.addEventListener("input", (e) => {
            const sel = elements.find(el => el.id === selectedId);
            if(sel) { sel.x = parseFloat(e.target.value); updateUI(); draw(); }
        });
        
        elFSlider.addEventListener("input", (e) => {
            const sel = elements.find(el => el.id === selectedId);
            if(sel) { sel.f = parseFloat(e.target.value); updateUI(); draw(); }
        });

        // --- INTERACTION / DRAGGING ---
        function getEventX(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
            else if (e.changedTouches && e.changedTouches.length > 0) clientX = e.changedTouches[0].clientX;
            return (clientX - rect.left) * (canvas.width / rect.width);
        }

        function getEventY(e) {
            const rect = canvas.getBoundingClientRect();
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) clientY = e.touches[0].clientY;
            else if (e.changedTouches && e.changedTouches.length > 0) clientY = e.changedTouches[0].clientY;
            return (clientY - rect.top) * (canvas.height / rect.height);
        }

        function handleInputStart(e) {
            if (e.target.closest('.hud-panel')) return; // Ignore HUD clicks
            const cx = getEventX(e);
            const cy = getEventY(e);
            const simX = cx - originX;

            // Check Object hit
            if (Math.abs(simX - object.x) < 20 && cy < originY && cy > originY - object.h - 20) {
                isDragging = true; dragTarget = 'object'; dragOffsetX = object.x - simX;
                if(e.cancelable) e.preventDefault();
                return;
            }

            // Check Elements hit (reverse order to pick top layer)
            for (let i = elements.length - 1; i >= 0; i--) {
                if (Math.abs(simX - elements[i].x) < 20 && Math.abs(cy - originY) < 70) {
                    isDragging = true;
                    dragTarget = elements[i].id;
                    selectedId = elements[i].id;
                    dragOffsetX = elements[i].x - simX;
                    updateUI();
                    draw();
                    if(e.cancelable) e.preventDefault();
                    return;
                }
            }
        }

        function handleInputMove(e) {
            if (!isDragging) return;
            if(e.cancelable) e.preventDefault();
            
            const cx = getEventX(e);
            const simX = cx - originX;
            let newX = simX + dragOffsetX;
            
            // Clamp to reasonable bounds
            if (newX < -W/2 + 20) newX = -W/2 + 20;
            if (newX > W/2 - 20) newX = W/2 - 20;

            if (dragTarget === 'object') {
                object.x = newX;
                objXSlider.value = newX;
            } else {
                const sel = elements.find(el => el.id === dragTarget);
                if (sel) {
                    sel.x = newX;
                    elXSlider.value = newX;
                }
            }
            updateUI();
            draw();
        }

        function handleInputEnd() { isDragging = false; dragTarget = null; }

        canvas.addEventListener("mousedown", handleInputStart);
        canvas.addEventListener("mousemove", handleInputMove);
        window.addEventListener("mouseup", handleInputEnd);

        canvas.addEventListener("touchstart", handleInputStart, {passive: false});
        canvas.addEventListener("touchmove", handleInputMove, {passive: false});
        window.addEventListener("touchend", handleInputEnd);

        // --- PARAXIAL RAY TRACING ENGINE ---
        function traceRays() {
            const rays = [];
            // Fan of paraxial rays from the object tip
            const initialSlopes = [-0.15, -0.05, 0, 0.05, 0.15];
            
            for (let m of initialSlopes) {
                // Ray state: x, y, direction vector (vx, vy)
                let ray = { x: object.x, y: object.h, vx: 1, vy: m };
                let path = [{ x: ray.x, y: ray.y }];
                let bounces = 0;
                let active = true;

                while (active && bounces < 15) {
                    let nextEl = null;
                    let minDist = Infinity;
                    
                    // Find next element in path
                    for (let el of elements) {
                        let dist = (el.x - ray.x) * ray.vx;
                        if (dist > 0.001 && dist < minDist) {
                            minDist = dist;
                            nextEl = el;
                        }
                    }
                    
                    if (!nextEl) {
                        // Off to infinity
                        path.push({ x: ray.x + ray.vx * 3000, y: ray.y + ray.vy * 3000 });
                        active = false;
                        break;
                    }
                    
                    // Hit plane
                    let hitY = ray.y + ray.vy * minDist;
                    
                    // Finite Aperture Check (Stop tracking if ray misses the element)
                    if (Math.abs(hitY) > 100) {
                        path.push({ x: ray.x + ray.vx * 3000, y: ray.y + ray.vy * 3000 });
                        active = false;
                        break;
                    }

                    path.push({ x: nextEl.x, y: hitY });
                    
                    // Apply Optical Transformation Matrix
                    let Power = 0;
                    if (nextEl.type === 'lens') {
                        Power = nextEl.subtype === 'convex' ? 1/nextEl.f : -1/nextEl.f;
                        // Lens bends ray based on hit height, keeps horizontal direction
                        ray.vy = ray.vy - hitY * Power * Math.abs(ray.vx);
                    } else if (nextEl.type === 'mirror') {
                        if (nextEl.subtype === 'plane') Power = 0;
                        else if (nextEl.subtype === 'concave') Power = 1/nextEl.f;
                        else Power = -1/nextEl.f; // Convex mirror
                        
                        // Mirror reflects horizontal direction, bends vertical
                        ray.vy = ray.vy - hitY * Power * Math.abs(ray.vx);
                        ray.vx = -ray.vx; 
                    }
                    
                    ray.x = nextEl.x;
                    ray.y = hitY;
                    bounces++;
                }
                rays.push(path);
            }
            return rays;
        }

        // --- DRAWING UTILS ---
        function drawElementGeometry(el) {
            const cx = originX + el.x;
            const cy = originY;
            const h = 160; 
            ctx.save();
            
            if (el.id === selectedId) {
                ctx.shadowBlur = 15; ctx.shadowColor = "var(--primary)";
            }

            if (el.type === 'lens') {
                ctx.strokeStyle = "#00e5ff"; 
                ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; 
                ctx.lineWidth = 3;
                ctx.beginPath();
                if (el.subtype === 'convex') {
                    ctx.moveTo(cx, cy - h/2);
                    ctx.quadraticCurveTo(cx + 25, cy, cx, cy + h/2);
                    ctx.quadraticCurveTo(cx - 25, cy, cx, cy - h/2);
                } else {
                    ctx.moveTo(cx - 15, cy - h/2); ctx.lineTo(cx + 15, cy - h/2);
                    ctx.quadraticCurveTo(cx - 5, cy, cx + 15, cy + h/2); ctx.lineTo(cx - 15, cy + h/2);
                    ctx.quadraticCurveTo(cx + 5, cy, cx - 15, cy - h/2);
                }
                ctx.fill(); ctx.stroke();
            } 
            else if (el.type === 'mirror') {
                ctx.lineWidth = 4;
                // Determine which side is reflecting based on the object's initial position
                // For a robust simulator, assume mirror always reflects towards the incident side (-x).
                // Simplification for UI: Mirror faces left.
                const curveDir = -1; 

                if (el.subtype === 'plane') {
                    ctx.strokeStyle = "#8de5ff";
                    ctx.beginPath(); ctx.moveTo(cx, cy - h/2); ctx.lineTo(cx, cy + h/2); ctx.stroke();
                    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    for(let y = cy - h/2 + 5; y < cy + h/2; y += 12) {
                        ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx + 10, y + 10); ctx.stroke();
                    }
                } 
                else {
                    ctx.strokeStyle = "#ff007f";
                    ctx.beginPath();
                    const bulge = el.subtype === 'concave' ? 30 * curveDir : -30 * curveDir;
                    ctx.moveTo(cx, cy - h/2);
                    ctx.quadraticCurveTo(cx + bulge, cy, cx, cy + h/2);
                    ctx.stroke();
                    
                    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    for(let t = 0.05; t < 1; t += 0.06) {
                        const px = cx + bulge * 2 * (1 - t) * t;
                        const py = (cy - h/2) * Math.pow(1 - t, 2) + cy * 2 * (1 - t) * t + (cy + h/2) * Math.pow(t, 2);
                        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 10, py + 10); ctx.stroke();
                    }
                }
            }
            ctx.restore();
            
            ctx.fillStyle = el.id === selectedId ? "var(--primary)" : "#a0aabf";
            ctx.font = "bold 13px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText(`E${el.id}`, cx, cy + h/2 + 25);
        }

        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            // Optical Axis
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(W, originY); ctx.stroke();
            ctx.setLineDash([]);

            // Draw Elements
            elements.forEach(drawElementGeometry);

            // Draw Object
            const ox = originX + object.x;
            const oy = originY;
            const tipY = originY - object.h;
            
            ctx.strokeStyle = "var(--gold)"; ctx.fillStyle = "var(--gold)"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, tipY); ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(ox, tipY); ctx.lineTo(ox - 6, tipY + 10); ctx.lineTo(ox + 6, tipY + 10); ctx.fill();
            ctx.font = "bold 14px 'Segoe UI'"; ctx.textAlign = "right"; ctx.fillText("O", ox - 10, tipY);

            // Trace & Draw Rays
            const paths = traceRays();
            
            paths.forEach((path) => {
                for(let i = 0; i < path.length - 1; i++) {
                    let p1 = path[i];
                    let p2 = path[i+1];
                    
                    // Main Ray
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(originX + p1.x, originY - p1.y);
                    ctx.lineTo(originX + p2.x, originY - p2.y);
                    ctx.stroke();

                    // Virtual Extension (Trace final segment backwards)
                    if (i === path.length - 2 && elements.length > 0) {
                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        ctx.strokeStyle = "rgba(0, 229, 255, 0.3)";
                        ctx.setLineDash([4, 4]);
                        ctx.beginPath();
                        ctx.moveTo(originX + p1.x, originY - p1.y);
                        ctx.lineTo(originX + (p1.x - dx * 10), originY - (p1.y - dy * 10));
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
            });

            // Find Final Image Intersection (Math Approximation for UI)
            if (paths.length >= 2 && elements.length > 0) {
                const path1 = paths[0]; const p1_0 = path1[path1.length-2]; const p1_1 = path1[path1.length-1];
                const path2 = paths[4]; const p2_0 = path2[path2.length-2]; const p2_1 = path2[path2.length-1];
                
                if (p1_0 && p2_0) {
                    const dx1 = p1_1.x - p1_0.x, dy1 = p1_1.y - p1_0.y;
                    const dx2 = p2_1.x - p2_0.x, dy2 = p2_1.y - p2_0.y;
                    const cross = dx1 * dy2 - dy1 * dx2;
                    
                    if (Math.abs(cross) > 0.001) {
                        const t = ((p2_0.x - p1_0.x) * dy2 - (p2_0.y - p1_0.y) * dx2) / cross;
                        const imgX = p1_0.x + t * dx1;
                        const imgY = p1_0.y + t * dy1;
                        
                        // Draw 'I' marker if it's within a reasonable screen space
                        if (Math.abs(imgX) < 3000 && Math.abs(imgY) < 1000) {
                            const ix = originX + imgX;
                            const iy = originY - imgY;
                            const isReal = (dx1 > 0 && imgX >= p1_0.x) || (dx1 < 0 && imgX <= p1_0.x);
                            const imgColor = isReal ? "var(--real-img)" : "var(--virtual-img)";
                            
                            ctx.strokeStyle = imgColor; ctx.fillStyle = imgColor; ctx.lineWidth = 3;
                            if (!isReal) ctx.setLineDash([4, 4]);
                            ctx.beginPath(); ctx.moveTo(ix, originY); ctx.lineTo(ix, iy); ctx.stroke();
                            ctx.setLineDash([]);
                            
                            ctx.beginPath();
                            const headDir = imgY > 0 ? 1 : -1;
                            ctx.moveTo(ix, iy);
                            ctx.lineTo(ix - 6, iy + (10 * headDir));
                            ctx.lineTo(ix + 6, iy + (10 * headDir));
                            ctx.fill();
                            ctx.fillText("I", ix - 10, iy);
                        }
                    }
                }
            }
        }
    </script>
</body>
