    <style>
        :root {
            --primary: #00e5ff;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --border: rgba(0, 229, 255, 0.2);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            overflow: hidden; display: flex; flex-direction: column;
        }

        .navbar {
            padding: 12px 20px; background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; position: relative;
        }

        .back-btn {
            color: var(--primary); text-decoration: none; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
        }

        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        .workspace {
            position: relative; flex-grow: 1; width: 100%; display: flex; overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; touch-action: none; cursor: crosshair;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%;
            background-image: url('../../logo.png'); background-size: contain;
            background-repeat: no-repeat; background-position: center;
            opacity: 0.08; pointer-events: none; z-index: 0;
        }

        .hud-panel {
            position: absolute; z-index: 50; background: var(--panel-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7); transition: all 0.3s ease;
        }

        .hud-header {
            padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }

        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .hud-content {
            padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px;
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }
        
        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        @media (min-width: 901px) {
            .hud-panel {
                top: 20px; left: 20px; width: 360px; max-height: calc(100% - 40px); border-radius: 16px;
            }
        }

        @media (max-width: 900px) {
            .hud-panel {
                bottom: 0; left: 0; width: 100%; height: 45vh;
                border-radius: 20px 20px 0 0; border-bottom: none; border-left: none; border-right: none;
            }
        }

        .section-title {
            font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold;
        }

        .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.8rem;
            cursor: pointer; transition: all 0.2s ease; text-align: center;
        }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.danger { border-color: rgba(255, 51, 102, 0.4); color: #ff3366; }
        .btn.danger:hover { background: rgba(255, 51, 102, 0.15); border-color: #ff3366; }

        .element-list { display: flex; flex-direction: column; gap: 6px; }
        .element-item {
            display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        .element-item:hover { border-color: rgba(255,255,255,0.3); }
        .element-item.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
        .element-item small { color: var(--text-muted); font-family: monospace; }

        .control-group { margin-bottom: 10px; }
        .control-group label {
            display: flex; justify-content: space-between; color: var(--text-muted);
            font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px;
        }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        .editor-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.2s ease-out;
        }

        .legend {
            display: flex; flex-wrap: wrap; gap: 10px; padding: 10px;
            font-size: 0.75rem; color: var(--text-main); border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2); border-radius: 6px;
        }
        .leg { display: flex; align-items: center; gap: 6px; font-weight: bold; }
        .leg-dot { width: 12px; height: 12px; border-radius: 50%; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 09</a>
        <h1>Lens & Mirror Combinations</h1>
    </nav>

    <div class="workspace">
        <div class="watermark"></div>
        <canvas id="comboCanvas"></canvas>

        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>System Controls</h2>
                <button class="btn" style="padding: 4px 8px; border: none; background: transparent; color: var(--text-muted);" onclick="resetScene()">↺ RESET</button>
            </div>
            
            <div class="hud-content">
                <div style="font-size: 0.8rem; color: var(--text-muted);">
                    <strong>Hint:</strong> Drag the lenses and mirrors directly on the canvas to move them in any direction. The Point Object is fixed.
                </div>

                <div>
                    <div class="section-title">Bring Optical Element</div>
                    <div class="toolbar">
                        <button class="btn" onclick="addElement('lens', 'convex')">+ Convex Lens</button>
                        <button class="btn" onclick="addElement('lens', 'concave')">+ Concave Lens</button>
                        <button class="btn" onclick="addElement('mirror', 'concave')">+ Concave Mirror</button>
                        <button class="btn" onclick="addElement('mirror', 'convex')">+ Convex Mirror</button>
                        <button class="btn" onclick="addElement('mirror', 'plane')" style="grid-column: span 2;">+ Plane Mirror</button>
                    </div>
                </div>

                <div>
                    <div class="section-title">Optical Path Sequence</div>
                    <div class="element-list" id="elementList"></div>
                </div>

                <div id="editorPanel" class="editor-panel" style="display: none;">
                    <div class="section-title" id="editorTitle" style="color: var(--text-main);">Edit Element</div>
                    <div class="control-group">
                        <label>Position X <span id="elXVal">0 px</span></label>
                        <input id="elX" type="range" min="-600" max="600" step="1" value="0">
                    </div>
                    <div class="control-group">
                        <label>Position Y <span id="elYVal">0 px</span></label>
                        <input id="elY" type="range" min="-300" max="300" step="1" value="0">
                    </div>
                    <div class="control-group">
                        <label>Rotation Angle (θ) <span id="elAngleVal">0°</span></label>
                        <input id="elAngle" type="range" min="-180" max="180" step="1" value="0">
                    </div>
                    <div class="control-group" id="focalGroup">
                        <label>Focal Length (f) <span id="elFVal">100 px</span></label>
                        <input id="elF" type="range" min="20" max="400" step="1" value="100">
                    </div>
                    <button class="btn danger" style="width: 100%; margin-top: 5px;" onclick="deleteSelected()">Remove Element</button>
                </div>

                <div>
                    <div class="section-title">Point Images Map</div>
                    <div class="legend" id="legendBox"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("comboCanvas");
        const ctx = canvas.getContext("2d");
        
        const elXSlider = document.getElementById("elX");
        const elYSlider = document.getElementById("elY");
        const elAngleSlider = document.getElementById("elAngle");
        const elFSlider = document.getElementById("elF");
        const elementListUI = document.getElementById("elementList");
        const editorPanel = document.getElementById("editorPanel");
        const hudPanel = document.getElementById("hudPanel");
        const legendBox = document.getElementById("legendBox");
        
        let W = 0, H = 0, originX = 0, originY = 0;
        let initialized = false;

        let isDragging = false;
        let dragTarget = null; 
        let dragOffsetX = 0, dragOffsetY = 0;

        const rayColors = ['#00e5ff', '#ff007f', '#00ffaa', '#ffd166', '#c7a6ff', '#ff5e00', '#ff00ff'];
        
        // Point object fixed on the left to maximize screen space
        let object = { x: -300, y: 0 };
        let elements = [];
        let selectedId = null;
        let nextId = 1;

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W;
                canvas.height = H;
                
                if (W > 900) {
                    originX = 420 + (W - 420) / 2;
                    originY = H / 2;
                } else {
                    const hudHeight = hudPanel.offsetHeight || (H * 0.45);
                    originX = W / 2; 
                    originY = (H - hudHeight) / 2;
                }

                if (!initialized && W > 10 && H > 10) {
                    initialized = true;
                    resetScene();
                } else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));

        function resetScene() {
            elements = [
                { id: nextId++, type: 'lens', subtype: 'convex', x: -50, y: 0, f: 120, angle: 0, color: rayColors[0], aperture: 200 },
                { id: nextId++, type: 'mirror', subtype: 'concave', x: 250, y: 0, f: 150, angle: 0, color: rayColors[1], aperture: 200 }
            ];
            selectedId = elements[0].id;
            updateUI();
            draw();
        }

        function updateUI() {
            elementListUI.innerHTML = "";
            if(elements.length === 0) {
                elementListUI.innerHTML = "<div style='color:var(--text-muted); font-size:0.8rem; text-align:center; padding: 10px;'>No elements in path.</div>";
            }
            
            elements.forEach(el => {
                const div = document.createElement("div");
                div.className = "element-item" + (el.id === selectedId ? " active" : "");
                const name = el.subtype.charAt(0).toUpperCase() + el.subtype.slice(1) + " " + el.type.charAt(0).toUpperCase() + el.type.slice(1);
                div.innerHTML = `<span style="color:${el.color}">E${el.id}: ${name}</span> <small>x:${Math.round(el.x)}, y:${Math.round(el.y)}</small>`;
                div.onclick = () => selectElement(el.id);
                elementListUI.appendChild(div);
            });

            const sel = elements.find(e => e.id === selectedId);
            if (sel) {
                editorPanel.style.display = "block";
                document.getElementById("editorTitle").textContent = `Edit E${sel.id}`;
                document.getElementById("editorTitle").style.color = sel.color;
                
                elXSlider.value = sel.x; elYSlider.value = sel.y; elAngleSlider.value = sel.angle;
                document.getElementById("elXVal").textContent = `${Math.round(sel.x)} px`;
                document.getElementById("elYVal").textContent = `${Math.round(sel.y)} px`;
                document.getElementById("elAngleVal").textContent = `${Math.round(sel.angle)}°`;
                
                if (sel.subtype === 'plane') {
                    document.getElementById("focalGroup").style.display = "none";
                } else {
                    document.getElementById("focalGroup").style.display = "flex";
                    elFSlider.value = sel.f;
                    document.getElementById("elFVal").textContent = `${Math.round(sel.f)} px`;
                }
            } else {
                editorPanel.style.display = "none";
            }
        }

        function addElement(type, subtype) {
            elements.push({ 
                id: nextId++, type, subtype, 
                x: 100, y: 0, f: 120, angle: 0, aperture: 200,
                color: rayColors[(nextId - 1) % rayColors.length] 
            });
            selectedId = nextId - 1;
            updateUI(); draw();
        }

        function selectElement(id) { selectedId = id; updateUI(); draw(); }
        function deleteSelected() { elements = elements.filter(e => e.id !== selectedId); selectedId = null; updateUI(); draw(); }

        elXSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.x = parseFloat(e.target.value); updateUI(); draw(); }});
        elYSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.y = parseFloat(e.target.value); updateUI(); draw(); }});
        elAngleSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.angle = parseFloat(e.target.value); updateUI(); draw(); }});
        elFSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.f = parseFloat(e.target.value); updateUI(); draw(); }});

        // --- MATH HELPERS ---
        function norm(v) { let l = Math.hypot(v.x, v.y) || 1; return { x: v.x/l, y: v.y/l }; }
        function dot(a, b) { return a.x*b.x + a.y*b.y; }

        function globalToLocal(p, el) {
            let dx = p.x - el.x, dy = p.y - el.y;
            let a = -el.angle * Math.PI / 180;
            return { x: dx * Math.cos(a) - dy * Math.sin(a), y: dx * Math.sin(a) + dy * Math.cos(a) };
        }
        function globalToLocalDir(d, el) {
            let a = -el.angle * Math.PI / 180;
            return { x: d.x * Math.cos(a) - d.y * Math.sin(a), y: d.x * Math.sin(a) + d.y * Math.cos(a) };
        }
        function localToGlobal(p, el) {
            let a = el.angle * Math.PI / 180;
            return { x: el.x + p.x * Math.cos(a) - p.y * Math.sin(a), y: el.y + p.x * Math.sin(a) + p.y * Math.cos(a) };
        }
        function localToGlobalDir(d, el) {
            let a = el.angle * Math.PI / 180;
            return { x: d.x * Math.cos(a) - d.y * Math.sin(a), y: d.x * Math.sin(a) + d.y * Math.cos(a) };
        }

        // --- EXACT PARABOLIC INTERSECTION ---
        function intersect(ray, el) {
            let p_loc = globalToLocal(ray.p, el);
            let d_loc = globalToLocalDir(ray.d, el);

            if (el.type === 'lens' || el.subtype === 'plane') {
                if (Math.abs(d_loc.x) < 1e-6) return null;
                let t = -p_loc.x / d_loc.x;
                if (t <= 1e-4) return null;
                let y_hit = p_loc.y + t * d_loc.y;
                if (Math.abs(y_hit) > el.aperture / 2) return null;

                if (el.type === 'lens') {
                    let Power = (el.subtype === 'convex' ? 1 : -1) / el.f;
                    let newAngle = Math.atan2(d_loc.y, d_loc.x) - y_hit * Power * Math.sign(d_loc.x);
                    let d_new = { x: Math.cos(newAngle), y: Math.sin(newAngle) };
                    return { t, p_loc: {x: 0, y: y_hit}, d_loc: d_new, el };
                } else {
                    return { t, p_loc: {x: 0, y: y_hit}, d_loc: {x: -d_loc.x, y: d_loc.y}, el };
                }
            } 
            else if (el.type === 'mirror') {
                // Parabola: x = a * y^2. Concave reflects towards +x when a > 0.
                let a = (el.subtype === 'concave' ? 1 : -1) / (4 * el.f);
                let A = a * d_loc.y * d_loc.y;
                let B = 2 * a * p_loc.y * d_loc.y - d_loc.x;
                let C = a * p_loc.y * p_loc.y - p_loc.x;
                
                let t = -1;
                if (Math.abs(A) < 1e-7) {
                    if (Math.abs(B) > 1e-7) t = -C / B;
                } else {
                    let disc = B*B - 4*A*C;
                    if (disc >= 0) {
                        let t1 = (-B - Math.sqrt(disc)) / (2*A);
                        let t2 = (-B + Math.sqrt(disc)) / (2*A);
                        if (t1 > 1e-4 && t2 > 1e-4) t = Math.min(t1, t2);
                        else if (t1 > 1e-4) t = t1;
                        else if (t2 > 1e-4) t = t2;
                    }
                }
                
                if (t <= 1e-4) return null;
                let y_hit = p_loc.y + t * d_loc.y;
                if (Math.abs(y_hit) > el.aperture / 2) return null;
                
                let x_hit = a * y_hit * y_hit;
                let N = norm({ x: 1, y: -2 * a * y_hit });
                
                // Normal should face against ray direction
                if (dot(d_loc, N) > 0) { N.x = -N.x; N.y = -N.y; }
                
                let dot_dN = dot(d_loc, N);
                let d_new = { x: d_loc.x - 2 * dot_dN * N.x, y: d_loc.y - 2 * dot_dN * N.y };
                
                return { t, p_loc: {x: x_hit, y: y_hit}, d_loc: d_new, el };
            }
            return null;
        }

        // Find intersection of two lines (to locate point images)
        function findIntersection(p1, d1, p2, d2) {
            let cross = d1.x * d2.y - d1.y * d2.x;
            if (Math.abs(cross) < 1e-6) return null;
            let t1 = ((p2.x - p1.x) * d2.y - (p2.y - p1.y) * d2.x) / cross;
            return { p: { x: p1.x + t1*d1.x, y: p1.y + t1*d1.y }, t1 };
        }

        // --- INTERACTION ---
        function getEventX(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
            else if (e.changedTouches && e.changedTouches.length > 0) clientX = e.changedTouches[0].clientX;
            return (clientX - rect.left) * (canvas.width / rect.width);
        }

        function getEventY(e) {
            const rect = canvas.getBoundingClientRect();
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) clientY = e.touches[0].clientY;
            else if (e.changedTouches && e.changedTouches.length > 0) clientY = e.changedTouches[0].clientY;
            return (clientY - rect.top) * (canvas.height / rect.height);
        }

        function handleInputStart(e) {
            if (e.target.closest('.hud-panel')) return; 
            const cx = getEventX(e); const cy = getEventY(e);
            const simX = cx - originX; const simY = originY - cy;

            for (let i = elements.length - 1; i >= 0; i--) {
                if (Math.abs(simX - elements[i].x) < 40 && Math.abs(simY - elements[i].y) < 100) {
                    isDragging = true; dragTarget = elements[i].id; selectedId = elements[i].id;
                    dragOffsetX = elements[i].x - simX; dragOffsetY = elements[i].y - simY;
                    updateUI(); draw();
                    if(e.cancelable) e.preventDefault();
                    return;
                }
            }
        }

        function handleInputMove(e) {
            if (!isDragging || !dragTarget) return;
            if(e.cancelable) e.preventDefault();
            
            const cx = getEventX(e); const cy = getEventY(e);
            const simX = cx - originX; const simY = originY - cy;
            
            let newX = simX + dragOffsetX; let newY = simY + dragOffsetY;

            const sel = elements.find(el => el.id === dragTarget);
            if (sel) {
                sel.x = newX; sel.y = newY;
                elXSlider.value = newX; elYSlider.value = newY;
            }
            updateUI(); draw();
        }

        function handleInputEnd() { isDragging = false; dragTarget = null; }

        canvas.addEventListener("mousedown", handleInputStart);
        canvas.addEventListener("mousemove", handleInputMove);
        window.addEventListener("mouseup", handleInputEnd);
        canvas.addEventListener("touchstart", handleInputStart, {passive: false});
        canvas.addEventListener("touchmove", handleInputMove, {passive: false});
        window.addEventListener("touchend", handleInputEnd);

        // --- DRAWING UTILS ---
        function mapX(x) { return originX + x; }
        function mapY(y) { return originY - y; }

        function drawRaySegment(p1, p2, color, dashed = false, showArrow = true) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            
            if (dashed) { ctx.setLineDash([4, 4]); ctx.globalAlpha = 0.4; }
            else { ctx.globalAlpha = 0.8; }
            
            ctx.beginPath();
            ctx.moveTo(mapX(p1.x), mapY(p1.y));
            ctx.lineTo(mapX(p2.x), mapY(p2.y));
            ctx.stroke();
            ctx.setLineDash([]);
            
            if (showArrow) {
                const dx = p2.x - p1.x; const dy = -(p2.y - p1.y); // Canvas Y is inverted
                const len = Math.hypot(dx, dy);
                if (len > 30) {
                    const angle = Math.atan2(dy, dx);
                    // Draw arrow at a guaranteed visible distance (max 150px from start)
                    const arrowDist = Math.min(len * 0.5, 150);
                    const mx = mapX(p1.x) + (dx / len) * arrowDist;
                    const my = mapY(p1.y) + (dy / len) * arrowDist;

                    ctx.beginPath(); ctx.fillStyle = color;
                    ctx.moveTo(mx, my);
                    ctx.lineTo(mx - 10 * Math.cos(angle - 0.4), my - 10 * Math.sin(angle - 0.4));
                    ctx.lineTo(mx - 10 * Math.cos(angle + 0.4), my - 10 * Math.sin(angle + 0.4));
                    ctx.closePath(); ctx.fill();
                }
            }
            ctx.restore();
        }

        function drawElementGeometry(el) {
            const cx = mapX(el.x);
            const cy = mapY(el.y);
            const h = el.aperture; 
            ctx.save();
            
            ctx.translate(cx, cy);
            ctx.rotate(-el.angle * Math.PI / 180); // Invert for canvas

            if (el.id === selectedId) {
                ctx.shadowBlur = 20; ctx.shadowColor = el.color;
            }

            if (el.type === 'lens') {
                ctx.strokeStyle = el.color; ctx.fillStyle = el.color.replace(')', ', 0.15)').replace('rgb', 'rgba'); 
                ctx.lineWidth = 3;
                ctx.beginPath();
                if (el.subtype === 'convex') {
                    ctx.moveTo(0, -h/2);
                    ctx.quadraticCurveTo(25, 0, 0, h/2);
                    ctx.quadraticCurveTo(-25, 0, 0, -h/2);
                } else {
                    ctx.moveTo(-15, -h/2); ctx.lineTo(15, -h/2);
                    ctx.quadraticCurveTo(-5, 0, 15, h/2); ctx.lineTo(-15, h/2);
                    ctx.quadraticCurveTo(5, 0, -15, -h/2);
                }
                ctx.fill(); ctx.stroke();
            } 
            else if (el.type === 'mirror') {
                ctx.strokeStyle = el.color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                if (el.subtype === 'plane') {
                    ctx.moveTo(0, -h/2); ctx.lineTo(0, h/2); ctx.stroke();
                    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    for(let y = -h/2 + 5; y < h/2; y += 10) {
                        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(8, y + 8); ctx.stroke();
                    }
                } 
                else {
                    let a = (el.subtype === 'concave' ? 1 : -1) / (4 * el.f);
                    for(let y = -h/2; y <= h/2; y += 5) {
                        if(y === -h/2) ctx.moveTo(a*y*y, y); else ctx.lineTo(a*y*y, y);
                    }
                    ctx.stroke();
                    
                    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    for(let y = -h/2 + 10; y < h/2; y += 12) {
                        let px = a*y*y;
                        ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px + 8, y + 8); ctx.stroke();
                    }
                }
            }
            ctx.restore();
            
            ctx.fillStyle = el.id === selectedId ? el.color : "#a0aabf";
            ctx.font = "bold 13px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText(`E${el.id}`, cx, cy + h/2 + 25);
        }

        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(W, originY); ctx.stroke();
            ctx.setLineDash([]);

            elements.forEach(drawElementGeometry);

            // Expand ray count for thicker, clearly visible fans
            let activeRays = [];
            for (let a = -0.16; a <= 0.16; a += 0.04) {
                activeRays.push({
                    p: {x: object.x, y: object.y},
                    d: {x: Math.cos(a), y: Math.sin(a)},
                    color: 'rgba(255, 255, 255, 0.4)', // Faint white for initial rays
                    path: [{x: object.x, y: object.y}],
                    seq: []
                });
            }

            let bounces = 0;
            let images = [];
            let allLines = [];
            
            // RAY TRACING ENGINE
            while (bounces < 10 && activeRays.length > 0) {
                let nextRays = [];
                let seqGroups = {};
                
                for (let ray of activeRays) {
                    let bestHit = null;
                    for (let el of elements) {
                        let hit = intersect(ray, el);
                        if (hit && (!bestHit || hit.t < bestHit.t)) bestHit = hit;
                    }
                    
                    if (bestHit) {
                        let hitP = localToGlobal(bestHit.p_loc, bestHit.el);
                        let hitD = localToGlobalDir(bestHit.d_loc, bestHit.el);
                        
                        allLines.push({ p1: ray.p, p2: hitP, color: ray.color });
                        
                        let newSeq = [...ray.seq, bestHit.el.id];
                        let seqKey = newSeq.join(',');
                        let newRay = { p: hitP, d: hitD, color: bestHit.el.color, path: [...ray.path, hitP], seq: newSeq };
                        nextRays.push(newRay);
                        
                        if (!seqGroups[seqKey]) seqGroups[seqKey] = [];
                        seqGroups[seqKey].push(newRay);
                    } else {
                        // Ray shoots off to infinity
                        let endP = { x: ray.p.x + ray.d.x * 3000, y: ray.p.y + ray.d.y * 3000 };
                        allLines.push({ p1: ray.p, p2: endP, color: ray.color });
                    }
                }
                
                // Extract Point Images by intersecting outermost rays in each sequence group
                for (let key in seqGroups) {
                    let group = seqGroups[key];
                    if (group.length >= 2) {
                        let r1 = group[0]; let r2 = group[group.length - 1];
                        let img = findIntersection(r1.p, r1.d, r2.p, r2.d);
                        if (img && Math.abs(img.t1) < 5000) {
                            images.push({ p: img.p, isReal: img.t1 > 0, color: r1.color, label: `I${key.split(',').length}`, seq: key });
                            // If Virtual, save dashed lines backwards
                            if (img.t1 < 0) {
                                allLines.push({ p1: r1.p, p2: img.p, color: r1.color, dashed: true });
                                allLines.push({ p2: r2.p, p2: img.p, color: r2.color, dashed: true });
                            }
                        }
                    }
                }
                activeRays = nextRays;
                bounces++;
            }

            // Draw all computed lines
            allLines.forEach(line => {
                if (line.p1 && line.p2) drawRaySegment(line.p1, line.p2, line.color, line.dashed, !line.dashed);
            });

            // Draw Object
            const ox = mapX(object.x), oy = mapY(object.y);
            ctx.save();
            ctx.shadowBlur = 15; ctx.shadowColor = "var(--text-main)";
            ctx.fillStyle = "var(--text-main)";
            ctx.beginPath(); ctx.arc(ox, oy, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "center";
            ctx.fillText("O", ox, oy + 22);
            ctx.restore();

            // Legend & Image Points
            let legendHTML = `<div class="leg"><div class="leg-dot" style="background: var(--text-main); box-shadow: 0 0 8px var(--text-main);"></div> Object (O)</div>`;
            images.forEach((img) => {
                if (img.p.x > -W && img.p.x < W*2) {
                    const ix = mapX(img.p.x), iy = mapY(img.p.y);
                    ctx.save();
                    ctx.shadowBlur = 15; ctx.shadowColor = img.color; ctx.fillStyle = img.color;
                    ctx.beginPath(); ctx.arc(ix, iy, 5, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
                    ctx.font = "bold 15px 'Segoe UI'"; ctx.fillText(img.label, ix, iy + 22);
                    ctx.font = "11px 'Segoe UI'"; ctx.fillStyle = "var(--text-muted)";
                    ctx.fillText(`(via E${img.seq.split(',').join('→E')})`, ix, iy + 36);
                    ctx.restore();
                    legendHTML += `<div class="leg"><div class="leg-dot" style="background: ${img.color}; box-shadow: 0 0 8px ${img.color};"></div> ${img.label} <span style="opacity:0.6; font-weight:normal;">(E${img.seq.split(',').join('→E')})</span></div>`;
                }
            });
            legendBox.innerHTML = legendHTML;
        }

        updateUI();
    </script>
</body>
</html>
