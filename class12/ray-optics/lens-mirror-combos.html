<html lang="en">

    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(7, 11, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --gold: #ffd166;
            --real-img: #00ffaa;
            --virtual-img: #c7a6ff;
            --border: rgba(0, 229, 255, 0.2);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            overflow: hidden; display: flex; flex-direction: column;
        }

        .navbar {
            padding: 12px 20px; background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; position: relative;
        }

        .back-btn {
            color: var(--primary); text-decoration: none; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
        }

        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        .workspace {
            position: relative; flex-grow: 1; width: 100%; display: flex; overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 80%);
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; touch-action: none; cursor: crosshair;
        }

        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%;
            background-image: url('../../logo.png'); background-size: contain;
            background-repeat: no-repeat; background-position: center;
            opacity: 0.08; pointer-events: none; z-index: 0;
        }

        .hud-panel {
            position: absolute; z-index: 50; background: var(--panel-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7); transition: all 0.3s ease;
        }

        .hud-header {
            padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }

        .hud-header h2 { margin: 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        .hud-content {
            padding: 16px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px;
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }
        
        .hud-content::-webkit-scrollbar { width: 4px; }
        .hud-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        @media (min-width: 901px) {
            .hud-panel {
                top: 20px; left: 20px; width: 360px; max-height: calc(100% - 40px); border-radius: 16px;
            }
        }

        @media (max-width: 900px) {
            .hud-panel {
                bottom: 0; left: 0; width: 100%; height: 45vh;
                border-radius: 20px 20px 0 0; border-bottom: none; border-left: none; border-right: none;
            }
        }

        .section-title {
            font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold;
        }

        .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main); padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.8rem;
            cursor: pointer; transition: all 0.2s ease; text-align: center;
        }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .btn.danger { border-color: rgba(255, 51, 102, 0.4); color: #ff3366; }
        .btn.danger:hover { background: rgba(255, 51, 102, 0.15); border-color: #ff3366; }

        .element-list { display: flex; flex-direction: column; gap: 6px; }
        .element-item {
            display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
        }
        .element-item:hover { border-color: rgba(255,255,255,0.3); }
        .element-item.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
        .element-item small { color: var(--text-muted); font-family: monospace; }

        .control-group { margin-bottom: 10px; }
        .control-group label {
            display: flex; justify-content: space-between; color: var(--text-muted);
            font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px;
        }
        .control-group span { color: var(--text-main); font-family: monospace; font-size: 0.85rem;}
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--primary); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

        .editor-panel {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.2s ease-out;
        }

        .legend {
            display: flex; flex-wrap: wrap; gap: 10px; padding: 10px;
            font-size: 0.75rem; color: var(--text-main); border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2); border-radius: 6px;
        }
        .leg { display: flex; align-items: center; gap: 6px; }
        .leg-dot { width: 12px; height: 12px; border-radius: 50%; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 09</a>
        <h1>Lens & Mirror Combinations</h1>
    </nav>

    <div class="workspace">
        <!-- Canvas Layer -->
        <div class="watermark"></div>
        <canvas id="comboCanvas"></canvas>

        <!-- Floating HUD Panel -->
        <div class="hud-panel" id="hudPanel">
            <div class="hud-header">
                <h2>System Controls</h2>
                <button class="btn" style="padding: 4px 8px; border: none; background: transparent; color: var(--text-muted);" onclick="resetScene()">↺ RESET</button>
            </div>
            
            <div class="hud-content">
                <div>
                    <div class="section-title">Point Object Settings</div>
                    <div class="control-group">
                        <label>Position (X) <span id="objXVal">-150 px</span></label>
                        <input id="objX" type="range" min="-600" max="600" step="1" value="-150">
                    </div>
                    <div class="control-group">
                        <label>Position (Y) <span id="objYVal">0 px</span></label>
                        <input id="objY" type="range" min="-300" max="300" step="1" value="0">
                    </div>
                </div>

                <div>
                    <div class="section-title">Bring Optical Element</div>
                    <div class="toolbar">
                        <button class="btn" onclick="addElement('lens', 'convex')">+ Convex Lens</button>
                        <button class="btn" onclick="addElement('lens', 'concave')">+ Concave Lens</button>
                        <button class="btn" onclick="addElement('mirror', 'concave')">+ Concave Mirror</button>
                        <button class="btn" onclick="addElement('mirror', 'convex')">+ Convex Mirror</button>
                        <button class="btn" onclick="addElement('mirror', 'plane')" style="grid-column: span 2;">+ Plane Mirror</button>
                    </div>
                </div>

                <div>
                    <div class="section-title">Optical Path Sequence</div>
                    <div class="element-list" id="elementList"></div>
                </div>

                <div id="editorPanel" class="editor-panel" style="display: none;">
                    <div class="section-title" id="editorTitle" style="color: var(--text-main);">Edit Element</div>
                    <div class="control-group">
                        <label>Position (X) <span id="elXVal">0 px</span></label>
                        <input id="elX" type="range" min="-600" max="600" step="1" value="0">
                    </div>
                    <div class="control-group">
                        <label>Position (Y) <span id="elYVal">0 px</span></label>
                        <input id="elY" type="range" min="-300" max="300" step="1" value="0">
                    </div>
                    <div class="control-group" id="focalGroup">
                        <label>Focal Length (f) <span id="elFVal">100 px</span></label>
                        <input id="elF" type="range" min="20" max="400" step="1" value="100">
                    </div>
                    <button class="btn danger" style="width: 100%; margin-top: 5px;" onclick="deleteSelected()">Remove Element</button>
                </div>

                <div>
                    <div class="section-title">Ray Tracing Map</div>
                    <div class="legend" id="legendBox">
                        <div class="leg"><div class="leg-dot" style="background: var(--gold); box-shadow: 0 0 8px var(--gold);"></div> Point Object (O)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("comboCanvas");
        const ctx = canvas.getContext("2d");
        
        // UI Elements
        const objXSlider = document.getElementById("objX");
        const objYSlider = document.getElementById("objY");
        const elXSlider = document.getElementById("elX");
        const elYSlider = document.getElementById("elY");
        const elFSlider = document.getElementById("elF");
        const elementListUI = document.getElementById("elementList");
        const editorPanel = document.getElementById("editorPanel");
        const hudPanel = document.getElementById("hudPanel");
        const legendBox = document.getElementById("legendBox");
        
        let W = 0, H = 0, originX = 0, originY = 0;
        let initialized = false;

        // Interactive State
        let isDragging = false;
        let dragTarget = null; 
        let dragOffsetX = 0, dragOffsetY = 0;

        const rayColors = ['#00e5ff', '#ff007f', '#00ffaa', '#ffd166', '#c7a6ff', '#ff5e00'];
        let object = { x: -200, y: 0 };
        let elements = [];
        let selectedId = null;
        let nextId = 1;

        // --- RESIZE OBSERVER & DYNAMIC ORIGIN ---
        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                W = Math.floor(entry.contentRect.width);
                H = Math.floor(entry.contentRect.height);
                canvas.width = W;
                canvas.height = H;
                
                if (W > 900) {
                    originX = 420 + (W - 420) / 2;
                    originY = H / 2;
                } else {
                    const hudHeight = hudPanel.offsetHeight || (H * 0.45);
                    originX = W / 2; 
                    originY = (H - hudHeight) / 2;
                }

                if (!initialized && W > 10 && H > 10) {
                    initialized = true;
                    resetScene();
                } else if (initialized) draw();
            }
        });
        resizeObserver.observe(document.querySelector('.workspace'));

        function resetScene() {
            object = { x: -150, y: 0 };
            elements = [
                { id: nextId++, type: 'lens', subtype: 'convex', x: 50, y: 0, f: 120 },
                { id: nextId++, type: 'mirror', subtype: 'concave', x: 300, y: 0, f: 150 }
            ];
            selectedId = elements[0].id;
            updateUI();
            draw();
        }

        // --- HUD UI LOGIC ---
        function updateUI() {
            document.getElementById("objXVal").textContent = `${Math.round(object.x)} px`;
            document.getElementById("objYVal").textContent = `${Math.round(object.y)} px`;
            objXSlider.value = object.x;
            objYSlider.value = object.y;
            
            const sorted = [...elements].sort((a,b) => a.x - b.x);
            elementListUI.innerHTML = "";
            if(sorted.length === 0) {
                elementListUI.innerHTML = "<div style='color:var(--text-muted); font-size:0.8rem; text-align:center; padding: 10px;'>No elements in path.</div>";
            }
            
            sorted.forEach(el => {
                const div = document.createElement("div");
                div.className = "element-item" + (el.id === selectedId ? " active" : "");
                const name = el.subtype.charAt(0).toUpperCase() + el.subtype.slice(1) + " " + el.type.charAt(0).toUpperCase() + el.type.slice(1);
                div.innerHTML = `<span>E${el.id}: ${name}</span> <small>x: ${Math.round(el.x)}, y: ${Math.round(el.y)}</small>`;
                div.onclick = () => selectElement(el.id);
                elementListUI.appendChild(div);
            });

            const sel = elements.find(e => e.id === selectedId);
            if (sel) {
                editorPanel.style.display = "block";
                document.getElementById("editorTitle").textContent = `Edit E${sel.id} (${sel.subtype.charAt(0).toUpperCase() + sel.subtype.slice(1)} ${sel.type.charAt(0).toUpperCase() + sel.type.slice(1)})`;
                
                elXSlider.value = sel.x; elYSlider.value = sel.y;
                document.getElementById("elXVal").textContent = `${Math.round(sel.x)} px`;
                document.getElementById("elYVal").textContent = `${Math.round(sel.y)} px`;
                
                if (sel.subtype === 'plane') {
                    document.getElementById("focalGroup").style.display = "none";
                } else {
                    document.getElementById("focalGroup").style.display = "flex";
                    elFSlider.value = sel.f;
                    document.getElementById("elFVal").textContent = `${Math.round(sel.f)} px`;
                }
            } else {
                editorPanel.style.display = "none";
            }
        }

        function addElement(type, subtype) {
            elements.push({ id: nextId++, type, subtype, x: object.x + 150, y: 0, f: 100 });
            selectedId = nextId - 1;
            updateUI(); draw();
        }

        function selectElement(id) { selectedId = id; updateUI(); draw(); }
        function deleteSelected() { elements = elements.filter(e => e.id !== selectedId); selectedId = null; updateUI(); draw(); }

        objXSlider.addEventListener("input", (e) => { object.x = parseFloat(e.target.value); updateUI(); draw(); });
        objYSlider.addEventListener("input", (e) => { object.y = parseFloat(e.target.value); updateUI(); draw(); });
        elXSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.x = parseFloat(e.target.value); updateUI(); draw(); }});
        elYSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.y = parseFloat(e.target.value); updateUI(); draw(); }});
        elFSlider.addEventListener("input", (e) => { const sel = elements.find(el => el.id === selectedId); if(sel) { sel.f = parseFloat(e.target.value); updateUI(); draw(); }});

        // --- INTERACTION / DRAGGING ---
        function getEventX(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
            else if (e.changedTouches && e.changedTouches.length > 0) clientX = e.changedTouches[0].clientX;
            return (clientX - rect.left) * (canvas.width / rect.width);
        }

        function getEventY(e) {
            const rect = canvas.getBoundingClientRect();
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) clientY = e.touches[0].clientY;
            else if (e.changedTouches && e.changedTouches.length > 0) clientY = e.changedTouches[0].clientY;
            return (clientY - rect.top) * (canvas.height / rect.height);
        }

        function handleInputStart(e) {
            if (e.target.closest('.hud-panel')) return; 
            const cx = getEventX(e); const cy = getEventY(e);
            const simX = cx - originX; const simY = originY - cy;

            if (Math.hypot(simX - object.x, simY - object.y) < 30) {
                isDragging = true; dragTarget = 'object'; 
                dragOffsetX = object.x - simX; dragOffsetY = object.y - simY;
                if(e.cancelable) e.preventDefault();
                return;
            }

            for (let i = elements.length - 1; i >= 0; i--) {
                if (Math.abs(simX - elements[i].x) < 30 && Math.abs(simY - elements[i].y) < 100) {
                    isDragging = true; dragTarget = elements[i].id; selectedId = elements[i].id;
                    dragOffsetX = elements[i].x - simX; dragOffsetY = elements[i].y - simY;
                    updateUI(); draw();
                    if(e.cancelable) e.preventDefault();
                    return;
                }
            }
        }

        function handleInputMove(e) {
            if (!isDragging || !dragTarget) return;
            if(e.cancelable) e.preventDefault();
            
            const cx = getEventX(e); const cy = getEventY(e);
            const simX = cx - originX; const simY = originY - cy;
            
            let newX = simX + dragOffsetX; let newY = simY + dragOffsetY;

            if (dragTarget === 'object') {
                object.x = newX; object.y = newY;
                objXSlider.value = newX; objYSlider.value = newY;
            } else {
                const sel = elements.find(el => el.id === dragTarget);
                if (sel) {
                    sel.x = newX; sel.y = newY;
                    elXSlider.value = newX; elYSlider.value = newY;
                }
            }
            updateUI(); draw();
        }

        function handleInputEnd() { isDragging = false; dragTarget = null; }

        canvas.addEventListener("mousedown", handleInputStart);
        canvas.addEventListener("mousemove", handleInputMove);
        window.addEventListener("mouseup", handleInputEnd);

        canvas.addEventListener("touchstart", handleInputStart, {passive: false});
        canvas.addEventListener("touchmove", handleInputMove, {passive: false});
        window.addEventListener("touchend", handleInputEnd);

        // --- PARAXIAL RAY TRACING ENGINE ---
        function traceSystem() {
            // Increased to 9 rays for clearer visual grouping
            const slopes = [-0.16, -0.12, -0.08, -0.04, 0, 0.04, 0.08, 0.12, 0.16];
            let allPaths = [];
            let imageRays = {}; // Group rays by sequence of hits to calculate images
            
            for (let i = 0; i < slopes.length; i++) {
                let r = { x: object.x, y: object.y, dx: 1, dy: slopes[i] };
                let path = [{ x: r.x, y: r.y }];
                let bounces = 0;
                let active = true;
                let hitSequence = [];
                
                while (active && bounces < 10) {
                    let nextEl = null; let minDist = Infinity;
                    
                    // Look for the next element the ray will hit
                    for (let el of elements) {
                        let d = (el.x - r.x) * r.dx;
                        if (d > 0.001 && d < minDist) { 
                            let hitY = r.y + d * r.dy / r.dx;
                            // Strictly enforce Aperture Check (prevents rays from passing through mirrors)
                            if (Math.abs(hitY - el.y) <= 100) {
                                minDist = d; nextEl = el; 
                            }
                        }
                    }
                    
                    if (!nextEl) {
                        let endX = r.x + r.dx * 3000;
                        let endY = r.y + r.dy * 3000;
                        path.push({ x: endX, y: endY });
                        
                        // Register this ray for image formation calculation
                        const seqStr = hitSequence.join('→');
                        if (seqStr) {
                            if (!imageRays[seqStr]) imageRays[seqStr] = [];
                            imageRays[seqStr].push({ x: r.x, y: r.y, dx: r.dx, dy: r.dy, bounceCount: bounces });
                        }
                        active = false;
                        break;
                    }
                    
                    let hitY = r.y + minDist * r.dy / r.dx;
                    path.push({ x: nextEl.x, y: hitY });
                    hitSequence.push(`E${nextEl.id}`);
                    
                    // Unified Matrix Transformation
                    let Power = 0;
                    if (nextEl.type === 'lens') {
                        Power = nextEl.subtype === 'convex' ? 1/nextEl.f : -1/nextEl.f;
                        r.dy = r.dy - (hitY - nextEl.y) * Power * Math.abs(r.dx);
                    } else {
                        Power = nextEl.subtype === 'plane' ? 0 : (nextEl.subtype === 'concave' ? 1/nextEl.f : -1/nextEl.f);
                        r.dy = r.dy - (hitY - nextEl.y) * Power * Math.abs(r.dx);
                        r.dx *= -1; 
                    }
                    r.x = nextEl.x; r.y = hitY;
                    bounces++;
                    
                    const seqStr = hitSequence.join('→');
                    if (!imageRays[seqStr]) imageRays[seqStr] = [];
                    imageRays[seqStr].push({ x: r.x, y: r.y, dx: r.dx, dy: r.dy, bounceCount: bounces });
                }
                allPaths.push(path);
            }

            // Calculate precise images based solely on valid grouped rays
            let images = [];
            let dashedExtensions = [];
            let bCount = 1;

            for (let seq in imageRays) {
                let rays = imageRays[seq];
                if (rays.length >= 2) {
                    let r1 = rays[0];
                    let r2 = rays[rays.length - 1]; // Use outermost rays for precision
                    
                    let cross = r1.dx * r2.dy - r1.dy * r2.dx;
                    if (Math.abs(cross) > 1e-6) {
                        let t = ((r2.x - r1.x) * r2.dy - (r2.y - r1.y) * r2.dx) / cross;
                        let imgX = r1.x + t * r1.dx;
                        let imgY = r1.y + t * r1.dy;
                        
                        let color = rayColors[(r1.bounceCount) % rayColors.length];
                        images.push({
                            x: imgX, y: imgY, color: color,
                            label: `I${bCount}`, desc: `(via ${seq})`
                        });

                        dashedExtensions.push({ x1: r1.x, y1: r1.y, x2: imgX, y2: imgY, color });
                        dashedExtensions.push({ x1: r2.x, y1: r2.y, x2: imgX, y2: imgY, color });
                    }
                }
                bCount++;
            }
            return { paths: allPaths, images, dashedExtensions };
        }

        // --- DRAWING UTILS ---
        function mapX(x) { return originX + x; }
        function mapY(y) { return originY - y; }

        function drawRaySegment(x1, y1, x2, y2, color, dashed = false, showArrow = true) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            if (dashed) {
                ctx.setLineDash([4, 4]);
                ctx.globalAlpha = 0.5;
            }
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            if (showArrow) {
                const dx = x2 - x1;
                const dy = y2 - y1;
                const len = Math.hypot(dx, dy);
                if (len > 30) {
                    const angle = Math.atan2(dy, dx);
                    // Force arrowhead to stay on screen by capping the projection distance
                    let arrowDist = Math.min(len * 0.55, 120); 
                    const midX = x1 + (dx / len) * arrowDist;
                    const midY = y1 + (dy / len) * arrowDist;

                    ctx.beginPath();
                    ctx.fillStyle = color;
                    ctx.moveTo(midX, midY);
                    ctx.lineTo(midX - 12 * Math.cos(angle - 0.4), midY - 12 * Math.sin(angle - 0.4));
                    ctx.lineTo(midX - 12 * Math.cos(angle + 0.4), midY - 12 * Math.sin(angle + 0.4));
                    ctx.closePath();
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        function drawElementGeometry(el) {
            const cx = mapX(el.x);
            const cy = mapY(el.y);
            const h = 200; // 100px radius aperture
            ctx.save();
            
            if (el.id === selectedId) {
                ctx.shadowBlur = 15; ctx.shadowColor = "var(--primary)";
            }

            if (el.type === 'lens') {
                ctx.strokeStyle = "#00e5ff"; 
                ctx.fillStyle = "rgba(0, 229, 255, 0.15)"; 
                ctx.lineWidth = 3;
                ctx.beginPath();
                if (el.subtype === 'convex') {
                    ctx.moveTo(cx, cy - h/2);
                    ctx.quadraticCurveTo(cx + 25, cy, cx, cy + h/2);
                    ctx.quadraticCurveTo(cx - 25, cy, cx, cy - h/2);
                } else {
                    ctx.moveTo(cx - 15, cy - h/2); ctx.lineTo(cx + 15, cy - h/2);
                    ctx.quadraticCurveTo(cx - 5, cy, cx + 15, cy + h/2); ctx.lineTo(cx - 15, cy + h/2);
                    ctx.quadraticCurveTo(cx + 5, cy, cx - 15, cy - h/2);
                }
                ctx.fill(); ctx.stroke();
            } 
            else if (el.type === 'mirror') {
                ctx.lineWidth = 4;
                const facesRight = el.x < object.x; 
                const curveDir = facesRight ? -1 : 1; 

                if (el.subtype === 'plane') {
                    ctx.strokeStyle = "#8de5ff";
                    ctx.beginPath(); ctx.moveTo(cx, cy - h/2); ctx.lineTo(cx, cy + h/2); ctx.stroke();
                    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    for(let y = cy - h/2 + 5; y < cy + h/2; y += 10) {
                        ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx + 8 * curveDir, y + 8); ctx.stroke();
                    }
                } 
                else {
                    ctx.strokeStyle = "#ff007f";
                    ctx.beginPath();
                    const bulge = el.subtype === 'concave' ? 25 * curveDir : -25 * curveDir;
                    ctx.moveTo(cx, cy - h/2);
                    ctx.quadraticCurveTo(cx + bulge, cy, cx, cy + h/2);
                    ctx.stroke();
                    
                    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,0.4)";
                    for(let t = 0.1; t < 1; t += 0.08) {
                        const px = cx + bulge * 2 * (1 - t) * t;
                        const py = (cy - h/2) * Math.pow(1 - t, 2) + cy * 2 * (1 - t) * t + (cy + h/2) * Math.pow(t, 2);
                        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 8 * curveDir, py + 8); ctx.stroke();
                    }
                }
            }
            ctx.restore();
            
            ctx.fillStyle = el.id === selectedId ? "var(--primary)" : "#a0aabf";
            ctx.font = "bold 13px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText(`E${el.id}`, cx, cy + h/2 + 25);
        }

        function draw() {
            if(!initialized) return;
            ctx.clearRect(0, 0, W, H);
            
            // Optical Axis
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(W, originY); ctx.stroke();
            ctx.setLineDash([]);

            // Draw Elements
            elements.forEach(drawElementGeometry);

            // Execute Ray Tracing
            const { paths, images, dashedExtensions } = traceSystem();
            
            // Draw Virtual Extensions to Image Points First
            dashedExtensions.forEach(ext => {
                if (ext.x2 > -W && ext.x2 < W*2) { 
                    drawRaySegment(mapX(ext.x1), mapY(ext.y1), mapX(ext.x2), mapY(ext.y2), ext.color, true, false);
                }
            });

            // Draw Real Solid Rays with Arrows
            paths.forEach((path, pathIdx) => {
                for(let i = 0; i < path.length - 1; i++) {
                    let p1 = path[i];
                    let p2 = path[i+1];
                    let color = rayColors[(i) % rayColors.length];
                    drawRaySegment(mapX(p1.x), mapY(p1.y), mapX(p2.x), mapY(p2.y), color, false, true);
                }
            });

            // Draw Fixed Point Object (O)
            const ox = mapX(object.x);
            const oy = mapY(object.y);
            ctx.save();
            ctx.shadowBlur = 15; ctx.shadowColor = "var(--gold)";
            ctx.fillStyle = "var(--gold)";
            ctx.beginPath(); ctx.arc(ox, oy, 7, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#fff"; ctx.font = "bold 16px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("O", ox, oy + 25);
            ctx.restore();

            // Update Dynamic Legend & Draw Point Images (I)
            let legendHTML = `<div class="leg"><div class="leg-dot" style="background: var(--gold); box-shadow: 0 0 8px var(--gold);"></div> Point Object (O)</div>`;
            
            images.forEach((img) => {
                if (img.x > -W && img.x < W*2) {
                    const ix = mapX(img.x);
                    const iy = mapY(img.y);
                    ctx.save();
                    ctx.shadowBlur = 15; ctx.shadowColor = img.color;
                    ctx.fillStyle = img.color;
                    ctx.beginPath(); ctx.arc(ix, iy, 6, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
                    ctx.font = "bold 15px 'Segoe UI'";
                    ctx.fillText(img.label, ix, iy + 25);
                    ctx.font = "11px 'Segoe UI'";
                    ctx.fillStyle = "var(--text-muted)";
                    ctx.fillText(img.desc, ix, iy + 40);
                    ctx.restore();
                    
                    legendHTML += `<div class="leg"><div class="leg-dot" style="background: ${img.color}; box-shadow: 0 0 8px ${img.color};"></div> Image ${img.label} <span style="opacity:0.7;">${img.desc}</span></div>`;
                }
            });
            legendBox.innerHTML = legendHTML;
        }

        updateUI();
    </script>
</body>
</html>
