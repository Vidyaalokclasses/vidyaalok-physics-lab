<html lang="en">
<head>

  <title>Spherical Lenses | Vidyaalok Lab</title>

  <!-- MathJax for rendering LaTeX formulas -->

    window.MathJax = { 
      tex: { inlineMath: [['\\(', '\\)']] },

    };

  <style>
    :root {
      --primary: #00e5ff;      /* Lens/Glass */
      --secondary: #ff007f;    /* UI Accents */
      --bg-dark: #070b19;
      --panel-bg: rgba(255, 255, 255, 0.03);
      --text-main: #ffffff;
      --text-muted: #a0aabf;
      --border: rgba(255, 255, 255, 0.1);
      
      /* Simulation specific colors */
      --ray-1: #ff3366;        /* Parallel Ray */
      --ray-2: #ffffff;        /* Center Ray */
      --obj-color: #ffd166;    /* Object (Yellow) */
      --real-img: #00ffaa;     /* Real Image (Green) */
      --virtual-img: #c7a6ff;  /* Virtual Image (Purple) */
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden; 
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation */
    .navbar {
      padding: 12px 20px;
      background: rgba(7, 11, 25, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 20;
    }

    .back-btn {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .navbar h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.8);
      text-transform: uppercase;
    }

    /* Main Workspace Layout */
    .main-panel {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Top: Canvas Area */
    .canvas-area {
      flex-grow: 1;
      position: relative;
      width: 100%;
      background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05), transparent 70%);
      overflow: hidden;
    }

    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%; 
      height: 70%;
      background-image: url('../../logo.png'); 
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.08; 
      pointer-events: none; 
      z-index: 0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    .canvas-head {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: bold;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }

    .canvas-head span:first-child { color: var(--primary); }

    /* Floating Stats Overlay */
    .stats-overlay {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px 15px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      pointer-events: none;
    }

    .stat-mini {
      display: flex;
      flex-direction: column;
    }
    .stat-mini strong {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-mini span {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-main);
      font-family: monospace;
    }

    /* Formula Overlay */
    .formula-overlay {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 10px 20px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
      color: var(--primary);
      pointer-events: none; 
      text-align: center;
    }

    .formula-overlay mjx-container { font-size: 0.95rem; }

    /* Legend Overlay */
    .legend {
      position: absolute;
      bottom: 15px;
      right: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 10px 15px;
      background: rgba(0,0,0,0.65);
      border: 1px solid var(--border);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 0.8rem;
      color: var(--text-main);
      z-index: 10;
      pointer-events: none;
    }
    .leg { display: flex; align-items: center; gap: 6px; }
    .leg-line { width: 16px; height: 3px; border-radius: 2px; }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Bottom: Controls Area */
    .controls-area {
      background: rgba(7, 11, 25, 0.95);
      border-top: 1px solid rgba(0, 229, 255, 0.3);
      padding: 15px 25px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      z-index: 20;
      box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
    }

    .tool-row {
      display: flex;
      gap: 8px;
      grid-column: 1 / -1; /* spans full width */
    }

    .tool-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 8px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }
    .tool-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: var(--primary); }
    .tool-btn.active { border-color: var(--gold); background: rgba(255, 209, 102, 0.15); color: var(--gold); }

    .control-group {
      display: flex;
      flex-direction: column;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .control-group span {
      color: var(--primary);
      font-family: monospace;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      margin-top: -7px;
      box-shadow: 0 0 10px var(--primary);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    /* Mobile overrides */
    @media (max-width: 900px) {
      .controls-area {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 12px 15px;
        max-height: 38vh;
        overflow-y: auto;
      }
      .stats-overlay {
        top: 5px; right: 5px; padding: 8px; gap: 8px;
        grid-template-columns: 1fr 1fr;
      }
      .stat-mini span { font-size: 0.95rem; }
      .formula-overlay { display: none; }
      .legend { display: none; } /* Hidden on mobile to maximize view space */
      .canvas-head { padding: 8px 12px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="back-btn">← Chapter 09</a>
    <h1>Spherical Lenses</h1>
  </nav>

  <div class="main-panel">
    
    <!-- Top: Canvas Area -->
    <div class="canvas-area" id="simWrapper">
      <div class="canvas-head">
        <span id="canvasTitle">Convex Lens</span>
        <span id="dragHint">Drag Object (O) along axis</span>
      </div>
      
      <div class="watermark"></div>
      <canvas id="lensCanvas"></canvas>

      <!-- Stats Overlay -->
      <div class="stats-overlay">
        <div class="stat-mini"><strong>Image Dist (v)</strong><span id="vOut">0 px</span></div>
        <div class="stat-mini"><strong>Magnification (m)</strong><span id="mOut">0.00</span></div>
        <div class="stat-mini" style="grid-column: span 2;"><strong>Nature</strong><span id="natureOut">Real & Inverted</span></div>
      </div>

      <!-- Formula Overlay -->
      <div class="formula-overlay" id="formulas">
        \[ \frac{1}{v} - \frac{1}{u} = \frac{1}{f} \quad \Rightarrow \quad v = \frac{uf}{u+f} \]
      </div>

      <!-- Legend Overlay -->
      <div class="legend">
        <div class="leg"><div class="leg-line" style="background: var(--ray-1);"></div> Ray 1</div>
        <div class="leg"><div class="leg-line" style="background: var(--ray-2);"></div> Ray 2</div>
        <div class="leg"><div class="leg-line" style="background: transparent; border-top: 2px dashed rgba(255,255,255,0.4);"></div> Virtual Ext.</div>
        <div class="leg"><div class="leg-dot" style="background: var(--obj-color);"></div> Object</div>
        <div class="leg"><div class="leg-dot" style="background: var(--real-img);"></div> Real Image</div>
        <div class="leg"><div class="leg-dot" style="background: var(--virtual-img);"></div> Virtual Image</div>
      </div>

    </div>

    <!-- Bottom: Controls Area -->
    <div class="controls-area">
      <div class="tool-row">
        <button class="tool-btn active" id="btnConvex">◖ Convex ◗</button>
        <button class="tool-btn" id="btnConcave">◗ Concave ◖</button>
      </div>

      <div class="control-group">
        <label>Focal Length (f) <span id="fVal">100 px</span></label>
        <input id="fSlider" type="range" min="40" max="250" step="1" value="100">
      </div>
      
      <div class="control-group">
        <label>Object Distance (u) <span id="uVal">150 px</span></label>
        <input id="uSlider" type="range" min="20" max="400" step="1" value="150">
      </div>

      <div class="control-group">
        <label>Object Height (hₒ) <span id="hVal">50 px</span></label>
        <input id="hSlider" type="range" min="10" max="100" step="1" value="50">
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById("lensCanvas");
    const ctx = canvas.getContext("2d");

    // UI Elements
    const btnConvex = document.getElementById("btnConvex");
    const btnConcave = document.getElementById("btnConcave");
    const uSlider = document.getElementById("uSlider");
    const fSlider = document.getElementById("fSlider");
    const hSlider = document.getElementById("hSlider");
    const uVal = document.getElementById("uVal");
    const fVal = document.getElementById("fVal");
    const hVal = document.getElementById("hVal");
    const vOut = document.getElementById("vOut");
    const mOut = document.getElementById("mOut");
    const natureOut = document.getElementById("natureOut");
    const canvasTitle = document.getElementById("canvasTitle");

    // Color definitions mapped to CSS variables
    const colorRay1 = "#ff3366"; // Pink (Parallel Ray)
    const colorRay2 = "#ffffff"; // White (Center Ray)
    const extColor = "rgba(255, 255, 255, 0.4)"; // Faint white for virtual
    const objColor = "#ffd166";  // Yellow
    const realImgColor = "#00ffaa"; // Green
    const virtImgColor = "#c7a6ff"; // Purple

    let W = 0, H = 0;
    let initialized = false;
    let isConvex = true;
    let isDragging = false;

    // --- RESIZE OBSERVER ---
    const resizeObserver = new ResizeObserver(entries => {
      for (let entry of entries) {
        if (entry.target.id === 'simWrapper') {
          W = Math.floor(entry.contentRect.width);
          H = Math.floor(entry.contentRect.height);
          canvas.width = W;
          canvas.height = H;
          if (!initialized && W > 10 && H > 10) {
            initialized = true;
            draw();
          } else if (initialized) {
            draw();
          }
        }
      }
    });
    resizeObserver.observe(document.getElementById('simWrapper'));

    setTimeout(() => {
      if (!initialized && canvas.parentElement.clientWidth > 10) {
        W = canvas.parentElement.clientWidth;
        H = canvas.parentElement.clientHeight || 400; 
        canvas.width = W;
        canvas.height = H;
        initialized = true;
        draw();
      }
    }, 300);

    // --- INTERACTION LOGIC ---
    btnConvex.addEventListener("click", () => {
      isConvex = true;
      btnConvex.classList.add("active");
      btnConcave.classList.remove("active");
      canvasTitle.textContent = "Convex Lens (Converging)";
      draw();
    });

    btnConcave.addEventListener("click", () => {
      isConvex = false;
      btnConcave.classList.add("active");
      btnConvex.classList.remove("active");
      canvasTitle.textContent = "Concave Lens (Diverging)";
      draw();
    });

    function getEventPos(e){
      const rect = canvas.getBoundingClientRect();
      let clientX = e.clientX;
      if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
      else if (e.changedTouches && e.changedTouches.length > 0) clientX = e.changedTouches[0].clientX;
      return (clientX - rect.left) * (canvas.width / rect.width);
    }

    canvas.addEventListener("mousedown", (e) => {
      const cx = getEventPos(e);
      const originX = W / 2;
      const objPx = originX - parseFloat(uSlider.value);
      if (Math.abs(cx - objPx) < 40) isDragging = true;
    });

    canvas.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const cx = getEventPos(e);
      const originX = W / 2;
      let newU = originX - cx;
      if (newU < 20) newU = 20;
      if (newU > W / 2) newU = W / 2;
      uSlider.value = newU;
      draw();
    });

    canvas.addEventListener("mouseup", () => isDragging = false);
    canvas.addEventListener("mouseleave", () => isDragging = false);
    
    // Touch support for dragging object
    canvas.addEventListener("touchstart", (e) => {
      const cx = getEventPos(e);
      const originX = W / 2;
      const objPx = originX - parseFloat(uSlider.value);
      if (Math.abs(cx - objPx) < 40) {
        isDragging = true;
        if(e.cancelable) e.preventDefault();
      }
    }, {passive: false});
    
    canvas.addEventListener("touchmove", (e) => {
      if (!isDragging) return;
      if(e.cancelable) e.preventDefault();
      const cx = getEventPos(e);
      const originX = W / 2;
      let newU = originX - cx;
      if (newU < 20) newU = 20;
      if (newU > W / 2) newU = W / 2;
      uSlider.value = newU;
      draw();
    }, {passive: false});
    
    canvas.addEventListener("touchend", () => isDragging = false);
    canvas.addEventListener("touchcancel", () => isDragging = false);

    // --- DRAWING UTILS ---
    function drawPoint(x, y, label, isFocal = false) {
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.font = "12px 'Segoe UI'";
      ctx.fillText(label, x - 8, y + 20);
    }

    function drawObjectArrow(x, y, height, color, label) {
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 4;
      
      // Stem
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y - height);
      ctx.stroke();
      
      // Arrowhead
      ctx.beginPath();
      const headDir = height > 0 ? 1 : -1;
      ctx.moveTo(x, y - height);
      ctx.lineTo(x - 6, y - height + (10 * headDir));
      ctx.lineTo(x + 6, y - height + (10 * headDir));
      ctx.closePath();
      ctx.fill();

      // Label
      ctx.fillStyle = color;
      ctx.font = "bold 15px 'Segoe UI'";
      ctx.fillText(label, x - 22, y - height - (10 * headDir));
    }

    function drawRay(x1, y1, x2, y2, color, dashed = false, showArrow = true) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2.5;
      
      if (dashed) ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.setLineDash([]);

      if (showArrow) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy);
        if(len > 30) {
          const angle = Math.atan2(dy, dx);
          const midX = x1 + dx * 0.55;
          const midY = y1 + dy * 0.55;
          ctx.beginPath();
          ctx.moveTo(midX, midY);
          ctx.lineTo(midX - 10 * Math.cos(angle - 0.4), midY - 10 * Math.sin(angle - 0.4));
          ctx.lineTo(midX - 10 * Math.cos(angle + 0.4), midY - 10 * Math.sin(angle + 0.4));
          ctx.closePath();
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function drawLens(cx, cy, height) {
      ctx.save();
      ctx.strokeStyle = "#00e5ff";
      ctx.fillStyle = "rgba(0, 229, 255, 0.15)";
      ctx.lineWidth = 3;
      
      ctx.beginPath();
      if (isConvex) {
        // Double Convex
        ctx.moveTo(cx, cy - height/2);
        ctx.quadraticCurveTo(cx + 30, cy, cx, cy + height/2);
        ctx.quadraticCurveTo(cx - 30, cy, cx, cy - height/2);
      } else {
        // Double Concave
        ctx.moveTo(cx - 15, cy - height/2);
        ctx.lineTo(cx + 15, cy - height/2);
        ctx.quadraticCurveTo(cx - 10, cy, cx + 15, cy + height/2);
        ctx.lineTo(cx - 15, cy + height/2);
        ctx.quadraticCurveTo(cx + 10, cy, cx - 15, cy - height/2);
      }
      ctx.fill();
      ctx.stroke();

      // Optical center dashed line
      ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(cx, cy - height/2 - 20);
      ctx.lineTo(cx, cy + height/2 + 20);
      ctx.stroke();
      ctx.restore();
    }

    // --- MAIN PHYSICS & RENDER LOOP ---
    function draw() {
      if(W === 0 || H === 0 || !initialized) return;

      const U = parseFloat(uSlider.value); 
      const f_mag = parseFloat(fSlider.value);
      const ho = parseFloat(hSlider.value);

      // Cartesian Sign Convention
      const u = -U; 
      const f = isConvex ? f_mag : -f_mag;

      // Lens Equation: 1/v = 1/f + 1/u
      let v = (u * f) / (u + f);
      let m = v / u;
      
      let isInfinity = false;
      if (Math.abs(u + f) < 0.1) {
        isInfinity = true;
        v = 9999;
        m = 9999;
      }

      // Update UI Text
      uVal.textContent = `${U.toFixed(0)} px`;
      fVal.textContent = `${f_mag.toFixed(0)} px`;
      hVal.textContent = `${ho.toFixed(0)} px`;

      if (isInfinity) {
        vOut.textContent = "∞";
        mOut.textContent = "∞";
        natureOut.textContent = "Real & Highly Enlarged";
        natureOut.style.color = realImgColor;
      } else {
        vOut.textContent = `${Math.abs(v).toFixed(1)} px`;
        mOut.textContent = `${m.toFixed(2)}`;
        
        if (v > 0) {
          natureOut.textContent = "Real & Inverted";
          natureOut.style.color = realImgColor;
        } else {
          natureOut.textContent = "Virtual & Erect";
          natureOut.style.color = virtImgColor;
        }
      }

      // Drawing Setup
      ctx.clearRect(0, 0, W, H);
      const cx = W / 2;
      const cy = H / 2;
      
      // Draw Principal Axis
      ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, cy);
      ctx.lineTo(W, cy);
      ctx.stroke();

      // Draw Focus Points
      drawPoint(cx - f_mag, cy, "F₁", true);
      drawPoint(cx + f_mag, cy, "F₂", true);
      drawPoint(cx - 2*f_mag, cy, "2F₁");
      drawPoint(cx + 2*f_mag, cy, "2F₂");
      drawPoint(cx, cy, "O");

      // Draw Lens
      drawLens(cx, cy, Math.max(250, ho * 2 + 50));

      // Coordinate mapping
      const objX = cx + u; // u is negative
      const objY = cy;
      const tipX = objX;
      const tipY = cy - ho;

      const imgX = cx + v;
      const hi = m * ho;
      const imgTipY = cy - hi;

      // Draw Object
      drawObjectArrow(objX, objY, ho, objColor, "O");

      if (isConvex) {
        // Ray 1: Parallel to principal axis -> passes through F2
        drawRay(tipX, tipY, cx, tipY, colorRay1); // Incident parallel
        if (!isInfinity) {
          drawRay(cx, tipY, cx + (W/2), tipY + ((cy - tipY)/f_mag) * (W/2), colorRay1); // Refracted through F2
        } else {
          drawRay(cx, tipY, W, tipY + ((cy - tipY)/f_mag) * (W/2), colorRay1);
        }

        // Ray 2: Passes through Optical Center
        const dx2 = cx - tipX;
        const dy2 = cy - tipY;
        drawRay(tipX, tipY, cx + (W/2), cy + (W/2) * (dy2 / dx2), colorRay2);

        // Virtual extensions for Convex (when object is inside focus, v < 0)
        if (v < 0 && !isInfinity) {
          drawRay(cx, tipY, imgX, imgTipY, colorRay1, true, false);
          drawRay(cx, cy, imgX, imgTipY, colorRay2, true, false);
        }

      } else {
        // Concave Lens (Diverging)
        
        // Ray 1: Incident parallel
        drawRay(tipX, tipY, cx, tipY, colorRay1);
        
        // Ray 1 Refracted: Diverges, appearing to come from F1
        // Slope = dy/dx. Ray hit lens at (cx, tipY). F1 is at (cx - f_mag, cy).
        // Vector from F1 to hit point: dx = f_mag, dy = tipY - cy.
        const slope = (tipY - cy) / f_mag;
        drawRay(cx, tipY, W, tipY + slope * (W - cx), colorRay1);
        
        // Ray 1 Virtual Extension: Traces back to F1 and Image
        drawRay(cx, tipY, cx - f_mag, cy, colorRay1, true, false);

        // Ray 2: Passes through Optical Center
        const dx2 = cx - tipX;
        const dy2 = cy - tipY;
        drawRay(tipX, tipY, W, cy + (W - cx) * (dy2 / dx2), colorRay2);
        
        // Virtual extension of Ray 2 back to image
        drawRay(cx, cy, imgX, imgTipY, colorRay2, true, false);
      }

      // Draw Image
      if (!isInfinity) {
        const imgColor = v > 0 ? realImgColor : virtImgColor;
        drawObjectArrow(imgX, objY, hi, imgColor, "I");
      }
    }

    // Event Listeners
    [uSlider, fSlider, hSlider].forEach(slider => {
      slider.addEventListener('input', draw);
    });

  </script>
</body>
</html>
