    <style>

    <div class="workspace">
        
        <!-- Control Panel -->
        <aside class="controls">

            <div class="panel-section">

            <div class="panel-section">
                <div class="panel-title">3. Modify Selected Mirror</div>
                <div class="control-group">
                    <label>Angle <span id="angleVal">0°</span></label>

                    <label>Size <span id="sizeVal">150 px</span></label>

                </div>
                <div class="control-group">
                    <label>Focal Length <span id="focalVal">90 px</span></label>
                    <input id="focalSlider" type="range" min="55" max="150" step="1" value="90">
                </div>
            </div>

            <div class="panel-section" style="margin-top: auto;">
                <div class="panel-title">Analysis</div>

                    <div class="stat"><strong>Position</strong><span id="imagePos">( , )</span></div>

        <!-- Simulation Area -->
        <div class="right-panel">
            <div class="canvas-head">
                <span>Drag object (O) or mirrors to interact.</span>
                <span id="selectedLabel">Selected: Mirror 1</span>
            </div>
            
            <div class="canvas-wrapper" id="simWrapper">
                <div class="watermark"></div>
                <canvas id="comboCanvas"></canvas>
            </div>

            <div class="legend">
                <div class="leg"><div class="leg-line" style="background: var(--ray-color);"></div> Rays</div>
                <div class="leg"><div class="leg-line" style="background: var(--real-img);"></div> Real Image</div>
                <div class="leg"><div class="leg-line" style="background: transparent; border-top: 3px dashed var(--virtual-img);"></div> Virtual Ext.</div>
                <div class="leg"><div class="leg-line" style="background: var(--selected);"></div> Selected</div>
            </div>

    <script>
        const canvas = document.getElementById('comboCanvas');
        const ctx = canvas.getContext('2d');
        const mirrorList = document.getElementById('mirrorList');
        
        const angleSlider = document.getElementById('angleSlider');
        const sizeSlider = document.getElementById('sizeSlider');
        const focalSlider = document.getElementById('focalSlider');
        
        const angleVal = document.getElementById('angleVal');
        const sizeVal = document.getElementById('sizeVal');
        const focalVal = document.getElementById('focalVal');
        
        const imageNature = document.getElementById('imageNature');
        const imagePos = document.getElementById('imagePos');
        const bounceCount = document.getElementById('bounceCount');
        const rayCount = document.getElementById('rayCount');
        const selectedLabel = document.getElementById('selectedLabel');

        let W = canvas.clientWidth || 800;
        let H = canvas.clientHeight || 500;
        let object = { x: 0, y: 0 };
        let mirrors = [];
        let selectedId = 1;
        let dragTarget = null;
        let dragOffset = { x: 0, y: 0 };
        let nextId = 1;
        
        // Ray Angles coming out of the point object
        const rayAngles = [-18, -9, 0, 9, 18].map(a => a * Math.PI / 180);

        let initialized = false;

        // --- RESIZE OBSERVER (Responsive Canvas) ---
        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                if (entry.target.id === 'simWrapper') {
                    W = Math.floor(entry.contentRect.width);
                    H = Math.floor(entry.contentRect.height);
                    
                    canvas.width = W;
                    canvas.height = H;
                    
                    if (!initialized && W > 0 && H > 0) {
                        initialized = true;
                        resetScene(); // Initialize mirrors now that we know actual screen size
                    } else {
                        draw();
                    }
                }
            }
        });
        resizeObserver.observe(document.getElementById('simWrapper'));

        function resetScene(){
            if(W === 0 || H === 0) return;
            
            // Set object relative to screen width (Responsive)
            object = { x: W * 0.15, y: H * 0.5 };
            nextId = 1;
            
            // Set initial mirrors relative to screen width
            mirrors = [
                createMirror('plane', W * 0.45, H * 0.5, 0),
                createMirror('concave', W * 0.8, H * 0.5, 0)
            ];
            
            selectedId = mirrors[0].id;
            syncControls();
            renderMirrorList();
            draw();
        }

        function createMirror(type, x, y, angleDeg){
            return {
                id: nextId++,
                type,
                x,
                y,
                angle: angleDeg * Math.PI / 180,
                size: 150,
                focal: 90
            };
        }

        function addMirror(type){
            // Place new mirror roughly in center
            mirrors.push(createMirror(type, W * 0.5, H * 0.5, 0));
            selectedId = mirrors[mirrors.length - 1].id;
            syncControls();
            renderMirrorList();
            draw();
        }

        function selectedMirror(){
            return mirrors.find(m => m.id === selectedId) || mirrors[0] || null;
        }

        function typeName(type){
            return type === 'plane' ? 'Plane' : type === 'concave' ? 'Concave' : 'Convex';
        }

        function syncControls(){
            const m = selectedMirror();
            const disabled = !m;
            [angleSlider, sizeSlider, focalSlider].forEach(input => input.disabled = disabled);
            
            if(!m){
                selectedLabel.textContent = 'Selected: none';
                return;
            }
            
            angleSlider.value = Math.round(m.angle * 180 / Math.PI);
            sizeSlider.value = Math.round(m.size);
            focalSlider.value = Math.round(m.focal);
            
            angleVal.textContent = `${angleSlider.value}°`;
            sizeVal.textContent = `${sizeSlider.value} px`;
            focalVal.textContent = `${focalSlider.value} px`;
            selectedLabel.textContent = `Selected: ${typeName(m.type)} ${m.id}`;
            
            focalSlider.style.opacity = m.type === 'plane' ? '0.3' : '1';
        }

        function renderMirrorList(){
            mirrorList.innerHTML = '';
            mirrors.forEach(m => {
                const button = document.createElement('div');
                button.className = 'mirror-item' + (m.id === selectedId ? ' active' : '');
                button.innerHTML = `<span>${typeName(m.type)} ${m.id}</span><small>${Math.round(m.angle * 180 / Math.PI)}°</small>`;
                button.onclick = () => {
                    selectedId = m.id;
                    syncControls();
                    renderMirrorList();
                    draw();
                };
                mirrorList.appendChild(button);
            });
        }

        // Vector Math
        function add(a,b){ return { x: a.x + b.x, y: a.y + b.y }; }
        function sub(a,b){ return { x: a.x - b.x, y: a.y - b.y }; }
        function mul(a,s){ return { x: a.x * s, y: a.y * s }; }
        function dot(a,b){ return a.x * b.x + a.y * b.y; }
        function len(v){ return Math.hypot(v.x, v.y); }
        function norm(v){ const l = len(v) || 1; return { x: v.x / l, y: v.y / l }; }
        function perp(v){ return { x: -v.y, y: v.x }; }
        function dirFromAngle(a){ return { x: Math.cos(a), y: Math.sin(a) }; }
        function reflect(d,n){ const nn = norm(n); return norm(sub(d, mul(nn, 2 * dot(d, nn)))); }

        function mirrorBasis(m){
            const axis = dirFromAngle(m.angle);
            const tangent = perp(axis);
            return { axis, tangent };
        }

        function curvedCenter(m){
            const { axis } = mirrorBasis(m);
            const sign = m.type === 'concave' ? -1 : 1;
            return add({ x: m.x, y: m.y }, mul(axis, sign * 2 * m.focal));
        }

        function intersectPlane(ray, m){
            const { tangent } = mirrorBasis(m);
            const p = { x: m.x, y: m.y };
            const denom = ray.d.x * tangent.y - ray.d.y * tangent.x;
            if(Math.abs(denom) < 0.0001) return null;
            const q = sub(p, ray.p);
            const t = (q.x * tangent.y - q.y * tangent.x) / denom;
            const s = (q.x * ray.d.y - q.y * ray.d.x) / denom;
            if(t < 0.5 || Math.abs(s) > m.size / 2) return null;
            return { t, point: add(ray.p, mul(ray.d, t)), normal: mirrorBasis(m).axis, mirror: m };
        }

        function intersectCurved(ray, m){
            const c = curvedCenter(m);
            const R = 2 * m.focal;
            const oc = sub(ray.p, c);
            const b = 2 * dot(ray.d, oc);
            const cc = dot(oc, oc) - R * R;
            const disc = b * b - 4 * cc;
            if(disc < 0) return null;
            const roots = [(-b - Math.sqrt(disc)) / 2, (-b + Math.sqrt(disc)) / 2].filter(t => t > 0.5);
            let best = null;
            const { tangent } = mirrorBasis(m);
            roots.forEach(t => {
                const point = add(ray.p, mul(ray.d, t));
                const rel = sub(point, { x: m.x, y: m.y });
                if(Math.abs(dot(rel, tangent)) > m.size / 2) return;
                const hit = { t, point, normal: sub(point, c), mirror: m };
                if(!best || t < best.t) best = hit;
            });
            return best;
        }

        function firstHit(ray){
            let best = null;
            mirrors.forEach(m => {
                const hit = m.type === 'plane' ? intersectPlane(ray, m) : intersectCurved(ray, m);
                if(hit && (!best || hit.t < best.t)) best = hit;
            });
            return best;
        }

        function traceRay(angle){
            let ray = { p: { ...object }, d: dirFromAngle(angle) };
            const segments = [];
            const reflections = [];
            for(let bounce = 0; bounce < 7; bounce++){
                const hit = firstHit(ray);
                if(!hit){
                    segments.push({ a: ray.p, b: add(ray.p, mul(ray.d, W * 1.5)), final: true });
                    break;
                }
                segments.push({ a: ray.p, b: hit.point });
                const out = reflect(ray.d, hit.normal);
                reflections.push({ point: hit.point, dir: out });
                ray = { p: add(hit.point, mul(out, 0.8)), d: out };
            }
            return { segments, reflections };
        }

        function lineIntersection(l1, l2){
            const p = l1.point;
            const r = l1.dir;
            const q = l2.point;
            const s = l2.dir;
            const cross = r.x * s.y - r.y * s.x;
            if(Math.abs(cross) < 0.001) return null;
            const qp = sub(q, p);
            const t = (qp.x * s.y - qp.y * s.x) / cross;
            const u = (qp.x * r.y - qp.y * r.x) / cross;
            return { point: add(p, mul(r, t)), t, u };
        }

        function estimateImage(traces){
            const last = traces.map(t => t.reflections[t.reflections.length - 1]).filter(Boolean);
            if(last.length < 2) return null;
            
            const realHits = [];
            const virtualHits = [];
            
            for(let i = 0; i < last.length; i++){
                for(let j = i + 1; j < last.length; j++){
                    const real = lineIntersection(last[i], last[j]);
                    if(real && real.t > 0 && real.u > 0) realHits.push(real.point);
                    
                    const backA = { point: last[i].point, dir: mul(last[i].dir, -1) };
                    const backB = { point: last[j].point, dir: mul(last[j].dir, -1) };
                    const virtual = lineIntersection(backA, backB);
                    if(virtual && virtual.t > 0 && virtual.u > 0) virtualHits.push(virtual.point);
                }
            }
            const source = realHits.length >= 2 ? realHits : virtualHits;
            if(source.length < 2) return null;
            
            source.sort((a,b) => a.x - b.x);
            const mx = source[Math.floor(source.length / 2)].x;
            source.sort((a,b) => a.y - b.y);
            const my = source[Math.floor(source.length / 2)].y;
            
            return { x: mx, y: my, nature: realHits.length >= 2 ? 'Real' : 'Virtual' };
        }

        function drawArrow(a, b, color, dashed=false){
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;
            if(dashed) ctx.setLineDash([5,5]);
            
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
            ctx.setLineDash([]);
            
            const angle = Math.atan2(b.y - a.y, b.x - a.x);
            const dist = len(sub(b,a));
            
            // Draw arrowhead slightly past the middle for better visibility
            let hx = a.x + (b.x - a.x) * 0.6;
            let hy = a.y + (b.y - a.y) * 0.6;
            
            if (!dashed && dist > 30) {
                ctx.beginPath();
                ctx.moveTo(hx, hy);
                ctx.lineTo(hx - 12 * Math.cos(angle - 0.4), hy - 12 * Math.sin(angle - 0.4));
                ctx.lineTo(hx - 12 * Math.cos(angle + 0.4), hy - 12 * Math.sin(angle + 0.4));
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        function drawMirror(m){
            const selected = m.id === selectedId;
            const { tangent, axis } = mirrorBasis(m);
            ctx.save();
            
            ctx.strokeStyle = selected ? 'var(--selected)' : '#00e5ff';
            ctx.lineWidth = selected ? 4 : 2;
            ctx.lineCap = 'round';
            
            if(m.type === 'plane'){
                const a = add({ x: m.x, y: m.y }, mul(tangent, -m.size / 2));
                const b = add({ x: m.x, y: m.y }, mul(tangent, m.size / 2));
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
                
                // Draw hash marks on back
                ctx.lineWidth = 1;
                for(let i = -m.size / 2; i <= m.size / 2; i += 18){
                    const p = add({ x: m.x, y: m.y }, mul(tangent, i));
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + axis.x * 12, p.y + axis.y * 12);
                    ctx.stroke();
                }
            } else {
                const c = curvedCenter(m);
                const start = add({ x: m.x, y: m.y }, mul(tangent, -m.size / 2));
                const end = add({ x: m.x, y: m.y }, mul(tangent, m.size / 2));
                const a0 = Math.atan2(start.y - c.y, start.x - c.x);
                const a1 = Math.atan2(end.y - c.y, end.x - c.x);
                
                ctx.beginPath();
                ctx.arc(c.x, c.y, 2 * m.focal, a0, a1, m.type === 'concave');
                ctx.stroke();
                
                ctx.fillStyle = ctx.strokeStyle;
                ctx.font = '10px system-ui';
                ctx.fillText('C', c.x - 4, c.y - 4);
                const f = add({ x: m.x, y: m.y }, mul(axis, (m.type === 'concave' ? -1 : 1) * m.focal));
                ctx.fillText('F', f.x - 4, f.y - 4);
            }
            
            ctx.fillStyle = selected ? 'var(--selected)' : '#ffffff';
            ctx.font = 'bold 13px system-ui';
            ctx.fillText(`${typeName(m.type)} ${m.id}`, m.x + 15, m.y - 15);
            ctx.restore();
        }

        function drawObject(){
            ctx.save();
            ctx.fillStyle = '#ff3366';
            ctx.shadowColor = '#ff3366';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(object.x, object.y, 6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px system-ui';
            ctx.fillText('O', object.x - 6, object.y - 15);
            ctx.restore();
        }

        function draw(){
            if(W === 0 || H === 0 || !initialized) return;
            
            ctx.clearRect(0, 0, W, H);
            
            // Faint Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for(let x = 40; x < W; x += 80){
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
            }
            for(let y = 40; y < H; y += 80){
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
            }

            mirrors.forEach(drawMirror);
            drawObject();

            const traces = rayAngles.map(traceRay);
            
            traces.forEach(trace => {
                trace.segments.forEach(segment => drawArrow(segment.a, segment.b, 'var(--ray-color)', false));
            });

            const image = estimateImage(traces);
            
            if(image){
                ctx.save();
                
                if (image.nature === 'Virtual') {
                    traces.forEach(trace => {
                        const lastRef = trace.reflections[trace.reflections.length - 1];
                        if (lastRef) {
                           drawArrow(lastRef.point, image, 'var(--virtual-img)', true);
                        }
                    });
                }
                
                const color = image.nature === 'Real' ? 'var(--real-img)' : 'var(--virtual-img)';
                ctx.fillStyle = color;
                ctx.strokeStyle = color;
                
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(image.x, image.y, 6, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px system-ui';
                ctx.fillText('I', image.x + 10, image.y - 10);
                ctx.restore();
                
                imageNature.textContent = image.nature;
                imageNature.style.color = color;
                imagePos.textContent = `(${Math.round(image.x)}, ${Math.round(image.y)})`;
            } else {
                imageNature.textContent = 'None';
                imageNature.style.color = 'var(--text-main)';
                imagePos.textContent = '( , )';
            }
            
            const maxBounce = Math.max(0, ...traces.map(t => t.reflections.length));
            bounceCount.textContent = `${maxBounce}`;
            rayCount.textContent = `${traces.filter(t => t.reflections.length > 0).length}/${traces.length}`;
        }

        // Mouse & Touch Interaction logic
        function getEventPos(e){
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function pickTarget(p){
            if(len(sub(p, object)) < 25) return { type: 'object' };
            for(let i = mirrors.length - 1; i >= 0; i--){
                const m = mirrors[i];
                const rel = sub(p, { x: m.x, y: m.y });
                // Expanded hitbox for easier mobile tapping
                if(len(rel) < 40 || Math.abs(dot(rel, mirrorBasis(m).tangent)) < (m.size / 2) + 15 && Math.abs(dot(rel, mirrorBasis(m).axis)) < 40){
                    return { type: 'mirror', mirror: m };
                }
            }
            return null;
        }

        function handleInputStart(e) {
            const p = getEventPos(e);
            const picked = pickTarget(p);
            if(!picked) return;
            
            if(e.type === 'touchstart') e.preventDefault(); // Prevent scrolling while dragging

            dragTarget = picked;
            if(picked.type === 'object'){
                dragOffset = sub(object, p);
            } else {
                selectedId = picked.mirror.id;
                dragOffset = sub({ x: picked.mirror.x, y: picked.mirror.y }, p);
                syncControls();
                renderMirrorList();
                draw();
            }
        }

        function handleInputMove(e) {
            if(!dragTarget) return;
            if(e.type === 'touchmove') e.preventDefault();
            
            const p = getEventPos(e);
            if(dragTarget.type === 'object'){
                object = add(p, dragOffset);
            } else {
                const m = dragTarget.mirror;
                const next = add(p, dragOffset);
                m.x = next.x;
                m.y = next.y;
            }
            draw();
        }

        function handleInputEnd() {
            dragTarget = null;
        }

        // Mouse Events
        canvas.addEventListener('mousedown', handleInputStart);
        canvas.addEventListener('mousemove', handleInputMove);
        canvas.addEventListener('mouseup', handleInputEnd);
        canvas.addEventListener('mouseleave', handleInputEnd);

        // Touch Events for Mobile/Tablets
        canvas.addEventListener('touchstart', handleInputStart, {passive: false});
        canvas.addEventListener('touchmove', handleInputMove, {passive: false});
        canvas.addEventListener('touchend', handleInputEnd);
        canvas.addEventListener('touchcancel', handleInputEnd);

        // Control listeners
        angleSlider.addEventListener('input', () => {
            const m = selectedMirror();
            if(!m) return;
            m.angle = parseFloat(angleSlider.value) * Math.PI / 180;
            syncControls();
            renderMirrorList();
            draw();
        });
        
        sizeSlider.addEventListener('input', () => {
            const m = selectedMirror();
            if(!m) return;
            m.size = parseFloat(sizeSlider.value);
            syncControls();
            draw();
        });
        
        focalSlider.addEventListener('input', () => {
            const m = selectedMirror();
            if(!m || m.type === 'plane') return;
            m.focal = parseFloat(focalSlider.value);
            syncControls();
            draw();
        });

        document.getElementById('addPlane').addEventListener('click', () => addMirror('plane'));
        document.getElementById('addConcave').addEventListener('click', () => addMirror('concave'));
        document.getElementById('addConvex').addEventListener('click', () => addMirror('convex'));
        document.getElementById('resetScene').addEventListener('click', resetScene);
        document.getElementById('deleteMirror').addEventListener('click', () => {
            mirrors = mirrors.filter(m => m.id !== selectedId);
            selectedId = mirrors[0]?.id || null;
            syncControls();
            renderMirrorList();
            draw();
        });

    </script>
</body>
</html>
