            border: 1px solid rgba(255, 0, 127, 0.3);

        }

        .card-title {
            margin: 0 0 8px;
            font-size: 18px;
            line-height: 1.2;
        }
        
        .card-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .formula-box, .graph-box {

            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .graph-box {

        }

        .inline-graph {

            max-width: 250px;
            height: auto;
        }

        .formula-main {
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
            line-height: 1.45;

        }

        .formula-main mjx-container {
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
        }

        .formula-note {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255,255,255,0.1);
            color: var(--text-muted);

            line-height: 1.5;
            text-align: center;

        }

        .empty-state {
            padding: 40px 18px;
            text-align: center;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);

            border: 1px dashed rgba(255,255,255,0.1);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }

        /* Mobile & Tablet Responsive Layout */
        @media(max-width: 640px) {
            .viewer-card { padding: 18px; }
            .navbar { padding: 1rem 1.5rem; flex-direction: column; align-items: flex-start; gap: 1rem; }

        @media (max-width: 900px) {
            * { 
                box-sizing: border-box !important; 
            }
            body, html { 
                overflow-x: hidden !important; 
                overflow-y: auto !important;

                width: 100vw !important;

                width: 100%;

                gap: 1rem;
            }

                grid-template-columns: 1fr; /* Stacks cards into single column on mobile */
            }
        }
    </style>

    <script>
    // Helper function for inline SVGs
    function createAxes(yLabel, xLabel = 'r') {
        return `
            <polyline points="20,10 20,130 180,130" stroke="#a0aabf" stroke-width="2" fill="none"/>
            <text x="185" y="135" fill="#a0aabf" font-size="12">${xLabel}</text>
            <text x="5" y="15" fill="#a0aabf" font-size="12">${yLabel}</text>
        `;
    }

    const flowData = {
        id: "root",
        title: "Electric Charges & Fields",
        type: "root",
        description: "Open a topic to view standard formulas and graphs.",
        children: [
            {
                id: "charge",
                title: "Electric Charge",
                type: "topic",
                description: "Basic properties of charge and charge distributions.",
                children: [
                    {
                        id: "charge-properties",
                        title: "Properties Of Charge",
                        type: "subtopic",
                        description: "Quantisation, conservation, and additivity.",
                        children: [
                            { id: "charge-quantisation", title: "Quantisation", type: "formula", formula: "Q = \\pm ne", note: "n = 1, 2, 3..., and e = 1.6 × 10^{-19} C.", important: true },
                            { id: "charge-conservation", title: "Conservation", type: "formula", formula: "Q_{\\text{before}} = Q_{\\text{after}}", note: "Total charge remains conserved in an isolated system." }
                        ]
                    },
                    {
                        id: "charge-density",
                        title: "Charge Density",
                        type: "subtopic",
                        description: "Linear, surface, and volume distributions.",
                        children: [
                            { id: "linear-density", title: "Linear Charge Density", type: "formula", formula: "\\lambda = \\frac{Q}{L}", note: "Charge per unit length." },
                            { id: "surface-density", title: "Surface Charge Density", type: "formula", formula: "\\sigma = \\frac{Q}{S}", note: "Charge per unit area." },
                            { id: "volume-density", title: "Volume Charge Density", type: "formula", formula: "\\rho = \\frac{Q}{V}", note: "Charge per unit volume." }
                        ]
                    }
                ]
            },
            {
                id: "coulomb",
                title: "Coulomb's Law",
                type: "topic",
                description: "Electrostatic force between point charges.",
                children: [
                    {
                        id: "coulomb-force",
                        title: "Force Magnitude",
                        type: "subtopic",
                        description: "Vacuum, medium, and dielectric relation.",
                        children: [
                            { id: "coulomb-vacuum", title: "In Vacuum", type: "formula", formula: "F = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{q_1 q_2}{r^2}", note: "Acts along the line joining the charges.", important: true },
                            { id: "coulomb-medium", title: "In Medium", type: "formula", formula: "F_{\\text{medium}} = \\frac{F_{\\text{vacuum}}}{K}", note: "K is the dielectric constant (relative permittivity)." }
                        ]
                    },
                    {
                        id: "equilibrium",
                        title: "Equilibrium & Neutral Points",
                        type: "subtopic",
                        description: "Positions where net force or field is zero.",
                        children: [
                            { id: "neutral-like", title: "Neutral Point (Like Charges)", type: "formula", formula: "x = \\frac{\\sqrt{Q_1} r}{\\sqrt{Q_1} + \\sqrt{Q_2}}", note: "Distance x from charge Q₁ between two like charges." },
                            { id: "neutral-unlike", title: "Neutral Point (Unlike Charges)", type: "formula", formula: "x = \\frac{\\sqrt{Q_1} r}{|\\sqrt{Q_2}| - |\\sqrt{Q_1}|}", note: "Distance x from smaller charge Q₁ outside the region." },
                            { id: "three-charge", title: "Three Charge Equilibrium", type: "formula", formula: "q = -\\frac{Q}{4}", note: "Charge placed at the center of two equal charges Q for equilibrium.", important: true }
                        ]
                    }
                ]
            },
            {
                id: "field",
                title: "Electric Field",
                type: "topic",
                description: "Field intensity, motion of charges, and standard results.",
                children: [
                    {
                        id: "field-point-charge",
                        title: "Point Charges",
                        type: "subtopic",
                        description: "Field due to discrete point charges.",
                        children: [
                            { id: "field-intensity", title: "Electric Field Intensity", type: "formula", formula: "E = \\frac{F}{q}", note: "Defined using a small positive test charge." },
                            { id: "field-point", title: "Field Due To Point Charge", type: "formula", formula: "E = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{q}{r^2}", note: "Directed radially outward for +q.", important: true }
                        ]
                    },
                    {
                        id: "particle-kinematics",
                        title: "Motion in Electric Field",
                        type: "subtopic",
                        description: "Charged particle released in a uniform electric field.",
                        children: [
                            { id: "acceleration", title: "Acceleration", type: "formula", formula: "a = \\frac{qE}{m}", note: "Constant acceleration in uniform field." },
                            { id: "velocity-time", title: "Velocity (Time)", type: "formula", formula: "v = \\frac{qE}{m}t", note: "Velocity after time t." },
                            { id: "velocity-dist", title: "Velocity (Distance)", type: "formula", formula: "v = \\sqrt{\\frac{2qE}{m}x}", note: "Velocity after covering distance x." },
                            { id: "kinetic-energy", title: "Kinetic Energy", type: "formula", formula: "K.E = \\frac{q^2 E^2 t^2}{2m}", note: "Kinetic energy acquired in time t." }
                        ]
                    },
                    {
                        id: "pendulum",
                        title: "Charged Pendulum Time Period",
                        type: "subtopic",
                        description: "Time period of a charged pendulum in a uniform field.",
                        children: [
                            { id: "pendulum-down", title: "Downward Field (+q)", type: "formula", formula: "T = 2\\pi\\sqrt{\\frac{l}{g + \\frac{qE}{m}}}", note: "Effective gravity increases, time period decreases." },
                            { id: "pendulum-up", title: "Upward Field (+q)", type: "formula", formula: "T = 2\\pi\\sqrt{\\frac{l}{g - \\frac{qE}{m}}}", note: "Effective gravity decreases, time period increases." },
                            { id: "pendulum-horiz", title: "Horizontal Field", type: "formula", formula: "T = 2\\pi\\sqrt{\\frac{l}{\\sqrt{g^2 + (\\frac{qE}{m})^2}}}", note: "Effective gravity is the vector sum." }
                        ]
                    },
                    {
                        id: "continuous-distributions",
                        title: "Continuous Distributions",
                        type: "subtopic",
                        description: "Wire, arc, ring, disc, and sheet formulas.",
                        children: [
                            { id: "finite-wire", title: "Finite Line Charge", type: "formula", formula: "E = \\frac{k\\lambda}{r}(\\sin\\alpha + \\sin\\beta)", note: "Field at perpendicular distance r." },
                            { id: "infinite-wire", title: "Infinite Line Charge", type: "formula", formula: "E = \\frac{2k\\lambda}{r} = \\frac{\\lambda}{2\\pi\\varepsilon_0 r}", note: "Field is radial and perpendicular to the line.", important: true },
                            { id: "arc-center", title: "Circular Arc at Center", type: "formula", formula: "E_0 = \\frac{2k\\lambda}{r}\\sin\\left(\\frac{\\alpha}{2}\\right)", note: "α is the angle subtended by the arc." },
                            { id: "semicircle", title: "Semicircle at Center", type: "formula", formula: "E = \\frac{2k\\lambda}{r}", note: "Special case where α = 180°." },
                            { id: "ring-center", title: "Center of Ring", type: "formula", formula: "E = 0", note: "Field is zero at the center by symmetry." },
                            { id: "ring-axis", title: "Ring On Its Axis", type: "formula", formula: "E = \\frac{kQx}{(R^2 + x^2)^{3/2}}", note: "Maximum at x = R/√2." },
                            { id: "sheet-field", title: "Infinite Plane Sheet", type: "formula", formula: "E = \\frac{\\sigma}{2\\varepsilon_0}", note: "Uniform field, independent of distance.", important: true }
                        ]
                    }
                ]
            },
            {
                id: "dipole",
                title: "Electric Dipole",
                type: "topic",
                description: "Dipole moment, field, torque, and energy.",
                children: [
                    {
                        id: "dipole-field-axial",
                        title: "Field on Axes",
                        type: "subtopic",
                        description: "Formulas for a short dipole.",
                        children: [
                            { id: "dipole-axial-short", title: "Axial Field", type: "formula", formula: "E_{\\text{axial}} = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{2p}{r^3}", note: "Direction is same as dipole moment." },
                            { id: "dipole-equitorial-short", title: "Equatorial Field", type: "formula", formula: "E_{\\text{equi}} = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{p}{r^3}", note: "Direction is opposite to dipole moment.", important: true }
                        ]
                    },
                    {
                        id: "dipole-torque-energy",
                        title: "Torque & Energy",
                        type: "subtopic",
                        description: "Dipole in a uniform electric field.",
                        children: [
                            { id: "dipole-torque", title: "Torque Magnitude", type: "formula", formula: "\\tau = pE\\sin\\theta", note: "Maximum when θ = 90°.", important: true },
                            { id: "dipole-energy", title: "Potential Energy", type: "formula", formula: "U = -pE\\cos\\theta", note: "Minimum (stable) when aligned with field." }
                        ]
                    }
                ]
            },
            {
                id: "flux-gauss",
                title: "Flux & Gauss's Law",
                type: "topic",
                description: "Gauss's law and its applications.",
                children: [
                    {
                        id: "flux",
                        title: "Gauss's Law",
                        type: "subtopic",
                        description: "Core law and enclosed charge form.",
                        children: [
                            { id: "flux-plane", title: "Electric Flux", type: "formula", formula: "\\phi = \\int E \\cdot ds \\cos\\theta", note: "θ is the angle between E and the area vector." },
                            { id: "gauss-law-formula", title: "Gauss Law", type: "formula", formula: "\\oint E \\cdot ds \\cos\\theta = \\frac{q_{in}}{\\varepsilon_0}", note: "Relates flux through a closed surface to enclosed charge.", important: true }
                        ]
                    },
                    {
                        id: "cube-flux",
                        title: "Flux through a Cube",
                        type: "subtopic",
                        description: "Standard symmetrical results for a cube.",
                        children: [
                            { id: "cube-center", title: "Charge at Center", type: "formula", formula: "\\phi = \\frac{q}{\\varepsilon_0}", note: "Full flux passes through the cube." },
                            { id: "cube-face", title: "Charge at Face Center", type: "formula", formula: "\\phi = \\frac{q}{2\\varepsilon_0}", note: "Shared by 2 cubes." },
                            { id: "cube-edge", title: "Charge at Edge", type: "formula", formula: "\\phi = \\frac{q}{4\\varepsilon_0}", note: "Shared by 4 cubes." },
                            { id: "cube-corner", title: "Charge at Corner", type: "formula", formula: "\\phi = \\frac{q}{8\\varepsilon_0}", note: "Shared by 8 cubes." }
                        ]
                    },
                    {
                        id: "gauss-applications",
                        title: "Spheres & Shells",
                        type: "subtopic",
                        description: "Results derived from spherical symmetry.",
                        children: [
                            { id: "shell-outside", title: "Conducting Shell Outside", type: "formula", formula: "E = \\frac{kQ}{r^2}", note: "Behaves like a point charge for r > R." },
                            { id: "shell-inside", title: "Conducting Shell Inside", type: "formula", formula: "E = 0", note: "No enclosed charge for r < R.", important: true },
                            { id: "solid-sphere-inside", title: "Non-Conducting Sphere Inside", type: "formula", formula: "E = \\frac{kQr}{R^3}", note: "Field varies linearly with distance r for r < R." }
                        ]
                    }
                ]
            },
            {
                id: "graphs",
                title: "Important Graphs",
                type: "topic",
                description: "Visual representation of key electrostatic field variations.",
                children: [
                    {
                        id: "graphs-point-charge",
                        title: "Point Charge",
                        type: "subtopic",
                        description: "Field variation with distance.",
                        children: [
                            { 
                                id: "graph-e-point", 
                                title: "Electric Field vs r", 
                                type: "graph", 
                                desc: "E ∝ 1/r²",
                                graph: `
                                <svg viewBox="0 0 200 150" class="inline-graph">
                                    ${createAxes('E')}
                                    <path d="M 30,20 Q 40,110 170,120" stroke="#00e5ff" stroke-width="3" fill="none"/>
                                </svg>
                                `,
                                note: "Field drops off rapidly following inverse square law." 
                            }
                        ]
                    },
                    {
                        id: "graphs-ring",
                        title: "Charged Ring",
                        type: "subtopic",
                        description: "Field along the axis of a uniformly charged ring.",
                        children: [
                            { 
                                id: "graph-e-ring", 
                                title: "Electric Field vs x", 
                                type: "graph", 
                                desc: "E = kQx / (R² + x²)^(3/2)",
                                graph: `
                                <svg viewBox="0 0 200 150" class="inline-graph">
                                    ${createAxes('E', 'x')}
                                    <line x1="60" y1="130" x2="60" y2="30" stroke="#ffaa00" stroke-width="1" stroke-dasharray="4"/>
                                    <text x="50" y="145" fill="#ffaa00" font-size="10">R/√2</text>
                                    <path d="M 20,130 Q 35,30 60,30 T 180,125" stroke="#00e5ff" stroke-width="3" fill="none"/>
                                </svg>
                                `,
                                note: "Field is zero at center, rises to maximum at x = R/√2, then approaches zero." 
                            }
                        ]
                    },
                    {
                        id: "graphs-conducting-sphere",
                        title: "Conducting Sphere / Shell",
                        type: "subtopic",
                        description: "Charge resides entirely on the outer surface.",
                        children: [
                            { 
                                id: "graph-e-shell", 
                                title: "Electric Field vs r", 
                                type: "graph", 
                                desc: "E = 0 (Inside), E ∝ 1/r² (Outside)",
                                important: true,
                                graph: `
                                <svg viewBox="0 0 200 150" class="inline-graph">
                                    ${createAxes('E')}
                                    <line x1="80" y1="130" x2="80" y2="20" stroke="#ffaa00" stroke-width="1" stroke-dasharray="4"/>
                                    <text x="75" y="145" fill="#ffaa00" font-size="10">R</text>
                                    <line x1="20" y1="128" x2="80" y2="128" stroke="#00e5ff" stroke-width="3"/>
                                    <line x1="80" y1="128" x2="80" y2="30" stroke="#00e5ff" stroke-width="2" stroke-dasharray="2"/>
                                    <path d="M 80,30 Q 100,110 170,120" stroke="#00e5ff" stroke-width="3" fill="none"/>
                                </svg>
                                `,
                                note: "Discontinuous jump at surface r = R." 
                            }
                        ]
                    },
                    {
                        id: "graphs-non-conducting-sphere",
                        title: "Solid Non-Conducting Sphere",
                        type: "subtopic",
                        description: "Charge is distributed uniformly throughout the volume.",
                        children: [
                            { 
                                id: "graph-e-solid", 
                                title: "Electric Field vs r", 
                                type: "graph", 
                                desc: "E ∝ r (Inside), E ∝ 1/r² (Outside)",
                                important: true,
                                graph: `
                                <svg viewBox="0 0 200 150" class="inline-graph">
                                    ${createAxes('E')}
                                    <line x1="80" y1="130" x2="80" y2="20" stroke="#ffaa00" stroke-width="1" stroke-dasharray="4"/>
                                    <text x="75" y="145" fill="#ffaa00" font-size="10">R</text>
                                    <line x1="20" y1="130" x2="80" y2="30" stroke="#00e5ff" stroke-width="3"/>
                                    <path d="M 80,30 Q 100,110 170,120" stroke="#00e5ff" stroke-width="3" fill="none"/>
                                </svg>
                                `,
                                note: "Field is maximum at the surface r = R." 
                            }
                        ]
                    }
                ]
            }
        ]
    };

    const pathIds = ["root"];

    function findNodeById(node, id){
        if(node.id === id) return node;
        if(!node.children) return null;
        for(const child of node.children){
            const found = findNodeById(child, id);
            if(found) return found;
        }
        return null;
    }

    function getPathNodes(){
        return pathIds.map(id => findNodeById(flowData, id)).filter(Boolean);
    }

    function currentNode(){
        return findNodeById(flowData, pathIds[pathIds.length - 1]);
    }

    function getTopicNodes(){
        return flowData.children || [];
    }

    function getSelectedTopic(){
        return pathIds.length > 1 ? currentNode() : null;
    }

    function formatFormulaText(text){
        return `$$${text}$$`;
    }

    function renderBreadcrumbs(){
        const breadcrumbs = document.getElementById("breadcrumbs");
        const nodes = getPathNodes();
        breadcrumbs.innerHTML = "";

        nodes.forEach((node, index) => {
            const crumb = document.createElement("button");
            crumb.className = "crumb" + (index === nodes.length - 1 ? " active" : "");
            crumb.textContent = node.title;
            crumb.onclick = () => {
                pathIds.splice(index + 1);
                renderFlow();
            };
            breadcrumbs.appendChild(crumb);
        });

        const current = nodes[nodes.length - 1];
        const levelTag = document.getElementById("levelTag");
        const backOneBtn = document.getElementById("backOneBtn");
        
        levelTag.textContent = current.type === "topic" ? `Showing · ${current.title}` : `Select A Topic`;
        backOneBtn.disabled = nodes.length <= 1;
    }

    function createNodeCard(node){
        const card = document.createElement("div");
        card.className = `node-card ${node.type}`;

        const kicker = document.createElement("div");
        kicker.className = "card-kicker";
        kicker.textContent = node.type === "graph" ? "Standard Graph" : "Formula";

        if(node.important){
            const tag = document.createElement("span");
            tag.className = "importance-tag";
            tag.textContent = "★ Most Asked";
            kicker.appendChild(tag);
        }
        card.appendChild(kicker);

        const title = document.createElement("h3");
        title.className = "card-title";
        title.textContent = node.title;
        card.appendChild(title);

        if(node.desc) {
            const desc = document.createElement("p");
            desc.className = "card-desc";
            desc.innerHTML = `\\(${node.desc}\\)`;
            card.appendChild(desc);
        }

        if(node.formula){
            const formulaBox = document.createElement("div");
            formulaBox.className = "formula-box";

            const formulaMain = document.createElement("div");
            formulaMain.className = "formula-main";
            formulaMain.innerHTML = formatFormulaText(node.formula);
            formulaBox.appendChild(formulaMain);

            if(node.note){
                const formulaNote = document.createElement("div");
                formulaNote.className = "formula-note";
                formulaNote.textContent = node.note;
                formulaBox.appendChild(formulaNote);
            }
            card.appendChild(formulaBox);
        } else if (node.graph) {
            const graphBox = document.createElement("div");
            graphBox.className = "graph-box";
            graphBox.innerHTML = node.graph;

            if(node.note){
                const graphNote = document.createElement("div");
                graphNote.className = "formula-note";
                graphNote.textContent = node.note;
                graphBox.appendChild(graphNote);
            }
            card.appendChild(graphBox);
        }

        return card;
    }

    function getFormulaGroups(topic){
        return (topic.children || []).map(subtopic => ({
            title: subtopic.title,
            description: subtopic.description,
            items: subtopic.children || []
        }));
    }

    function renderFlow(){
        renderBreadcrumbs();

        const stage = document.getElementById("flowStage");
        stage.innerHTML = "";

        const browser = document.createElement("div");
        browser.className = "formula-browser";

        const topicRail = document.createElement("div");
        topicRail.className = "topic-rail";

        const selectedTopic = getSelectedTopic();
        getTopicNodes().forEach(topic => {
            const button = document.createElement("button");
            button.className = "topic-button" + (selectedTopic && selectedTopic.id === topic.id ? " active" : "");
            button.type = "button";
            button.innerHTML = `
              <span class="topic-button-title">${topic.title}</span>
              <span class="topic-button-desc">${topic.description || ""}</span>
            `;
            button.addEventListener("click", () => {
                pathIds.length = 0;
                pathIds.push("root", topic.id);
                renderFlow();
            });
            topicRail.appendChild(button);
        });

        const display = document.createElement("div");
        display.className = "formula-display";

        if(selectedTopic){
            const header = document.createElement("div");
            header.className = "display-header";
            header.innerHTML = `
              <div class="display-kicker">Current Topic</div>
              <h2 class="display-title">${selectedTopic.title}</h2>
              <p class="display-desc">${selectedTopic.description || ""}</p>
            `;
            display.appendChild(header);

            const stack = document.createElement("div");
            stack.className = "subtopic-stack";

            getFormulaGroups(selectedTopic).forEach(group => {
                const panel = document.createElement("section");
                panel.className = "subtopic-panel";

                const panelHeader = document.createElement("div");
                panelHeader.className = "subtopic-header";
                panelHeader.innerHTML = `
                  <h3 class="subtopic-title">${group.title}</h3>
                  <p class="subtopic-desc">${group.description || ""}</p>
                `;
                panel.appendChild(panelHeader);

                const list = document.createElement("div");
                list.className = "formula-list";
                group.items.forEach(node => {
                    list.appendChild(createNodeCard(node));
                });
                panel.appendChild(list);
                stack.appendChild(panel);
            });

            display.appendChild(stack);
        } else {
            const empty = document.createElement("div");
            empty.className = "empty-state";
            empty.textContent = "Select any topic from the left to show its formulas and graphs here.";
            display.appendChild(empty);
        }

        browser.appendChild(topicRail);
        browser.appendChild(display);
        stage.appendChild(browser);

        if(window.MathJax && window.MathJax.typesetPromise){
            window.MathJax.typesetPromise([stage]);
        }
    }

    renderFlow();

    document.getElementById("backOneBtn").addEventListener("click", () => {
        if(pathIds.length > 1){
            pathIds.pop();
            renderFlow();
        }
    });
    </script>
</body>
