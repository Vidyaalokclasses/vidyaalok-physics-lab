    <script>
    const flowData = {
        id: "root",
        title: "Electric Charges & Fields",
        type: "root",
        description: "Open a topic, then a subtopic, then the exact formula card you want.",
        children: [
            {
                id: "charge",
                title: "Electric Charge",
                type: "topic",
                description: "Basic properties of charge and charge distributions.",
                children: [
                    {
                        id: "charge-properties",
                        title: "Properties Of Charge",
                        type: "subtopic",
                        description: "Quantisation, conservation, and additivity.",
                        children: [
                            { id: "charge-quantisation", title: "Quantisation Of Charge", type: "formula", formula: "q = \\pm ne", note: "Here n is an integer and e = 1.6 × 10^-19 C.", important: true },
                            { id: "electron-proton-charge", title: "Magnitude Of Fundamental Charge", type: "formula", formula: "e = 1.6 \\times 10^{-19}\\,\\text{C}", note: "Electron has charge -e and proton has charge +e.", important: true },
                            { id: "charge-conservation", title: "Conservation Of Charge", type: "formula", formula: "q_{\\text{before}} = q_{\\text{after}}", note: "Charge can move from one body to another, but total charge remains conserved." }
                        ]
                    },
                    {
                        id: "charge-density",
                        title: "Charge Density",
                        type: "subtopic",
                        description: "Linear, surface, and volume distributions.",
                        children: [
                            { id: "linear-density", title: "Linear Charge Density", type: "formula", formula: "\\lambda = \\frac{dq}{dl}", note: "Charge per unit length, SI unit C m<sup>-1</sup>." },
                            { id: "linear-total", title: "Charge On Line Distribution", type: "formula", formula: "q = \\int \\lambda\\, dl", note: "Use integration when &lambda; varies along the length." },
                            { id: "surface-density", title: "Surface Charge Density", type: "formula", formula: "\\sigma = \\frac{dq}{dA}", note: "Charge per unit area, SI unit C m<sup>-2</sup>." },
                            { id: "surface-total", title: "Charge On Surface Distribution", type: "formula", formula: "q = \\int \\sigma\\, dA", note: "Use integration when &sigma; varies over the surface." },
                            { id: "volume-density", title: "Volume Charge Density", type: "formula", formula: "\\rho = \\frac{dq}{dV}", note: "Charge per unit volume, SI unit C m<sup>-3</sup>." },
                            { id: "volume-total", title: "Charge On Volume Distribution", type: "formula", formula: "q = \\int \\rho\\, dV", note: "Use integration when &rho; varies with position." }
                        ]
                    }
                ]
            },
            {
                id: "coulomb",
                title: "Coulomb's Law",
                type: "topic",
                description: "Electrostatic force between point charges.",
                children: [
                    {
                        id: "coulomb-force",
                        title: "Force Magnitude",
                        type: "subtopic",
                        description: "Vacuum, medium, and dielectric relation.",
                        children: [
                            { id: "coulomb-vacuum", title: "In Vacuum", type: "formula", formula: "F = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{|q_1 q_2|}{r^2}", note: "Acts along the line joining the charges.", important: true },
                            { id: "coulomb-medium", title: "In Medium", type: "formula", formula: "F = \\frac{1}{4\\pi\\varepsilon} \\cdot \\frac{|q_1 q_2|}{r^2}", note: "Here &epsilon; = K&epsilon;<sub>0</sub>." },
                            { id: "dielectric-constant", title: "Dielectric Constant Relation", type: "formula", formula: "K = \\frac{\\varepsilon}{\\varepsilon_0}", note: "Also called the relative permittivity of the medium." },
                            { id: "medium-force-relation", title: "Force In Medium vs Vacuum", type: "formula", formula: "F_{\\text{medium}} = \\frac{F_{\\text{vacuum}}}{K}", note: "Force decreases in a medium with dielectric constant K." }
                        ]
                    },
                    {
                        id: "coulomb-vector",
                        title: "Vector Form And Superposition",
                        type: "subtopic",
                        description: "Direction-sensitive force and net force due to many charges.",
                        children: [
                            { id: "coulomb-vector-form", title: "Vector Form", type: "formula", formula: "\\vec F_{12} = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{q_1 q_2}{r^2}\\, \\hat r", note: "r&#770; is the unit vector along the line joining the charges." },
                            { id: "superposition", title: "Principle Of Superposition", type: "formula", formula: "\\vec F_{\\text{net}} = \\vec F_1 + \\vec F_2 + \\vec F_3 + \\cdots", note: "Net force is the vector sum of all individual electrostatic forces." }
                        ]
                    }
                ]
            },
            {
                id: "field",
                title: "Electric Field",
                type: "topic",
                description: "Field intensity and standard electric field results.",
                children: [
                    {
                        id: "field-definition",
                        title: "Definition And Basic Relations",
                        type: "subtopic",
                        description: "Field in terms of force and motion.",
                        children: [
                            { id: "field-intensity", title: "Electric Field Intensity", type: "formula", formula: "E = \\frac{F}{q_0}", note: "Defined using a small positive test charge q<sub>0</sub>.", important: true },
                            { id: "force-on-charge", title: "Force On Charge", type: "formula", formula: "F = qE", note: "Direction is along E for positive charge and opposite for negative charge." },
                            { id: "acceleration-in-field", title: "Acceleration In Uniform Field", type: "formula", formula: "a = \\frac{qE}{m}", note: "Useful for charged particle motion in a uniform electric field." }
                        ]
                    },
                    {
                        id: "field-point-charge",
                        title: "Field Due To Charges",
                        type: "subtopic",
                        description: "Point charge and many-charge systems.",
                        children: [
                            { id: "field-point", title: "Field Due To Point Charge", type: "formula", formula: "E = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{q}{r^2}", note: "Directed radially outward for +q and inward for -q.", important: true },
                            { id: "field-many", title: "Field Due To System Of Charges", type: "formula", formula: "\\vec E = \\vec E_1 + \\vec E_2 + \\vec E_3 + \\cdots", note: "Electric field obeys vector superposition." }
                        ]
                    },
                    {
                        id: "symmetric-results",
                        title: "Symmetric Results",
                        type: "subtopic",
                        description: "Important quick results for common arrangements.",
                        children: [
                            { id: "polygon-centre", title: "Equal Charges On Regular Polygon", type: "formula", formula: "E_{\\text{centre}} = 0", note: "For identical charges symmetrically placed at corners of a regular polygon, net field at centre is zero." },
                            { id: "full-ring-centre", title: "Field At Centre Of Complete Ring", type: "formula", formula: "E_{\\text{centre}} = 0", note: "By symmetry, the field at the centre of a uniformly charged complete ring is zero." }
                        ]
                    },
                    {
                        id: "continuous-distributions",
                        title: "Continuous Charge Distributions",

                            { id: "finite-wire-general", title: "Finite Line Charge", type: "formula", formula: "E = \\frac{k\\lambda}{r}(\\sin\\theta_1 + \\sin\\theta_2)", note: "Field at perpendicular distance r from a finite uniformly charged wire." },
                            { id: "finite-wire-symmetric", title: "Finite Wire Symmetric Case", type: "formula", formula: "E = \\frac{2k\\lambda \\sin\\theta}{r}", note: "Used when the point lies on the perpendicular bisector of the wire." },
                            { id: "semi-infinite-wire", title: "Semi-Infinite Wire", type: "formula", formula: "E = \\frac{k\\lambda}{r}", note: "Special case of the finite-wire result." },
                            { id: "line-field", title: "Infinite Line Charge", type: "formula", formula: "E = \\frac{\\lambda}{2\\pi\\varepsilon_0 r}", note: "Field is radial and perpendicular to the line.", important: true },
                            { id: "arc-centre", title: "Uniformly Charged Arc At Centre", type: "formula", formula: "E = \\frac{2k\\lambda \\sin(\\theta/2)}{r}", note: "&theta; is the angular width of the arc in radians." },
                            { id: "semicircle-centre", title: "Semicircular Arc At Centre", type: "formula", formula: "E = \\frac{2k\\lambda}{r}", note: "Special case of the charged arc formula for &theta; = &pi;." },
                            { id: "ring-axis", title: "Ring On Its Axis", type: "formula", formula: "E = \\frac{kQx}{(R^2 + x^2)^{3/2}}", note: "Field at a point on the axis of a uniformly charged ring." },
                            { id: "ring-axis-maximum-position", title: "Position Of Maximum Field", type: "formula", formula: "x = \\frac{R}{\\sqrt{2}}", note: "The field due to a uniformly charged ring is maximum at this axial position." },
                            { id: "ring-axis-maximum", title: "Maximum Field On Ring Axis", type: "formula", formula: "E_{\\max} = \\frac{2kQ}{3\\sqrt{3}R^2}", note: "Maximum value of field on the ring axis." },
                            { id: "disc-axis", title: "Disc On Its Axis", type: "formula", formula: "E = \\frac{\\sigma}{2\\varepsilon_0} \\left[1 - \\frac{x}{\\sqrt{x^2 + R^2}}\\right]", note: "Field at a point on the axis of a uniformly charged disc." },

                            { id: "conductor-surface-field", title: "Just Outside Conductor", type: "formula", formula: "E = \\frac{\\sigma}{\\varepsilon_0}", note: "Normal to the conductor surface." },
                            { id: "inside-conductor-field", title: "Inside A Conductor", type: "formula", formula: "E = 0", note: "Electrostatic field inside a conductor is zero." }
                        ]
                    }
                ]
            },
            {
                id: "dipole",
                title: "Electric Dipole",
                type: "topic",
                description: "Dipole moment, field, torque, and energy.",

                            { id: "dipole-axial-short", title: "Short Dipole Axial Field", type: "formula", formula: "E_{\\text{axial}} = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{2p}{r^3}", note: "Valid for r >> a.", important: true }

                        description: "Exact and short-dipole formulas on the equatorial line.",
                        children: [
                            { id: "dipole-equitorial-exact", title: "Exact Equatorial Field", type: "formula", formula: "E_{\\text{equitorial}} = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{p}{(r^2 + a^2)^{3/2}}", note: "Direction is opposite to the dipole moment." },
                            { id: "dipole-equitorial-short", title: "Short Dipole Equatorial Field", type: "formula", formula: "E_{\\text{equitorial}} = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{p}{r^3}", note: "Valid for r >> a.", important: true }
                        ]
                    },
                    {
                        id: "dipole-general",
                        title: "Field At General Position",
                        type: "subtopic",
                        description: "Useful short-dipole general-point results.",
                        children: [
                            { id: "dipole-general-magnitude", title: "Magnitude Of Field", type: "formula", formula: "E = \\frac{kp}{r^3}\\sqrt{1 + 3\\cos^2\\theta}", note: "Standard short-dipole result at a general position." },
                            { id: "dipole-general-angle", title: "Direction Formula", type: "formula", formula: "\\tan\\alpha = \\frac{1}{2}\\tan\\theta", note: "α is the angle between electric field and radial direction." }
                        ]
                    },
                    {
                        id: "dipole-torque-energy",
                        title: "Torque And Potential Energy",
                        type: "subtopic",
                        description: "Dipole placed in a uniform electric field.",
                        children: [
                            { id: "dipole-torque-vector", title: "Torque Vector Form", type: "formula", formula: "\\vec\\tau = \\vec p \\times \\vec E", note: "Torque tends to align the dipole with the field." },
                            { id: "dipole-torque", title: "Torque Magnitude", type: "formula", formula: "\\tau = pE\\sin\\theta", note: "Maximum when θ = 90°.", important: true },
                            { id: "dipole-energy", title: "Potential Energy", type: "formula", formula: "U = -pE\\cos\\theta", note: "Minimum when dipole is aligned with the field.", important: true }
                        ]
                    }
                ]
            },
            {
                id: "flux-gauss",
                title: "Electric Flux And Gauss's Law",
                type: "topic",
                description: "Flux and direct Gauss law results.",
                children: [
                    {
                        id: "flux",
                        title: "Electric Flux",
                        type: "subtopic",
                        description: "Flux through plane and closed surfaces.",
                        children: [
                            { id: "flux-plane", title: "Flux Through Plane Surface", type: "formula", formula: "\\Phi = EA\\cos\\theta", note: "θ is the angle between E and the area vector.", important: true },
                            { id: "flux-closed", title: "Flux Through Closed Surface", type: "formula", formula: "\\Phi = \\oint \\vec E \\cdot d\\vec A", note: "For a closed surface the area vector is always outward." }
                        ]
                    },
                    {
                        id: "gauss-law",
                        title: "Gauss's Law",
                        type: "subtopic",
                        description: "Core law and enclosed charge form.",
                        children: [
                            { id: "gauss-law-formula", title: "Integral Form", type: "formula", formula: "\\oint \\vec E \\cdot d\\vec A = \\frac{q_{\\text{enc}}}{\\varepsilon_0}", note: "Gauss's law relates flux through a closed surface to charge enclosed.", important: true }
                        ]
                    },
                    {
                        id: "gauss-applications",
                        title: "Applications Of Gauss's Law",
                        type: "subtopic",
                        description: "High-yield symmetry-based results.",
                        children: [
                            { id: "gauss-line", title: "Infinite Line Charge", type: "formula", formula: "E = \\frac{\\lambda}{2\\pi\\varepsilon_0 r}", note: "Obtained using a cylindrical Gaussian surface." },
                            { id: "gauss-sheet", title: "Infinite Plane Sheet", type: "formula", formula: "E = \\frac{\\sigma}{2\\varepsilon_0}", note: "Obtained using a pillbox Gaussian surface." },
                            { id: "gauss-conductor", title: "Conductor Surface", type: "formula", formula: "E = \\frac{\\sigma}{\\varepsilon_0}", note: "Applies just outside a conductor surface." },
                            { id: "shell-outside", title: "Thin Spherical Shell Outside", type: "formula", formula: "E = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{Q}{r^2}", note: "Outside the shell it behaves like a point charge." },
                            { id: "shell-inside", title: "Thin Spherical Shell Inside", type: "formula", formula: "E = 0", note: "Inside a thin charged spherical shell the field is zero." },
                            { id: "solid-sphere-outside", title: "Solid Sphere Outside", type: "formula", formula: "E = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{Q}{r^2}", note: "Outside a uniformly charged non-conducting sphere." },
                            { id: "solid-sphere-inside", title: "Solid Sphere Inside", type: "formula", formula: "E = \\frac{1}{4\\pi\\varepsilon_0} \\cdot \\frac{Qr}{R^3}", note: "Inside a uniformly charged non-conducting sphere, E varies linearly with r." }
                        ]
                    }
                ]
            }
        ]
    };

    const pathIds = ["root"];

    function findNodeById(node, id){
        if(node.id === id) return node;
        if(!node.children) return null;

        for(const child of node.children){
            const found = findNodeById(child, id);
            if(found) return found;
        }

        return null;
    }

    function getPathNodes(){
        return pathIds.map(id => findNodeById(flowData, id)).filter(Boolean);
    }

    function currentNode(){
        return findNodeById(flowData, pathIds[pathIds.length - 1]);
    }

    function getTopicNodes(){
        return flowData.children || [];
    }

    function getSelectedTopic(){
        return pathIds.length > 1 ? currentNode() : null;
    }

    function formatFormulaText(text){
        return `\\[${text}\\]`;
    }

    function formatNoteText(text){
        return text;
    }

    function renderBreadcrumbs(){
        const breadcrumbs = document.getElementById("breadcrumbs");
        const nodes = getPathNodes();
        breadcrumbs.innerHTML = "";

        nodes.forEach((node, index) => {
            const crumb = document.createElement("button");
            crumb.className = "crumb" + (index === nodes.length - 1 ? " active" : "");
            crumb.textContent = node.title;
            crumb.onclick = () => {
                pathIds.splice(index + 1);
                renderFlow();
            };
            breadcrumbs.appendChild(crumb);
        });

        const current = nodes[nodes.length - 1];
        const levelTag = document.getElementById("levelTag");
        const backOneBtn = document.getElementById("backOneBtn");
        
        levelTag.textContent = current.type === "topic" ? `Showing · ${current.title}` : `Select A Topic`;
        backOneBtn.disabled = nodes.length <= 1;
    }

    function createNodeCard(node, extraClass = ""){
        const card = document.createElement("div");
        card.className = `node-card ${node.type} ${extraClass}`.trim();

        const kicker = document.createElement("div");
        kicker.className = "card-kicker";
        kicker.textContent = "Formula";

        if(node.important){
            const tag = document.createElement("span");
            tag.className = "importance-tag";
            tag.textContent = "★ Most Asked";
            kicker.appendChild(tag);
        }
        card.appendChild(kicker);

        const title = document.createElement("h3");
        title.className = "card-title";
        title.textContent = node.title;
        card.appendChild(title);

        if(node.formula){
            const formulaBox = document.createElement("div");
            formulaBox.className = "formula-box";

            const formulaMain = document.createElement("div");
            formulaMain.className = "formula-main";
            formulaMain.innerHTML = formatFormulaText(node.formula);
            formulaBox.appendChild(formulaMain);

            if(node.note){
                const formulaNote = document.createElement("div");
                formulaNote.className = "formula-note";
                formulaNote.innerHTML = formatNoteText(node.note);
                formulaBox.appendChild(formulaNote);
            }

            card.appendChild(formulaBox);
        }

        return card;
    }

    function getFormulaGroups(topic){
        return (topic.children || []).map(subtopic => ({
            title: subtopic.title,
            description: subtopic.description,
            formulas: subtopic.children || []
        }));
    }

    function renderFlow(){
        renderBreadcrumbs();

        const stage = document.getElementById("flowStage");
        stage.innerHTML = "";

        const browser = document.createElement("div");
        browser.className = "formula-browser";

        const topicRail = document.createElement("div");
        topicRail.className = "topic-rail";

        const selectedTopic = getSelectedTopic();
        getTopicNodes().forEach(topic => {
            const button = document.createElement("button");
            button.className = "topic-button" + (selectedTopic && selectedTopic.id === topic.id ? " active" : "");
            button.type = "button";
            button.innerHTML = `
              <span class="topic-button-title">${topic.title}</span>
              <span class="topic-button-desc">${topic.description || ""}</span>
            `;
            button.addEventListener("click", () => {
                pathIds.length = 0;
                pathIds.push("root", topic.id);
                renderFlow();
            });
            topicRail.appendChild(button);
        });

        const display = document.createElement("div");
        display.className = "formula-display";

        if(selectedTopic){
            const header = document.createElement("div");
            header.className = "display-header";
            header.innerHTML = `
              <div class="display-kicker">Current Topic</div>
              <h2 class="display-title">${selectedTopic.title}</h2>
              <p class="display-desc">${selectedTopic.description || ""}</p>
            `;
            display.appendChild(header);

            const stack = document.createElement("div");
            stack.className = "subtopic-stack";

            getFormulaGroups(selectedTopic).forEach(group => {
                const panel = document.createElement("section");
                panel.className = "subtopic-panel";

                const panelHeader = document.createElement("div");
                panelHeader.className = "subtopic-header";
                panelHeader.innerHTML = `
                  <h3 class="subtopic-title">${group.title}</h3>
                  <p class="subtopic-desc">${group.description || ""}</p>
                `;
                panel.appendChild(panelHeader);

                const formulaList = document.createElement("div");
                formulaList.className = "formula-list";
                group.formulas.forEach(formulaNode => {
                    formulaList.appendChild(createNodeCard(formulaNode, "formula"));
                });
                panel.appendChild(formulaList);
                stack.appendChild(panel);
            });

            display.appendChild(stack);
        } else {
            const empty = document.createElement("div");
            empty.className = "empty-state";
            empty.textContent = "Select any topic from the left to show its formulas here. Opening another topic will replace the current one.";
            display.appendChild(empty);
        }

        browser.appendChild(topicRail);
        browser.appendChild(display);
        stage.appendChild(browser);

        if(window.MathJax && window.MathJax.typesetPromise){
            window.MathJax.typesetPromise([stage]);
        }
    }

    renderFlow();

    document.getElementById("backOneBtn").addEventListener("click", () => {
        if(pathIds.length > 1){
            pathIds.pop();
            renderFlow();
        }
    });
    </script>
</body>
</html>
