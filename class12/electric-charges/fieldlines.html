    <style>

        select, input[type="number"], input[type="range"] {

        input[type="range"]::-webkit-slider-thumb {

        .right-panel {

<body>
    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 01</a>
        <h1>Electric Field Lines</h1>
    </nav>

    <div class="workspace">
        <div class="controls">
            <h2>Parameters</h2>

            <div class="instructions">
                Drag charges in 2D mode. Field lines leave positive charges and enter negative ones. Toggle equipotentials to see constant-potential curves.
            </div>

            <div class="control-group">
                <label for="dimension">Dimension</label>
                <select id="dimension">
                    <option value="2d">2D View (Interactive)</option>
                    <option value="3d">3D View (Orbit)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="mode">Charge Configuration</label>
                <select id="mode">
                    <option value="single+">Single Positive</option>
                    <option value="single-">Single Negative</option>
                    <option value="two">Two Charges</option>
                </select>
            </div>

            <div class="control-group" id="controls-custom" style="display:none;">
                <label>Charge Values (q)</label>
                <div class="charge-grid">
                    <input type="number" id="q1" value="1" step="0.5">
                    <input type="number" id="q2" value="-1" step="0.5">
                </div>
            </div>

            <div class="control-group">
                <label>Field Line Density <span id="densityVal">16</span></label>
                <input type="range" id="density" min="8" max="36" step="2" value="16">
            </div>

            <div class="toggle-row">
                <input type="checkbox" id="showEquipotential">
                <label for="showEquipotential" style="text-transform:none; letter-spacing:0; font-weight:500;">Show Equipotential Contours</label>
            </div>

            <div class="btn-row">
                <button class="btn" id="resetBtn">Reset Positions</button>
                <button class="btn btn-primary" id="rebuildBtn">Rebuild</button>
            </div>

            <div class="legend">
                <span style="color:#ff5555;">● Positive Charge</span>
                <span style="color:#33ff88;">● Negative Charge</span>
                <span style="color:#00e5ff;">— Field Lines</span>
                <span style="color:#ffaa00;">⋯ Equipotentials</span>
            </div>
        </div>

        <div class="right-panel" id="simWrapper">
            <div class="watermark"></div>
            <canvas id="canvas2d"></canvas>
            <div id="container3d" style="display:none;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

    <script>
        const canvas = document.getElementById("canvas2d");
        const ctx = canvas.getContext("2d");
        const mode = document.getElementById("mode");
        const dimension = document.getElementById("dimension");
        const controlsCustom = document.getElementById("controls-custom");
        const container3d = document.getElementById("container3d");
        const q1 = document.getElementById("q1");
        const q2 = document.getElementById("q2");
        const densitySlider = document.getElementById("density");
        const densityVal = document.getElementById("densityVal");
        const showEquipotential = document.getElementById("showEquipotential");
        const resetBtn = document.getElementById("resetBtn");
        const rebuildBtn = document.getElementById("rebuildBtn");

        let charges = [];
        let is3D = false;
        let dragging = null;          // index of charge being dragged
        let scene, camera, renderer, orbit;
        let chargeMeshes = [];
        let fieldLineObjects = [];
        let animationStarted = false;

        // ---------- RESIZE ----------
        const resizeObserver = new ResizeObserver(entries => {
            window.requestAnimationFrame(() => {
                for (let entry of entries) {
                    if (entry.target.id === 'simWrapper') {
                        canvas.width = Math.floor(entry.contentRect.width);
                        canvas.height = Math.floor(entry.contentRect.height);
                        if (is3D && renderer) onWindowResize();
                        if (!is3D) setCharges(false); // keep relative positions
                    }
                }
            });
        });
        resizeObserver.observe(document.getElementById('simWrapper'));

        // ---------- CHARGE SETUP ----------
        function setCharges(resetPositions = true) {
            const cx = canvas.width / 2 || 300;
            const cy = canvas.height / 2 || 200;

            if (mode.value === "single+") {
                if (resetPositions || charges.length !== 1) {
                    charges = [{ x: cx, y: cy, z: 0, q: 1 }];
                } else {
                    charges[0].q = 1;
                }
            } else if (mode.value === "single-") {
                if (resetPositions || charges.length !== 1) {
                    charges = [{ x: cx, y: cy, z: 0, q: -1 }];
                } else {
                    charges[0].q = -1;
                }
            } else {
                const qA = parseFloat(q1.value) || 1;
                const qB = parseFloat(q2.value) || -1;
                if (resetPositions || charges.length !== 2) {
                    charges = [
                        { x: cx - 110, y: cy, z: 0, q: qA },
                        { x: cx + 110, y: cy, z: 0, q: qB }
                    ];
                } else {
                    charges[0].q = qA;
                    charges[1].q = qB;
                }
            }
        }

        function updateMode() {
            controlsCustom.style.display = (mode.value === "two") ? "flex" : "none";
            setCharges(true);
            if (is3D && scene) rebuild3D();
        }

        function switchMode() {
            is3D = (dimension.value === "3d");
            canvas.style.display = is3D ? "none" : "block";
            container3d.style.display = is3D ? "block" : "none";
            if (is3D) {
                init3D();
                rebuild3D();
            }
        }

        // ---------- 2D PHYSICS ----------
        function field2D(x, y) {
            let Ex = 0, Ey = 0;
            charges.forEach(c => {
                const dx = x - c.x;
                const dy = y - c.y;
                const r2 = dx * dx + dy * dy + 0.8;
                const r = Math.sqrt(r2);
                const k = c.q / (r2 * r);
                Ex += k * dx;
                Ey += k * dy;
            });
            return { Ex, Ey };
        }

        function potential2D(x, y) {
            let V = 0;
            charges.forEach(c => {
                const r = Math.hypot(x - c.x, y - c.y) + 1.5;
                V += c.q / r;
            });
            return V;
        }

        function trace2D(x, y, chargeSign) {
            const path = [];
            for (let i = 0; i < 480; i++) {
                const { Ex, Ey } = field2D(x, y);
                const mag = Math.hypot(Ex, Ey);
                if (mag < 1e-5) break;
                const ux = Ex / mag;
                const uy = Ey / mag;
                const dir = chargeSign > 0 ? 1 : -1;
                x += dir * ux * 2.2;
                y += dir * uy * 2.2;
                path.push({ x, y });
                for (const c of charges) {
                    if (Math.hypot(x - c.x, y - c.y) < 10) return path;
                }
                if (x < -50 || x > canvas.width + 50 || y < -50 || y > canvas.height + 50) break;
            }
            return path;
        }

        function drawArrow2D(x, y, angle) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 7 * Math.cos(angle - 0.4), y - 7 * Math.sin(angle - 0.4));
            ctx.lineTo(x - 7 * Math.cos(angle + 0.4), y - 7 * Math.sin(angle + 0.4));
            ctx.fillStyle = "#00e5ff";
            ctx.fill();
        }

        // Simple equipotential contours (marching-squares style approximation)
        function drawEquipotentials() {
            if (!showEquipotential.checked) return;
            const step = 18;
            const levels = [-0.8, -0.4, -0.15, 0.15, 0.4, 0.8];
            ctx.strokeStyle = "rgba(255, 170, 0, 0.55)";
            ctx.lineWidth = 1.2;
            ctx.setLineDash([4, 4]);

            for (const level of levels) {
                for (let y = 0; y < canvas.height; y += step) {
                    for (let x = 0; x < canvas.width; x += step) {
                        const v00 = potential2D(x, y);
                        const v10 = potential2D(x + step, y);
                        const v01 = potential2D(x, y + step);
                        const v11 = potential2D(x + step, y + step);

                        // very lightweight contour segments
                        if ((v00 - level) * (v10 - level) < 0) {
                            const t = (level - v00) / (v10 - v00);
                            ctx.beginPath();
                            ctx.moveTo(x + t * step, y);
                            ctx.lineTo(x + t * step, y + 2);
                            ctx.stroke();
                        }
                        if ((v00 - level) * (v01 - level) < 0) {
                            const t = (level - v00) / (v01 - v00);
                            ctx.beginPath();
                            ctx.moveTo(x, y + t * step);
                            ctx.lineTo(x + 2, y + t * step);
                            ctx.stroke();
                        }
                    }
                }
            }
            ctx.setLineDash([]);
        }

        function draw2D() {
            if (is3D || canvas.width === 0) {
                requestAnimationFrame(draw2D);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEquipotentials();

            // Field lines
            const lines = parseInt(densitySlider.value, 10);
            charges.forEach(c => {
                for (let i = 0; i < lines; i++) {
                    const angle = (i / lines) * Math.PI * 2;
                    const sx = c.x + Math.cos(angle) * 15;
                    const sy = c.y + Math.sin(angle) * 15;
                    const path = trace2D(sx, sy, c.q);
                    if (path.length < 3) continue;

                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    path.forEach(p => ctx.lineTo(p.x, p.y));
                    ctx.strokeStyle = "#00e5ff";
                    ctx.lineWidth = 1.4;
                    ctx.stroke();

                    for (let j = 25; j < path.length; j += 55) {
                        const p = path[j];
                        const { Ex, Ey } = field2D(p.x, p.y);
                        drawArrow2D(p.x, p.y, Math.atan2(Ey, Ex));
                    }
                }
            });

            // Charges
            charges.forEach((c, idx) => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 13, 0, Math.PI * 2);
                ctx.fillStyle = c.q > 0 ? "#ff4444" : "#33ff88";
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = dragging === idx ? "#ffffff" : "rgba(255,255,255,0.75)";
                ctx.stroke();

                // label
                ctx.fillStyle = "#fff";
                ctx.font = "bold 12px system-ui";
                ctx.textAlign = "center";
                ctx.fillText(c.q > 0 ? "+" : "−", c.x, c.y + 4);
            });

            requestAnimationFrame(draw2D);
        }

        // ---------- DRAG HANDLING (2D) ----------
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function hitTest(x, y) {
            for (let i = 0; i < charges.length; i++) {
                if (Math.hypot(x - charges[i].x, y - charges[i].y) < 18) return i;
            }
            return null;
        }

        canvas.addEventListener("mousedown", e => {
            if (is3D) return;
            const p = getPointerPos(e);
            dragging = hitTest(p.x, p.y);
        });
        canvas.addEventListener("mousemove", e => {
            if (dragging === null || is3D) return;
            const p = getPointerPos(e);
            charges[dragging].x = p.x;
            charges[dragging].y = p.y;
        });
        window.addEventListener("mouseup", () => { dragging = null; });

        // Touch
        canvas.addEventListener("touchstart", e => {
            if (is3D) return;
            e.preventDefault();
            const p = getPointerPos(e);
            dragging = hitTest(p.x, p.y);
        }, { passive: false });
        canvas.addEventListener("touchmove", e => {
            if (dragging === null || is3D) return;
            e.preventDefault();
            const p = getPointerPos(e);
            charges[dragging].x = p.x;
            charges[dragging].y = p.y;
        }, { passive: false });
        window.addEventListener("touchend", () => { dragging = null; });

        // ---------- 3D ----------
        function init3D() {
            if (renderer) return;
            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(55, container3d.clientWidth / container3d.clientHeight, 0.1, 2000);
            camera.position.set(0, 35, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(container3d.clientWidth, container3d.clientHeight);
            container3d.innerHTML = "";
            container3d.appendChild(renderer.domElement);

            orbit = new THREE.OrbitControls(camera, renderer.domElement);
            orbit.enableDamping = true;
            orbit.dampingFactor = 0.08;
            orbit.minDistance = 30;
            orbit.maxDistance = 220;

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const key = new THREE.DirectionalLight(0xffffff, 0.85);
            key.position.set(50, 70, 60);
            scene.add(key);

            const grid = new THREE.GridHelper(140, 14, 0x333333, 0x222222);
            grid.position.y = -30;
            scene.add(grid);

            if (!animationStarted) {
                animationStarted = true;
                animate3D();
            }
        }

        function onWindowResize() {
            if (!renderer || !camera) return;
            const w = container3d.clientWidth;
            const h = container3d.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function to3D(c) {
            const cx = canvas.width / 2 || 300;
            const cy = canvas.height / 2 || 200;
            return new THREE.Vector3((c.x - cx) / 3.2, -(c.y - cy) / 3.2, 0);
        }

        function field3D(x, y, z) {
            let Ex = 0, Ey = 0, Ez = 0;
            charges.forEach(c => {
                const p = to3D(c);
                const dx = x - p.x, dy = y - p.y, dz = z - p.z;
                const r2 = dx*dx + dy*dy + dz*dz + 0.4;
                const r = Math.sqrt(r2);
                const k = c.q / (r2 * r);
                Ex += k * dx; Ey += k * dy; Ez += k * dz;
            });
            return { Ex, Ey, Ez };
        }

        function getSphereSeeds(radius, count) {
            const seeds = [];
            const offset = 2 / count;
            const inc = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < count; i++) {
                const y = ((i * offset) - 1) + (offset / 2);
                const r = Math.sqrt(1 - y * y);
                const phi = i * inc;
                seeds.push(new THREE.Vector3(Math.cos(phi) * r * radius, y * radius, Math.sin(phi) * r * radius));
            }
            return seeds;
        }

        function trace3D(start, sign) {
            const path = [];
            const pos = start.clone();
            for (let i = 0; i < 380; i++) {
                const { Ex, Ey, Ez } = field3D(pos.x, pos.y, pos.z);
                const mag = Math.hypot(Ex, Ey, Ez);
                if (mag < 2e-5) break;
                const dir = sign > 0 ? 1 : -1;
                pos.x += dir * (Ex / mag) * 1.3;
                pos.y += dir * (Ey / mag) * 1.3;
                pos.z += dir * (Ez / mag) * 1.3;
                path.push(pos.clone());
                if (Math.abs(pos.x) > 110 || Math.abs(pos.y) > 110 || Math.abs(pos.z) > 110) break;
            }
            return path;
        }

        function clearList(list) {
            list.forEach(obj => {
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
            });
            list.length = 0;
        }

        function rebuild3D() {
            if (!scene) return;
            setCharges(false);
            clearList(chargeMeshes);
            clearList(fieldLineObjects);

            const isMobile = window.innerWidth < 900;
            const seedCount = isMobile ? (mode.value === "two" ? 16 : 22) : (mode.value === "two" ? 22 : 32);

            charges.forEach(c => {
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(2.6, 24, 24),
                    new THREE.MeshPhongMaterial({
                        color: c.q > 0 ? 0xff4444 : 0x33ff88,
                        emissive: c.q > 0 ? 0x440000 : 0x003311
                    })
                );
                sphere.position.copy(to3D(c));
                scene.add(sphere);
                chargeMeshes.push(sphere);
            });

            charges.forEach(c => {
                const center = to3D(c);
                const seeds = getSphereSeeds(3.6, seedCount);
                seeds.forEach(seed => {
                    const start = center.clone().add(seed);
                    const points = trace3D(start, c.q);
                    if (points.length < 3) return;
                    const geo = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x00e5ff }));
                    scene.add(line);
                    fieldLineObjects.push(line);
                });
            });

            orbit.target.set(0, 0, 0);
            orbit.update();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (renderer && scene && camera) {
                orbit.update();
                renderer.render(scene, camera);
            }
        }

        // ---------- EVENTS ----------
        densitySlider.addEventListener("input", () => {
            densityVal.textContent = densitySlider.value;
        });

        mode.addEventListener("change", updateMode);
        dimension.addEventListener("change", switchMode);
        q1.addEventListener("input", () => { setCharges(false); if (is3D) rebuild3D(); });
        q2.addEventListener("input", () => { setCharges(false); if (is3D) rebuild3D(); });
        showEquipotential.addEventListener("change", () => {}); // redraw happens automatically
        resetBtn.addEventListener("click", () => {
            setCharges(true);
            if (is3D) rebuild3D();
        });
        rebuildBtn.addEventListener("click", () => {
            if (is3D) rebuild3D();
        });

        // Init
        updateMode();
        draw2D();
    </script>
</body>
</html>
