<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Field Lines | Vidyaalok Lab</title>
    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
            --positive: #ff3366;
            --negative: #33ccff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 1rem 2rem;
            background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.8);
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex-grow: 1;
            padding: 1.5rem;
            gap: 1.5rem;
            height: calc(100vh - 70px);
            box-sizing: border-box;
        }

        /* Control Panel */
        .controls {
            width: 350px;
            flex-shrink: 0; 
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .controls h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            padding-bottom: 0.5rem;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .instructions strong {
            color: var(--primary);
        }

        /* Action Buttons */
        .btn {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-pos {
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--positive);
            color: var(--positive);
        }
        .btn-pos:hover {
            background: var(--positive);
            color: white;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
        }

        .btn-neg {
            background: rgba(51, 204, 255, 0.1);
            border-color: var(--negative);
            color: var(--negative);
        }
        .btn-neg:hover {
            background: var(--negative);
            color: white;
            box-shadow: 0 0 15px rgba(51, 204, 255, 0.5);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
            color: var(--text-main);
            margin-top: auto;
        }
        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-main);
        }

        /* Canvas Area */
        .canvas-container {
            flex-grow: 1;
            min-width: 0; 
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%; 
            height: 75%;
            background-image: url('../../logo.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.12; 
            pointer-events: none; 
            z-index: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            cursor: grab;
        }
        
        canvas:active {
            cursor: grabbing;
        }
        
        @media (max-width: 900px) {
            .workspace {
                flex-direction: column;
                overflow-y: auto;
                height: auto;
            }
            .controls {
                width: 100%;
            }
            .canvas-container {
                height: 600px;
                flex-grow: 0;
            }
            body { overflow: auto; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 01</a>
        <h1>Electric Field Lines</h1>
    </nav>

    <div class="workspace">
        <div class="controls">
            <h2>Charge Controls</h2>

            <div class="instructions">
                <strong>Click and drag</strong> charges on the canvas to see how the electric field vector grid responds in real-time.
            </div>

            <button class="btn btn-pos" onclick="addCharge(1)">+ Add Positive Charge</button>
            <button class="btn btn-neg" onclick="addCharge(-1)">- Add Negative Charge</button>

            <button class="btn btn-clear" onclick="clearCharges()">Clear All Charges</button>
        </div>

        <div class="canvas-container" id="simWrapper">
            <div class="watermark"></div>
            <canvas id="simCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // State Variables
        let charges = [];
        let draggingCharge = null;
        const chargeRadius = 25;
        const gridSpacing = 40; // Pixels between each vector arrow

        // --- RESIZE OBSERVER ---
        const resizeObserver = new ResizeObserver(entries => {
            window.requestAnimationFrame(() => {
                for (let entry of entries) {
                    if (entry.target.id === 'simWrapper') {
                        canvas.width = Math.floor(entry.contentRect.width);
                        canvas.height = Math.floor(entry.contentRect.height);
                    }
                }
                // Initialize with a dipole if empty
                if (charges.length === 0 && canvas.width > 0) {
                    charges.push({ x: canvas.width / 2 - 100, y: canvas.height / 2, q: 1 });
                    charges.push({ x: canvas.width / 2 + 100, y: canvas.height / 2, q: -1 });
                }
                draw();
            });
        });

        resizeObserver.observe(document.getElementById('simWrapper'));

        // --- PHYSICS & RENDERING ---
        function calculateEField(x, y) {
            let Ex = 0;
            let Ey = 0;
            const k = 10000; // Arbitrary scale factor for visuals

            for (let c of charges) {
                let dx = x - c.x;
                let dy = y - c.y;
                let r2 = dx * dx + dy * dy;
                
                if (r2 < 400) r2 = 400; // Prevent infinite field lines at the exact center of a charge

                let r = Math.sqrt(r2);
                let E = (k * c.q) / r2;
                Ex += E * (dx / r);
                Ey += E * (dy / r);
            }
            return { Ex, Ey };
        }

        function drawVector(x, y, Ex, Ey) {
            let mag = Math.sqrt(Ex * Ex + Ey * Ey);
            if (mag === 0) return;

            // Normalize vector direction
            let nx = Ex / mag;
            let ny = Ey / mag;

            // Map magnitude to a visible arrow length and opacity
            let len = Math.min(gridSpacing * 0.7, Math.max(5, mag * 2));
            let opacity = Math.min(0.8, Math.max(0.1, mag / 2));

            // Color shift based on dominant field (reddish for positive, cyan for negative)
            let color = `rgba(255, 255, 255, ${opacity})`;
            if (mag > 0.5) {
                // If it's a strong field, color code it slightly
                color = `rgba(0, 229, 255, ${opacity})`; // Default cyan-ish
            }

            const endX = x + nx * (len / 2);
            const endY = y + ny * (len / 2);
            const startX = x - nx * (len / 2);
            const startY = y - ny * (len / 2);

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);

            // Draw arrowhead
            const headlen = len * 0.3;
            const angle = Math.atan2(ny, nx);
            ctx.lineTo(endX - headlen * Math.cos(angle - Math.PI / 6), endY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - headlen * Math.cos(angle + Math.PI / 6), endY - headlen * Math.sin(angle + Math.PI / 6));

            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Vector Field Grid
            if (charges.length > 0) {
                for (let x = gridSpacing / 2; x < canvas.width; x += gridSpacing) {
                    for (let y = gridSpacing / 2; y < canvas.height; y += gridSpacing) {
                        let { Ex, Ey } = calculateEField(x, y);
                        drawVector(x, y, Ex, Ey);
                    }
                }
            } else {
                ctx.fillStyle = "rgba(255,255,255,0.2)";
                ctx.font = "1.2rem system-ui";
                ctx.textAlign = "center";
                ctx.fillText("Add charges to visualize the electric field.", canvas.width / 2, canvas.height / 2);
            }

            // 2. Draw Charges
            for (let c of charges) {
                let color = c.q > 0 ? "#ff3366" : "#33ccff";
                let glow = c.q > 0 ? "rgba(255, 51, 102, 0.4)" : "rgba(51, 204, 255, 0.4)";

                // Glow
                ctx.beginPath();
                ctx.arc(c.x, c.y, chargeRadius + (c === draggingCharge ? 10 : 8), 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();

                // Core
                ctx.beginPath();
                ctx.arc(c.x, c.y, chargeRadius, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                ctx.stroke();

                // Sign
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 24px system-ui";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(c.q > 0 ? "+" : "-", c.x, c.y);
            }
        }

        // --- INTERACTIVITY ---
        function addCharge(sign) {
            // Drop new charge near the center, with slight random offset so they don't stack perfectly
            const offset = (Math.random() - 0.5) * 50;
            charges.push({
                x: canvas.width / 2 + offset,
                y: canvas.height / 2 + offset,
                q: sign
            });
            draw();
        }

        function clearCharges() {
            charges = [];
            draw();
        }

        // Mouse Events for Dragging
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            for (let i = charges.length - 1; i >= 0; i--) {
                let c = charges[i];
                let dx = mouseX - c.x;
                let dy = mouseY - c.y;
                if (dx * dx + dy * dy <= chargeRadius * chargeRadius) {
                    draggingCharge = c;
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (draggingCharge) {
                const rect = canvas.getBoundingClientRect();
                draggingCharge.x = e.clientX - rect.left;
                draggingCharge.y = e.clientY - rect.top;
                
                // Keep inside bounds
                draggingCharge.x = Math.max(chargeRadius, Math.min(canvas.width - chargeRadius, draggingCharge.x));
                draggingCharge.y = Math.max(chargeRadius, Math.min(canvas.height - chargeRadius, draggingCharge.y));
                
                // Use requestAnimationFrame for smooth drawing while dragging
                window.requestAnimationFrame(draw);
            }
        });

        window.addEventListener('mouseup', () => {
            if (draggingCharge) {
                draggingCharge = null;
                draw();
            }
        });

    </script>
</body>
</html>
