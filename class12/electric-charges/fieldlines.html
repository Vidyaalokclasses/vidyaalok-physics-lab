<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Electric Field Lines | Vidyaalok Lab</title>
    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 1rem 2rem;
            background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.8);
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex-grow: 1;
            padding: 1.5rem;
            gap: 1.5rem;
            height: calc(100vh - 70px);
            box-sizing: border-box;
        }

        /* Control Panel */
        .controls {
            width: 380px;
            flex-shrink: 0; 
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .controls h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            padding-bottom: 0.5rem;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            color: #e6f2ff;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input[type="number"] {
            width: 100%;
            background: rgba(0,0,0,0.3);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        
        select option {
            background: var(--bg-dark);
        }

        .charge-grid {
            display: flex;
            gap: 10px;
        }

        .legend {
            margin-top: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            font-size: 0.9rem;
            line-height: 1.8;
            color: var(--text-muted);
        }

        .legend span {
            display: block;
            font-weight: bold;
        }

        /* Canvas Area */
        .right-panel {
            flex-grow: 1;
            min-width: 0; 
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Transparent Watermark Logo */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%; 
            height: 75%;
            background-image: url('../../logo.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.12; 
            pointer-events: none; 
            z-index: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        #container3d {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }
        
        /* Mobile & Tablet Responsive Layout */
        @media (max-width: 900px) {
            * { 
                box-sizing: border-box !important; 
            }
            body, html { 
                overflow-x: hidden !important; 
                overflow-y: auto !important; 
                height: auto !important; 
                width: 100vw !important; 
            }
            .workspace {
                flex-direction: column;
                overflow-y: visible;
                height: auto;
                padding: 1rem;
                width: 100%;
            }
            .controls {
                width: 100%;
            }
            .right-panel {
                min-height: 60vh; 
                height: 500px;
                flex-grow: 0;
                margin-top: 1rem;
            }
            .navbar { 
                padding: 1rem; 
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 01</a>
        <h1>Electric Field Lines</h1>
    </nav>

    <div class="workspace">
        
        <!-- Control Panel -->
        <div class="controls">
            <h2>Parameters</h2>

            <div class="instructions">
                Field lines point away from positive charges and toward negative charges. Use the 3D mode to rotate and explore the spatial structure.
            </div>

            <div class="control-group">
                <label for="dimension">Dimension</label>
                <select id="dimension">
                    <option value="2d">2D View</option>
                    <option value="3d">3D View (Interactive)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="mode">Charge Configuration</label>
                <select id="mode">
                    <option value="single+">Single Positive</option>
                    <option value="single-">Single Negative</option>
                    <option value="two">Two Charges</option>
                </select>
            </div>

            <div class="control-group" id="controls-custom">
                <label>Custom Charges</label>
                <div class="charge-grid">
                    <input type="number" id="q1" value="1" step="0.5" placeholder="Q1">
                    <input type="number" id="q2" value="-1" step="0.5" placeholder="Q2">
                </div>
            </div>

            <div class="legend">
                <span style="color: #ff3333;">■ Positive Charge</span>
                <span style="color: #33ff66;">■ Negative Charge</span>
                <span style="color: #00ffff;">■ Field Lines & Vectors</span>
            </div>
        </div>

        <!-- Simulation Area -->
        <div class="right-panel" id="simWrapper">
            <div class="watermark"></div>
            <!-- 2D Canvas -->
            <canvas id="canvas2d"></canvas>
            <!-- 3D Container -->
            <div id="container3d" style="display:none;"></div>
        </div>

    </div>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

    <script>
        const canvas = document.getElementById("canvas2d");
        const ctx = canvas.getContext("2d");

        const mode = document.getElementById("mode");
        const dimension = document.getElementById("dimension");
        const controlsCustom = document.getElementById("controls-custom");
        const container3d = document.getElementById("container3d");
        const q1 = document.getElementById("q1");
        const q2 = document.getElementById("q2");

        let charges = [];
        let is3D = false;

        let scene, camera, renderer, orbit;
        let chargeMeshes = [];
        let fieldLineObjects = [];
        let animationStarted = false;

        // --- RESIZE OBSERVER (Responsive 2D and 3D) ---
        const resizeObserver = new ResizeObserver(entries => {
            window.requestAnimationFrame(() => {
                for (let entry of entries) {
                    if (entry.target.id === 'simWrapper') {
                        canvas.width = Math.floor(entry.contentRect.width);
                        canvas.height = Math.floor(entry.contentRect.height);
                        if (is3D && renderer) {
                            onWindowResize();
                        }
                    }
                }
            });
        });
        resizeObserver.observe(document.getElementById('simWrapper'));

        function setCharges(){
            // Center the charges dynamically based on canvas size
            const cx = canvas.width / 2 || 300;
            const cy = canvas.height / 2 || 200;

            if(mode.value === "single+"){
                charges = [{x: cx, y: cy, z:0, q:1}];
            } else if(mode.value === "single-"){
                charges = [{x: cx, y: cy, z:0, q:-1}];
            } else {
                charges = [
                    {x: cx - 100, y: cy, z:0, q:parseFloat(q1.value) || 1},
                    {x: cx + 100, y: cy, z:0, q:parseFloat(q2.value) || -1}
                ];
            }
        }

        function updateMode(){
            controlsCustom.style.display = (mode.value === "two") ? "flex" : "none";
            setCharges();
            if(is3D && scene){
                rebuild3D();
            }
        }

        function switchMode(){
            is3D = (dimension.value === "3d");
            canvas.style.display = is3D ? "none" : "block";
            container3d.style.display = is3D ? "block" : "none";

            if(is3D){
                init3D();
                rebuild3D();
            }
        }

        // --- 2D PHYSICS & RENDERING ---
        function field2D(x, y){
            let Ex = 0;
            let Ey = 0;
            charges.forEach(c => {
                const dx = x - c.x;
                const dy = y - c.y;
                const r = Math.hypot(dx, dy) + 0.5;
                const k = c.q / (r * r * r);
                Ex += k * dx;
                Ey += k * dy;
            });
            return {Ex, Ey};
        }

        function trace2D(x, y, chargeSign){
            const path = [];
            for(let i = 0; i < 500; i++){
                const {Ex, Ey} = field2D(x, y);
                const mag = Math.hypot(Ex, Ey);
                if(mag < 0.0001) break;

                const ux = Ex / mag;
                const uy = Ey / mag;
                const dir = chargeSign > 0 ? 1 : -1;

                x += dir * ux * 2;
                y += dir * uy * 2;
                path.push({x, y});

                for(const c of charges){
                    if(Math.hypot(x - c.x, y - c.y) < 8) return path;
                }
            }
            return path;
        }

        function drawArrow2D(x, y, angle){
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(
                x - 8 * Math.cos(angle - Math.PI / 6),
                y - 8 * Math.sin(angle - Math.PI / 6)
            );
            ctx.lineTo(
                x - 8 * Math.cos(angle + Math.PI / 6),
                y - 8 * Math.sin(angle + Math.PI / 6)
            );
            ctx.fillStyle = "#00ffff";
            ctx.fill();
        }

        function draw2D(){
            if(!is3D && canvas.width > 0){
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setCharges(); // Continuously adapt to center if resized

                // Draw solid background to hide watermark if necessary, but we are keeping it clear
                
                // Draw Charges
                charges.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 12, 0, 2 * Math.PI); // Slightly larger
                    ctx.fillStyle = c.q > 0 ? "#ff3333" : "#33ff66";
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "rgba(255,255,255,0.8)";
                    ctx.stroke();
                });

                // Trace lines
                charges.forEach(c => {
                    const lines = 16;
                    for(let i = 0; i < lines; i++){
                        const angle = (i / lines) * 2 * Math.PI;
                        const sx = c.x + Math.cos(angle) * 14;
                        const sy = c.y + Math.sin(angle) * 14;
                        const path = trace2D(sx, sy, c.q);

                        if(path.length < 2) continue;

                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        path.forEach(p => ctx.lineTo(p.x, p.y));
                        ctx.strokeStyle = "#00e5ff"; // Matched neon cyan
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        for(let j = 20; j < path.length; j += 50){
                            const p = path[j];
                            const {Ex, Ey} = field2D(p.x, p.y);
                            const angle2 = Math.atan2(Ey, Ex);
                            drawArrow2D(p.x, p.y, angle2);
                        }
                    }
                });
            }
            requestAnimationFrame(draw2D);
        }

        // --- 3D PHYSICS & RENDERING (Three.js) ---
        function init3D(){
            if(renderer) return;

            scene = new THREE.Scene();
            // Using a transparent background so the watermark shows through!
            scene.background = null; 

            camera = new THREE.PerspectiveCamera(
                60,
                container3d.clientWidth / container3d.clientHeight,
                0.1,
                2000
            );
            camera.position.set(0, 30, 95);

            // Setting alpha: true allows transparency
            renderer = new THREE.WebGLRenderer({antialias:true, alpha: true});
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            renderer.setSize(container3d.clientWidth, container3d.clientHeight);
            container3d.innerHTML = "";
            container3d.appendChild(renderer.domElement);

            orbit = new THREE.OrbitControls(camera, renderer.domElement);
            orbit.enableDamping = true;
            orbit.dampingFactor = 0.08;
            orbit.rotateSpeed = 0.8;
            orbit.zoomSpeed = 0.9;
            orbit.panSpeed = 0.8;
            orbit.minDistance = 25;
            orbit.maxDistance = 220;

            const ambient = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambient);

            const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
            keyLight.position.set(60, 80, 70);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x66aaff, 0.35);
            fillLight.position.set(-80, -30, -60);
            scene.add(fillLight);

            const grid = new THREE.GridHelper(160, 16, 0x333333, 0x222222);
            grid.position.y = -35;
            scene.add(grid);

            const axes = new THREE.AxesHelper(30);
            scene.add(axes);

            if(!animationStarted){
                animationStarted = true;
                animate3D();
            }
        }

        function onWindowResize(){
            if(!renderer || !camera) return;
            const width = container3d.clientWidth;
            const height = container3d.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function to3DPosition(charge){
            const cx = canvas.width / 2 || 300;
            const cy = canvas.height / 2 || 200;
            return new THREE.Vector3(
                (charge.x - cx) / 3,
                -(charge.y - cy) / 3,
                charge.z / 3
            );
        }

        function field3D(x, y, z){
            let Ex = 0; let Ey = 0; let Ez = 0;
            charges.forEach(c => {
                const pos = to3DPosition(c);
                const dx = x - pos.x;
                const dy = y - pos.y;
                const dz = z - pos.z;
                const r = Math.hypot(dx, dy, dz) + 0.35;
                const k = c.q / (r * r * r);
                Ex += k * dx;
                Ey += k * dy;
                Ez += k * dz;
            });
            return {Ex, Ey, Ez};
        }

        function getSphereSeeds(radius, count){
            const seeds = [];
            const offset = 2 / count;
            const increment = Math.PI * (3 - Math.sqrt(5));

            for(let i = 0; i < count; i++){
                const y = ((i * offset) - 1) + (offset / 2);
                const r = Math.sqrt(1 - y * y);
                const phi = i * increment;
                const x = Math.cos(phi) * r;
                const z = Math.sin(phi) * r;
                seeds.push(new THREE.Vector3(x * radius, y * radius, z * radius));
            }
            return seeds;
        }

        function trace3D(start, chargeSign){
            const path = [];
            const pos = start.clone();

            for(let i = 0; i < 420; i++){
                const {Ex, Ey, Ez} = field3D(pos.x, pos.y, pos.z);
                const mag = Math.hypot(Ex, Ey, Ez);
                if(mag < 0.00002) break;

                const ux = Ex / mag;
                const uy = Ey / mag;
                const uz = Ez / mag;
                const traceDir = chargeSign > 0 ? 1 : -1;

                pos.x += traceDir * ux * 1.25;
                pos.y += traceDir * uy * 1.25;
                pos.z += traceDir * uz * 1.25;

                path.push(pos.clone());

                if(Math.abs(pos.x) > 120 || Math.abs(pos.y) > 120 || Math.abs(pos.z) > 120){
                    return path;
                }
            }
            return path;
        }

        function makeArrowHead(position, direction, color){
            const coneRadius = 1.1;
            const coneHeight = 3.2;

            const geometry = new THREE.ConeGeometry(coneRadius, coneHeight, 12);
            const material = new THREE.MeshBasicMaterial({color});
            const cone = new THREE.Mesh(geometry, material);

            const unit = direction.clone().normalize();
            cone.position.copy(position);
            cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), unit);
            cone.position.add(unit.clone().multiplyScalar(coneHeight * 0.45));

            return cone;
        }

        function buildFieldLine3D(start, chargeSign, color){
            const points = trace3D(start, chargeSign);
            if(points.length < 2) return;

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({color});
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            fieldLineObjects.push(line);

            const arrowSpacing = 28;
            for(let i = arrowSpacing; i < points.length; i += arrowSpacing){
                const prev = points[i - 1];
                const curr = points[i];
                let tangent = curr.clone().sub(prev);
                if(tangent.lengthSq() === 0) continue;

                if(chargeSign < 0){
                    tangent.multiplyScalar(-1);
                }

                const arrow = makeArrowHead(curr, tangent, color);
                scene.add(arrow);
                fieldLineObjects.push(arrow);
            }
        }

        function clearSceneObjects(list){
            list.forEach(obj => {
                scene.remove(obj);
                if(obj.geometry) obj.geometry.dispose();
                if(obj.material){
                    if(Array.isArray(obj.material)){
                        obj.material.forEach(m => m.dispose());
                    } else {
                        obj.material.dispose();
                    }
                }
            });
            list.length = 0;
        }

        function rebuild3D(){
            if(!scene) return;

            setCharges();
            clearSceneObjects(chargeMeshes);
            clearSceneObjects(fieldLineObjects);

            charges.forEach(c => {
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(2.8, 28, 28),
                    new THREE.MeshPhongMaterial({
                        color: c.q > 0 ? 0xff3333 : 0x33ff66,
                        emissive: c.q > 0 ? 0x550000 : 0x003311
                    })
                );
                sphere.position.copy(to3DPosition(c));
                scene.add(sphere);
                chargeMeshes.push(sphere);
            });

            charges.forEach(c => {
                const center = to3DPosition(c);
                const seedCount = mode.value === "two" ? 24 : 36;
                const seeds = getSphereSeeds(3.8, seedCount);
                const color = 0x00e5ff; // Neon Cyan

                seeds.forEach(seed => {
                    const start = center.clone().add(seed);
                    buildFieldLine3D(start, c.q, color);
                });
            });

            orbit.target.set(0, 0, 0);
            orbit.update();
        }

        function animate3D(){
            requestAnimationFrame(animate3D);
            if(renderer && scene && camera){
                orbit.update();
                renderer.render(scene, camera);
            }
        }

        // --- INIT EVENT LISTENERS ---
        updateMode();
        draw2D();

        dimension.addEventListener("change", switchMode);
        mode.addEventListener("change", updateMode);
        q1.addEventListener("input", updateMode);
        q2.addEventListener("input", updateMode);
    </script>
</body>
</html>
