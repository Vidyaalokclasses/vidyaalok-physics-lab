<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coulomb's Law Simulator | Vidyaalok Lab</title>
    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff007f;
            --bg-dark: #070b19;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-muted: #a0aabf;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            padding: 1rem 2rem;
            background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.8);
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex-grow: 1;
            padding: 1.5rem;
            gap: 1.5rem;
            height: calc(100vh - 70px);
            box-sizing: border-box;
        }

        /* Control Panel */
        .controls {
            width: 380px;
            flex-shrink: 0; 
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .controls h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            padding-bottom: 0.5rem;
        }

        /* Scientific Formula Box */
        .formula-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            color: #e6f2ff;
        }

        .math-equation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.2rem;
            font-style: italic;
        }

        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .numerator {
            border-bottom: 1px solid #e6f2ff;
            padding: 0 6px;
        }

        .denominator {
            padding: 0 6px;
        }

        /* Physical Constants Info */
        .constants-info {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(0, 229, 255, 0.2);
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            color: var(--text-main);
            font-family: monospace;
            font-size: 1.1rem;
        }

        select {
            width: 100%;
            background: rgba(0,0,0,0.3);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        select option {
            background: var(--bg-dark);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 10px var(--primary);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .results {
            margin-top: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            text-align: center;
        }

        .results h3 {
            margin: 0 0 0.5rem 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .force-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            font-family: monospace;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        /* Right Panel Layout (Canvas + Graph) */
        .right-panel {
            flex-grow: 1;
            min-width: 0; 
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .canvas-container {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .sim-container {
            flex: 2; 
        }

        .graph-container {
            flex: 1; 
        }

        /* Transparent Watermark Logo styling */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; 
            height: 90%;
            background-image: url('../../logo.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.12; 
            pointer-events: none; 
            z-index: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            position: relative;
            z-index: 1;
        }
        
        /* Mobile & Tablet Responsive Layout */
        @media (max-width: 900px) {
            * { 
                box-sizing: border-box !important; 
            }
            body, html { 
                overflow-x: hidden !important; 
                overflow-y: auto !important; 
                height: auto !important; 
                width: 100vw !important; 
            }
            .workspace {
                flex-direction: column;
                overflow-y: visible;
                height: auto;
                padding: 1rem;
                width: 100%;
            }
            .controls {
                width: 100%;
            }
            .right-panel {
                min-height: 80vh; 
                height: 750px; /* Taller height needed because this has 2 canvases */
                flex-grow: 0;
                margin-top: 1rem;
            }
            .navbar { 
                padding: 1rem; 
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn">← Chapter 01</a>
        <h1>Coulomb's Law Simulator</h1>
    </nav>

    <div class="workspace">
        <!-- Control Panel -->
        <div class="controls">
            <h2>Parameters</h2>

            <!-- Scientific Fraction Formula & Constants -->
            <div class="formula-box">
                <div class="math-equation">
                    <span>F = </span>
                    <div class="fraction">
                        <span class="numerator">1</span>
                        <span class="denominator">4&pi;&epsilon;<sub>0</sub>&epsilon;<sub>r</sub></span>
                    </div>
                    <span>&middot;</span>
                    <div class="fraction">
                        <span class="numerator">|q<sub>1</sub>q<sub>2</sub>|</span>
                        <span class="denominator">r<sup>2</sup></span>
                    </div>
                </div>
                <!-- Constants Section -->
                <div class="constants-info">
                    &epsilon;<sub>0</sub> = 8.854 &times; 10<sup>-12</sup> C<sup>2</sup> / (N&middot;m<sup>2</sup>)<br>
                    1 / (4&pi;&epsilon;<sub>0</sub>) = 8.987 &times; 10<sup>9</sup> N&middot;m<sup>2</sup> / C<sup>2</sup>
                </div>
            </div>

            <div class="control-group">
                <label>
                    <span>Medium</span>
                </label>
                <select id="medium">
                    <option value="1">Vacuum / Air (εᵣ = 1)</option>
                    <option value="80">Water (εᵣ = 80)</option>
                    <option value="5.6">Glass (εᵣ ≈ 5.6)</option>
                    <option value="2.2">Paper (εᵣ ≈ 2.2)</option>
                </select>
            </div>

            <div class="control-group">
                <label>
                    <span>Charge 1 (q₁)</span>
                    <span class="val-display" id="q1-val">5 μC</span>
                </label>
                <input type="range" id="q1" min="-10" max="10" step="1" value="5">
            </div>

            <div class="control-group">
                <label>
                    <span>Charge 2 (q₂)</span>
                    <span class="val-display" id="q2-val">-5 μC</span>
                </label>
                <input type="range" id="q2" min="-10" max="10" step="1" value="-5">
            </div>

            <div class="control-group">
                <label>
                    <span>Distance (r)</span>
                    <span class="val-display" id="r-val">1.5 m</span>
                </label>
                <input type="range" id="r" min="1" max="10" step="0.5" value="1.5">
            </div>

            <div class="results">
                <h3>Electrostatic Force Magnitude</h3>
                <div class="force-value" id="f-val">0.00 N</div>
            </div>
        </div>

        <!-- Right Side: Simulation and Graph -->
        <div class="right-panel">
            <div class="canvas-container sim-container" id="simWrapper">
                <!-- Transparent Watermark -->
                <div class="watermark"></div>
                <canvas id="simCanvas"></canvas>
            </div>
            
            <div class="canvas-container graph-container" id="graphWrapper">
                <!-- Transparent Watermark -->
                <div class="watermark"></div>
                <canvas id="graphCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const simCanvas = document.getElementById('simCanvas');
        const simCtx = simCanvas.getContext('2d');
        
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');

        // Inputs
        const mediumSelect = document.getElementById('medium');
        const q1Slider = document.getElementById('q1');
        const q2Slider = document.getElementById('q2');
        const rSlider = document.getElementById('r');
        
        // Displays
        const q1Val = document.getElementById('q1-val');
        const q2Val = document.getElementById('q2-val');
        const rVal = document.getElementById('r-val');
        const fVal = document.getElementById('f-val');

        // Physics Constant (k in vacuum)
        const k0 = 8.987e9; 
        
        // --- RESIZE OBSERVER (Fixes Canvas Stretching and Centering) ---
        const resizeObserver = new ResizeObserver(entries => {
            window.requestAnimationFrame(() => {
                let shouldDraw = false;
                for (let entry of entries) {
                    if (entry.target.id === 'simWrapper') {
                        simCanvas.width = Math.floor(entry.contentRect.width);
                        simCanvas.height = Math.floor(entry.contentRect.height);
                        shouldDraw = true;
                    } else if (entry.target.id === 'graphWrapper') {
                        graphCanvas.width = Math.floor(entry.contentRect.width);
                        graphCanvas.height = Math.floor(entry.contentRect.height);
                        shouldDraw = true;
                    }
                }
                if (shouldDraw) drawAll();
            });
        });

        resizeObserver.observe(document.getElementById('simWrapper'));
        resizeObserver.observe(document.getElementById('graphWrapper'));

        function formatScientificHTML(num) {
            if (num === 0) return "0 N";
            let expStr = num.toExponential(2); 
            let parts = expStr.split('e');
            let base = parts[0];
            let exponent = parseInt(parts[1]); 
            
            return `${base} &times; 10<sup>${exponent}</sup> N`;
        }

        function drawArrow(ctx, fromX, fromY, toX, toY, color) {
            const headlen = 15; 
            const dx = toX - fromX;
            const dy = toY - fromY;
            const angle = Math.atan2(dy, dx);
            
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawAll() {
            if(simCanvas.width === 0) return;

            const er = parseFloat(mediumSelect.value); 
            const q1 = parseFloat(q1Slider.value);
            const q2 = parseFloat(q2Slider.value);
            const r = parseFloat(rSlider.value);

            q1Val.innerText = `${q1 > 0 ? '+' : ''}${q1} μC`;
            q2Val.innerText = `${q2 > 0 ? '+' : ''}${q2} μC`;
            rVal.innerText = `${r} m`;

            const k = k0 / er;
            const q1C = q1 * 1e-6;
            const q2C = q2 * 1e-6;
            
            let force = 0;
            if (r !== 0) {
                force = (k * Math.abs(q1C * q2C)) / (r * r);
            }
            
            fVal.innerHTML = formatScientificHTML(force);

            drawSimulation(q1, q2, r, force);
            drawGraph(q1, q2, r, force, k);
        }

        function drawSimulation(q1, q2, r, force) {
            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            
            const centerY = simCanvas.height / 2;
            const centerX = simCanvas.width / 2;
            
            // Map the physical distance to pixels, keeping it inside the canvas
            const maxPxDist = Math.min(simCanvas.width * 0.7, 600);
            const pixelDist = (r / 10) * maxPxDist; 
            
            const x1 = centerX - (pixelDist / 2);
            const x2 = centerX + (pixelDist / 2);

            simCtx.beginPath();
            simCtx.moveTo(x1, centerY + 60);
            simCtx.lineTo(x2, centerY + 60);
            simCtx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            simCtx.lineWidth = 2;
            simCtx.setLineDash([5, 5]);
            simCtx.stroke();
            simCtx.setLineDash([]);
            
            simCtx.beginPath();
            simCtx.moveTo(x1, centerY + 50); simCtx.lineTo(x1, centerY + 70);
            simCtx.moveTo(x2, centerY + 50); simCtx.lineTo(x2, centerY + 70);
            simCtx.stroke();

            simCtx.fillStyle = "rgba(255, 255, 255, 0.6)";
            simCtx.font = "14px system-ui";
            simCtx.textAlign = "center";
            simCtx.fillText(`r = ${r} m`, centerX, centerY + 85);

            const isAttracting = Math.sign(q1) !== Math.sign(q2) && q1 !== 0 && q2 !== 0;
            const isRepelling = Math.sign(q1) === Math.sign(q2) && q1 !== 0 && q2 !== 0;
            
            let arrowLength = 0;
            if (force > 0) {
                arrowLength = Math.max(40, Math.min(150, 40 + Math.log10(force * 1000) * 30));
            }

            if (isAttracting) {
                drawArrow(simCtx, x1 + 45, centerY, x1 + 45 + arrowLength, centerY, "#00e5ff");
                drawArrow(simCtx, x2 - 45, centerY, x2 - 45 - arrowLength, centerY, "#00e5ff");
            } else if (isRepelling) {
                drawArrow(simCtx, x1 - 45, centerY, x1 - 45 - arrowLength, centerY, "#ff007f");
                drawArrow(simCtx, x2 + 45, centerY, x2 + 45 + arrowLength, centerY, "#ff007f");
            }

            function drawCharge(x, y, chargeValue) {
                const radius = 35; 
                let color = "rgba(255, 255, 255, 0.1)"; 
                let glow = "transparent";
                if (chargeValue > 0) {
                    color = "#ff3366"; glow = "rgba(255, 51, 102, 0.5)";
                } else if (chargeValue < 0) {
                    color = "#33ccff"; glow = "rgba(51, 204, 255, 0.5)";
                }

                simCtx.beginPath(); simCtx.arc(x, y, radius + 10, 0, Math.PI * 2);
                simCtx.fillStyle = glow; simCtx.fill();

                simCtx.beginPath(); simCtx.arc(x, y, radius, 0, Math.PI * 2);
                simCtx.fillStyle = color; simCtx.fill();
                simCtx.lineWidth = 2; simCtx.strokeStyle = "rgba(255, 255, 255, 0.5)"; simCtx.stroke();

                simCtx.fillStyle = "#ffffff"; simCtx.font = "bold 26px system-ui";
                simCtx.textAlign = "center"; simCtx.textBaseline = "middle";
                if (chargeValue > 0) simCtx.fillText("+", x, y);
                else if (chargeValue < 0) simCtx.fillText("-", x, y);
                else simCtx.fillText("0", x, y);
            }

            drawCharge(x1, centerY, q1);
            drawCharge(x2, centerY, q2);
        }

        function drawGraph(q1, q2, currentR, currentForce, k) {
            graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);

            const padX = 60;
            const padY = 30;
            const w = graphCanvas.width - padX - 40;
            const h = graphCanvas.height - padY - 40;
            
            graphCtx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            graphCtx.lineWidth = 2;
            graphCtx.beginPath();
            graphCtx.moveTo(padX, padY); graphCtx.lineTo(padX, padY + h); 
            graphCtx.lineTo(padX + w, padY + h); 
            graphCtx.stroke();
            
            graphCtx.fillStyle = "#a0aabf";
            graphCtx.font = "12px system-ui";
            graphCtx.textAlign = "center";
            graphCtx.fillText("Distance (r)", padX + w / 2, padY + h + 30);
            
            graphCtx.save();
            graphCtx.translate(padX - 45, padY + h / 2);
            graphCtx.rotate(-Math.PI / 2);
            graphCtx.fillText("Force Magnitude (F)", 0, 0);
            graphCtx.restore();

            if (q1 === 0 || q2 === 0) return;

            const q1C = Math.abs(q1 * 1e-6);
            const q2C = Math.abs(q2 * 1e-6);
            const maxF = (k * q1C * q2C) / (1 * 1); 
            
            graphCtx.beginPath();
            graphCtx.strokeStyle = "#00e5ff";
            graphCtx.lineWidth = 2;
            
            for(let stepR = 1; stepR <= 10; stepR += 0.1) {
                let f = (k * q1C * q2C) / (stepR * stepR);
                let px = padX + ((stepR - 1) / 9) * w;
                let py = padY + h - (f / maxF) * h;
                
                if(stepR === 1) graphCtx.moveTo(px, py);
                else graphCtx.lineTo(px, py);
            }
            graphCtx.stroke();
            
            let currPx = padX + ((currentR - 1) / 9) * w;
            let currPy = padY + h - (currentForce / maxF) * h;
            
            graphCtx.beginPath();
            graphCtx.arc(currPx, currPy, 6, 0, Math.PI*2);
            graphCtx.fillStyle = "#ff007f";
            graphCtx.fill();
            graphCtx.strokeStyle = "#ffffff";
            graphCtx.lineWidth = 2;
            graphCtx.stroke();
        }

        [mediumSelect, q1Slider, q2Slider, rSlider].forEach(input => {
            input.addEventListener('input', drawAll);
        });

    </script>
</body>
</html>
