<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Units & Measurements Formulas | Vidyaalok Lab</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L8DFSQTR66"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L8DFSQTR66');
    </script>

    <style>
        :root { --primary: #00e5ff; --secondary: #ff007f; --bg-dark: #070b19; --panel-bg: rgba(7, 11, 25, 0.85); --text-main: #ffffff; --text-muted: #a0aabf; --gold: #ffd166; --border: rgba(0, 229, 255, 0.2); }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; }
        .navbar { padding: 12px 20px; background: rgba(7, 11, 25, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 100; position: relative; }
        .back-btn { color: var(--primary); text-decoration: none; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .navbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

        .workspace { display: flex; flex-direction: row; flex-grow: 1; width: 100%; height: calc(100vh - 58px); overflow: hidden; }

        .sidebar { width: 320px; flex-shrink: 0; background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; scrollbar-width: thin; scrollbar-color: var(--primary) transparent; }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .tbtn { flex: 1 1 calc(50% - 4px); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: var(--text-main); padding: 8px 4px; border-radius: 6px; font-weight: bold; font-size: 0.72rem; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
        .tbtn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .tbtn.active2 { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); color: var(--primary); pointer-events: none; }

        .group-title { font-size: 0.7rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold; margin: 18px 0 8px; }
        .group-title:first-of-type { margin-top: 0; }
        .topic-btn { display: block; width: 100%; text-align: left; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); padding: 10px 12px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 6px; cursor: pointer; transition: all 0.15s ease; }
        .topic-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); }
        .topic-btn.active { border-color: var(--primary); background: rgba(0, 229, 255, 0.15); color: var(--primary); font-weight: bold; }

        .formula-wrapper { position: relative; flex-grow: 1; height: 100%; overflow-y: auto; padding: 30px 40px; scrollbar-width: thin; scrollbar-color: var(--primary) transparent; }
        .formula-wrapper::-webkit-scrollbar { width: 5px; }
        .formula-wrapper::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-image: url('../../logo.png'); background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.07; pointer-events: none; z-index: 0; }
        .content { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; }

        .topic-header { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-bottom: 4px; }
        .topic-sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

        .card { background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
        .card h3 { margin: 0 0 12px; font-size: 0.78rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
        .eq { font-family: 'Times New Roman', Times, serif; font-style: italic; color: var(--text-main); font-size: 1.05rem; margin: 10px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .eq .plain { font-style: normal; color: var(--text-muted); font-size: 0.85rem; margin-right: 4px; }
        .note { color: var(--text-muted); font-size: 0.82rem; line-height: 1.5; margin: 6px 0; }
        .note b { color: var(--text-main); }
        .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.3; font-size: 1rem; vertical-align: middle; }
        .frac-num, .frac-den { padding: 0 4px; white-space: nowrap; }
        .frac-line { width: 100%; height: 1px; background: var(--primary); margin: 2px 0; }
        .boxed { border: 1px solid var(--primary); border-radius: 8px; padding: 10px 16px; display: inline-block; background: rgba(0,229,255,0.06); }
        ul.pts { margin: 6px 0; padding-left: 20px; color: var(--text-muted); font-size: 0.82rem; line-height: 1.6; }
        ul.pts li b { color: var(--text-main); }
        table.units-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        table.units-table th { text-align: left; color: var(--gold); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
        table.units-table td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); color: var(--text-muted); }
        table.units-table td.sym { color: var(--primary); font-family: monospace; font-weight: bold; }

        @media (max-width: 900px) {
            .workspace { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: none; border-right: none; border-bottom: 1px solid var(--border); display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; white-space: nowrap; padding: 12px; gap: 8px; }
            .toolbar { display: none; }
            .group-title { display: none; }
            .topic-btn { display: inline-block; width: auto; flex-shrink: 0; margin-bottom: 0; white-space: nowrap; }
            .formula-wrapper { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="back-btn">← Class 11 Dashboard</a>
        <h1>Units &amp; Measurements Formulas</h1>
    </nav>

    <div class="workspace">
        <div class="sidebar" id="sidebar">
            <div class="toolbar">
                <a href="index.html" class="tbtn">Vernier Calipers</a>
                <a href="screw-gauge.html" class="tbtn">Screw Gauge</a>
                <a href="formulas.html" class="tbtn active2">Formulas</a>
            </div>
            <div id="topicList"></div>
        </div>
        <div class="formula-wrapper" id="formulaWrapper">
            <div class="watermark" id="watermark"></div>
            <div class="content" id="content"></div>
        </div>
    </div>

    <script>
        const TOPICS = [
            { id: 'si-units', group: 'Units', title: 'SI Base Units', body: `
                <div class="card"><h3>The Seven SI Base Units</h3>
                    <table class="units-table">
                        <tr><th>Quantity</th><th>Unit</th><th>Symbol</th></tr>
                        <tr><td>Length</td><td>metre</td><td class="sym">m</td></tr>
                        <tr><td>Mass</td><td>kilogram</td><td class="sym">kg</td></tr>
                        <tr><td>Time</td><td>second</td><td class="sym">s</td></tr>
                        <tr><td>Electric current</td><td>ampere</td><td class="sym">A</td></tr>
                        <tr><td>Thermodynamic temperature</td><td>kelvin</td><td class="sym">K</td></tr>
                        <tr><td>Amount of substance</td><td>mole</td><td class="sym">mol</td></tr>
                        <tr><td>Luminous intensity</td><td>candela</td><td class="sym">cd</td></tr>
                    </table>
                </div>
                <div class="card"><h3>Supplementary Units</h3>
                    <div class="eq">Plane angle → <b>radian (rad)</b></div>
                    <div class="eq">Solid angle → <b>steradian (sr)</b></div>
                </div>` },

            { id: 'dimensions', group: 'Units', title: 'Dimensional Formulas', body: `
                <div class="card"><h3>Dimensions of Common Quantities</h3>
                    <table class="units-table">
                        <tr><th>Quantity</th><th>Dimensional Formula</th></tr>
                        <tr><td>Velocity</td><td class="sym">[M⁰L¹T⁻¹]</td></tr>
                        <tr><td>Acceleration</td><td class="sym">[M⁰L¹T⁻²]</td></tr>
                        <tr><td>Force</td><td class="sym">[M¹L¹T⁻²]</td></tr>
                        <tr><td>Work / Energy</td><td class="sym">[M¹L²T⁻²]</td></tr>
                        <tr><td>Power</td><td class="sym">[M¹L²T⁻³]</td></tr>
                        <tr><td>Momentum</td><td class="sym">[M¹L¹T⁻¹]</td></tr>
                        <tr><td>Pressure</td><td class="sym">[M¹L⁻¹T⁻²]</td></tr>
                        <tr><td>Density</td><td class="sym">[M¹L⁻³T⁰]</td></tr>
                        <tr><td>Frequency</td><td class="sym">[M⁰L⁰T⁻¹]</td></tr>
                        <tr><td>Gravitational constant (G)</td><td class="sym">[M⁻¹L³T⁻²]</td></tr>
                    </table>
                </div>` },

            { id: 'dim-analysis', group: 'Units', title: 'Principle of Homogeneity & Dimensional Analysis', body: `
                <div class="card"><h3>Principle of Homogeneity of Dimensions</h3>
                    <div class="note">Only quantities with the <b>same dimensions</b> can be added, subtracted, or equated. Every term on both sides of a valid physical equation must have identical dimensions.</div>
                </div>
                <div class="card"><h3>Uses of Dimensional Analysis</h3>
                    <ul class="pts">
                        <li>Checking the <b>correctness</b> of a physical equation</li>
                        <li><b>Converting</b> a physical quantity from one system of units to another</li>
                        <li><b>Deriving</b> a relation between physical quantities (when the exact form of dependence is unknown)</li>
                    </ul>
                </div>
                <div class="card"><h3>Limitations</h3>
                    <ul class="pts">
                        <li>Cannot determine dimensionless constants</li>
                        <li>Fails for equations with trigonometric, exponential, or logarithmic functions</li>
                        <li>Cannot distinguish between quantities with the same dimensions (e.g. torque vs. energy)</li>
                        <li>Cannot be used if a physical quantity depends on more than three unknown factors</li>
                    </ul>
                </div>` },

            { id: 'sig-figs', group: 'Significant Figures', title: 'Rules for Significant Figures', body: `
                <div class="card"><h3>Counting Significant Figures</h3>
                    <ul class="pts">
                        <li>All <b>non-zero digits</b> are significant</li>
                        <li>Zeros <b>between</b> non-zero digits are significant (e.g. 1005 → 4 s.f.)</li>
                        <li>Leading zeros (before the first non-zero digit) are <b>not</b> significant (e.g. 0.0025 → 2 s.f.)</li>
                        <li>Trailing zeros <b>after a decimal point</b> are significant (e.g. 2.500 → 4 s.f.)</li>
                        <li>Trailing zeros in a number <b>without</b> a decimal point are ambiguous — use scientific notation to be clear (e.g. 2.5×10³ → 2 s.f.)</li>
                        <li>Changing units does not change the number of significant figures</li>
                    </ul>
                </div>
                <div class="card"><h3>Significant Figures in Calculations</h3>
                    <div class="eq boxed">Addition / Subtraction → result has as many <b>decimal places</b> as the term with the <b>fewest</b> decimal places</div>
                    <div class="eq boxed" style="margin-top:10px;">Multiplication / Division → result has as many <b>significant figures</b> as the term with the <b>fewest</b> significant figures</div>
                </div>` },

            { id: 'errors-basic', group: 'Errors', title: 'Absolute, Mean & Relative Error', body: `
                <div class="card"><h3>Absolute Error</h3>
                    <div class="eq boxed">Δa<sub>i</sub> = |a<sub>mean</sub> − a<sub>i</sub>|</div>
                    <div class="note">The magnitude of the difference between the true (or mean) value and an individual measured value.</div>
                </div>
                <div class="card"><h3>Mean Absolute Error</h3>
                    <div class="eq boxed">Δa<sub>mean</sub> = <span class="frac"><span class="frac-num">Δa₁ + Δa₂ + … + Δa<sub>n</sub></span><span class="frac-line"></span><span class="frac-den">n</span></span></div>
                </div>
                <div class="card"><h3>Relative (Fractional) Error</h3>
                    <div class="eq boxed">Relative Error = <span class="frac"><span class="frac-num">Δa<sub>mean</sub></span><span class="frac-line"></span><span class="frac-den">a<sub>mean</sub></span></span></div>
                </div>
                <div class="card"><h3>Percentage Error</h3>
                    <div class="eq boxed">Percentage Error = <span class="frac"><span class="frac-num">Δa<sub>mean</sub></span><span class="frac-line"></span><span class="frac-den">a<sub>mean</sub></span></span> × 100%</div>
                </div>
                <div class="card"><h3>Final Result</h3>
                    <div class="eq">a = a<sub>mean</sub> ± Δa<sub>mean</sub></div>
                </div>` },

            { id: 'error-combination', group: 'Errors', title: 'Combination of Errors', body: `
                <div class="card"><h3>Sum or Difference: Z = A ± B</h3>
                    <div class="eq boxed">ΔZ = ΔA + ΔB</div>
                    <div class="note">Absolute errors are <b>added</b> in both a sum and a difference — the error can only grow, never cancel.</div>
                </div>
                <div class="card"><h3>Product or Quotient: Z = A×B or Z = A/B</h3>
                    <div class="eq boxed"><span class="frac"><span class="frac-num">ΔZ</span><span class="frac-line"></span><span class="frac-den">Z</span></span> = <span class="frac"><span class="frac-num">ΔA</span><span class="frac-line"></span><span class="frac-den">A</span></span> + <span class="frac"><span class="frac-num">ΔB</span><span class="frac-line"></span><span class="frac-den">B</span></span></div>
                    <div class="note"><b>Relative</b> (fractional) errors are added.</div>
                </div>
                <div class="card"><h3>Power: Z = A<sup>n</sup></h3>
                    <div class="eq boxed"><span class="frac"><span class="frac-num">ΔZ</span><span class="frac-line"></span><span class="frac-den">Z</span></span> = n × <span class="frac"><span class="frac-num">ΔA</span><span class="frac-line"></span><span class="frac-den">A</span></span></div>
                </div>
                <div class="card"><h3>General Case: Z = A<sup>p</sup>B<sup>q</sup>/C<sup>r</sup></h3>
                    <div class="eq boxed"><span class="frac"><span class="frac-num">ΔZ</span><span class="frac-line"></span><span class="frac-den">Z</span></span> = p<span class="frac"><span class="frac-num">ΔA</span><span class="frac-line"></span><span class="frac-den">A</span></span> + q<span class="frac"><span class="frac-num">ΔB</span><span class="frac-line"></span><span class="frac-den">B</span></span> + r<span class="frac"><span class="frac-num">ΔC</span><span class="frac-line"></span><span class="frac-den">C</span></span></div>
                </div>` },

            { id: 'least-count', group: 'Instruments', title: 'Least Count of Common Instruments', body: `
                <div class="card"><h3>Vernier Calipers</h3>
                    <div class="eq boxed">Least Count = 1 MSD − 1 VSD</div>
                    <div class="note">MSD = Main Scale Division, VSD = Vernier Scale Division. For the standard caliper (10 VSD = 9 MSD = 9 mm): LC = 1 mm − 0.9 mm = <b>0.1 mm = 0.01 cm</b>.</div>
                </div>
                <div class="card"><h3>Screw Gauge</h3>
                    <div class="eq boxed">Least Count = <span class="frac"><span class="frac-num">Pitch</span><span class="frac-line"></span><span class="frac-den">No. of Circular Scale Divisions</span></span></div>
                    <div class="note">Pitch = distance the spindle advances in one full rotation of the thimble. For a common gauge (pitch = 1 mm, 100 divisions): LC = <b>0.01 mm</b>.</div>
                </div>
                <div class="card"><h3>Zero Error</h3>
                    <div class="note">If the reading is not zero when the jaws/spindle are fully closed, the instrument has a <b>zero error</b> — a fixed offset that must be subtracted from every reading:</div>
                    <div class="eq boxed">Corrected Reading = Observed Reading − Zero Error</div>
                    <div class="note">See the <b>Vernier Calipers</b> and <b>Screw Gauge</b> simulators (tabs above) to practise measuring and correcting for zero error interactively.</div>
                </div>` }
        ];

        const sidebar = document.getElementById('topicList');
        const content = document.getElementById('content');
        let groups = [];
        TOPICS.forEach(t => { if (!groups.includes(t.group)) groups.push(t.group); });

        groups.forEach(g => {
            const h = document.createElement('div');
            h.className = 'group-title';
            h.textContent = g;
            sidebar.appendChild(h);
            TOPICS.filter(t => t.group === g).forEach(t => {
                const btn = document.createElement('button');
                btn.className = 'topic-btn';
                btn.id = 'btn-' + t.id;
                btn.textContent = t.title;
                btn.onclick = () => selectTopic(t.id);
                sidebar.appendChild(btn);
            });
        });

        function selectTopic(id) {
            const topic = TOPICS.find(t => t.id === id);
            if (!topic) return;
            document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + id).classList.add('active');
            content.innerHTML = `<div class="topic-header">${topic.title}</div><div class="topic-sub">${topic.group}</div>${topic.body}`;
            document.getElementById('formulaWrapper').scrollTop = 0;
        }

        const formulaWrapper = document.getElementById('formulaWrapper');
        const watermark = document.getElementById('watermark');
        const wmObserver = new ResizeObserver(entries => {
            for (const entry of entries) {
                const w = entry.contentRect.width, h = entry.contentRect.height;
                const size = Math.min(w, h) * 0.75;
                watermark.style.width = size + 'px';
                watermark.style.height = size + 'px';
            }
        });
        wmObserver.observe(formulaWrapper);

        selectTopic(TOPICS[0].id);
    </script>
</body>
</html>
